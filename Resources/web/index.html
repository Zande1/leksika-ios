<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Лексика</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Лексика">
<style>
/* Layout: one-column reading app — sticky top bar, fixed bottom tab bar, non-modal bottom sheet for words */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#181B22; --muted:#5F6676; --line:#E1E5EB;
  --accent:#0D7A6B; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC;
  --new:#D8E4FF; --l1:#FFD25E; --l2:#FFE08C; --l3:#FFEDB9; --l4:#FFF6DC;
  --play:#C9EEE6; --danger:#B93D29; --good:#2F8A3B; --shadow:rgba(16,20,28,.14);
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h:60px; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --ink:#E8EAEF; --muted:#9AA1AE; --line:#2A2E36;
  --accent:#3CC4AE; --accent-ink:#04211C; --accent-soft:#163631;
  --new:rgba(112,152,255,.26); --l1:rgba(255,196,40,.46); --l2:rgba(255,196,40,.32); --l3:rgba(255,196,40,.2); --l4:rgba(255,196,40,.1);
  --play:rgba(60,196,174,.24); --danger:#F0806B; --good:#6CCB78; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --ink:#E8EAEF; --muted:#9AA1AE; --line:#2A2E36;
  --accent:#3CC4AE; --accent-ink:#04211C; --accent-soft:#163631;
  --new:rgba(112,152,255,.26); --l1:rgba(255,196,40,.46); --l2:rgba(255,196,40,.32); --l3:rgba(255,196,40,.2); --l4:rgba(255,196,40,.1);
  --play:rgba(60,196,174,.24); --danger:#F0806B; --good:#6CCB78; --shadow:rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button,a.btn{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:54px;padding-block:6px}
header.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
body.sheet-open main{padding-bottom:58vh}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}
.banner{background:var(--l3);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative;min-width:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;text-align:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.icon-btn svg{width:20px;height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:16px;font-weight:800}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=search],textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;font-size:16px}
textarea{min-height:160px;resize:vertical;font-family:var(--f-read);line-height:1.5}
.parts{margin:0;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

/* library */
.lesson{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.lesson h3{margin:0;font-family:var(--f-read);font-weight:600;font-size:18px;min-width:0;overflow-wrap:anywhere}
.lesson .meta{grid-column:1;font-size:13px;color:var(--muted)}
.lesson .pct{grid-row:1/3;grid-column:2;font-variant-numeric:tabular-nums;text-align:right}
.lesson .pct b{display:block;font-size:20px}
.bar{grid-column:1/3;height:5px;border-radius:3px;background:var(--new);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.lesson-wrap{display:flex;flex-direction:column;gap:6px}
.lesson-actions{display:flex;justify-content:flex-end;gap:4px;flex-wrap:wrap}
.course-parts{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.part{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.part:last-child{border-bottom:0}
.part .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part .p{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.part .ok{color:var(--accent);font-weight:800}

/* reader */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.text{font-family:var(--f-read);font-size:var(--fs,20px);line-height:1.8;overflow-wrap:break-word;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.text p{margin:0 0 1em}
.sent{border-radius:6px;transition:background .2s}
.sent.playing{background:var(--play)}
.w{border-radius:5px;padding:0 1px;cursor:pointer}
.s0{background:var(--new)} .s1{background:var(--l1)} .s2{background:var(--l2)} .s3{background:var(--l3)} .s4{background:var(--l4)}
.w.ph{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:5px}
.w.sel{outline:2px solid var(--accent);outline-offset:1px}
.w.pick{background:var(--accent);color:var(--accent-ink)}
.endbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:14px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:20px}
.stats span{font-size:12px;color:var(--muted)}

/* sheet (non-modal) */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  max-height:55vh;max-height:55dvh;overflow:auto;overscroll-behavior:contain;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -10px 30px var(--shadow)}
.sheet .wrap{display:flex;flex-direction:column;gap:11px;padding-block:6px 0}
.grab{padding:6px 0 2px;display:flex;justify-content:center;touch-action:none}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.sw-head{display:flex;align-items:center;gap:8px}
.sw-word{font-family:var(--f-read);font-size:24px;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.sw-ipa{font-size:14px;color:var(--muted)}
.sw-tr{font-size:18px;font-weight:600}
.ctx{font-family:var(--f-read);font-size:15px;line-height:1.5;background:var(--bg);border-radius:10px;padding:10px 12px}
.ctx mark{background:var(--l2);color:inherit;border-radius:4px;padding:0 2px}
.pg[hidden]{display:none}
.player{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:24;background:var(--surface);border-top:1px solid var(--line)}
.player .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:auto auto auto 1fr auto;gap:8px;align-items:center;padding:7px max(12px,env(safe-area-inset-left,0px))}
.player button{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:40px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;padding:0 8px}
.player button svg{width:20px;height:20px}
.player #pbPlay{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:56px}
.player .info{font-size:12.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.has-player main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 82px)}
body.has-player .toast{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 68px)}
body.sheet-open .player{display:none}
.cw{cursor:pointer;border-radius:4px}
.cw.tg{background:var(--l2);padding:0 2px}
.cw:active{background:var(--accent-soft)}
.wtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wtools select{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 10px;font-size:13px;font-weight:600}
.wtools .lab{font-size:12px;color:var(--muted);font-weight:700}
.wrow .lv{text-align:right;white-space:nowrap}
.wrow .lv small{display:block;font-size:11px;white-space:nowrap;margin-top:2px}
.wrow .lv small.lapse{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:8px;background:var(--danger-soft,rgba(208,58,38,.14));color:var(--danger);font-weight:700}
.wrow.sel{background:var(--accent-soft)}
.selbar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);margin-top:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5}
.selbar b{flex:1;font-size:13px;min-width:90px}
.selbar button{border:0;border-radius:9px;padding:8px 10px;font-weight:700;font-size:13px;background:var(--bg);color:var(--ink)}
.selbar button.del{background:var(--danger);color:#fff}
.pager{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:6px}
.pager .btn{justify-content:center;padding:13px 10px;font-size:15px}
.pager .mid{text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.explain{font-size:14px;line-height:1.5;white-space:pre-wrap;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.levels{display:grid;grid-template-columns:repeat(5,1fr) 1.3fr;gap:6px}
.levels button{border:1px solid var(--line);border-radius:10px;padding:9px 0;background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.levels button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvl-cap{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.inph{display:flex;flex-direction:column;gap:6px}
.inph button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}

/* words */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.wrow:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);flex:none}
.wrow .tx{min-width:0}
.wrow .tx b{font-family:var(--f-read);font-size:17px;font-weight:600}
.wrow .tx div{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .lv{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;min-height:280px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;justify-content:center}
.card .big{font-family:var(--f-read);font-size:32px;font-weight:600;overflow-wrap:anywhere}
.card .ans{display:flex;flex-direction:column;gap:6px;align-items:center}
.card hr{width:60%;border:0;border-top:1px solid var(--line);margin:4px 0}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grades2 button{border:1px solid var(--line);border-radius:14px;padding:16px 8px;background:var(--surface);font-weight:800;font-size:16px}
.grades2 .g0{color:var(--danger)} .grades2 .g3{color:var(--good)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);font-size:16px;line-height:1.35;color:var(--ink)}
.opt:disabled{opacity:1;cursor:default}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good);font-weight:700}
.opt.wrong{border-color:var(--danger);box-shadow:inset 0 0 0 2px var(--danger)}
.result{font-weight:800;font-size:15px}.result.ok{color:var(--good)}.result.bad{color:var(--danger)}
.big-btn{justify-content:center;padding:14px;font-size:16px}
#trInput{min-height:0;resize:none;overflow:hidden;font-family:var(--f-ui);line-height:1.4;display:block}
.grades button{border:1px solid var(--line);border-radius:12px;padding:10px 4px;background:var(--surface);font-weight:700;display:flex;flex-direction:column;gap:2px}
.grades button span{font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.grades .g0{color:var(--danger)} .grades .g3{color:var(--good)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.big-num{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:24px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.dist{display:flex;flex-direction:column;gap:8px}
.dist .r{display:grid;grid-template-columns:70px 1fr 54px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.dist .r .t{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.dist .r .t i{display:block;height:100%}
.dist .r .n{text-align:right}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-sizing:border-box;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--accent);font-weight:800;padding:2px 4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.sent{transition:none}}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}

/* ================= look, second version =================
   One idea carries the look: text marked by hand. Ink-blue is the pen (actions, links, new words),
   highlighter yellow marks what is active or in progress. Everything else stays quiet. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#12151B; --muted:#646C7C; --line:#E4E7EC;
  --accent:#2748E0; --accent-ink:#FFFFFF; --accent-soft:#E6EBFF;
  --mark:#FFD84A; --mark-ink:#12151B; --mark-soft:#FFF4C2;
  --danger:#D03A26; --danger-soft:#FCE5E0; --good:#1B9450; --good-soft:#DDF4E6; --warn:#8A5A00; --warn-soft:#FFF0C2;
  --play:#FFF1B0; --shadow:rgba(18,21,27,.12);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-read:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --nav-h:62px; --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --surface:#171A20; --ink:#ECEEF3; --muted:#969FB0; --line:#272B33;
  --accent:#8FA5FF; --accent-ink:#0A1233; --accent-soft:#1B2347;
  --mark:#F2C63C; --mark-ink:#12151B; --mark-soft:#3B3212;
  --danger:#FF8A75; --danger-soft:#3D1D17; --good:#5FCB84; --good-soft:#15321F; --warn:#FFD25E; --warn-soft:#3A3013;
  --play:rgba(242,198,60,.22); --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F13; --surface:#171A20; --ink:#ECEEF3; --muted:#969FB0; --line:#272B33;
  --accent:#8FA5FF; --accent-ink:#0A1233; --accent-soft:#1B2347;
  --mark:#F2C63C; --mark-ink:#12151B; --mark-soft:#3B3212;
  --danger:#FF8A75; --danger-soft:#3D1D17; --good:#5FCB84; --good-soft:#15321F; --warn:#FFD25E; --warn-soft:#3A3013;
  --play:rgba(242,198,60,.22); --shadow:rgba(0,0,0,.55); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header.top{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:0}
header.top .wrap{min-height:60px;padding-block:8px}
header.top h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
main .wrap{gap:16px;padding-block:8px 18px}
/* bottom bar: the active section is marked with the highlighter */
nav.tabs{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line)}
nav.tabs .in{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{font-size:11px;font-weight:600;gap:4px;letter-spacing:0;color:var(--muted);overflow:visible}
nav.tabs button svg{width:24px;height:24px;padding:3px 14px;box-sizing:content-box;border-radius:999px;transition:background .18s}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{background:var(--mark);color:var(--mark-ink)}
nav.tabs .badge{top:4px;left:calc(50% + 10px);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{border-radius:14px;padding:11px 16px;font-size:15px;font-weight:600;border-color:var(--line);transition:transform .08s,background .15s}
.btn:active,.icon-btn:active,.opt:active,.chip:active{transform:scale(.97)}
.btn.primary{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent}
.icon-btn{border-radius:14px;width:44px;height:44px}
.panel{border-radius:var(--r);padding:18px;gap:12px;border-color:transparent;box-shadow:0 1px 2px rgba(18,21,27,.05),0 0 0 1px var(--line)}
.panel h2{font-size:18px;letter-spacing:-.01em}
.small{font-size:14px}

.chip{padding:8px 14px;font-size:14px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}

@media (prefers-reduced-motion: reduce){.btn,.icon-btn,.opt,.chip,nav.tabs button svg{transition:none}.btn:active,.icon-btn:active,.opt:active,.chip:active{transform:none}}

<script>
"use strict";
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const LT='A-Za-z\\u00C0-\\u00D6\\u00D8-\\u00F6\\u00F8-\\u024F';
const WORD_RE=new RegExp('['+LT+']+(?:[\'’]['+LT+']+)*','g');
const norm=w=>w.toLowerCase().replace(/’/g,"'");
const phraseKey=t=>(t.match(WORD_RE)||[]).map(norm).join(' ');
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const fmtN=n=>Number(n||0).toLocaleString('ru-RU');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native);
const NB={seq:0,cb:new Map(),
  call(type,data,ms){return new Promise((res,rej)=>{const id=++this.seq;this.cb.set(id,{res,rej});if(ms)setTimeout(()=>{if(this.cb.delete(id))rej({code:'timeout'})},ms);try{window.webkit.messageHandlers.native.postMessage({id,type,data})}catch(e){this.cb.delete(id);rej({code:'bridge'})}})},
  post(type,data){try{window.webkit.messageHandlers.native.postMessage({id:0,type,data})}catch(e){}}};
window.__nb=(id,ok,val)=>{const c=NB.cb.get(id);if(!c)return;NB.cb.delete(id);ok?c.res(val):c.rej(val||{})};
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function today(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let toastT;
function toast(m,act,fn,ms){if(!m)return;const t=$('#toast');t.innerHTML='<span>'+esc(m)+'</span>'+(act?`<button type="button">${esc(act)}</button>`:'');t.hidden=false;if(act)t.querySelector('button').onclick=()=>{t.hidden=true;fn()};clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||(act?6000:2600))}

/* sentence splitter keeping every character */
const ABBR=/(?:\b(?:Mr|Mrs|Ms|Dr|St|Jr|Sr|Prof|Mt|vs|etc|No|Vol|Ch|Fig|Gen|Col|Lt|Sgt|Capt|Gov|Rev)|\b[A-HJ-Z]|\be\.g|\bi\.e)\.$/;
function splitSentences(p){
  const out=[];let start=0;const re=/[.!?…]+["'”’)\]]*(?=\s|$)/g;let m;
  while((m=re.exec(p))){
    const end=m.index+m[0].length;
    if(m[0]==='.'&&ABBR.test(p.slice(start,end)))continue;
    let e=end;while(e<p.length&&/\s/.test(p[e]))e++;
    out.push(p.slice(start,e));start=e;
  }
  if(start<p.length)out.push(p.slice(start));
  return out.filter(s=>s.trim());
}
/* rough English stemmer: groups help/helps/helped/helping for an approximate count */
function stem(w){
  w=w.replace(/n't$/,'').replace(/'(s|re|ll|ve|d|m)$/,'').replace(/s'$/,'s');
  if(w.length>4&&/ies$/.test(w))return w.slice(0,-3)+'y';
  if(w.length>4&&/(ss|x|z|ch|sh)es$/.test(w))return w.slice(0,-2);
  const undbl=x=>/([b-df-hj-np-tv-z])\1$/.test(x)&&!/(ll|ss|ff|zz)$/.test(x)?x.slice(0,-1):x;
  if(w.length>5&&/ing$/.test(w))return undbl(w.slice(0,-3)).replace(/e$/,'');
  if(w.length>4&&/ied$/.test(w))return w.slice(0,-3)+'y';
  if(w.length>4&&/ed$/.test(w))return undbl(w.slice(0,-2)).replace(/e$/,'');
  if(w.length>3&&/[^sui]s$/.test(w)&&!/^(news|series|species|means|always|perhaps|towards|afterwards|whereas|lens|bus|gas|yes|this|thus|was|has|does|goes|less|unless)$/.test(w))w=w.slice(0,-1);
  if(w.length>5&&/(er|est)$/.test(w)&&/^(bigg|hott|fatt|thinn|wett|sadd|redd|fitt)/.test(w))return w.replace(/(er|est)$/,'').slice(0,-1);
  return w.length>3?w.replace(/e$/,''):w;
}

const SAMPLE={title:'Пример: A Rainy Saturday',text:`On Saturday morning it was raining, so Anna decided to stay at home. She made a big cup of coffee and sat by the window. The street outside was empty, and the only sound was the rain on the roof.

She opened a book she had bought last month but never started. It was about a man who travels across Canada by train. After a few pages, she forgot about the weather completely.

In the afternoon, her brother called. He wanted to borrow her car because his was at the garage. Anna agreed, but she asked him to fill up the tank before bringing it back.

By evening the rain had stopped. The air smelled fresh, and the streets were shining under the lights. Anna put on her jacket and went out for a short walk. She felt calm and a little proud: she had read almost half of the book in one day.`};

/* ================= state ================= */
// S.words: lingqs (status 1-5), S.kn: plain marks (1 = known, 2 = ignored)
const S={lessons:new Map(),words:new Map(),kn:new Map(),prog:{},days:{}};
let db=null, sample=null, downloads=null, sampleOff=false, mode='loading', loadErr='', offline=false;

function statusOf(k){const w=S.words.get(k);if(w)return w.status||1;const v=S.kn.get(k);return v===1?5:v===2?-1:0}
function knownKeys(){const out=[];for(const w of S.words.values())if(!w.phrase&&w.status===5)out.push(w.k);for(const [k,v] of S.kn)if(v===1&&!S.words.has(k))out.push(k);return out}
function knownCount(){let n=0;for(const w of S.words.values())if(!w.phrase&&w.status===5)n++;for(const [k,v] of S.kn)if(v===1&&!S.words.has(k))n++;return n}
function learningCount(){let n=0;for(const w of S.words.values())if((w.status||1)<5)n++;return n}
let vocabVer=0, famCache={v:-1,n:0};
/* irregular forms -> base word */
const IRR=(()=>{const m=new Map();`be:am,is,are,was,were,been,being,isn't,aren't,wasn't,weren't|have:has,had,having,hasn't,haven't,hadn't|do:does,did,done,doing,doesn't,didn't|go:goes,went,gone,going|say:says,said|get:got,gotten|make:made|know:knew,known|think:thought|take:took,taken|see:saw,seen|come:came|give:gave,given|find:found|tell:told|become:became|leave:left|feel:felt|bring:brought|begin:began,begun|keep:kept|hold:held|write:wrote,written|stand:stood|hear:heard|mean:meant|meet:met|run:ran|pay:paid|sit:sat|speak:spoke,spoken|lie:lay,lain|lead:led|grow:grew,grown|lose:lost|fall:fell,fallen|send:sent|build:built|understand:understood|draw:drew,drawn|break:broke,broken|spend:spent|rise:rose,risen|drive:drove,driven|buy:bought|wear:wore,worn|choose:chose,chosen|seek:sought|throw:threw,thrown|catch:caught|deal:dealt|win:won|forget:forgot,forgotten|sell:sold|fight:fought|teach:taught|eat:ate,eaten|sing:sang,sung|drink:drank,drunk|swim:swam,swum|fly:flew,flown|freeze:froze,frozen|hide:hid,hidden|ride:rode,ridden|shake:shook,shaken|steal:stole,stolen|wake:woke,woken|bite:bit,bitten|blow:blew,blown|feed:fed|fly:flies|forgive:forgave,forgiven|hang:hung|light:lit|sleep:slept|sweep:swept|weep:wept|bend:bent|lend:lent|shoot:shot|slide:slid|stick:stuck|strike:struck|swing:swung|dig:dug|bleed:bled|breed:bred|flee:fled|kneel:knelt|dream:dreamt|learn:learnt|burn:burnt|smell:smelt|spell:spelt|spill:spilt|tear:tore,torn|bear:bore,born,borne|beat:beaten|arise:arose,arisen|shine:shone|withdraw:withdrew,withdrawn|undertake:undertook,undertaken|overcome:overcame|child:children|man:men|woman:women|person:people|foot:feet|tooth:teeth|mouse:mice|goose:geese|life:lives|wife:wives|knife:knives|leaf:leaves|half:halves|wolf:wolves|shelf:shelves|thief:thieves|good:better,best|bad:worse,worst|far:further,farther,furthest,farthest|little:less,least|many:more,most|i:me,my,mine,myself|you:your,yours,yourself,yourselves|he:him,his,himself|she:her,hers,herself|it:its,itself|we:us,our,ours,ourselves|they:them,their,theirs,themselves|can:could,can't,couldn't,cannot|will:would,won't,wouldn't|shall:should,shouldn't|may:might`.split('|').forEach(g=>{const [b,f]=g.split(':');for(const x of f.split(','))m.set(x,b)});return m})();
function lemmaKey(k){
  const w=S.words.get(k);
  if(w&&!w.phrase&&w.lemma){const l=norm(w.lemma.trim().split(/[\s,;(]/)[0]||'');if(/^[a-z']+$/.test(l))return stem(IRR.get(l)||l)}
  const base=k.replace(/n't$/,'').replace(/'(s|re|ll|ve|d|m)$/,'');
  return stem(IRR.get(k)||IRR.get(base)||base);
}
function famCount(){if(famCache.v!==vocabVer)famCache={v:vocabVer,n:new Set(knownKeys().map(lemmaKey)).size};return famCache.n}
/* CEFR thresholds: Milton & Alexiou (2009), known words among the 5000 most frequent (X-Lex) */
const CEFR=[['A1',0],['A2',1500],['B1',2750],['B2',3250],['C1',3750],['C2',4500]];
function cefrOf(n){let i=0;for(let j=0;j<CEFR.length;j++)if(n>=CEFR[j][1])i=j;return i}

/* ---- vocab store: buckets vocab/<b> = {w:{key:obj|null}, k:{key:0|1|2}} ---- */
const bucketOf=k=>{const a=k[0]||'_',b=k[1]||'_';return (/[a-z]/.test(a)?a:'_')+(/[a-z]/.test(b)?b:'_')};
const serverB=new Map(), bucketExists=new Set();
const pendW=new Map(), pendK=new Map(); let gen=0;
const dirtyB=new Map(); let flushT=null, flushing=false;
function vocabWrite(k,wVal,kVal){
  const g=++gen;vocabVer++;
  if(wVal!==undefined){pendW.set(k,{v:wVal,g});if(wVal===null)S.words.delete(k);else S.words.set(k,wVal)}
  if(kVal!==undefined){pendK.set(k,{v:kVal,g});if(kVal)S.kn.set(k,kVal);else S.kn.delete(k)}
  if(db){const b=bucketOf(k);let p=dirtyB.get(b);if(!p){p={w:{},k:{},keys:[]};dirtyB.set(b,p)}
    if(wVal!==undefined)p.w[k]=wVal;if(kVal!==undefined)p.k[k]=kVal;p.keys.push([k,g]);
    clearTimeout(flushT);flushT=setTimeout(flush,60)}
  else persistLocal();
  changed();
}
async function flush(){
  if(flushing)return;flushing=true;
  try{
    while(dirtyB.size){
      const [b,p]=dirtyB.entries().next().value;dirtyB.delete(b);
      const patch={};if(Object.keys(p.w).length)patch.w=p.w;if(Object.keys(p.k).length)patch.k=p.k;
      const ref=db.collection('vocab').doc(b);

async function parseEpub(buf){

  const items={};let navHref=null,ncxHref=null;

    if(navHref){const np=resolve(base,navHref);const nd=P.parseFromString(await zip.file(np).async('string'),'application/xhtml+xml');for(const a of nd.getElementsByTagName('a')){const h=a.getAttribute('href');if(!h)continue;const p=resolve(dir(np),h);const t=a.textContent.replace(/\s+/g,' ').trim();if(t&&!toc[p])toc[p]=t}}
    else if(ncxHref){const np=resolve(base,ncxHref);const nd=P.parseFromString(await zip.file(np).async('string'),'application/xml');for(const pt of nd.getElementsByTagNameNS('*','navPoint')){const c=pt.getElementsByTagNameNS('*','content')[0];const l=pt.getElementsByTagNameNS('*','text')[0];if(!c||!l)continue;const p=resolve(dir(np),c.getAttribute('src'));const t=l.textContent.replace(/\s+/g,' ').trim();if(t&&!toc[p])toc[p]=t}}

async function parseDocx(buf){

async function parsePdf(buf,onProgress){

    onProgress&&onProgress(`Страница ${p} из ${pdf.numPages}…`);
    const tc=await (await pdf.getPage(p)).getTextContent();
    const lines=[];let line='',prevEnd=null,prevY=null;
    for(const it of tc.items){
      if(typeof it.str!=='string')continue;

      if(prevEnd!==null&&it.str&&x-prevEnd>fsz*0.15&&!/\s$/.test(line)&&!/^\s/.test(it.str))line+=' ';

async function parseFile(file,onProgress){
  const name=file.name;const ext=(name.split('.').pop()||'').toLowerCase();const base=name.replace(/\.[^.]+$/,'');

  else if(ext==='html'||ext==='htm'||ext==='xhtml')r={title:'',sections:[{title:'',text:blocksFromDoc(new DOMParser().parseFromString(decodeText(buf),'text/html'))}]};

function splitText(text,max=1800){

    const c=wc(p);

    if(n+c>max)flush();cur.push(p);n+=c;

let winUp=null;
function rangeInfo(i,j){

  const r=document.createRange();r.setStartBefore(a);r.setEndAfter(b);

function openRange(i,j){const r=rangeInfo(i,j);openSheet(r.k,r.disp,r.ctx,r.si,r.phrase,r.ph,r.range)}
function attachSelection(box){
  let press=null, suppress=false;
  const clearPick=()=>{for(const s of box.querySelectorAll('.w.pick'))s.classList.remove('pick')};
  const pickRange=(a,b)=>{let i=+a.dataset.n,j=+b.dataset.n;if(i>j)[i,j]=[j,i];if(j-i>11)j=i+11;clearPick();for(let k=i;k<=j;k++)spans[k].classList.add('pick');press.range=[i,j]};
  const cancel=()=>{if(press){clearTimeout(press.timer);clearPick();press=null}};
  const finish=()=>{const [i,j]=press.range;clearPick();openRange(i,j)};
  box.addEventListener('touchstart',e=>{
    if(press)cancel();
    if(e.touches.length>1)return;
    const w=e.target.closest('.w');if(!w)return;const t=e.touches[0];
    press={start:w,x:t.clientX,y:t.clientY,active:false,range:null};
    press.timer=setTimeout(()=>{if(!press)return;press.active=true;pickRange(w,w)},380)},{passive:true});
  box.addEventListener('touchmove',e=>{
    if(!press)return;if(e.touches.length>1){cancel();return}
    const t=e.touches[0];
    if(!press.active){if(Math.hypot(t.clientX-press.x,t.clientY-press.y)>10)cancel();return}
    if(e.cancelable)e.preventDefault();
    const el=document.elementFromPoint(t.clientX,t.clientY);const w=el&&el.closest&&el.closest('#text .w');if(w)pickRange(press.start,w)},{passive:false});
  box.addEventListener('touchend',e=>{if(!press)return;clearTimeout(press.timer);if(press.active){if(e.cancelable)e.preventDefault();finish()}press=null});
  box.addEventListener('touchcancel',cancel);
  box.addEventListener('contextmenu',e=>e.preventDefault());
  box.addEventListener('mousedown',e=>{if(e.button||e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents)return;const w=e.target.closest('.w');if(!w)return;press={start:w,active:false,range:null,mouse:true};
    press.timer=setTimeout(()=>{if(press&&!press.active){press.active=true;pickRange(w,w)}},450)});
  box.addEventListener('mousemove',e=>{if(!press||!press.mouse)return;const w=e.target.closest('.w');if(w&&(w!==press.start||press.active)){press.active=true;clearTimeout(press.timer);pickRange(press.start,w)}});
  if(winUp)removeEventListener('mouseup',winUp);
  winUp=()=>{if(!press||!press.mouse)return;clearTimeout(press.timer);if(press.active){suppress=true;setTimeout(()=>suppress=false,300);finish()}press=null};
  addEventListener('mouseup',winUp);
  box.addEventListener('click',e=>{
    if(suppress){suppress=false;return}
    const w=e.target.closest('.w');if(!w){if(sheet)closeSheet();return}
    const n=+w.dataset.n;openRange(n,n);
  });
}

/* ================= cards (SRS) =================
   Two correct answers in a row, on separate reviews, move a word up one level.
   Intervals expand with the level (spacing effect); a mistake moves it down one level.
   Levels 1-2: multiple choice (recognition). Levels 3-4: recall first, then "remembered / not". */
const LV_DAYS={1:1,2:3,3:7,4:14};
/* the learning day starts at 04:00, so a session after midnight still belongs to the evening */
function dayStart(t,plus=0){const d=new Date(t);if(d.getHours()<4)d.setDate(d.getDate()-1);d.setHours(4,0,0,0);d.setDate(d.getDate()+plus);return d.getTime()}
/* a short retry (10 minutes after a mistake) keeps its exact time; everything else is due for the whole day */
function isDue(w,now){const due=w.due||0;return due-(w.last||0)<12*36e5?due<=now:due<dayStart(now,1)}
function grade(w,ok,counted,now=Date.now()){
  let {status=1,streak=0,lapses=0,reps=0}=w;status=status||1;
  let due,leveled=false;
  if(ok){
    if(counted){streak++;reps++;if(streak>=2){streak=0;status++;leveled=true}}
    if(status>=5){status=5;due=now+60*864e5}
    else{
      /* due by calendar day, not by the clock: a card answered in the evening is back the next morning */
      const days=Math.max(1,Math.round(LV_DAYS[status]*(lapses>=3?0.7:1)));
      due=dayStart(now,days);
      if(!counted)due=Math.max(due,w.due||0);
    }
  }else{
    streak=0;lapses++;status=Math.max(1,status-1);due=now+10*60e3;
  }
  return {w:{...w,status,streak,lapses,reps,due,last:now,interval:Math.max(0,(due-now)/864e5)},leveled};
}
const shortTr=t=>{t=String(t||'').trim();return t.length>70?t.slice(0,68)+'…':t};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildChoice(w,dir){
  const ans=x=>dir==='ru'?(x.w||x.k):shortTr(x.tr);
  const right=ans(w);if(!right||(dir!=='ru'&&!w.tr))return null;
  const seen=new Set([right.toLowerCase()]);const out=[];
  /* wrong options of the same kind as the right one (verb with verbs, adjective with adjectives), so the form gives nothing away */
  const kind=x=>{if(x.phrase)return 'p';const p={verb:'v',adjective:'a',noun:'n',adverb:'d'}[x.pos];if(p)return p;
    const f=String(x.tr||'').split(',')[0].trim().toLowerCase();return /(ть|ться|чь|тись|ти)$/.test(f)?'v':/(ый|ий|ой|ая|яя|ое|ее|ые|ие)$/.test(f)?'a':'n'};
  const all=[...S.words.values()].filter(x=>x.k!==w.k&&x.tr),kw=kind(w);
  const pools=[all.filter(x=>kind(x)===kw),all.filter(x=>!!x.phrase===!!w.phrase),all];
  for(const pool of pools){for(const x of shuffle(pool)){const a=ans(x);if(!a||seen.has(a.toLowerCase()))continue;seen.add(a.toLowerCase());out.push(a);if(out.length===3)break}if(out.length===3)break}
  if(out.length<3)return null;
  return shuffle([right,...out]).map(t=>({t,ok:t===right}));
}

      <div class="tile"><b>${fmtN(tr.read||0)}</b><span>слов прочитано</span></div>
      <div class="tile"><b>${fmtMin(tr.rsec)}</b><span>время чтения</span></div>
      <div class="tile"><b>${(tr.ts||0)>=60?Math.round(tr.tw/tr.ts*60):'—'}</b><span>слов в минуту</span></div>
    </div>
    <div class="panel"><h2>Известные слова по дням</h2>${chartKnown(days,known)}</div>
    <div class="panel"><h2>Мои слова по уровням</h2><div class="dist">
      ${[1,2,3,4].map(n=>`<div class="r"><span>Уровень ${n}</span><span class="t"><i style="width:${lv[n-1]/dmax*100}%;background:var(--l${n});${n>2?'box-shadow:inset 0 0 0 1px var(--l1)':''}"></i></span><span class="n">${fmtN(lv[n-1])}</span></div>`).join('')}
      <div class="r"><span>Знаю ✓</span><span class="t"><i style="width:${known/dmax*100}%;background:var(--accent)"></i></span><span class="n">${fmtN(known)}</span></div>
    </div><div class="small muted">В изучении: ${fmtN(lingqs)}, из них фраз: ${fmtN(phrases)}. Игнорируется: ${fmtN(ign)}. К повторению сейчас: ${fmtN(dueKeys().length)}.</div></div>
    <span class="label">За всё время</span>
    <div class="tiles">
      <div class="tile"><b>${fmtN(read)}</b><span>слов прочитано (с повторными прочтениями)</span></div>
      <div class="tile"><b>${fmtN(reviews)}</b><span>ответов в карточках</span></div>
      <div class="tile"><b>${fmtN(active)}</b><span>активных дней</span></div>
      <div class="tile"><b>${fmtN(streak)}</b><span>дней подряд</span></div>
      <div class="tile"><b>${fmtMin(rsecAll)}</b><span>время чтения</span></div>
      <div class="tile"><b>${tsAll>=60?Math.round(twAll/tsAll*60):'—'}</b><span>слов в минуту в среднем</span></div>
    </div>
    <div class="small muted">Слова засчитываются по страницам: каждая перевёрнутая страница сразу попадает в «прочитано», поэтому главу можно читать несколько дней. Время идёт только на вкладке «Чтение», пока ты листаешь, нажимаешь слова или слушаешь; через минуту без действий счёт останавливается. Скорость считается только по страницам, прочитанным в темпе от ${WPM_MIN} до ${WPM_MAX} слов в минуту: пролистанные за секунды и оставленные открытыми в неё не попадают.</div>
    <div class="panel"><h2>Данные</h2>
      ${downloads||NATIVE?`<div class="row"><button class="btn" id="expCsv">Слова в CSV (для Anki)</button><button class="btn" id="expJson">Резервная копия</button></div>`:'<div class="small muted">Сохранение файлов недоступно в этом окне.</div>'}
      <div class="row"><button class="btn ${restoreArm?'danger':''}" id="impJson">${restoreArm?'Выбрать файл копии':'Восстановить из копии'}</button>${restoreArm?'<span class="small muted">Данные из копии добавятся к текущим.</span>':''}</div>
    </div>
    <div class="small muted">Статистика по дням ведётся с первого запуска. Ступени — шкала приложения по числу известных слов, а не уровень CEFR или LingQ.</div>`;
  $('#expCsv')&&($('#expCsv').onclick=exportCsv);
  $('#expJson')&&($('#expJson').onclick=exportJson);
  $('#impJson').onclick=()=>{if(!restoreArm){restoreArm=true;renderProgress();return}restoreArm=false;$('#backupIn').value='';$('#backupIn').click();renderProgress()};
}
function chartKnown(days,known){
  const keys=Object.keys(days).filter(k=>days[k].known!=null||days[k].startKnown!=null).sort();
  if(keys.length<2)return `<div class="small muted">График появится, когда наберётся хотя бы два дня занятий. Сейчас: ${fmtN(known)} слов.</div>`;
  const pts=keys.slice(-60).map(k=>[k,days[k].known??days[k].startKnown]);
  const W=340,H=150,pl=44,pr=10,pt=10,pb=24;
  const max=Math.max(...pts.map(p=>p[1])),min=Math.min(...pts.map(p=>p[1]));
  const lo=Math.max(0,Math.floor(min*0.95)),hi=Math.max(lo+10,Math.ceil(max*1.02));
  const x=i=>pl+(i/(pts.length-1))*(W-pl-pr);const y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const area=line+`L${x(pts.length-1).toFixed(1)},${H-pb}L${pl},${H-pb}Z`;
  const fd=k=>k.slice(8,10)+'.'+k.slice(5,7);const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Известные слова по дням">
    ${[lo,Math.round((lo+hi)/2),hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmtN(v)}</text>`).join('')}
    <path d="${area}" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last[1])}" r="4" fill="var(--accent)"/>
    <text x="${pl}" y="${H-6}">${fd(pts[0][0])}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fd(last[0])}</text></svg>`;
}
async function saveFile(filename,data){
  if(NATIVE){try{await NB.call('share',{filename,data});toast('Готово')}catch(e){}return}
  if(!downloads){toast('Сохранение файлов недоступно здесь');return}
  try{await downloads.save({filename,data});toast('Готово')}catch(e){if(e&&e.code!=='declined')toast('Не удалось сохранить файл ('+(e.code||'ошибка')+')')}
}
function exportCsv(){
  const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
  const rows=[['word','translation','transcription','context','level'].join(',')];
  for(const w of S.words.values())rows.push([w.w||w.k,w.tr,w.ipa,w.ctx,w.status===5?'known':w.status].map(q).join(','));
  saveFile('leksika-words-'+today()+'.csv','\uFEFF'+rows.join('\n'));
}
function exportJson(){
  saveFile('leksika-backup-'+today()+'.json',JSON.stringify({app:'leksika',v:2,lessons:Object.fromEntries(S.lessons),words:Object.fromEntries(S.words),kn:Object.fromEntries(S.kn),prog:S.prog,days:S.days}));
}
$('#backupIn').onchange=async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{
    const d=JSON.parse(decodeText(await f.arrayBuffer()));if(!d||d.app!=='leksika')throw new Error('Это не резервная копия «Лексики».');
    toast('Восстанавливаю…');
    for(const [id,l] of Object.entries(d.lessons||{}))if(!S.lessons.has(id))await putLesson(id,l);
    for(const [k,w] of Object.entries(d.words||{}))if(w&&w.k&&!S.words.has(k))vocabWrite(k,w,undefined);
    for(const [k,v] of Object.entries(d.kn||{}))if(!S.kn.has(k)&&!S.words.has(k))vocabWrite(k,undefined,v);
    for(const [id,p] of Object.entries(d.prog||{}))if(!S.prog[id])setProg(id,p,0);
    for(const [day,r] of Object.entries(d.days||{}))if(!S.days[day]){S.days[day]=r;if(db)await queue('day',()=>db.collection('days').doc(day).set(r))}
    persistLocal();toast('Копия восстановлена');renderView();
  }catch(err){toast((err&&err.message)||'Не удалось прочитать копию')}
};

/* ================= misc ================= */
addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
init();
</script>

{lv:'b',ru:'Артикли и фразовые глаголы',en:'Articles and phrasal verbs',units:[
{id:'art2',ru:'Артикли: трудные случаи',en:'Articles in depth',
 th:{ru:`<p>Три зоны, где артикль чаще всего ставят неправильно.</p>
<p><b>1. Вообще или конкретно.</b> Когда говорим о чём-то в общем смысле, артикля нет. Когда о конкретном, известном обоим — the.</p>
<table><tr><th>в общем</th><th>конкретно</th></tr>
<tr><td><span class="en">I love music.</span></td><td><span class="en">I liked the music at the party.</span></td></tr>
<tr><td><span class="en">Life is short.</span></td><td><span class="en">the life of a sailor</span></td></tr>
<tr><td><span class="en">Dogs are friendly.</span></td><td><span class="en">The dogs next door are noisy.</span></td></tr></table>
<p><b>2. Географические названия.</b></p>
<table><tr><th>с the</th><th>без артикля</th></tr>
<tr><td>реки, моря, океаны: the Volga, the Black Sea, the Atlantic</td><td>города, континенты: Moscow, Europe</td></tr>
<tr><td>горные цепи: the Alps, the Caucasus</td><td>отдельные горы, озёра: Elbrus, Lake Baikal</td></tr>
<tr><td>страны со словами States, Kingdom, Republic и во мн. числе: the USA, the UK, the Netherlands</td><td>остальные страны: Russia, France</td></tr></table>
<p><b>3. Место по назначению.</b> Если человек там по прямому назначению, артикля нет: <span class="en">go to school</span>, <span class="en">be in hospital</span>, <span class="en">go to bed</span>, <span class="en">at work</span>, <span class="en">at home</span>.</p>
<p>И ещё: the — с тем, что одно на свете (the sun, the moon, the world), с превосходной степенью (the best) и с музыкальными инструментами (play the guitar; в американской речи артикль здесь часто опускают).</p>`,
 en:`<p>Three areas where articles go wrong most often.</p>
<p><b>1. General or specific.</b> No article when we mean something in general. Use the for something specific that both people know.</p>
<table><tr><th>general</th><th>specific</th></tr>
<tr><td><span class="en">I love music.</span></td><td><span class="en">I liked the music at the party.</span></td></tr>
<tr><td><span class="en">Life is short.</span></td><td><span class="en">the life of a sailor</span></td></tr>
<tr><td><span class="en">Dogs are friendly.</span></td><td><span class="en">The dogs next door are noisy.</span></td></tr></table>
<p><b>2. Place names.</b></p>
<table><tr><th>with the</th><th>no article</th></tr>
<tr><td>rivers, seas, oceans: the Volga, the Black Sea, the Atlantic</td><td>cities, continents: Moscow, Europe</td></tr>
<tr><td>mountain ranges: the Alps, the Caucasus</td><td>single mountains, lakes: Elbrus, Lake Baikal</td></tr>
<tr><td>countries with States, Kingdom, Republic and plural names: the USA, the UK, the Netherlands</td><td>other countries: Russia, France</td></tr></table>
<p><b>3. A place used for its purpose.</b> No article: <span class="en">go to school</span>, <span class="en">be in hospital</span>, <span class="en">go to bed</span>, <span class="en">at work</span>, <span class="en">at home</span>.</p>
<p>Also: the with unique things (the sun, the moon, the world), superlatives (the best) and musical instruments (play the guitar).</p>`},
 rules:{a:{ru:'В общем смысле — без артикля; конкретное, известное обоим — the.',en:'General meaning — no article; specific and known to both — the.'},
  b:{ru:'the — реки, моря, океаны, горные цепи, страны с States / Kingdom / Republic; без артикля — города, обычные страны, озёра.',en:'the — rivers, seas, oceans, mountain ranges, countries with States / Kingdom / Republic; no article — cities, most countries, lakes.'},
  c:{ru:'Место по назначению — без артикля: go to school, in hospital, go to bed, at work.',en:'A place used for its purpose — no article: go to school, in hospital, go to bed, at work.'},
  d:{ru:'the — единственное в своём роде, превосходная степень, музыкальные инструменты.',en:'the — unique things, superlatives, musical instruments.'}},

{id:'phr',ru:'Фразовые глаголы',en:'Phrasal verbs',
 th:{ru:`<p>Фразовый глагол — это глагол + короткое слово (up, off, out, on, for, after). Вместе они значат не то, что по отдельности: <b>give</b> — давать, <b>give up</b> — бросить, сдаться.</p>
<table><tr><th>Глагол</th><th>Значение</th><th>Пример</th></tr>
<tr><td>get up</td><td>вставать</td><td><span class="en">I get up at seven.</span></td></tr>
<tr><td>turn on / off</td><td>включить / выключить</td><td><span class="en">Turn off the light.</span></td></tr>
<tr><td>put on / take off</td><td>надеть / снять</td><td><span class="en">Put on your coat.</span></td></tr>
<tr><td>look for</td><td>искать</td><td><span class="en">I am looking for my keys.</span></td></tr>
<tr><td>look after</td><td>присматривать</td><td><span class="en">She looks after the children.</span></td></tr>
<tr><td>give up</td><td>бросить</td><td><span class="en">He gave up smoking.</span></td></tr>
<tr><td>find out</td><td>узнать, выяснить</td><td><span class="en">I found out the truth.</span></td></tr>
<tr><td>pick up</td><td>поднять, забрать</td><td><span class="en">Pick up the phone.</span></td></tr>
<tr><td>grow up</td><td>вырасти</td><td><span class="en">I grew up in Kazan.</span></td></tr>
<tr><td>run out of</td><td>закончиться (о запасе)</td><td><span class="en">We have run out of milk.</span></td></tr>
<tr><td>wake up</td><td>проснуться</td><td><span class="en">I woke up late.</span></td></tr>
<tr><td>come back</td><td>вернуться</td><td><span class="en">Come back soon.</span></td></tr>
<tr><td>go on</td><td>продолжать</td><td><span class="en">Please go on.</span></td></tr>
<tr><td>turn up / down</td><td>сделать громче / тише</td><td><span class="en">Turn the music down.</span></td></tr>
<tr><td>look up</td><td>посмотреть в словаре</td><td><span class="en">Look it up.</span></td></tr>
<tr><td>fill in</td><td>заполнить (бланк)</td><td><span class="en">Fill in this form.</span></td></tr></table>
<p><b>Порядок слов.</b> У многих глаголов дополнение-существительное может стоять и в середине, и в конце: <span class="en">Turn off the light.</span> = <span class="en">Turn the light off.</span></p>
<p>Но короткое местоимение (it, them, me) — только в середине: <span class="en">Turn it off.</span> <span class="bad">Turn off it.</span></p>
<p>Некоторые глаголы не разделяются вообще: <span class="en">look for my keys</span>, <span class="en">look after them</span>.</p>`,
 en:`<p>A phrasal verb is a verb + a short word (up, off, out, on, for, after). Together they mean something new: <b>give</b> but <b>give up</b> = stop doing.</p>
<table><tr><th>Verb</th><th>Meaning</th><th>Example</th></tr>
<tr><td>get up</td><td>leave your bed</td><td><span class="en">I get up at seven.</span></td></tr>
<tr><td>turn on / off</td><td>start / stop a device</td><td><span class="en">Turn off the light.</span></td></tr>
<tr><td>put on / take off</td><td>clothes on / off</td><td><span class="en">Put on your coat.</span></td></tr>
<tr><td>look for</td><td>try to find</td><td><span class="en">I am looking for my keys.</span></td></tr>
<tr><td>look after</td><td>take care of</td><td><span class="en">She looks after the children.</span></td></tr>
<tr><td>give up</td><td>stop doing</td><td><span class="en">He gave up smoking.</span></td></tr>
<tr><td>find out</td><td>discover</td><td><span class="en">I found out the truth.</span></td></tr>
<tr><td>pick up</td><td>lift, collect</td><td><span class="en">Pick up the phone.</span></td></tr>
<tr><td>grow up</td><td>become an adult</td><td><span class="en">I grew up in Kazan.</span></td></tr>
<tr><td>run out of</td><td>have none left</td><td><span class="en">We have run out of milk.</span></td></tr>
<tr><td>wake up</td><td>stop sleeping</td><td><span class="en">I woke up late.</span></td></tr>
<tr><td>come back</td><td>return</td><td><span class="en">Come back soon.</span></td></tr>
<tr><td>go on</td><td>continue</td><td><span class="en">Please go on.</span></td></tr>
<tr><td>turn up / down</td><td>make louder / quieter</td><td><span class="en">Turn the music down.</span></td></tr>
<tr><td>look up</td><td>find in a dictionary</td><td><span class="en">Look it up.</span></td></tr>
<tr><td>fill in</td><td>complete a form</td><td><span class="en">Fill in this form.</span></td></tr></table>
<p><b>Word order.</b> With many verbs a noun object can go in the middle or at the end: <span class="en">Turn off the light.</span> = <span class="en">Turn the light off.</span></p>
<p>But a short pronoun (it, them, me) goes only in the middle: <span class="en">Turn it off.</span> <span class="bad">Turn off it.</span></p>
<p>Some verbs never split: <span class="en">look for my keys</span>, <span class="en">look after them</span>.</p>`},
 rules:{a:{ru:'Смысл — у всего сочетания: give up = бросить, find out = узнать, run out of = закончиться.',en:'The meaning belongs to the whole phrase: give up, find out, run out of.'},
  b:{ru:'Местоимение it / them / me ставится в середину: turn it off, pick them up.',en:'A pronoun (it / them / me) goes in the middle: turn it off, pick them up.'},
  c:{ru:'Существительное — в середине или в конце: take off your shoes / take your shoes off.',en:'A noun can go in the middle or at the end: take off your shoes / take your shoes off.'},
  d:{ru:'Не разделяются: look for, look after, get up, run out of.',en:'These never split: look for, look after, get up, run out of.'}},

{lv:'b',ru:'Вопросы и короткие ответы',en:'Questions and short answers',units:[
{id:'tags',ru:'Вопросы-хвостики: …, не так ли?',en:"Question tags: …, isn't it?",
 th:{ru:`<p>Хвостик в конце превращает утверждение в вопрос: «…, не так ли?», «…, правда?», «…, да?». В английском он строится из вспомогательного глагола и местоимения.</p>
<table><tr><th>Предложение</th><th>Хвостик</th></tr>
<tr><td>утвердительное</td><td>отрицательный: <span class="en">It is cold, isn't it?</span></td></tr>
<tr><td>отрицательное</td><td>утвердительный: <span class="en">You don't smoke, do you?</span></td></tr></table>
<p><b>Какой глагол.</b> Тот же вспомогательный, что в предложении: be, have, can, will, would. Если его нет — do / does / did.</p>
<ul><li><span class="en">She can swim, can't she?</span></li><li><span class="en">They have left, haven't they?</span></li><li><span class="en">He works here, doesn't he?</span></li><li><span class="en">You saw it, didn't you?</span></li></ul>
<p><b>Какое местоимение.</b> Существительное заменяем: <span class="en">Tom is late, isn't he?</span></p>
<p>Особые случаи: <span class="en">I am late, aren't I?</span> <span class="en">Let's go, shall we?</span> <span class="en">Open the door, will you?</span></p>`,
 en:`<p>A tag at the end turns a statement into a question. It is built from an auxiliary verb and a pronoun.</p>
<table><tr><th>Statement</th><th>Tag</th></tr>
<tr><td>positive</td><td>negative: <span class="en">It is cold, isn't it?</span></td></tr>
<tr><td>negative</td><td>positive: <span class="en">You don't smoke, do you?</span></td></tr></table>
<p><b>Which verb.</b> The same auxiliary as in the statement: be, have, can, will, would. If there is none, use do / does / did.</p>
<ul><li><span class="en">She can swim, can't she?</span></li><li><span class="en">They have left, haven't they?</span></li><li><span class="en">He works here, doesn't he?</span></li><li><span class="en">You saw it, didn't you?</span></li></ul>
<p><b>Which pronoun.</b> Replace a noun: <span class="en">Tom is late, isn't he?</span></p>
<p>Special cases: <span class="en">I am late, aren't I?</span> <span class="en">Let's go, shall we?</span> <span class="en">Open the door, will you?</span></p>`},
 rules:{a:{ru:'Утверждение → отрицательный хвостик; отрицание → утвердительный.',en:'Positive statement → negative tag; negative statement → positive tag.'},
  b:{ru:'В хвостике тот же вспомогательный глагол; если его нет — do / does / did.',en:'The tag repeats the auxiliary; if there is none, use do / does / did.'},
  c:{ru:'В хвостике всегда местоимение: Tom → he, the children → they.',en:'The tag always has a pronoun: Tom → he, the children → they.'},
  d:{ru:"Особые: I am → aren't I; Let's → shall we; просьба → will you.",en:"Special: I am → aren't I; Let's → shall we; a request → will you."}},

{id:'soneither',ru:'Я тоже: So do I, Neither do I',en:'So do I / Neither do I',
 th:{ru:`<p>Короткий ответ «я тоже» по-английски зависит от того, утверждение перед ним или отрицание.</p>
<table><tr><th>Реплика</th><th>Ответ</th><th>Смысл</th></tr>
<tr><td><span class="en">I like tea.</span></td><td><span class="en">So do I.</span></td><td>Я тоже.</td></tr>
<tr><td><span class="en">I don't like tea.</span></td><td><span class="en">Neither do I.</span></td><td>Я тоже нет.</td></tr></table>
<p>Порядок слов как в вопросе: <b>So / Neither + вспомогательный глагол + подлежащее</b>.</p>
<p>Глагол берём из реплики собеседника. Если вспомогательного нет — do / does / did.</p>
<ul><li><span class="en">I am tired.</span> — <span class="en">So am I.</span></li><li><span class="en">I can't swim.</span> — <span class="en">Neither can I.</span></li><li><span class="en">I have been there.</span> — <span class="en">So have I.</span></li><li><span class="en">I went home.</span> — <span class="en">So did I.</span></li></ul>
<p>После Neither глагол утвердительный: отрицание уже в самом слове.</p>
<p>Если не согласен, повторяем только подлежащее и глагол: <span class="en">I like jazz.</span> — <span class="en">I don't.</span> <span class="en">I can't cook.</span> — <span class="en">I can.</span></p>
<p>В разговоре проще: <span class="en">Me too.</span> и <span class="en">Me neither.</span></p>`,
 en:`<p>The short answer for agreement depends on whether the statement is positive or negative.</p>
<table><tr><th>Statement</th><th>Reply</th><th>Meaning</th></tr>
<tr><td><span class="en">I like tea.</span></td><td><span class="en">So do I.</span></td><td>I like it too.</td></tr>
<tr><td><span class="en">I don't like tea.</span></td><td><span class="en">Neither do I.</span></td><td>I don't either.</td></tr></table>
<p>Word order as in a question: <b>So / Neither + auxiliary + subject</b>.</p>
<p>Take the verb from the other person's statement. If there is no auxiliary, use do / does / did.</p>
<ul><li><span class="en">I am tired.</span> — <span class="en">So am I.</span></li><li><span class="en">I can't swim.</span> — <span class="en">Neither can I.</span></li><li><span class="en">I have been there.</span> — <span class="en">So have I.</span></li><li><span class="en">I went home.</span> — <span class="en">So did I.</span></li></ul>
<p>After Neither the verb is positive: the negative is already in the word.</p>
<p>To disagree, repeat only the subject and the verb: <span class="en">I like jazz.</span> — <span class="en">I don't.</span> <span class="en">I can't cook.</span> — <span class="en">I can.</span></p>
<p>In conversation: <span class="en">Me too.</span> and <span class="en">Me neither.</span></p>`},
 rules:{a:{ru:'На утверждение: So + вспомогательный глагол + подлежащее.',en:'After a positive statement: So + auxiliary + subject.'},
  b:{ru:'На отрицание: Neither + утвердительный вспомогательный + подлежащее.',en:'After a negative statement: Neither + positive auxiliary + subject.'},
  c:{ru:'Глагол тот же, что в реплике; если его нет — do / does / did.',en:'Use the same auxiliary as the statement; if there is none, do / does / did.'},
  d:{ru:"Не согласен: I do. / I don't. / I can. / I am not.",en:"To disagree: I do. / I don't. / I can. / I am not."}},

{lv:'b',ru:'Слова и сочетания',en:'Words and patterns',units:[
{id:'quant',ru:'Оба, ни один, все, каждый',en:'both, either, neither, all, most, every',
 th:{ru:`<p><b>О двух предметах или людях:</b></p>
<table><tr><th>Слово</th><th>Смысл</th><th>Пример</th></tr>
<tr><td>both</td><td>оба (мн. число)</td><td><span class="en">Both films are good.</span></td></tr>
<tr><td>either</td><td>любой из двух (ед. число)</td><td><span class="en">Either day is fine.</span></td></tr>
<tr><td>neither</td><td>ни один из двух (ед. число)</td><td><span class="en">Neither answer is correct.</span></td></tr></table>
<p>Парные союзы: <span class="en">both Anna and Tom</span> (и… и), <span class="en">either tea or coffee</span> (или… или), <span class="en">neither tea nor coffee</span> (ни… ни).</p>
<p>С neither глагол утвердительный: <span class="en">Neither of them came.</span></p>
<p><b>О трёх и больше:</b> all (все), most (большинство), some (некоторые), none (никто, ни один).</p>
<p>После most, some, none перед <b>the, my, these</b> и перед <b>them, us</b> нужен of: <span class="en">most of my friends</span>, <span class="en">none of the students</span>, <span class="en">all of them</span>. После all и both перед существительным of можно опустить: <span class="en">all my friends</span>, <span class="en">both my parents</span>. В общем смысле of нет: <span class="en">Most people like music.</span></p>
<p><b>every</b> и <b>each</b> — «каждый», всегда с единственным числом: <span class="en">Every student has a book.</span></p>`,
 en:`<p><b>Two things or people:</b></p>
<table><tr><th>Word</th><th>Meaning</th><th>Example</th></tr>
<tr><td>both</td><td>the two together (plural)</td><td><span class="en">Both films are good.</span></td></tr>
<tr><td>either</td><td>one or the other (singular)</td><td><span class="en">Either day is fine.</span></td></tr>
<tr><td>neither</td><td>not one and not the other (singular)</td><td><span class="en">Neither answer is correct.</span></td></tr></table>
<p>Pairs: <span class="en">both Anna and Tom</span>, <span class="en">either tea or coffee</span>, <span class="en">neither tea nor coffee</span>.</p>
<p>With neither the verb is positive: <span class="en">Neither of them came.</span></p>
<p><b>Three or more:</b> all, most, some, none.</p>
<p>After most, some, none use of before <b>the, my, these</b> and before <b>them, us</b>: <span class="en">most of my friends</span>, <span class="en">none of the students</span>, <span class="en">all of them</span>. After all and both, of is optional before a noun (<span class="en">all my friends</span>) but required before a pronoun. In general statements there is no of: <span class="en">Most people like music.</span></p>
<p><b>every</b> and <b>each</b> always take a singular noun and verb: <span class="en">Every student has a book.</span></p>`},
 rules:{a:{ru:'both — оба (мн. число); either — любой из двух; neither — ни один из двух, глагол утвердительный.',en:'both — the two (plural); either — one or the other; neither — not either, with a positive verb.'},

  d:{ru:'every / each + существительное и глагол в единственном числе.',en:'every / each + singular noun and verb.'}},

{id:'eding',ru:'Скучный или скучающий: -ed и -ing',en:'bored or boring: -ed and -ing adjectives',
 th:{ru:`<p>От многих глаголов чувств есть два прилагательных, и их постоянно путают.</p>
<table><tr><th>-ed: что чувствует человек</th><th>-ing: какой предмет или ситуация</th></tr>
<tr><td><span class="en">I am bored.</span> — Мне скучно.</td><td><span class="en">The film is boring.</span> — Фильм скучный.</td></tr>
<tr><td><span class="en">She is interested in art.</span></td><td><span class="en">Art is interesting.</span></td></tr>
<tr><td><span class="en">We were surprised.</span></td><td><span class="en">The news was surprising.</span></td></tr>
<tr><td><span class="en">I am tired.</span></td><td><span class="en">It was a tiring day.</span></td></tr></table>
<p>Причина — -ing, результат в человеке — -ed: <span class="en">The lesson was boring, so the students were bored.</span></p>
<p>Человек тоже может быть -ing, если он вызывает это чувство у других: <span class="en">He is boring.</span> — «Он зануда», а не «ему скучно».</p>
<p>Частые пары: excited / exciting, confused / confusing, worried / worrying, shocked / shocking, relaxed / relaxing, annoyed / annoying, disappointed / disappointing.</p>
<p>Предлоги после -ed: <span class="en">interested in</span>, <span class="en">bored with</span>, <span class="en">tired of</span>, <span class="en">surprised by</span>, <span class="en">excited about</span>, <span class="en">worried about</span>.</p>`,
 en:`<p>Many verbs of feeling give two adjectives that are often confused.</p>
<table><tr><th>-ed: how a person feels</th><th>-ing: what the thing or situation is like</th></tr>
<tr><td><span class="en">I am bored.</span></td><td><span class="en">The film is boring.</span></td></tr>
<tr><td><span class="en">She is interested in art.</span></td><td><span class="en">Art is interesting.</span></td></tr>
<tr><td><span class="en">We were surprised.</span></td><td><span class="en">The news was surprising.</span></td></tr>
<tr><td><span class="en">I am tired.</span></td><td><span class="en">It was a tiring day.</span></td></tr></table>
<p>The cause is -ing, the effect on a person is -ed: <span class="en">The lesson was boring, so the students were bored.</span></p>
<p>A person can be -ing if they cause the feeling in others: <span class="en">He is boring.</span> means he bores people.</p>
<p>Common pairs: excited / exciting, confused / confusing, worried / worrying, shocked / shocking, relaxed / relaxing, annoyed / annoying, disappointed / disappointing.</p>
<p>Prepositions after -ed: <span class="en">interested in</span>, <span class="en">bored with</span>, <span class="en">tired of</span>, <span class="en">surprised by</span>, <span class="en">excited about</span>, <span class="en">worried about</span>.</p>`},
 rules:{a:{ru:'-ed — что чувствует человек: I am bored, she was surprised.',en:'-ed — how a person feels: I am bored, she was surprised.'},
  b:{ru:'-ing — какой предмет, событие, ситуация: a boring film, surprising news.',en:'-ing — what a thing, event or situation is like: a boring film, surprising news.'},
  c:{ru:'Человек с -ing вызывает чувство у других: He is boring = он зануда.',en:'A person with -ing causes the feeling: He is boring = he bores people.'},
  d:{ru:'Предлоги: interested in, tired of, bored with, surprised by, excited about, worried about.',en:'Prepositions: interested in, tired of, bored with, surprised by, excited about, worried about.'}},

{id:'vprep',ru:'Глаголы и прилагательные с предлогами',en:'Verbs and adjectives with prepositions',
 th:{ru:`<p>Предлог после глагола или прилагательного нельзя вывести из русского — его запоминают вместе со словом.</p>
<table><tr><th>Глагол + предлог</th><th>Перевод</th></tr>
<tr><td><span class="en">listen to music</span></td><td>слушать музыку</td></tr>
<tr><td><span class="en">wait for the bus</span></td><td>ждать автобус</td></tr>
<tr><td><span class="en">look at the picture</span></td><td>смотреть на картину</td></tr>
<tr><td><span class="en">depend on the weather</span></td><td>зависеть от погоды</td></tr>
<tr><td><span class="en">belong to me</span></td><td>принадлежать мне</td></tr>
<tr><td><span class="en">pay for the tickets</span></td><td>платить за билеты</td></tr>
<tr><td><span class="en">laugh at a joke</span></td><td>смеяться над шуткой</td></tr>
<tr><td><span class="en">think about the future</span></td><td>думать о будущем</td></tr>
<tr><td><span class="en">apologise for the mistake</span></td><td>извиниться за ошибку</td></tr></table>
<table><tr><th>Прилагательное + предлог</th><th>Перевод</th></tr>
<tr><td><span class="en">good at maths</span></td><td>силён в математике</td></tr>
<tr><td><span class="en">afraid of dogs</span></td><td>боится собак</td></tr>
<tr><td><span class="en">proud of his son</span></td><td>гордится сыном</td></tr>
<tr><td><span class="en">famous for its metro</span></td><td>знаменит своим метро</td></tr>
<tr><td><span class="en">married to a doctor</span></td><td>замужем за врачом</td></tr>
<tr><td><span class="en">different from yours</span></td><td>отличается от твоего</td></tr>
<tr><td><span class="en">angry with me</span></td><td>сердится на меня</td></tr>
<tr><td><span class="en">keen on football</span></td><td>увлекается футболом</td></tr></table>
<p><b>Без предлога</b>, хотя в русском он есть: <span class="en">answer a question</span> (ответить на), <span class="en">enter a room</span> (войти в), <span class="en">discuss a problem</span> (обсуждать), <span class="en">marry somebody</span> (жениться на), <span class="en">phone somebody</span> (звонить кому-то).</p>
<p>После предлога — существительное или -ing: <span class="en">I am afraid of flying.</span></p>`,
 en:`<p>The preposition after a verb or adjective cannot be guessed from Russian; learn it together with the word.</p>
<table><tr><th>Verb + preposition</th></tr>
<tr><td><span class="en">listen to music</span></td></tr>
<tr><td><span class="en">wait for the bus</span></td></tr>
<tr><td><span class="en">look at the picture</span></td></tr>
<tr><td><span class="en">depend on the weather</span></td></tr>
<tr><td><span class="en">belong to me</span></td></tr>
<tr><td><span class="en">pay for the tickets</span></td></tr>
<tr><td><span class="en">laugh at a joke</span></td></tr>
<tr><td><span class="en">think about the future</span></td></tr>
<tr><td><span class="en">apologise for the mistake</span></td></tr></table>
<table><tr><th>Adjective + preposition</th></tr>
<tr><td><span class="en">good at maths</span></td></tr>
<tr><td><span class="en">afraid of dogs</span></td></tr>
<tr><td><span class="en">proud of his son</span></td></tr>
<tr><td><span class="en">famous for its metro</span></td></tr>
<tr><td><span class="en">married to a doctor</span></td></tr>
<tr><td><span class="en">different from yours</span></td></tr>
<tr><td><span class="en">angry with me</span></td></tr>
<tr><td><span class="en">keen on football</span></td></tr></table>
<p><b>No preposition</b> in English: <span class="en">answer a question</span>, <span class="en">enter a room</span>, <span class="en">discuss a problem</span>, <span class="en">marry somebody</span>, <span class="en">phone somebody</span>.</p>
<p>After a preposition use a noun or -ing: <span class="en">I am afraid of flying.</span></p>`},
 rules:{a:{ru:'Глагол + предлог: listen to, wait for, look at, depend on, belong to, pay for, laugh at, think about.',en:'Verb + preposition: listen to, wait for, look at, depend on, belong to, pay for, laugh at, think about.'},

  c:{ru:'Без предлога: answer, enter, discuss, marry, phone + дополнение.',en:'No preposition: answer, enter, discuss, marry, phone + object.'},

{lv:'b',ru:'Дополнительные темы',en:'More practice',units:[
{id:'unless',ru:'Если не: unless',en:'unless',
 th:{ru:`<p><b>unless</b> значит «если не». Это то же самое, что <b>if … not</b>.</p>
<table><tr><td><span class="en">I will not go unless you come with me.</span></td></tr>
<tr><td><span class="en">I will not go if you do not come with me.</span></td></tr></table>
<p>Отрицание уже есть внутри unless, поэтому глагол после него стоит в утвердительной форме:</p>
<ul><li><span class="en">Unless you study, you will fail.</span></li><li><span class="bad">Unless you don't study, you will fail.</span></li></ul>
<p>Как и после if, после unless идёт настоящее время, даже когда речь о будущем:</p>
<ul><li><span class="en">Unless it rains, we will play tennis.</span></li><li><span class="bad">Unless it will rain, …</span></li></ul>
<p>unless часто используется в предупреждениях: <span class="en">You will be late unless you hurry.</span></p>`,
 en:`<p><b>unless</b> means <b>if … not</b>.</p>
<table><tr><td><span class="en">I will not go unless you come with me.</span></td></tr>
<tr><td><span class="en">I will not go if you do not come with me.</span></td></tr></table>
<p>The negative is already inside unless, so the verb after it is positive:</p>
<ul><li><span class="en">Unless you study, you will fail.</span></li><li><span class="bad">Unless you don't study, you will fail.</span></li></ul>
<p>As after if, use the present after unless, even when talking about the future:</p>
<ul><li><span class="en">Unless it rains, we will play tennis.</span></li><li><span class="bad">Unless it will rain, …</span></li></ul>
<p>unless is common in warnings: <span class="en">You will be late unless you hurry.</span></p>`},
 rules:{a:{ru:'unless = if … not («если не»).',en:'unless = if … not.'},
  b:{ru:'После unless глагол в утвердительной форме: отрицание уже внутри.',en:'The verb after unless is positive: the negative is already inside.'},
  c:{ru:'После unless — настоящее время, как после if.',en:'After unless use the present, as after if.'}},

"be1": "<h4>Где в английском нужен be, а в русском глагола нет<\/h4><div class=\"tw\"><table><tr><th>Что сообщаем<\/th><th>Пример<\/th><\/tr><tr><td>кто человек, профессия<\/td><td><span class=\"en\">He is a doctor.<\/span><\/td><\/tr><tr><td>возраст<\/td><td><span class=\"en\">I am twenty-one.<\/span><\/td><\/tr><tr><td>состояние, чувство<\/td><td><span class=\"en\">I am hungry.<\/span> <span class=\"en\">She is afraid.<\/span><\/td><\/tr><tr><td>место<\/td><td><span class=\"en\">They are in Moscow.<\/span><\/td><\/tr><tr><td>погода, время, расстояние<\/td><td><span class=\"en\">It is cold.<\/span> <span class=\"en\">It is five o'clock.<\/span><\/td><\/tr><tr><td>цена<\/td><td><span class=\"en\">It is ten dollars.<\/span><\/td><\/tr><\/table><\/div><h4>Тонкости<\/h4><ul><li><b>you<\/b> всегда с <b>are<\/b>, даже если это один человек: <span class=\"en\">You are my friend.<\/span><\/li><li>Краткая форма возможна и после существительного: <span class=\"en\">Tom's at work.<\/span> <span class=\"en\">My sister's a nurse.<\/span> В разговоре почти всегда говорят кратко, в деловом письме пишут полностью.<\/li><li>В безличных фразах («Холодно», «Поздно») нужно подлежащее <b>it<\/b>: <span class=\"en\">It is late.<\/span><\/li><li>С одной профессией нужен артикль <b>a / an<\/b>: <span class=\"en\">I am an engineer.<\/span> Во множественном числе артикля нет: <span class=\"en\">We are engineers.<\/span><\/li><li>Слова-ловушки: <b>people<\/b>, <b>police<\/b> — множественное число (<span class=\"en\">People are different.<\/span>); <b>news<\/b>, <b>money<\/b> — единственное (<span class=\"en\">The news is good.<\/span>); <b>everybody<\/b>, <b>everyone<\/b> — тоже единственное (<span class=\"en\">Everybody is here.<\/span>).<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I student.<\/span><span class=\"en\">I am a student.<\/span><small>глагол нельзя пропускать<\/small><\/li><li><span class=\"bad\">I have 21 years.<\/span><span class=\"en\">I am 21.<\/span><small>возраст — через be<\/small><\/li><li><span class=\"bad\">I am agree.<\/span><span class=\"en\">I agree.<\/span><small>agree — уже глагол, be не нужен<\/small><\/li><li><span class=\"bad\">Cold today.<\/span><span class=\"en\">It is cold today.<\/span><small>нужно подлежащее it<\/small><\/li><li><span class=\"bad\">My parents is at home.<\/span><span class=\"en\">My parents are at home.<\/span><\/li><\/ul>",
"be2": "<h4>Две краткие формы отрицания<\/h4><div class=\"tw\"><table><tr><th>Сокращаем not<\/th><th>Сокращаем be<\/th><\/tr><tr><td><span class=\"en\">He isn't here.<\/span><\/td><td><span class=\"en\">He's not here.<\/span><\/td><\/tr><tr><td><span class=\"en\">We aren't ready.<\/span><\/td><td><span class=\"en\">We're not ready.<\/span><\/td><\/tr><tr><td>нет<\/td><td><span class=\"en\">I'm not ready.<\/span><\/td><\/tr><\/table><\/div><p>Обе колонки значат одно и то же. С <b>I<\/b> возможен только вариант <b>I'm not<\/b>.<\/p><h4>Краткие ответы<\/h4><ul><li>В ответе «да» форму не сокращают: <span class=\"en\">Yes, I am.<\/span> <span class=\"en\">Yes, she is.<\/span> Варианта «Yes, I'm» не бывает.<\/li><li>В ответе «нет» можно обоими способами: <span class=\"en\">No, she isn't.<\/span> <span class=\"en\">No, she's not.<\/span><\/li><\/ul><h4>Частые вопросы с be<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>О чём он<\/td><\/tr><tr><td><span class=\"en\">What is your name?<\/span><\/td><td>имя<\/td><\/tr><tr><td><span class=\"en\">How old are you?<\/span><\/td><td>возраст<\/td><\/tr><tr><td><span class=\"en\">Where are you from?<\/span><\/td><td>откуда ты<\/td><\/tr><tr><td><span class=\"en\">How are you?<\/span><\/td><td>как дела, самочувствие<\/td><\/tr><tr><td><span class=\"en\">What is she like?<\/span><\/td><td>какая она по характеру<\/td><\/tr><tr><td><span class=\"en\">What is it?<\/span> / <span class=\"en\">Who is it?<\/span><\/td><td>что это / кто это<\/td><\/tr><tr><td><span class=\"en\">How much is it?<\/span><\/td><td>цена<\/td><\/tr><\/table><\/div><h4>Вопрос с отрицанием<\/h4><p><span class=\"en\">Isn't it cold?<\/span> — «Разве не холодно?» Так спрашивают, когда ждут согласия или удивлены.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Where you are from?<\/span><span class=\"en\">Where are you from?<\/span><small>be встаёт перед подлежащим<\/small><\/li><li><span class=\"bad\">You are ready?<\/span><span class=\"en\">Are you ready?<\/span><small>одной интонации в правильной речи мало<\/small><\/li><li><span class=\"bad\">Yes, I'm.<\/span><span class=\"en\">Yes, I am.<\/span><\/li><li><span class=\"bad\">How old you are?<\/span><span class=\"en\">How old are you?<\/span><\/li><li><span class=\"bad\">I amn't sure.<\/span><span class=\"en\">I'm not sure.<\/span><\/li><\/ul>",
"pc1": "<h4>Написание -ing полностью<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Примеры<\/th><\/tr><tr><td>обычно просто + ing<\/td><td>work → working, play → playing<\/td><\/tr><tr><td>немое -e убираем<\/td><td>make → making, write → writing, come → coming<\/td><\/tr><tr><td>-ee и be сохраняются<\/td><td>see → seeing, be → being<\/td><\/tr><tr><td>-ie → -ying<\/td><td>lie → lying, die → dying<\/td><\/tr><tr><td>один слог, гласная + согласная: удваиваем<\/td><td>run → running, sit → sitting, get → getting, stop → stopping<\/td><\/tr><tr><td>w, x, y не удваиваем<\/td><td>snow → snowing, fix → fixing, play → playing<\/td><\/tr><tr><td>два слога, ударение на последнем: удваиваем<\/td><td>begin → beginning, forget → forgetting<\/td><\/tr><tr><td>два слога, ударение на первом: не удваиваем<\/td><td>open → opening, visit → visiting, listen → listening<\/td><\/tr><tr><td>-l (британский вариант)<\/td><td>travel → travelling<\/td><\/tr><\/table><\/div><h4>Когда ещё нужен Present Continuous<\/h4><ul><li>Временная ситуация «в эти дни», не обязательно в эту секунду: <span class=\"en\">I am reading a good book these days.<\/span> <span class=\"en\">She is living with her parents this month.<\/span><\/li><li>Что-то меняется: <span class=\"en\">It is getting dark.<\/span> <span class=\"en\">Prices are going up.<\/span><\/li><li>Личная договорённость на будущее, когда названо время: <span class=\"en\">I am meeting Anna tomorrow.<\/span><\/li><li>Раздражение с <b>always<\/b>: <span class=\"en\">He is always losing his keys.<\/span> — «вечно теряет».<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I working now.<\/span><span class=\"en\">I am working now.<\/span><small>без be формы нет<\/small><\/li><li><span class=\"bad\">I am work now.<\/span><span class=\"en\">I am working now.<\/span><small>без -ing тоже<\/small><\/li><li><span class=\"bad\">She is writeing.<\/span><span class=\"en\">She is writing.<\/span><\/li><li><span class=\"bad\">He is swiming.<\/span><span class=\"en\">He is swimming.<\/span><\/li><li><span class=\"bad\">I am understanding you.<\/span><span class=\"en\">I understand you.<\/span><small>глаголы состояния в Continuous не ставят<\/small><\/li><\/ul>",
"pc2": "<h4>Краткие ответы<\/h4><p><span class=\"en\">Are you working?<\/span> — <span class=\"en\">Yes, I am.<\/span> / <span class=\"en\">No, I'm not.<\/span> <span class=\"en\">Is he sleeping?<\/span> — <span class=\"en\">Yes, he is.<\/span> / <span class=\"en\">No, he isn't.<\/span> Глагол с -ing в кратком ответе не повторяют.<\/p><h4>Вопрос к подлежащему<\/h4><p>Если спрашиваем «кто?» или «что?» делает действие, порядок слов как в утверждении, а глагол всегда <b>is<\/b>: <span class=\"en\">Who is talking?<\/span> <span class=\"en\">What is happening?<\/span><\/p><h4>Предлог уходит в конец вопроса<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>Перевод<\/td><\/tr><tr><td><span class=\"en\">What are you looking at?<\/span><\/td><td>На что ты смотришь?<\/td><\/tr><tr><td><span class=\"en\">Who are you waiting for?<\/span><\/td><td>Кого ты ждёшь?<\/td><\/tr><tr><td><span class=\"en\">Who is she talking to?<\/span><\/td><td>С кем она говорит?<\/td><\/tr><tr><td><span class=\"en\">What are you thinking about?<\/span><\/td><td>О чём ты думаешь?<\/td><\/tr><\/table><\/div><h4>Вопрос с отрицанием<\/h4><p><span class=\"en\">Why aren't you eating?<\/span> — «Почему ты не ешь?» <span class=\"en\">Isn't she coming?<\/span> — «Разве она не придёт?»<\/p><h4>Отрицание: два способа<\/h4><p><span class=\"en\">He isn't listening.<\/span> = <span class=\"en\">He's not listening.<\/span> Смысл одинаковый.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Do you working?<\/span><span class=\"en\">Are you working?<\/span><small>в Continuous вспомогательный глагол — be, а не do<\/small><\/li><li><span class=\"bad\">What you are doing?<\/span><span class=\"en\">What are you doing?<\/span><\/li><li><span class=\"bad\">He don't working.<\/span><span class=\"en\">He isn't working.<\/span><\/li><li><span class=\"bad\">Yes, I do.<\/span><span class=\"en\">Yes, I am.<\/span><small>в Continuous отвечаем через be<\/small><\/li><li><span class=\"bad\">At what are you looking?<\/span><span class=\"en\">What are you looking at?<\/span><\/li><\/ul>",
"ps1": "<h4>Когда нужен Present Simple<\/h4><ul><li>Привычки и регулярные действия: <span class=\"en\">I get up at seven.<\/span><\/li><li>Факты и то, что верно всегда: <span class=\"en\">Water boils at 100 degrees.<\/span><\/li><li>Постоянные ситуации: <span class=\"en\">She lives in Kazan.<\/span> <span class=\"en\">He works in a bank.<\/span><\/li><li>Расписания, даже о будущем: <span class=\"en\">The train leaves at nine tomorrow.<\/span><\/li><li>Чувства, мнения, знание: <span class=\"en\">I like tea.<\/span> <span class=\"en\">I know him.<\/span><\/li><\/ul><h4>Окончание -s полностью<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Примеры<\/th><\/tr><tr><td>обычно + s<\/td><td>work → works, live → lives<\/td><\/tr><tr><td>после -s, -ss, -sh, -ch, -x, -z, -o → -es<\/td><td>pass → passes, wash → washes, fix → fixes, go → goes<\/td><\/tr><tr><td>согласная + y → -ies<\/td><td>study → studies, try → tries, fly → flies<\/td><\/tr><tr><td>гласная + y → просто -s<\/td><td>play → plays, buy → buys, say → says<\/td><\/tr><tr><td>особые формы<\/td><td>have → has, be → is<\/td><\/tr><\/table><\/div><p>Произношение: после глухих звуков [s] (works, likes), после звонких и гласных [z] (plays, lives), после шипящих и свистящих — отдельный слог [iz] (watches, washes).<\/p><h4>Место наречий частоты<\/h4><div class=\"tw\"><table><tr><td>Положение<\/td><td>Пример<\/td><\/tr><tr><td>перед основным глаголом<\/td><td><span class=\"en\">She often reads.<\/span><\/td><\/tr><tr><td>после be<\/td><td><span class=\"en\">He is always late.<\/span><\/td><\/tr><tr><td>между don't / doesn't и глаголом<\/td><td><span class=\"en\">I don't usually eat meat.<\/span><\/td><\/tr><tr><td>every day, twice a week, on Mondays — в конце<\/td><td><span class=\"en\">I go to the gym twice a week.<\/span><\/td><\/tr><\/table><\/div><p><b>Sometimes<\/b> и <b>usually<\/b> могут стоять и в начале: <span class=\"en\">Sometimes I walk to work.<\/span><\/p><h4>Ещё<\/h4><ul><li><b>everybody, nobody, somebody<\/b> — единственное число: <span class=\"en\">Everybody knows it.<\/span><\/li><li><b>never<\/b> уже содержит отрицание, второе не нужно: <span class=\"en\">I never drink coffee.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">He work in a bank.<\/span><span class=\"en\">He works in a bank.<\/span><\/li><li><span class=\"bad\">She haves two children.<\/span><span class=\"en\">She has two children.<\/span><\/li><li><span class=\"bad\">I always am late.<\/span><span class=\"en\">I am always late.<\/span><small>после be<\/small><\/li><li><span class=\"bad\">He goes often there.<\/span><span class=\"en\">He often goes there.<\/span><\/li><li><span class=\"bad\">My friends lives here.<\/span><span class=\"en\">My friends live here.<\/span><small>они = they, без -s<\/small><\/li><\/ul>",
"ps2": "<h4>Как устроено<\/h4><p><b>do / does<\/b> берёт на себя и отрицание, и окончание -s, поэтому основной глагол остаётся в первой форме: <span class=\"en\">She doesn't like fish.<\/span> Полные формы <b>do not / does not<\/b> — для официального письма или чтобы подчеркнуть «нет».<\/p><h4>Где don't не используется<\/h4><div class=\"tw\"><table><tr><th>Глагол<\/th><th>Отрицание<\/th><\/tr><tr><td>be<\/td><td><span class=\"en\">I'm not tired.<\/span> <span class=\"en\">He isn't here.<\/span><\/td><\/tr><tr><td>can, must, should, will<\/td><td><span class=\"en\">I can't swim.<\/span> <span class=\"en\">You shouldn't go.<\/span><\/td><\/tr><tr><td>have got<\/td><td><span class=\"en\">I haven't got a car.<\/span><\/td><\/tr><\/table><\/div><p>С простым <b>have<\/b> — через do: <span class=\"en\">I don't have a car.<\/span><\/p><h4>Тонкости<\/h4><ul><li>Одно отрицание на предложение. Со словами <b>never, nobody, nothing<\/b> глагол стоит в утвердительной форме: <span class=\"en\">I never eat meat.<\/span> <span class=\"en\">Nobody knows.<\/span><\/li><li>«Я думаю, что он не прав» по-английски обычно строят с отрицанием в первой части: <span class=\"en\">I don't think he is right.<\/span><\/li><li><b>do<\/b> может быть и основным глаголом, тогда он повторяется: <span class=\"en\">He doesn't do his homework.<\/span><\/li><li>Вопрос-предложение: <span class=\"en\">Why don't you ask him?<\/span> — «Почему бы тебе не спросить его?»<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">He don't know.<\/span><span class=\"en\">He doesn't know.<\/span><\/li><li><span class=\"bad\">She doesn't likes it.<\/span><span class=\"en\">She doesn't like it.<\/span><small>-s уже в doesn't<\/small><\/li><li><span class=\"bad\">I not like coffee.<\/span><span class=\"en\">I don't like coffee.<\/span><\/li><li><span class=\"bad\">I am not understand.<\/span><span class=\"en\">I don't understand.<\/span><small>understand — обычный глагол, be не нужен<\/small><\/li><li><span class=\"bad\">I don't never go there.<\/span><span class=\"en\">I never go there.<\/span><\/li><\/ul>",
"ps3": "<h4>Вопрос к подлежащему: без do<\/h4><p>Когда спрашиваем, кто делает действие, порядок слов как в утверждении, глагол с -s:<\/p><div class=\"tw\"><table><tr><th>К подлежащему (без do)<\/th><th>К остальному (с do)<\/th><\/tr><tr><td><span class=\"en\">Who lives here?<\/span><\/td><td><span class=\"en\">Where do you live?<\/span><\/td><\/tr><tr><td><span class=\"en\">Who knows the answer?<\/span><\/td><td><span class=\"en\">What do you know?<\/span><\/td><\/tr><tr><td><span class=\"en\">What happens next?<\/span><\/td><td><span class=\"en\">What does he want?<\/span><\/td><\/tr><\/table><\/div><h4>Полезные вопросы целиком<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>Перевод<\/td><\/tr><tr><td><span class=\"en\">What do you do?<\/span><\/td><td>Кем ты работаешь?<\/td><\/tr><tr><td><span class=\"en\">What does this word mean?<\/span><\/td><td>Что значит это слово?<\/td><\/tr><tr><td><span class=\"en\">How do you spell it?<\/span><\/td><td>Как это пишется?<\/td><\/tr><tr><td><span class=\"en\">How much does it cost?<\/span><\/td><td>Сколько это стоит?<\/td><\/tr><tr><td><span class=\"en\">How often do you train?<\/span><\/td><td>Как часто ты тренируешься?<\/td><\/tr><tr><td><span class=\"en\">What time does it start?<\/span><\/td><td>Во сколько начало?<\/td><\/tr><tr><td><span class=\"en\">How long does it take?<\/span><\/td><td>Сколько это занимает времени?<\/td><\/tr><\/table><\/div><h4>Тонкости<\/h4><ul><li><span class=\"en\">What do you do?<\/span> — о профессии. <span class=\"en\">What are you doing?<\/span> — чем занят сейчас.<\/li><li>Предлог в конце: <span class=\"en\">Where do you come from?<\/span> <span class=\"en\">What music do you listen to?<\/span><\/li><li>С be и модальными do не нужен: <span class=\"en\">Are you tired?<\/span> <span class=\"en\">Can you help?<\/span><\/li><li>Вопрос с отрицанием: <span class=\"en\">Don't you like it?<\/span> — «Разве тебе не нравится?»<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Does she works here?<\/span><span class=\"en\">Does she work here?<\/span><\/li><li><span class=\"bad\">Do she work here?<\/span><span class=\"en\">Does she work here?<\/span><\/li><li><span class=\"bad\">What means this word?<\/span><span class=\"en\">What does this word mean?<\/span><\/li><li><span class=\"bad\">Where you live?<\/span><span class=\"en\">Where do you live?<\/span><\/li><li><span class=\"bad\">How much costs it?<\/span><span class=\"en\">How much does it cost?<\/span><\/li><li><span class=\"bad\">Who does live here?<\/span><span class=\"en\">Who lives here?<\/span><small>вопрос к подлежащему<\/small><\/li><\/ul>",
"pcps": "<h4>Глаголы состояния: только Simple<\/h4><div class=\"tw\"><table><tr><th>Группа<\/th><th>Глаголы<\/th><\/tr><tr><td>чувства и желания<\/td><td>like, love, hate, prefer, want, need<\/td><\/tr><tr><td>знание и мнение<\/td><td>know, understand, believe, remember, forget, mean<\/td><\/tr><tr><td>восприятие<\/td><td>see, hear, smell, taste, seem<\/td><\/tr><tr><td>владение<\/td><td>have (иметь), own, belong<\/td><\/tr><tr><td>прочее<\/td><td>be, cost<\/td><\/tr><\/table><\/div><p><span class=\"en\">I want a coffee now.<\/span> <span class=\"en\">Do you understand me?<\/span> Здесь действие «сейчас», но форма Simple.<\/p><h4>Глаголы с двумя значениями<\/h4><div class=\"tw\"><table><tr><th>Состояние → Simple<\/th><th>Действие → Continuous<\/th><\/tr><tr><td><span class=\"en\">I think you are right.<\/span> — считаю<\/td><td><span class=\"en\">I am thinking about it.<\/span> — обдумываю<\/td><\/tr><tr><td><span class=\"en\">I have a car.<\/span> — владею<\/td><td><span class=\"en\">I am having lunch.<\/span> — обедаю<\/td><\/tr><tr><td><span class=\"en\">I see.<\/span> — понимаю<\/td><td><span class=\"en\">I am seeing the doctor at five.<\/span> — иду на приём<\/td><\/tr><tr><td><span class=\"en\">The soup tastes good.<\/span> — на вкус<\/td><td><span class=\"en\">She is tasting the soup.<\/span> — пробует<\/td><\/tr><\/table><\/div><h4>Постоянное и временное<\/h4><div class=\"tw\"><table><tr><td>Постоянно<\/td><td>Временно<\/td><\/tr><tr><td><span class=\"en\">I live in Moscow.<\/span><\/td><td><span class=\"en\">I am living with a friend this week.<\/span><\/td><\/tr><tr><td><span class=\"en\">He works in a bank.<\/span><\/td><td><span class=\"en\">He is working from home today.<\/span><\/td><\/tr><\/table><\/div><h4>Оба времени о будущем<\/h4><ul><li>Расписание — Simple: <span class=\"en\">The film starts at eight.<\/span><\/li><li>Личная договорённость — Continuous: <span class=\"en\">I am meeting Tom at eight.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I am knowing him.<\/span><span class=\"en\">I know him.<\/span><\/li><li><span class=\"bad\">I am wanting to go home.<\/span><span class=\"en\">I want to go home.<\/span><\/li><li><span class=\"bad\">Now I read a book.<\/span><span class=\"en\">I am reading a book now.<\/span><small>в русском время одно, в английском разные<\/small><\/li><li><span class=\"bad\">I am going to work by bus every day.<\/span><span class=\"en\">I go to work by bus every day.<\/span><\/li><li><span class=\"bad\">What do you do now?<\/span><span class=\"en\">What are you doing now?<\/span><small>если спрашиваем о занятии в эту минуту<\/small><\/li><\/ul>",
"hgot": "<h4>have got и have: в чём разница<\/h4><p>Для владения, родственников, внешности и болезней оба варианта значат одно и то же: <span class=\"en\">I've got a brother.<\/span> = <span class=\"en\">I have a brother.<\/span> В британской речи чаще <b>have got<\/b>, в американской — <b>have<\/b>. В письме надёжнее <b>have<\/b>.<\/p><h4>Где got не ставится<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Пример<\/th><\/tr><tr><td>действия: еда, душ, отдых<\/td><td><span class=\"en\">I have breakfast at eight.<\/span> <span class=\"en\">She is having a shower.<\/span><\/td><\/tr><tr><td>прошедшее время<\/td><td><span class=\"en\">I had a dog.<\/span><\/td><\/tr><tr><td>будущее<\/td><td><span class=\"en\">I will have time tomorrow.<\/span><\/td><\/tr><tr><td>после модальных<\/td><td><span class=\"en\">You must have a ticket.<\/span><\/td><\/tr><\/table><\/div><h4>Сокращения<\/h4><ul><li><span class=\"en\">I've got<\/span>, <span class=\"en\">we've got<\/span>, <span class=\"en\">he's got<\/span>, <span class=\"en\">she's got<\/span>. Здесь <b>'s<\/b> = <b>has<\/b>, а не <b>is<\/b>.<\/li><li>Без <b>got<\/b> не сокращают: говорят <span class=\"en\">I have a car<\/span>, а не «I've a car».<\/li><\/ul><h4>Краткие ответы<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>Ответ<\/td><\/tr><tr><td><span class=\"en\">Have you got a pen?<\/span><\/td><td><span class=\"en\">Yes, I have.<\/span> / <span class=\"en\">No, I haven't.<\/span><\/td><\/tr><tr><td><span class=\"en\">Do you have a pen?<\/span><\/td><td><span class=\"en\">Yes, I do.<\/span> / <span class=\"en\">No, I don't.<\/span><\/td><\/tr><\/table><\/div><p>Нельзя смешивать два способа в одном предложении.<\/p><h4>Русское «у меня есть»<\/h4><p>Строится от человека, а не от предмета: «У неё есть машина» → <span class=\"en\">She has got a car.<\/span> Предлогов и слова «есть» переводить не надо.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Do you have got a car?<\/span><span class=\"en\">Have you got a car?<\/span><small>или: Do you have a car?<\/small><\/li><li><span class=\"bad\">I don't have got time.<\/span><span class=\"en\">I haven't got time.<\/span><small>или: I don't have time<\/small><\/li><li><span class=\"bad\">She have got a cat.<\/span><span class=\"en\">She has got a cat.<\/span><\/li><li><span class=\"bad\">I have got breakfast at seven.<\/span><span class=\"en\">I have breakfast at seven.<\/span><small>действие, got не нужен<\/small><\/li><li><span class=\"bad\">Yesterday I had got a headache.<\/span><span class=\"en\">Yesterday I had a headache.<\/span><\/li><\/ul>",
"was": "<h4>Формы целиком<\/h4><div class=\"tw\"><table><tr><th>Лицо<\/th><th>Утверждение<\/th><th>Отрицание<\/th><th>Вопрос<\/th><\/tr><tr><td>I / he / she / it<\/td><td>was<\/td><td>wasn't<\/td><td>Was he…?<\/td><\/tr><tr><td>we / you / they<\/td><td>were<\/td><td>weren't<\/td><td>Were they…?<\/td><\/tr><\/table><\/div><p><b>you<\/b> всегда с <b>were<\/b>, даже об одном человеке: <span class=\"en\">You were right.<\/span><\/p><h4>Выражения с was / were<\/h4><ul><li>Родиться: <span class=\"en\">I was born in 2005.<\/span> — всегда с be и всегда в прошедшем.<\/li><li>Было холодно, поздно: <span class=\"en\">It was cold.<\/span> <span class=\"en\">It was late.<\/span><\/li><li>Было, находилось: <span class=\"en\">There was a shop here.<\/span> <span class=\"en\">There were two cafes.<\/span><\/li><li>Опоздать, быть занятым, быть в отпуске: <span class=\"en\">He was late.<\/span> <span class=\"en\">We were busy.<\/span> <span class=\"en\">She was on holiday.<\/span><\/li><\/ul><h4>Слова прошедшего времени<\/h4><p><b>yesterday, last night, last week, two days ago, in 2020, when I was a child<\/b>. «Вчера вечером» — <span class=\"en\">last night<\/span> или <span class=\"en\">yesterday evening<\/span>, но не «yesterday night».<\/p><h4>Вопросы<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>Перевод<\/td><\/tr><tr><td><span class=\"en\">Where were you?<\/span><\/td><td>Где ты был?<\/td><\/tr><tr><td><span class=\"en\">How was the film?<\/span><\/td><td>Как фильм?<\/td><\/tr><tr><td><span class=\"en\">What was the weather like?<\/span><\/td><td>Какая была погода?<\/td><\/tr><tr><td><span class=\"en\">Why was she late?<\/span><\/td><td>Почему она опоздала?<\/td><\/tr><tr><td><span class=\"en\">Who was there?<\/span><\/td><td>Кто там был?<\/td><\/tr><\/table><\/div><p>Краткие ответы: <span class=\"en\">Yes, I was.<\/span> <span class=\"en\">No, we weren't.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I were at home.<\/span><span class=\"en\">I was at home.<\/span><\/li><li><span class=\"bad\">They was happy.<\/span><span class=\"en\">They were happy.<\/span><\/li><li><span class=\"bad\">I born in Moscow.<\/span><span class=\"en\">I was born in Moscow.<\/span><\/li><li><span class=\"bad\">Did you were at work?<\/span><span class=\"en\">Were you at work?<\/span><small>с be вспомогательный did не нужен<\/small><\/li><li><span class=\"bad\">Yesterday I am tired.<\/span><span class=\"en\">Yesterday I was tired.<\/span><\/li><\/ul>",
"past1": "<h4>Написание -ed полностью<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Примеры<\/th><\/tr><tr><td>обычно + ed<\/td><td>work → worked, watch → watched<\/td><\/tr><tr><td>уже есть -e: только + d<\/td><td>live → lived, like → liked<\/td><\/tr><tr><td>согласная + y → -ied<\/td><td>study → studied, try → tried<\/td><\/tr><tr><td>гласная + y → просто -ed<\/td><td>play → played, stay → stayed<\/td><\/tr><tr><td>один слог, гласная + согласная: удваиваем<\/td><td>stop → stopped, plan → planned<\/td><\/tr><tr><td>два слога, ударение на последнем: удваиваем<\/td><td>prefer → preferred<\/td><\/tr><tr><td>два слога, ударение на первом: не удваиваем<\/td><td>visit → visited, open → opened<\/td><\/tr><\/table><\/div><h4>Как читается -ed<\/h4><div class=\"tw\"><table><tr><th>Звук<\/th><th>Когда<\/th><th>Примеры<\/th><\/tr><tr><td>[t]<\/td><td>после глухих согласных<\/td><td>worked, stopped, watched<\/td><\/tr><tr><td>[d]<\/td><td>после звонких и гласных<\/td><td>played, lived, called<\/td><\/tr><tr><td>[id]<\/td><td>только после t и d<\/td><td>wanted, needed, started<\/td><\/tr><\/table><\/div><p>Лишний слог появляется только в третьем случае. «Work-ed» в два слога — ошибка произношения.<\/p><h4>Неправильные глаголы по группам<\/h4><div class=\"tw\"><table><tr><th>Группа<\/th><th>Примеры<\/th><\/tr><tr><td>форма не меняется<\/td><td>put → put, cut → cut, cost → cost<\/td><\/tr><tr><td>меняется гласная<\/td><td>come → came, give → gave, write → wrote, drink → drank<\/td><\/tr><tr><td>-ought / -aught<\/td><td>buy → bought, think → thought, bring → brought, catch → caught, teach → taught<\/td><\/tr><tr><td>конец на -t<\/td><td>feel → felt, keep → kept, sleep → slept, leave → left, send → sent, spend → spent<\/td><\/tr><tr><td>совсем другая форма<\/td><td>go → went, be → was / were<\/td><\/tr><\/table><\/div><p><b>read<\/b> пишется одинаково, но в прошедшем читается [red].<\/p><h4>Когда нужен Past Simple<\/h4><ul><li>Действие закончено, и время известно или понятно: <span class=\"en\">I saw him yesterday.<\/span><\/li><li>Цепочка событий: <span class=\"en\">I got up, had breakfast and went out.<\/span><\/li><li>Привычка в прошлом: <span class=\"en\">We played football every day.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I goed home.<\/span><span class=\"en\">I went home.<\/span><\/li><li><span class=\"bad\">He buyed a car.<\/span><span class=\"en\">He bought a car.<\/span><\/li><li><span class=\"bad\">I was go to the shop.<\/span><span class=\"en\">I went to the shop.<\/span><small>was здесь лишний<\/small><\/li><li><span class=\"bad\">I have seen him yesterday.<\/span><span class=\"en\">I saw him yesterday.<\/span><small>названо время — Past Simple<\/small><\/li><li><span class=\"bad\">She studyed English.<\/span><span class=\"en\">She studied English.<\/span><\/li><\/ul>",
"past2": "<h4>did один на всех<\/h4><p><b>did<\/b> не меняется по лицам и забирает на себя прошедшее время, поэтому основной глагол возвращается в первую форму: <span class=\"en\">She didn't go.<\/span> <span class=\"en\">Did they see it?<\/span> Краткие ответы: <span class=\"en\">Yes, I did.<\/span> <span class=\"en\">No, I didn't.<\/span><\/p><h4>Вопрос к подлежащему: без did<\/h4><div class=\"tw\"><table><tr><th>К подлежащему (без did)<\/th><th>К остальному (с did)<\/th><\/tr><tr><td><span class=\"en\">Who called you?<\/span> — Кто тебе звонил?<\/td><td><span class=\"en\">Who did you call?<\/span> — Кому ты звонил?<\/td><\/tr><tr><td><span class=\"en\">What happened?<\/span> — Что случилось?<\/td><td><span class=\"en\">What did you see?<\/span> — Что ты видел?<\/td><\/tr><tr><td><span class=\"en\">Who told you?<\/span><\/td><td><span class=\"en\">What did he tell you?<\/span><\/td><\/tr><\/table><\/div><h4>Где did не используется<\/h4><div class=\"tw\"><table><tr><th>Глагол<\/th><th>Отрицание и вопрос<\/th><\/tr><tr><td>be<\/td><td><span class=\"en\">I wasn't there.<\/span> <span class=\"en\">Were you at home?<\/span><\/td><\/tr><tr><td>can<\/td><td><span class=\"en\">I couldn't sleep.<\/span> <span class=\"en\">Could you swim?<\/span><\/td><\/tr><\/table><\/div><h4>Тонкости<\/h4><ul><li><b>do<\/b> как основной глагол остаётся: <span class=\"en\">What did you do?<\/span> <span class=\"en\">I didn't do it.<\/span><\/li><li>С <b>never<\/b> глагол во второй форме, без didn't: <span class=\"en\">I never saw him again.<\/span><\/li><li>Вопрос с отрицанием: <span class=\"en\">Why didn't you call me?<\/span><\/li><li>Предлог в конце: <span class=\"en\">Who did you go with?<\/span> <span class=\"en\">What did you talk about?<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Did you went there?<\/span><span class=\"en\">Did you go there?<\/span><\/li><li><span class=\"bad\">I didn't saw him.<\/span><span class=\"en\">I didn't see him.<\/span><\/li><li><span class=\"bad\">Where you went?<\/span><span class=\"en\">Where did you go?<\/span><\/li><li><span class=\"bad\">What did happen?<\/span><span class=\"en\">What happened?<\/span><small>вопрос к подлежащему<\/small><\/li><li><span class=\"bad\">I not went to work.<\/span><span class=\"en\">I didn't go to work.<\/span><\/li><li><span class=\"bad\">Did you be at home?<\/span><span class=\"en\">Were you at home?<\/span><\/li><\/ul>",
"pastc": "<h4>Четыре случая<\/h4><ul><li>Действие шло в названный момент: <span class=\"en\">At eight I was having dinner.<\/span><\/li><li>Фон в рассказе: <span class=\"en\">The sun was shining and people were walking in the park.<\/span><\/li><li>Два длительных действия одновременно, обычно с <b>while<\/b>: <span class=\"en\">While I was cooking, he was watching TV.<\/span><\/li><li>Длительное действие, прерванное коротким: <span class=\"en\">I was sleeping when you called.<\/span><\/li><\/ul><h4>Чего Past Continuous не выражает<\/h4><ul><li>Привычку в прошлом. Для неё Past Simple или used to: <span class=\"en\">I played football every day.<\/span><\/li><li>Законченное действие целиком: <span class=\"en\">I read the book last week.<\/span> — прочитал. <span class=\"en\">I was reading the book.<\/span> — читал, и неизвестно, дочитал ли.<\/li><li>Состояния: <span class=\"en\">I knew him.<\/span> <span class=\"en\">She wanted to leave.<\/span><\/li><\/ul><h4>Со словами all day, from … to …<\/h4><p>Возможны оба времени. Continuous подчёркивает, что действие тянулось: <span class=\"en\">I was working all day.<\/span> Simple просто сообщает факт: <span class=\"en\">I worked all day.<\/span><\/p><h4>Вежливая просьба<\/h4><p><span class=\"en\">I was wondering if you could help me.<\/span> — мягкая форма «не могли бы вы». Время прошедшее только по форме.<\/p><h4>Вопросы<\/h4><p><span class=\"en\">What were you doing at ten?<\/span> <span class=\"en\">Where was he going?<\/span> <span class=\"en\">Who were you talking to?<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I was work at five.<\/span><span class=\"en\">I was working at five.<\/span><\/li><li><span class=\"bad\">They was playing.<\/span><span class=\"en\">They were playing.<\/span><\/li><li><span class=\"bad\">When I was a child, I was playing football every day.<\/span><span class=\"en\">When I was a child, I played football every day.<\/span><small>привычка<\/small><\/li><li><span class=\"bad\">I was knowing the answer.<\/span><span class=\"en\">I knew the answer.<\/span><\/li><li><span class=\"bad\">What did you doing?<\/span><span class=\"en\">What were you doing?<\/span><\/li><\/ul>",
"pastcs": "<h4>Схемы с when и while<\/h4><div class=\"tw\"><table><tr><th>Схема<\/th><th>Пример<\/th><th>Смысл<\/th><\/tr><tr><td>Continuous + when + Simple<\/td><td><span class=\"en\">I was sleeping when the phone rang.<\/span><\/td><td>фон и событие<\/td><\/tr><tr><td>While + Continuous, Simple<\/td><td><span class=\"en\">While I was walking home, I met Anna.<\/span><\/td><td>то же, начинаем с фона<\/td><\/tr><tr><td>When + Simple, Simple<\/td><td><span class=\"en\">When he came, we had dinner.<\/span><\/td><td>он пришёл, и потом мы поели<\/td><\/tr><tr><td>When + Simple, Continuous<\/td><td><span class=\"en\">When he came, we were having dinner.<\/span><\/td><td>он пришёл, а мы уже ели<\/td><\/tr><\/table><\/div><p>Последние две строки отличаются только временем, а смысл разный.<\/p><h4>Тонкости<\/h4><ul><li>Если придаточное стоит первым, после него запятая. Если вторым — запятой нет.<\/li><li><b>as<\/b> может заменять <b>while<\/b>: <span class=\"en\">As I was leaving, the phone rang.<\/span><\/li><li>Законченный срок — Simple, даже если он долгий: <span class=\"en\">I lived there for five years.<\/span><\/li><li>Короткое, мгновенное действие в Continuous звучит странно: сломал, упал, нашёл, уронил — Simple.<\/li><li>После <b>while<\/b> в разговоре встречается и Simple (<span class=\"en\">While I cooked, he slept<\/span>), это не ошибка, но Continuous надёжнее.<\/li><\/ul><h4>Как выбрать<\/h4><p>Спроси себя: это рамка или событие? Рамка, внутри которой что-то случилось, — Continuous. Само событие, шаг сюжета — Simple.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I was breaking my leg when I played football.<\/span><span class=\"en\">I broke my leg when I was playing football.<\/span><small>перепутаны фон и событие<\/small><\/li><li><span class=\"bad\">When I came home, my wife cooked dinner.<\/span><span class=\"en\">When I came home, my wife was cooking dinner.<\/span><small>если она уже готовила<\/small><\/li><li><span class=\"bad\">I was seeing him yesterday.<\/span><span class=\"en\">I saw him yesterday.<\/span><\/li><li><span class=\"bad\">While I was knowing him, he was happy.<\/span><span class=\"en\">While I knew him, he was happy.<\/span><\/li><\/ul>",
"pp1": "<h4>Четыре значения<\/h4><div class=\"tw\"><table><tr><th>Значение<\/th><th>Пример<\/th><\/tr><tr><td>результат виден сейчас<\/td><td><span class=\"en\">I have lost my keys.<\/span> — и их нет<\/td><\/tr><tr><td>опыт «когда-либо в жизни»<\/td><td><span class=\"en\">I have been to London.<\/span><\/td><\/tr><tr><td>период ещё не закончился<\/td><td><span class=\"en\">I have drunk three coffees today.<\/span><\/td><\/tr><tr><td>началось раньше и длится<\/td><td><span class=\"en\">I have lived here for five years.<\/span><\/td><\/tr><\/table><\/div><h4>Как это переводится<\/h4><p>В русском такого времени нет. Первые три случая переводятся прошедшим временем («потерял», «был», «выпил»), четвёртый — настоящим: «Я живу здесь пять лет». Отсюда самая частая ошибка: <span class=\"en\">I have lived here for five years<\/span>, а не «I live here for five years».<\/p><h4>been и gone<\/h4><ul><li><span class=\"en\">He has been to Paris.<\/span> — съездил и вернулся.<\/li><li><span class=\"en\">He has gone to Paris.<\/span> — уехал и сейчас там.<\/li><\/ul><h4>Сокращения<\/h4><p><span class=\"en\">I've<\/span>, <span class=\"en\">you've<\/span>, <span class=\"en\">we've<\/span>, <span class=\"en\">he's<\/span>, <span class=\"en\">she's<\/span>. <b>'s<\/b> может значить и <b>is<\/b>, и <b>has<\/b>. Различают по следующему слову: <span class=\"en\">He's finished.<\/span> = has (третья форма), <span class=\"en\">He's tired.<\/span> = is.<\/p><h4>Слова-спутники<\/h4><p><b>just, already, yet, ever, never, recently, lately, so far, before, today, this week, this year, for, since<\/b>.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I have saw this film.<\/span><span class=\"en\">I have seen this film.<\/span><small>нужна третья форма<\/small><\/li><li><span class=\"bad\">He have finished.<\/span><span class=\"en\">He has finished.<\/span><\/li><li><span class=\"bad\">I have seen him yesterday.<\/span><span class=\"en\">I saw him yesterday.<\/span><small>названо законченное время<\/small><\/li><li><span class=\"bad\">I live here for five years.<\/span><span class=\"en\">I have lived here for five years.<\/span><\/li><li><span class=\"bad\">I have been in London twice.<\/span><span class=\"en\">I have been to London twice.<\/span><small>о поездках лучше been to<\/small><\/li><\/ul>",
"pp2": "<h4>Слова-подсказки<\/h4><div class=\"tw\"><table><tr><th>Present Perfect<\/th><th>Past Simple<\/th><\/tr><tr><td>ever, never, just, already, yet<\/td><td>yesterday, last week, two days ago<\/td><\/tr><tr><td>today, this week, this year (ещё идёт)<\/td><td>in 2020, on Monday, at five<\/td><\/tr><tr><td>for, since (до сих пор)<\/td><td>When…? What time…?<\/td><\/tr><tr><td>recently, so far, before<\/td><td>when I was a child<\/td><\/tr><\/table><\/div><h4>Как идёт разговор<\/h4><p>Новость сообщают в Present Perfect, а подробности — уже в Past Simple, потому что речь пошла о конкретном моменте: <span class=\"en\">I have bought a car.<\/span> — <span class=\"en\">Where did you buy it?<\/span> — <span class=\"en\">I bought it in Kazan.<\/span><\/p><h4>Тонкости<\/h4><ul><li>Вопрос <b>When…?<\/b> всегда в Past Simple: <span class=\"en\">When did you arrive?<\/span><\/li><li><b>today, this morning<\/b>: если период ещё идёт — Perfect, если уже кончился — Simple. В три часа дня скажут <span class=\"en\">I didn't have breakfast this morning.<\/span><\/li><li>О людях, которых уже нет, и о закрытых периодах — Past Simple: <span class=\"en\">Pushkin wrote many poems.<\/span><\/li><li>После «в первый раз»: <span class=\"en\">It is the first time I have eaten sushi.<\/span><\/li><li>В американской речи с <b>just, already, yet<\/b> часто ставят Past Simple: <span class=\"en\">Did you eat yet?<\/span> Это не ошибка, но в британской норме — Perfect.<\/li><\/ul><h4>Место just, already, yet, still<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Место<\/th><th>Пример<\/th><\/tr><tr><td>just, already<\/td><td>между have и глаголом<\/td><td><span class=\"en\">I have just eaten.<\/span><\/td><\/tr><tr><td>yet<\/td><td>в конце вопроса или отрицания<\/td><td><span class=\"en\">Have you finished yet?<\/span><\/td><\/tr><tr><td>still<\/td><td>перед haven't<\/td><td><span class=\"en\">I still haven't finished.<\/span><\/td><\/tr><\/table><\/div><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">When have you arrived?<\/span><span class=\"en\">When did you arrive?<\/span><\/li><li><span class=\"bad\">I have been there last year.<\/span><span class=\"en\">I was there last year.<\/span><\/li><li><span class=\"bad\">Did you ever be in Paris?<\/span><span class=\"en\">Have you ever been to Paris?<\/span><\/li><li><span class=\"bad\">I already have seen it.<\/span><span class=\"en\">I have already seen it.<\/span><\/li><li><span class=\"bad\">I didn't see him since Monday.<\/span><span class=\"en\">I haven't seen him since Monday.<\/span><\/li><\/ul>",
"gt": "<h4>Два значения<\/h4><ul><li>Намерение, решённое заранее: <span class=\"en\">I am going to buy a new phone.<\/span><\/li><li>Прогноз по тому, что видно уже сейчас: <span class=\"en\">Look at the clouds. It is going to rain.<\/span><\/li><\/ul><h4>going to и Present Continuous<\/h4><div class=\"tw\"><table><tr><th>going to<\/th><th>Present Continuous<\/th><\/tr><tr><td>намерение, деталей может не быть<\/td><td>договорённость: есть время, место, люди<\/td><\/tr><tr><td><span class=\"en\">I am going to see a doctor.<\/span><\/td><td><span class=\"en\">I am seeing the doctor at five.<\/span><\/td><\/tr><\/table><\/div><p>Часто подходят оба. С глаголом <b>go<\/b> обычно не говорят «going to go», а сокращают: <span class=\"en\">I am going to the cinema tonight.<\/span><\/p><h4>Собирался, но не сделал<\/h4><p><span class=\"en\">I was going to call you, but I forgot.<\/span> — прошедшая форма <b>was / were going to<\/b> показывает несостоявшийся план.<\/p><h4>В разговоре<\/h4><p>В быстрой речи <b>going to<\/b> звучит как «gonna». Так говорят и поют, но не пишут.<\/p><h4>Вопросы<\/h4><p><span class=\"en\">What are you going to do?<\/span> <span class=\"en\">When is she going to tell him?<\/span> <span class=\"en\">Are you going to stay?<\/span> — <span class=\"en\">Yes, I am.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I going to buy it.<\/span><span class=\"en\">I am going to buy it.<\/span><small>без be формы нет<\/small><\/li><li><span class=\"bad\">I am going buy it.<\/span><span class=\"en\">I am going to buy it.<\/span><small>нужен to<\/small><\/li><li><span class=\"bad\">I am going to buying it.<\/span><span class=\"en\">I am going to buy it.<\/span><small>после to первая форма<\/small><\/li><li><span class=\"bad\">He is going to goes.<\/span><span class=\"en\">He is going to go.<\/span><\/li><li><span class=\"bad\">I will going to call.<\/span><span class=\"en\">I am going to call.<\/span><small>will и going to вместе не ставят<\/small><\/li><\/ul>",
"will": "<h4>Когда нужен will<\/h4><div class=\"tw\"><table><tr><th>Значение<\/th><th>Пример<\/th><\/tr><tr><td>решение в момент речи<\/td><td><span class=\"en\">I'll take this one.<\/span><\/td><\/tr><tr><td>обещание<\/td><td><span class=\"en\">I'll call you tonight.<\/span><\/td><\/tr><tr><td>предложение помощи<\/td><td><span class=\"en\">I'll carry your bag.<\/span><\/td><\/tr><tr><td>просьба<\/td><td><span class=\"en\">Will you help me?<\/span><\/td><\/tr><tr><td>прогноз, мнение<\/td><td><span class=\"en\">I think it will rain.<\/span><\/td><\/tr><tr><td>факт о будущем<\/td><td><span class=\"en\">I'll be 22 next year.<\/span><\/td><\/tr><tr><td>отказ<\/td><td><span class=\"en\">The car won't start.<\/span><\/td><\/tr><\/table><\/div><h4>Три способа сказать о будущем<\/h4><div class=\"tw\"><table><tr><th>Форма<\/th><th>Что значит<\/th><th>Пример<\/th><\/tr><tr><td>will<\/td><td>решил только что, прогноз<\/td><td><span class=\"en\">I'll have tea.<\/span><\/td><\/tr><tr><td>going to<\/td><td>решил заранее<\/td><td><span class=\"en\">I am going to learn to drive.<\/span><\/td><\/tr><tr><td>Present Continuous<\/td><td>уже договорился<\/td><td><span class=\"en\">I am meeting Tom at six.<\/span><\/td><\/tr><\/table><\/div><h4>Тонкости<\/h4><ul><li><b>probably<\/b>: в утверждении после will, в отрицании перед won't: <span class=\"en\">I'll probably come.<\/span> <span class=\"en\">I probably won't come.<\/span><\/li><li>Отрицательное мнение: <span class=\"en\">I don't think I'll go.<\/span> звучит естественнее, чем «I think I won't go».<\/li><li><b>shall<\/b> с I и we — предложить что-то: <span class=\"en\">Shall I open the window?<\/span> <span class=\"en\">Shall we go?<\/span><\/li><li>После <b>if, when, before, as soon as<\/b> will не ставят: <span class=\"en\">I'll call you when I arrive.<\/span><\/li><li><b>will<\/b> не сокращают в кратком ответе: <span class=\"en\">Yes, I will.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I will to go.<\/span><span class=\"en\">I will go.<\/span><\/li><li><span class=\"bad\">He wills come.<\/span><span class=\"en\">He will come.<\/span><\/li><li><span class=\"bad\">I think I go home.<\/span><span class=\"en\">I think I'll go home.<\/span><\/li><li><span class=\"bad\">I'll call you when I will arrive.<\/span><span class=\"en\">I'll call you when I arrive.<\/span><\/li><li><span class=\"bad\">I will go to the doctor at five tomorrow.<\/span><span class=\"en\">I am going to the doctor at five tomorrow.<\/span><small>если запись уже есть<\/small><\/li><\/ul>",
"can": "<h4>Значения can<\/h4><div class=\"tw\"><table><tr><th>Значение<\/th><th>Пример<\/th><\/tr><tr><td>умение<\/td><td><span class=\"en\">I can swim.<\/span><\/td><\/tr><tr><td>возможность<\/td><td><span class=\"en\">You can buy tickets online.<\/span><\/td><\/tr><tr><td>разрешение<\/td><td><span class=\"en\">Can I come in?<\/span> <span class=\"en\">You can't park here.<\/span><\/td><\/tr><tr><td>просьба<\/td><td><span class=\"en\">Can you help me?<\/span><\/td><\/tr><\/table><\/div><p>С глаголами чувств <b>can<\/b> часто просто не переводится: <span class=\"en\">I can see the sea.<\/span> — «Я вижу море». <span class=\"en\">I can't hear you.<\/span> — «Я тебя не слышу».<\/p><h4>У can только две формы<\/h4><p>Для других времён берут <b>be able to<\/b>:<\/p><div class=\"tw\"><table><tr><th>Время<\/th><th>Пример<\/th><\/tr><tr><td>будущее<\/td><td><span class=\"en\">I will be able to come.<\/span><\/td><\/tr><tr><td>Present Perfect<\/td><td><span class=\"en\">I haven't been able to sleep.<\/span><\/td><\/tr><tr><td>после другого глагола<\/td><td><span class=\"en\">I want to be able to drive.<\/span><\/td><\/tr><\/table><\/div><h4>could в прошедшем<\/h4><ul><li>Общее умение: <span class=\"en\">I could swim when I was five.<\/span><\/li><li>Одна удача в конкретной ситуации — <b>was able to<\/b> или <b>managed to<\/b>: <span class=\"en\">The door was locked, but I was able to open it.<\/span><\/li><li>В отрицании разницы нет: <span class=\"en\">I couldn't open it.<\/span><\/li><\/ul><h4>Вежливость по возрастанию<\/h4><p><span class=\"en\">Can you…?<\/span> → <span class=\"en\">Could you…?<\/span> → <span class=\"en\">Could you possibly…?<\/span> Просьба о разрешении: <span class=\"en\">Can I…?<\/span> → <span class=\"en\">Could I…?<\/span> → <span class=\"en\">May I…?<\/span><\/p><h4>Произношение и письмо<\/h4><p>В утверждении <b>can<\/b> звучит слабо и коротко, а <b>can't<\/b> в британском произношении — с долгим гласным. <b>cannot<\/b> пишется слитно.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I can to swim.<\/span><span class=\"en\">I can swim.<\/span><\/li><li><span class=\"bad\">He cans drive.<\/span><span class=\"en\">He can drive.<\/span><\/li><li><span class=\"bad\">I don't can come.<\/span><span class=\"en\">I can't come.<\/span><\/li><li><span class=\"bad\">Do you can help?<\/span><span class=\"en\">Can you help?<\/span><\/li><li><span class=\"bad\">I will can come.<\/span><span class=\"en\">I will be able to come.<\/span><\/li><\/ul>",
"must": "<h4>must и have to<\/h4><div class=\"tw\"><table><tr><th>must<\/th><th>have to<\/th><\/tr><tr><td>говорящий сам так считает<\/td><td>требуют обстоятельства или правила<\/td><\/tr><tr><td><span class=\"en\">I must call my mother.<\/span><\/td><td><span class=\"en\">I have to work on Saturday.<\/span><\/td><\/tr><tr><td>письменные правила: <span class=\"en\">You must wear a helmet.<\/span><\/td><td>в речи встречается чаще<\/td><\/tr><\/table><\/div><p>В утверждениях разница небольшая, и <b>have to<\/b> подойдёт почти всегда.<\/p><h4>Отрицания значат разное<\/h4><div class=\"tw\"><table><tr><th>Форма<\/th><th>Смысл<\/th><th>Пример<\/th><\/tr><tr><td>mustn't<\/td><td>нельзя, запрещено<\/td><td><span class=\"en\">You mustn't smoke here.<\/span><\/td><\/tr><tr><td>don't have to<\/td><td>не обязательно, можно не делать<\/td><td><span class=\"en\">You don't have to come.<\/span><\/td><\/tr><tr><td>needn't<\/td><td>не нужно (то же, что don't have to)<\/td><td><span class=\"en\">You needn't wait.<\/span><\/td><\/tr><\/table><\/div><h4>Другие времена<\/h4><div class=\"tw\"><table><tr><th>Время<\/th><th>Форма<\/th><\/tr><tr><td>прошедшее<\/td><td><span class=\"en\">I had to wait.<\/span><\/td><\/tr><tr><td>будущее<\/td><td><span class=\"en\">I will have to go.<\/span><\/td><\/tr><tr><td>вопрос<\/td><td><span class=\"en\">Do I have to pay?<\/span><\/td><\/tr><\/table><\/div><p>У <b>must<\/b> прошедшей формы нет, всегда <b>had to<\/b>.<\/p><h4>Близкие выражения<\/h4><ul><li><b>have got to<\/b> — разговорный вариант have to: <span class=\"en\">I've got to go.<\/span><\/li><li><b>need to<\/b> — «нужно»: <span class=\"en\">I need to buy milk.<\/span><\/li><li><b>must<\/b> как догадка: <span class=\"en\">He must be tired.<\/span> — «Он, должно быть, устал».<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I must to go.<\/span><span class=\"en\">I must go.<\/span><\/li><li><span class=\"bad\">He musts work.<\/span><span class=\"en\">He must work.<\/span><\/li><li><span class=\"bad\">Yesterday I must work.<\/span><span class=\"en\">Yesterday I had to work.<\/span><\/li><li><span class=\"bad\">You don't must do it.<\/span><span class=\"en\">You don't have to do it.<\/span><small>или mustn't, если это запрет<\/small><\/li><li><span class=\"bad\">I haven't to go.<\/span><span class=\"en\">I don't have to go.<\/span><\/li><li><span class=\"bad\">You mustn't come if you are busy.<\/span><span class=\"en\">You don't have to come if you are busy.<\/span><small>«не обязательно», а не «запрещено»<\/small><\/li><\/ul>",
"should": "<h4>Сила совета по возрастанию<\/h4><div class=\"tw\"><table><tr><th>Форма<\/th><th>Смысл<\/th><th>Пример<\/th><\/tr><tr><td>could<\/td><td>можно бы<\/td><td><span class=\"en\">You could ask Tom.<\/span><\/td><\/tr><tr><td>should / ought to<\/td><td>стоит<\/td><td><span class=\"en\">You should see a doctor.<\/span><\/td><\/tr><tr><td>had better<\/td><td>лучше сделай, иначе будет плохо<\/td><td><span class=\"en\">You'd better hurry.<\/span><\/td><\/tr><tr><td>have to / must<\/td><td>обязан<\/td><td><span class=\"en\">You have to stop.<\/span><\/td><\/tr><\/table><\/div><p><b>ought to<\/b> значит то же, что should, но встречается реже. После <b>had better<\/b> глагол без to.<\/p><h4>Как советуют и спрашивают совета<\/h4><ul><li><span class=\"en\">What should I do?<\/span> <span class=\"en\">Should I call him?<\/span> <span class=\"en\">Do you think I should go?<\/span><\/li><li><span class=\"en\">I think you should rest.<\/span> <span class=\"en\">I don't think you should go.<\/span> — отрицание ставят в первую часть.<\/li><li><span class=\"en\">If I were you, I would wait.<\/span> — «На твоём месте я бы подождал».<\/li><li><span class=\"en\">Why don't you take a taxi?<\/span> — тот же совет, но мягче.<\/li><\/ul><h4>Другие значения<\/h4><ul><li>Ожидание: <span class=\"en\">She should be at home by now.<\/span> — «Она уже должна быть дома».<\/li><li>Упрёк о прошлом: <span class=\"en\">You should have called me.<\/span> — «Надо было позвонить». Форма: should have + третья форма.<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">You should to go.<\/span><span class=\"en\">You should go.<\/span><\/li><li><span class=\"bad\">He shoulds rest.<\/span><span class=\"en\">He should rest.<\/span><\/li><li><span class=\"bad\">You don't should eat it.<\/span><span class=\"en\">You shouldn't eat it.<\/span><\/li><li><span class=\"bad\">Do I should wait?<\/span><span class=\"en\">Should I wait?<\/span><\/li><li><span class=\"bad\">You should went there.<\/span><span class=\"en\">You should have gone there.<\/span><small>о прошлом<\/small><\/li><li><span class=\"bad\">You had better to go.<\/span><span class=\"en\">You had better go.<\/span><\/li><\/ul>",

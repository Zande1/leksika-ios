function render(){
  document.body.classList.toggle('in-session',!!session);
  document.querySelectorAll('nav.tabs [data-go]').forEach(b=>{const on=b.dataset.go===view.name||(view.name==='unit'&&b.dataset.go==='course');on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  const due=dueIds().length,bd=$('#dueBadge');bd.hidden=!due;bd.textContent=due>99?'99+':due;
  const back=$('#backBtn');back.innerHTML=BACK;$('#topActions').innerHTML='';
  if(session){$('header.top').hidden=true;return renderSession()}
  $('header.top').hidden=false;
  if(view.name==='unit'){back.hidden=false;back.setAttribute('aria-label','К курсу');back.onclick=()=>go('course')}
  else if(EMB){back.hidden=false;back.setAttribute('aria-label','Назад в Лексику');back.onclick=()=>{saveNow();PARENT.__closeGrammar()}}
  else back.hidden=true;
  ({course:renderCourse,unit:renderUnit,review:renderReview,stats:renderStats,settings:renderSettings})[view.name]();
}

function renderCourse(){
  $('#title').textContent='Грамматика';
  const pct=coursePct(),st=streak(),day=S.days[dayKey()]||{n:0};
  $('#topActions').innerHTML=st?`<span class="chip">${st} ${plural(st,'день','дня','дней')} подряд</span>`:'';
  const mine=lvUnits(S.lv),doneUnits=mine.filter(unitDone).length,L=LEVELS.find(l=>l.id===S.lv);
  let h=`<div class="seg lvseg" role="group" aria-label="Уровень">${LEVELS.map(l=>`<button data-lv="${l.id}" aria-pressed="${l.id===S.lv}">${l.name} <span>${l.cefr}</span></button>`).join('')}</div>
    <div class="panel hero"><div><div class="muted small">Пройдено: ${L.name}</div><div class="pct">${pct}%</div></div>
    <div class="small muted" style="text-align:right">${doneUnits} из ${mine.length} тем<br>сегодня ${day.n} / ${S.goal}</div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  const due=dueIds().length;
  if(due)h+=`<button class="btn primary big" id="revBtn">Повторить: ${due} ${plural(due,'задание','задания','заданий')}</button>`;
  const testCard=(key,units,title,ru,n)=>{const open=units.every(unitDone),t=S.tests[key];
    return `<button class="unit test ${t&&t.best>=PASS?'done':''} ${open?'':'locked'}" data-test="${key}" ${open?'':'disabled'}>
      <span class="num">${t&&t.best>=PASS?'✓':'T'}</span><span><span class="tt">${title}</span><br><span class="ru">${esc(ru)}</span><br>
      <span class="sub">${!open?'Откроется после всех тем':t?`Лучший результат ${t.best}% · последний ${t.last}% (${t.at})`:n+' вопросов без подсказок и объяснений'}</span></span><span></span></button>`};
  SECTIONS.filter(sec=>sec.lv===S.lv).forEach(sec=>{
    h+=`<div class="sec-title">${esc(sec.en)} · ${esc(sec.ru)}</div>`;
    sec.units.forEach(u=>{
      const d=stepsDone(u),open=unlocked(u),m=unitMastered(u);
      const cu=curFor(u);
      const sub=cu?`Шаг ${cu.step+1} начат: сделано ${cu.i} из ${cu.q.length}`:!open?'Откроется после предыдущей темы':m?'Освоено':unitDone(u)?'Пройдено · закрепляется в повторении':d?`Шаг ${d} из ${u.steps.length} пройден`:'Теория и '+u.list.length+' '+plural(u.list.length,'задание','задания','заданий');
      h+=`<button class="unit ${unitDone(u)?'done':''} ${open?'':'locked'}" data-u="${u.id}" ${open?'':'disabled'}>
        <span class="num">${unitDone(u)?'✓':u.k}</span><span><span class="tt">${esc(u.en)}</span><br><span class="ru">${esc(u.ru)}</span><br><span class="sub">${sub}</span></span>
        <span class="dots">${u.steps.map((_,i)=>`<i class="${i<d?'on':''}"></i>`).join('')}</span></button>`;
    });
    h+=testCard(sec.id,sec.units,'Section test','Тест раздела: '+sec.ru,15);
  });
  const soon=SOON[S.lv]||[];
  if(soon.length)h+=`<div class="sec-title">Дальше в курсе</div><div class="soon">${soon.map(esc).join(' · ')}<br><br>Уровень ${L.name} ещё дописывается: эти темы добавятся следующими.</div>`;
  else{h+=`<div class="sec-title">Итог уровня</div>`+testCard('level-'+S.lv,mine,'Final test: '+L.name,'Итоговый тест уровня '+L.cefr,levelTestSize(S.lv))
    +`<div class="soon">Это все темы уровня ${L.name}. Дальше грамматика закрепляется повторением, свободным письмом и чтением.</div>`}
  $('#view').innerHTML=h;
  document.querySelectorAll('.lvseg [data-lv]').forEach(b=>b.onclick=()=>{S.lv=b.dataset.lv;save();render();scrollTo(0,0)});
  document.querySelectorAll('.unit[data-test]').forEach(b=>b.onclick=()=>{const key=b.dataset.test,sec=SECTIONS.find(x=>x.id===key);
    if(sec){startTest(key,sec.units,15,'Section test: '+sec.en,TQ[sec.id]||[],8);return}
    const lv=key.slice(6),us=lvUnits(lv),n=levelTestSize(lv);
    startTest(key,us,n,'Final test',SECTIONS.filter(x=>x.lv===lv).flatMap(x=>TQ[x.id]||[]),Math.max(0,n-us.length))});
  $('#revBtn')&&($('#revBtn').onclick=startReview);
  document.querySelectorAll('.unit[data-u]').forEach(b=>b.onclick=()=>go('unit',b.dataset.u));
}

let moreOpen=null;
function renderUnit(){
  const u=UNIT(view.arg);$('#title').textContent=u.k+'. '+u.en;
  const d=stepsDone(u);
  let h=`<div class="muted">${esc(u.ru)}</div><div class="row" style="justify-content:space-between"><span class="task">Теория</span>
    <span class="seg" role="group" aria-label="Язык теории"><button data-l="ru" aria-pressed="${S.lang==='ru'}">Русский</button><button data-l="en" aria-pressed="${S.lang==='en'}">English</button></span></div>
    <div class="panel theory">${(u.th[S.lang]||u.th.ru).replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>')}<div class="small muted">Нажми на английский пример, чтобы услышать его. В заданиях нажатие на слово показывает перевод.</div></div>
    ${MORE[u.id]?`<details class="panel theory more" id="moreBox"${moreOpen===u.id?' open':''}><summary><b>Подробнее</b><span>полные таблицы, тонкости, типичные ошибки</span></summary>${S.lang==='en'?'<p class="small muted">Этот раздел пока только на русском.</p>':''}${MORE[u.id]}</details>`:''}
    <span class="task">Практика</span>`;
  u.steps.forEach((ids,i)=>{
    const done=i<d,open=i<=d,c=curFor(u,i);
    h+=`<div class="panel step"><div><b>Шаг ${i+1}. ${['Узнаём форму','Строим сами','Закрепляем вперемешку'][i]}</b><div class="small muted">${ids.length} ${plural(ids.length,'задание','задания','заданий')}${i===2&&u.n>1?' + несколько из прошлых тем':''}${c?` · сделано ${c.i} из ${c.q.length}`:done?' · пройден':''}</div></div>
      <button class="btn ${done&&!c?'':'primary'}" data-step="${i}" ${open?'':'disabled'}>${c?'Продолжить':done?'Ещё раз':open?'Начать':'Закрыт'}</button></div>`;
  });
  if(!unitDone(u))h+=`<button class="btn" id="skipBtn">Уже знаю эту тему: сдать тестом (10 вопросов)</button>`;
  if(u.fw)h+=`<span class="task">Свободное письмо · в прогресс не идёт</span>
    <div class="panel"><div>${esc(u.fw[S.lang]||u.fw.ru)}</div>
    <textarea class="inp" id="fw" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Пиши по-английски, своими словами">${esc((S.free[u.id]||{}).t||'')}</textarea>
    <div class="small muted">Сохраняется само. Здесь нет автопроверки: текст можно выгрузить на разбор в «Статистике».</div></div>`;
  $('#view').innerHTML=h;
  document.querySelectorAll('.seg [data-l]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();render()});
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.step;let q=u.steps[i];
    const c=curFor(u,i);if(c){startSession({kind:'step',unit:u.id,step:i,q:c.q,resume:c});return}
    if(i===2){ /* interleaving: mix in the weakest items already met in earlier topics */
      const prev=shuffle(UNITS.slice(0,u.n-1).flatMap(x=>x.list.map(y=>y.id)).filter(id=>S.items[id]))
        .sort((a,b)=>(S.items[b].w-S.items[b].r)-(S.items[a].w-S.items[a].r)).slice(0,4);
      q=shuffle(q.concat(prev));
    }
    startSession({kind:'step',unit:u.id,step:i,q})});
  $('#skipBtn')&&($('#skipBtn').onclick=()=>startTest('skip-'+u.id,[u],10,'Topic test: '+u.en,[],0));
  const mb=$('#moreBox');if(mb)mb.ontoggle=()=>{moreOpen=mb.open?u.id:null};
  const fw=$('#fw');if(fw)fw.oninput=()=>{const t=fw.value;if(t.trim())S.free[u.id]={t,at:dayKey()};else delete S.free[u.id];save()};
}

function renderReview(){
  $('#title').textContent='Повторение';
  const due=dueIds(),seen=Object.keys(S.items).filter(id=>ITEMS.has(id)),tm=addDays(1);
  const tomorrow=seen.filter(id=>S.items[id].d===tm).length;
  let h='';
  if(!seen.length)h=`<div class="panel"><h2>Пока нечего повторять</h2><div class="muted">Пройди первый шаг любой темы. Каждое задание потом вернётся сюда через день, три дня, неделю и дальше — так правило переходит в долгую память.</div><button class="btn primary" id="toCourse">К курсу</button></div>`;
  else{
    h=due.length?`<div class="panel"><h2>Сегодня: ${due.length} ${plural(due.length,'задание','задания','заданий')}</h2><div class="muted">Темы идут вперемешку, а предложение может быть другим на то же правило. Там, где раньше был выбор из вариантов, часто нужно вписать ответ самому.</div><button class="btn primary big" id="revBtn">Начать${due.length>15?' (первые 15)':''}</button></div>`
      :`<div class="panel"><h2>На сегодня всё повторено</h2><div class="muted">Завтра вернётся: ${tomorrow}. Можно потренироваться дополнительно — на интервалы это не повлияет, но ошибки вернут задание в очередь.</div><button class="btn big" id="extraBtn">Смешанная практика: 10 заданий</button></div>`;
    const boxes=[0,0,0];seen.forEach(id=>{const b=S.items[id].b;boxes[b<=1?0:b<MASTER?1:2]++});
    h+=`<div class="grid2"><div class="stat"><div class="v">${boxes[0]}</div><div class="l">новые и сложные</div></div><div class="stat"><div class="v">${boxes[1]}</div><div class="l">закрепляются</div></div>
      <div class="stat"><div class="v">${boxes[2]}</div><div class="l">освоены</div></div><div class="stat"><div class="v">${Math.max(0,NPRACT-seen.filter(id=>!ITEMS.get(id).test).length)}</div><div class="l">ещё не встречались</div></div></div>`;
  }
  $('#view').innerHTML=h;
  $('#toCourse')&&($('#toCourse').onclick=()=>go('course'));
  $('#revBtn')&&($('#revBtn').onclick=startReview);
  $('#extraBtn')&&($('#extraBtn').onclick=startExtra);
}

function renderStats(){
  $('#title').textContent='Статистика';
  flushAct();
  let n=0,ok=0,sec=0,act=0;Object.values(S.days).forEach(d=>{n+=d.n||0;ok+=d.ok||0;sec+=d.sec||0;act+=Math.max(d.act||0,d.sec||0)});
  const seen=Object.keys(S.items).filter(id=>ITEMS.has(id)),mast=seen.filter(id=>S.items[id].b>=MASTER).length;
  const day=S.days[dayKey()]||{n:0},st=streak();
  let h=`<div class="grid2">
    <div class="stat"><div class="v">${coursePct()}%</div><div class="l">${LEVELS.find(l=>l.id===S.lv).name}: пройдено · осталось ${100-coursePct()}%</div></div>
    <div class="stat"><div class="v">${st}</div><div class="l">${plural(st,'день','дня','дней')} подряд</div></div>
    <div class="stat"><div class="v">${day.n} / ${S.goal}</div><div class="l">ответов сегодня</div></div>
    <div class="stat"><div class="v">${n?Math.round(100*ok/n)+'%':'—'}</div><div class="l">верных с первой попытки</div></div>
    <div class="stat"><div class="v">${mast} / ${NPRACT}</div><div class="l">заданий освоено</div></div>
    <div class="stat"><div class="v">${fmtTime(Math.max(day.act||0,day.sec||0))}</div><div class="l">в грамматике сегодня</div></div>
    <div class="stat"><div class="v">${fmtTime(act)}</div><div class="l">в грамматике всего</div></div>
    <div class="stat"><div class="v">${fmtTime(sec)}</div><div class="l">из них над заданиями</div></div></div>
    <div class="small muted">Время идёт, пока ты читаешь теорию, делаешь задания или пишешь текст. Через минуту без касаний счёт останавливается; свёрнутое приложение и другие вкладки Лексики не считаются.</div>`;
  const ds=[];for(let i=13;i>=0;i--){const k=addDays(-i);ds.push({k,n:(S.days[k]||{}).n||0})}
  const mx=Math.max(1,...ds.map(d=>d.n));
  h+=`<div class="panel"><h2>Ответы за 14 дней</h2><div class="days">${ds.map(d=>`<i class="${d.n?'':'zero'}" style="height:${d.n?Math.max(6,Math.round(100*d.n/mx)):2}%" title="${d.k}: ${d.n}"></i>`).join('')}</div>
    <div class="dlab">${ds.map(d=>`<span>${+d.k.slice(8)}</span>`).join('')}</div></div>`;
  const taken=Object.keys(S.tests).map(k=>{const sec=SECTIONS.find(x=>x.id===k),lv=LEVELS.find(l=>'level-'+l.id===k);return (sec||lv)?{name:sec?'Section test: '+sec.en:'Final test: '+lv.name,t:S.tests[k]}:null}).filter(Boolean);
  if(taken.length)h+=`<div class="panel"><h2>Тесты</h2>${taken.map(x=>`<div class="urow"><span>${esc(x.name)}<br><span class="small muted">попыток: ${x.t.n} · последняя ${x.t.at}: ${x.t.last}%</span></span><b>${x.t.best}%</b><div class="bar"><i style="width:${x.t.best}%"></i></div></div>`).join('')}<div class="small muted">Справа лучший результат. Зачёт от ${PASS}%.</div></div>`;
  const rows=UNITS.map(u=>{let r=0,w=0;u.list.forEach(it=>{const x=S.items[it.id];if(x){r+=x.r||0;w+=x.w||0}});return {u,r,w,p:r+w?r/(r+w):null}}).filter(x=>x.p!=null).sort((a,b)=>a.p-b.p);
  h+=`<div class="panel"><h2>Точность по темам</h2>${rows.length?'<div class="small muted">Сверху — темы, где ошибок больше всего.</div>'+rows.map(x=>`<div class="urow"><span>${esc(x.u.en)}<br><span class="small muted">${esc(x.u.ru)}</span></span><b>${Math.round(100*x.p)}%</b><div class="bar"><i style="width:${Math.round(100*x.p)}%"></i></div></div>`).join(''):'<div class="muted">Появится после первых ответов.</div>'}</div>`;
  const nf=Object.keys(S.free).filter(id=>UNIT(id)).length,nl=S.log.filter(x=>ITEMS.has(x.id)).length;
  h+=`<div class="panel"><h2>Выгрузка на проверку</h2><div class="small muted">Собирает одним текстом свободное письмо (${nf} ${plural(nf,'тема','темы','тем')}) и последние ошибки в упражнениях (${nl}). Отправь его Claude — он разберёт ошибки. ${S.exp?'Последняя выгрузка: '+S.exp+'.':'Удобный ритм — раз в неделю.'}</div>
    <button class="btn primary" id="expBtn" ${nf||nl?'':'disabled'}>Выгрузить</button><div id="expOut"></div></div>`;
  $('#view').innerHTML=h;
  $('#expBtn').onclick=doExport;
}
function exportText(){
  let t='Грамматика: выгрузка на проверку, '+dayKey()+'\n\nПроверь, пожалуйста, мои тексты: исправь ошибки и коротко объясни каждую. Потом посмотри список ошибок из упражнений и скажи, какие правила мне стоит повторить.\n';
  const fr=UNITS.filter(u=>S.free[u.id]);
  if(fr.length){t+='\n=== Свободное письмо ===\n';fr.forEach(u=>{t+='\n'+u.n+'. '+u.en+' ('+S.free[u.id].at+')\nЗадание: '+(u.fw?u.fw.ru:'')+'\nМой текст:\n'+S.free[u.id].t.trim()+'\n'})}
  const lg=S.log.filter(x=>ITEMS.has(x.id)).slice(-60);
  if(lg.length){t+='\n=== Ошибки в упражнениях ===\n';lg.forEach(x=>{const it=ITEMS.get(x.id);t+='\n['+UNIT(it.u).en+'] '+(it.t==='dict'?'(диктант)':it.q)+'\n  мой ответ: '+(x.g||'—')+'\n  верно: '+it.ans[0]+'\n'})}
  return t;
}
function doExport(){
  const t=exportText();S.exp=dayKey();save();
  $('#expOut').innerHTML='<textarea class="inp out" readonly></textarea><div class="row"><button class="btn" id="cpBtn">Скопировать</button><span class="small muted" id="cpNote"></span></div>';
  const ta=$('#expOut textarea');ta.value=t;
  const copy=()=>{const ok=()=>{$('#cpNote').textContent='Скопировано — вставь в чат с Claude.'},fail=()=>{ta.focus();ta.select();try{document.execCommand('copy')?ok():($('#cpNote').textContent='Выдели текст и скопируй вручную.')}catch(e){$('#cpNote').textContent='Выдели текст и скопируй вручную.'}};
    try{navigator.clipboard.writeText(t).then(ok,fail)}catch(e){fail()}};
  $('#cpBtn').onclick=copy;
  if(MH)post('share',{filename:'grammar-'+dayKey()+'.txt',data:t});else copy();
}

    <div class="field"><span>Оформление</span><span class="seg">${[['auto','Как в системе'],['light','Светлое'],['dark','Тёмное']].map(([k,t])=>`<button data-th="${k}" aria-pressed="${LS.get('lx-theme','auto')===k}">${t}</button>`).join('')}</span></div>
    <div class="field"><span>Цель на день, ответов</span><select id="goal">${[10,20,30,50].map(g=>`<option ${g===S.goal?'selected':''}>${g}</option>`).join('')}</select></div>
    <div class="field"><span>Озвучивать правильный ответ</span><span class="seg"><button data-s="1" aria-pressed="${!!S.sound}">Да</button><button data-s="0" aria-pressed="${!S.sound}">Нет</button></span></div></div>

    <div class="panel"><h2>Сброс</h2><div class="small muted">Удаляет прогресс и статистику грамматики. Тексты свободного письма, а также слова и тексты Лексики остаются.</div><button class="btn danger" id="reset">Сбросить прогресс</button></div>`;

  document.querySelectorAll('.seg [data-th]').forEach(b=>b.onclick=()=>{LS.set('lx-theme',b.dataset.th);applyTheme();render()});
  $('#goal').onchange=e=>{S.goal=+e.target.value;save()};
  $('#reset').onclick=e=>{const b=e.currentTarget;if(b.dataset.arm){pendAct=0;S.items={};S.steps={};S.days={};S.log=[];S.tests={};delete S.curs;saveNow();go('course')}else{b.dataset.arm=1;b.textContent='Нажми ещё раз, чтобы удалить всё'}};
}

/* ================= sessions ================= */
/* an unfinished step is kept so that leaving it (back to the theory or the course) loses nothing */
function keepCur(i){
  const s=session;if(!s||s.kind!=='step')return;
  (S.curs=S.curs||{})[s.unit]={unit:s.unit,step:s.step,q:s.q.slice(),i,total:s.total,right:s.right,wrong:s.wrong,typos:s.typos,tried:[...s.tried],again:s.again};save();
}
function curFor(u,step){const c=(S.curs||{})[u.id];return c&&c.unit===u.id&&(step===undefined||c.step===step)&&c.i>0&&c.i<c.q.length&&c.q.every(id=>ITEMS.has(id))?c:null}
function startSession(o){
  let q=o.q.filter(id=>ITEMS.has(id)&&(CAN_SPEAK||ITEMS.get(id).t!=='dict'));
  if(!q.length)return;
  session=Object.assign({i:0,q,total:q.length,right:0,wrong:0,typos:0,tried:new Set(),again:{},state:null,t0:Date.now()},o,{q});
  const r=o.resume;if(r){delete session.resume;Object.assign(session,{i:r.i,total:r.total||q.length,right:r.right||0,wrong:r.wrong||0,typos:r.typos||0,tried:new Set(r.tried||[]),again:r.again||{}})}
  render();scrollTo(0,0);
}
/* ---- tests: questions from the finished topics, no hints, no explanations until the end.
   A wrong answer sends the item back to review; a right one does not move its interval. ---- */
function testPool(units,n,tq=[],ownN=0){
  const own=shuffle(tq).slice(0,Math.min(tq.length,ownN)),rest=n-own.length;
  const per=Math.max(1,Math.ceil(rest/units.length));let out=[];
  shuffle(units).forEach(u=>{out=out.concat(shuffle(u.list.filter(it=>it.t==='mc'||it.t==='gap'||it.t==='fix'||it.t==='tr').map(it=>it.id)).slice(0,per))});
  /* every topic keeps at least one question when there is room for it */
  const first=[],more=[];const seenU=new Set();for(const id of out){const u=ITEMS.get(id).u;(seenU.has(u)?more:first).push(id);seenU.add(u)}
  return shuffle(own.concat(shuffle(first).concat(shuffle(more)).slice(0,rest)));
}
function startTest(key,units,n,title,tq,ownN){startSession({kind:'test',key,title,units:units.map(u=>u.id),res:[],q:testPool(units,n,tq||[],ownN||0)})}
function levelTestSize(lv){return Math.min(50,lvUnits(lv).length*5)}
function testAnswer(it,r,given){
  const s=session,ok=r.res!=='bad',t=dayKey();
  s.res.push({id:it.id,g:given,ok});ok?s.right++:s.wrong++;
  const rec=S.items[it.id]||(S.items[it.id]={b:1,d:addDays(1),r:0,w:0});
  if(ok)rec.r++;else{rec.w++;rec.b=0;rec.d=addDays(1);S.log.push({id:it.id,g:String(given||'').slice(0,120),at:t});if(S.log.length>150)S.log=S.log.slice(-150)}
  const d=dayRec();d.n++;if(ok)d.ok++;d.sec+=Math.min(90,Math.round((Date.now()-s.state.shown)/1000));save();
}
function renderTestResult(){
  const s=session,n=s.res.length,pct=n?Math.round(100*s.right/n):0,prev=S.tests[s.key]||{};
  const skipU=s.key.startsWith('skip-')?UNIT(s.key.slice(5)):null;
  if(!s.saved){s.saved=true;
    if(skipU){if(pct>=PASS){S.steps[skipU.id]=skipU.steps.length;if(S.curs)delete S.curs[skipU.id]}}
    else S.tests[s.key]={best:Math.max(prev.best||0,pct),last:pct,at:dayKey(),n:(prev.n||0)+1};
    saveNow()}
  const by=new Map();s.res.forEach(x=>{const u=UNIT(ITEMS.get(x.id).u),e=by.get(u.id)||{u,ok:0,n:0};e.n++;if(x.ok)e.ok++;by.set(u.id,e)});
  const weak=[...by.values()].filter(e=>e.ok<e.n).sort((a,b)=>a.ok/a.n-b.ok/b.n);
  const bad=s.res.filter(x=>!x.ok);
  let h=`<div class="panel" style="text-align:center;padding:26px 16px"><div class="task">${esc(s.title)}</div>
    <div style="font-size:44px;font-weight:800;letter-spacing:-.02em">${pct}%</div>
    <div class="muted">верно ${s.right} из ${n}</div>
    <div><b>${skipU?(pct>=PASS?'Тема засчитана. Её задания всё равно появятся в повторении.':`Тема не засчитана: нужно ${PASS}%. Пройди её по шагам.`):pct>=PASS?'Тест пройден: материал закреплён.':`До зачёта нужно ${PASS}%. Повтори слабые темы и попробуй ещё раз.`}</b></div></div>`;
  if(weak.length)h+=`<div class="panel"><h2>Где были ошибки</h2>${weak.map(e=>`<div class="urow"><span>${esc(e.u.en)}<br><span class="small muted">${esc(e.u.ru)}</span></span><b>${e.ok} из ${e.n}</b></div>`).join('')}</div>`;
  if(bad.length)h+=`<div class="panel"><h2>Разбор ошибок</h2>${bad.map(x=>{const it=ITEMS.get(x.id),u=UNIT(it.u),rule=u.rules[it.rule];
    const right=(it.t==='mc'||it.t==='gap')&&it.q.includes('___')?fillBlank(it.q,it.ans[0]):twrap(it.ans[0]);
    return `<div class="mist"><div class="small muted">${it.t==='tr'||it.t==='fix'?esc(it.q):''}</div><div class="right">${right}</div>
      <div class="small">Твой ответ: <span class="wrongtxt">${esc(x.g||'—')}</span></div>${rule?`<div class="why">${esc(rule[S.lang]||rule.ru)}</div>`:''}</div>`}).join('')}
    <div class="small muted">Эти задания вернутся в повторении завтра.</div></div>`;
  h+=`<button class="btn primary big" id="doneBtn">${skipU?'К теме':'К курсу'}</button>`;
  $('#view').innerHTML=h;$('#doneBtn').onclick=()=>skipU?go('unit',skipU.id):go('course');
}
/* oldest first, but mixed across topics: shuffle the 45 oldest and take 15 */
function startReview(){const d=shuffle(dueIds().slice(0,45)).slice(0,15);if(d.length)startSession({kind:'review',q:d})}
function startExtra(){
  const seen=Object.keys(S.items).filter(id=>ITEMS.has(id));
  const w=shuffle(seen).sort((a,b)=>(S.items[b].w||0)-(S.items[b].r||0)-((S.items[a].w||0)-(S.items[a].r||0)));
  startSession({kind:'extra',q:shuffle(w.slice(0,10))});
}
function proper(w){return w==='I'||/^(I'm|I've|Tom|Anna|London|Russia|English|French|TV|Paris|Moscow|Canada)$/.test(w)}
const NOART='—';
/* raw English text → tappable words (tap = translation) */
function twrap(t){return String(t).split(/([A-Za-z]+(?:['’][A-Za-z]+)*)/).map((x,i)=>i%2?`<span class="tw">${esc(x)}</span>`:esc(x)).join('')}
function qHtml(q){const a=String(q).split('___');return a.map(twrap).join('<span class="blank"></span>')}
function fillBlank(q,a){const t=q.replace(/\s*\([^)]*\)\s*$/,'').split('___');return a===NOART?twrap(t.join('').replace(/\s+/g,' ').trim())+' <span class="muted small">(без артикля и предлога)</span>':twrap(t[0])+'<b>'+twrap(a)+'</b>'+twrap(t[1]||'')}
const TASK={mc:'Выбери вариант',gap:'Впиши пропущенное',build:'Собери предложение',tr:'Переведи на английский',fix:'Исправь ошибку',dict:'Напиши то, что слышишь'};

function renderSession(){
  const s=session;
  if(s.i>=s.q.length)return s.kind==='test'?renderTestResult():renderSummary();
  /* In review the schedule follows the rule, not the sentence: when the topic has other exercises of the same
     kind on the same rule, one of them is shown, so the answer cannot be recalled from the wording alone. */
  const base=ITEMS.get(s.q[s.i]),rec=S.items[base.id];let it=base;
  if(s.kind==='review'||s.kind==='extra'){const sib=SIBS.get(base.u+'|'+base.rule+'|'+base.t)||[];if(sib.length>1)it=sib[Math.floor(Math.random()*sib.length)]}
  /* in review, a multiple-choice gap that was already answered right once becomes a typed gap */
  let mode=it.t;if(mode==='mc'&&s.kind!=='test'&&(s.kind!=='step'||it.u!==s.unit)&&it.q.includes('___')&&rec&&rec.b>=1&&canon(it.ans[0]).split(' ').every(w=>AUX.has(w)))mode='gap';
  s.state={it,base,mode,shown:Date.now(),pick:null,tiles:null,line:[],done:false};
  let h=`<div class="sess-top"><button class="icon-btn" id="quit" aria-label="Закрыть">${CLOSE}</button><div class="bar"><i style="width:${Math.round(100*Math.min(s.i,s.total)/s.total)}%"></i></div><span class="small muted">${s.i<s.total?(s.i+1)+' / '+s.total:'ошибки: ещё '+(s.q.length-s.i)}</span></div>
    <div class="task">${mode==='mc'&&it.o.includes(NOART)?'Выбери вариант («—» значит ничего не нужно)':TASK[mode]}${s.kind==='test'?(mode==='gap'?' · '+esc(UNIT(it.u).en):''):s.kind!=='step'||it.u!==s.unit?' · '+esc(UNIT(it.u).en):''}</div>`;
  const input=`<input class="inp" id="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Ответ по-английски">`;
  if(mode==='mc')h+=`<div class="q">${qHtml(it.q)}</div><div class="opts">${shuffle(it.o.map((o,i)=>i)).map(i=>`<button class="opt" data-i="${i}" aria-pressed="false">${esc(it.o[i])}</button>`).join('')}</div>`;
  else if(mode==='gap')h+=`<div class="q">${qHtml(it.q)}</div>${input}`;
  else if(mode==='tr')h+=`<div class="q">${esc(it.q)}</div>${input}`;
  else if(mode==='fix')h+=`<div class="q"><span class="wrong">${twrap(it.q)}</span></div><div class="small muted">Напиши предложение целиком, уже без ошибки.</div>${input}`;
  else if(mode==='dict')h+=`<button class="say" id="say" aria-label="Прослушать">${SPK}</button><div class="small muted" style="text-align:center">Можно слушать сколько угодно раз.</div>${input}`;
  else if(mode==='build'){
    const words=it.ans[0].replace(/[.?!,]/g,'').split(' ').map((w,i)=>i===0&&!proper(w)?w.toLowerCase():w);
    s.state.tiles=shuffle(words.concat(it.extra));
    h+=`<div class="q">${esc(it.q)}</div><div class="tiles line" id="line"></div><div class="tiles" id="bank">${s.state.tiles.map((w,i)=>`<button class="tile" data-i="${i}">${esc(w)}</button>`).join('')}</div>`;
  }
  h+=`<div class="foot" id="foot"><div class="wrap"><button class="btn primary big" id="checkBtn" disabled>${s.kind==='test'?'Ответить':'Проверить'}</button></div></div>`;
  $('#view').innerHTML=h;
  $('#quit').onclick=()=>{
    if(s.kind==='test'&&!s.quitArm){s.quitArm=true;tip('Выйти из теста? Результат не сохранится. Нажми крестик ещё раз, чтобы выйти.',4500);return}
    saveNow();const k=s.kind,u=s.unit;session=null;k==='step'?go('unit',u):k==='test'?go('course'):go('review')};
  const cb=$('#checkBtn');cb.onclick=submit;
  if(mode==='mc')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(s.state.done)return;s.state.pick=+b.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));cb.disabled=false});
  if(mode==='build'){
    const paint=()=>{$('#line').innerHTML=s.state.line.map((ti,k)=>`<button class="tile" data-k="${k}">${esc(s.state.tiles[ti])}</button>`).join('');
      document.querySelectorAll('#bank .tile').forEach(b=>b.classList.toggle('used',s.state.line.includes(+b.dataset.i)));cb.disabled=!s.state.line.length;
      document.querySelectorAll('#line .tile').forEach(b=>b.onclick=()=>{if(s.state.done)return;s.state.line.splice(+b.dataset.k,1);paint()})};
    document.querySelectorAll('#bank .tile').forEach(b=>b.onclick=()=>{if(s.state.done)return;s.state.line.push(+b.dataset.i);paint()});paint();
  }
  const inp=$('#ans');
  if(inp){inp.oninput=()=>{cb.disabled=!inp.value.trim()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(!s.state.done&&inp.value.trim())submit()}};if(!('ontouchstart' in window))inp.focus()}
  if(mode==='dict'){$('#say').onclick=()=>speak(it.ans[0]);setTimeout(()=>speak(it.ans[0]),350)}
}

function submit(){
  const s=session,st=s.state,it=st.it;if(st.done)return;
  let r,given='';
  if(st.mode==='mc'){given=it.o[st.pick];r={res:st.pick===it.c?'ok':'bad'}}
  else if(st.mode==='build'){given=st.line.map(i=>st.tiles[i]).join(' ');r=check(given,it.ans,true)}
  else{given=$('#ans').value;r=check(given,it.ans,it.strict)}
  st.done=true;st.given=given;st.r=r;
  const inp=$('#ans');if(inp)inp.blur();
  if(s.kind==='test'){testAnswer(it,r,given);s.i++;render();scrollTo(0,0);return}
  grade(st.base||it,r.res!=='bad',r.res==='typo',given,it);
  keepCur(s.i+1);
  showFeedback();
}
/* only the first attempt at an item within a session counts for intervals and statistics */
function grade(it,ok,typo,given,shown){
  const s=session,first=!s.tried.has(it.id);s.tried.add(it.id);
  if(!ok){s.again[it.id]=(s.again[it.id]||0)+1;if(s.again[it.id]<=2)s.q.push(it.id)}
  if(!first)return;
  ok?s.right++:s.wrong++;if(typo)s.typos++;
  const t=dayKey(),rec=S.items[it.id]||(S.items[it.id]={b:0,d:t,r:0,w:0}),wasDue=rec.d<=t||!(rec.r+rec.w);
  if(ok){rec.r++;if(wasDue){rec.b=Math.min(rec.b+1,IV.length-1);rec.d=addDays(IV[rec.b])}}
  else{rec.w++;rec.b=0;rec.d=addDays(1);S.log.push({id:(shown||it).id,g:String(given||'').slice(0,120),at:t});if(S.log.length>150)S.log=S.log.slice(-150)}
  const d=dayRec();d.n++;if(ok)d.ok++;d.sec+=Math.min(90,Math.round((Date.now()-s.state.shown)/1000));
  if(d.n===S.goal)tip('Дневная цель выполнена: '+S.goal+' ответов.',4000);
  s.state.rec={first:true};save();
}
function showFeedback(){
  const s=session,st=s.state,it=st.it,r=st.r,u=UNIT(it.u);
  document.querySelectorAll('.opt,.tile,#ans').forEach(e=>e.disabled=true);
  if(st.mode==='mc')document.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;if(i===it.c)b.classList.add('right');else if(i===st.pick)b.classList.add('wrong')});
  const rule=u.rules[it.rule],why=rule?(rule[S.lang]||rule.ru):'';
  const full=(it.t==='mc'||it.t==='gap')&&it.q.includes('___')?fillBlank(it.q,it.ans[0]):twrap(it.ans[0]);
  const plain=(it.t==='mc'||it.t==='gap')&&it.q.includes('___')?it.q.replace('___',it.ans[0]===NOART?'':it.ans[0]).replace(/\s*\([^)]*\)\s*$/,'').replace(/\s+/g,' '):it.ans[0];
  const f=$('#foot');f.className='foot '+r.res;
  let h=`<div class="wrap"><div class="verdict">${r.res==='ok'?'Верно':r.res==='typo'?'Верно, но есть помарка':'Неверно'}</div>`;
  if(r.res==='typo')h+=`<div class="small">Ты написал <b>${esc(r.got)}</b>, правильно — <b>${esc(r.want)}</b>.</div>`;
  if(r.res==='bad'&&st.mode!=='mc'&&String(st.given||'').trim())h+=`<div class="small">Твой ответ: <span class="wrongtxt">${esc(st.given)}</span></div>`;
  if(r.res!=='ok'||it.t==='dict')h+=`<div class="right">${full}</div>`;
  if(why&&r.res!=='ok')h+=`<div class="why">${esc(why)}</div>`;
  if(r.res==='bad'&&(it.t==='tr'||it.t==='fix'||it.t==='gap')&&st.mode!=='mc')h+=`<button class="linkbtn" id="mine">Мой вариант тоже верный — засчитать</button>`;
  h+=`<button class="btn primary big" id="nextBtn">Дальше</button></div>`;
  f.innerHTML=h;
  $('#nextBtn').onclick=next;
  $('#mine')&&($('#mine').onclick=override);
  if(S.sound&&CAN_SPEAK&&it.t!=='dict'&&it.q!==undefined&&plain&&!/→/.test(plain))speak(plain.replace(/["“”]/g,''));
}
/* the learner says their own translation was also correct: undo the miss */
function override(){
  const s=session,it=s.state.base||s.state.it,rec=S.items[it.id];
  if(s.q[s.q.length-1]===it.id&&s.q.length>s.i+1)s.q.pop();
  if(s.state.rec&&rec){const li=S.log.length-1;if(li>=0&&S.log[li].id===s.state.it.id)S.log.pop();s.wrong--;s.right++;rec.w=Math.max(0,rec.w-1);rec.r++;rec.b=1;rec.d=addDays(IV[1]);dayRec().ok++;save()}
  keepCur(s.i+1);
  s.state.r={res:'ok'};const f=$('#foot');f.className='foot ok';f.querySelector('.verdict').textContent='Засчитано';$('#mine').remove();
}
/* a double tap on «Дальше» must not skip a question */
function next(){const st=session.state;if(!st||st.left)return;st.left=true;session.i++;render();scrollTo(0,0)}

function renderSummary(){
  const s=session,n=s.right+s.wrong,mins=Math.max(1,Math.round((Date.now()-s.t0)/60000));
  let extra='';
  if(s.kind==='step'){
    const u=UNIT(s.unit),before=stepsDone(u);
    const passed=!n||s.right/n>=STEP_PASS;
    if(passed&&s.step+1>before){S.steps[u.id]=s.step+1}
    if(S.curs&&S.curs[u.id]&&S.curs[u.id].step===s.step)delete S.curs[u.id];
    saveNow();
    const nextU=nextInLevel(u);
    extra=!passed?`<div><b>Шаг не засчитан.</b> Нужно хотя бы ${Math.round(STEP_PASS*100)}% верных с первой попытки. Перечитай теорию и пройди шаг ещё раз.</div>`:unitDone(u)?(before<u.steps.length?`<div>Тема «${esc(u.en)}» пройдена.${nextU?' Открыта следующая: «'+esc(nextU.en)+'».':''}</div>`:'')
      :`<div>Шаг ${s.step+1} пройден. Впереди шаг ${s.step+2}.</div>`;
  }else saveNow();
  $('#view').innerHTML=`<div class="panel" style="text-align:center;padding:26px 16px"><div class="task">Готово</div>
    <div style="font-size:44px;font-weight:800;letter-spacing:-.02em">${n?Math.round(100*s.right/n):0}%</div>
    <div class="muted">верно с первой попытки: ${s.right} из ${n}${s.typos?' · помарок: '+s.typos:''} · ${mins} мин</div>${extra}
    <div class="small muted">${s.wrong?'Задания с ошибками вернутся в повторении уже завтра.':'Эти задания вернутся в повторении через день, потом через три, через неделю.'}</div></div>
    <button class="btn primary big" id="doneBtn">Продолжить</button>`;
  $('#doneBtn').onclick=()=>{const k=s.kind,u=s.unit;session=null;k==='step'?go('unit',u):go('review')};
}

render();
</script>
</body></html>

<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Грамматика</title>
<style>
/* Layout: one-column trainer — sticky top bar, fixed bottom tab bar, bottom feedback sheet during a session */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#181B22; --muted:#5F6676; --line:#E1E5EB;
  --accent:#0D7A6B; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC;
  --warn:#8A5A00; --warn-soft:#FFEDB9; --danger:#B93D29; --danger-soft:#FBE3DE; --good:#2F8A3B; --good-soft:#DDF3E0;
  --shadow:rgba(16,20,28,.14);
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h:60px; --r:14px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
:root.emb{--sat:0px; --sab:0px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --ink:#E8EAEF; --muted:#9AA1AE; --line:#2A2E36;
  --accent:#3CC4AE; --accent-ink:#04211C; --accent-soft:#163631;
  --warn:#FFD25E; --warn-soft:#3A3013; --danger:#F0806B; --danger-soft:#3B1E19; --good:#6CCB78; --good-soft:#17321B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --ink:#E8EAEF; --muted:#9AA1AE; --line:#2A2E36;
  --accent:#3CC4AE; --accent-ink:#04211C; --accent-soft:#163631;
  --warn:#FFD25E; --warn-soft:#3A3013; --danger:#F0806B; --danger-soft:#3B1E19; --good:#6CCB78; --good-soft:#17321B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:var(--sat)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:54px;padding-block:6px}
header.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding-bottom:calc(var(--nav-h) + var(--sab) + 24px)}
body.in-session main{padding-bottom:calc(var(--sab) + 240px)}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative;min-width:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;text-align:center}
body.in-session nav.tabs{display:none}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:14px 18px;font-size:16px;border-radius:12px;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:16px;font-weight:800}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.gray{background:var(--line);color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}

/* course map */
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.hero .pct{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.hero .bar{grid-column:1/-1}
.sec-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px -4px}
.unit{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.unit .num{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.unit.done .num{background:var(--accent);color:var(--accent-ink)}
.unit.locked{opacity:.55}
.unit.locked .num{background:var(--line);color:var(--muted)}
.unit .tt{font-weight:700;overflow-wrap:anywhere}
.unit .sub{font-size:12.5px;color:var(--muted)}
.unit .dots{display:flex;gap:4px}
.unit .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.unit .dots i.on{background:var(--accent)}
.soon{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px}

/* theory */
.theory{font-size:15.5px}
.theory p{margin:0 0 10px}
.theory table{border-collapse:collapse;width:100%;margin:4px 0 12px;font-size:15px}
.theory td,.theory th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.theory th{background:var(--bg);font-size:12.5px;color:var(--muted);font-weight:700}
.theory ul{margin:0 0 10px;padding-left:20px}
.theory li{margin:3px 0}
.en{font-family:var(--f-read);font-weight:600;color:var(--ink);border-bottom:1px dotted var(--muted);cursor:pointer}
.theory .bad{text-decoration:line-through;color:var(--danger);font-family:var(--f-read)}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.step{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}

/* session */
.sess-top{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.task{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q{font-family:var(--f-read);font-size:23px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.q .blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--accent);margin:0 2px;height:1.1em;vertical-align:baseline}
.q .wrong{color:var(--danger)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:17px;font-family:var(--f-read);font-weight:600;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:18px;font-family:var(--f-read)}
.inp:focus{outline:none;border-color:var(--accent)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tiles.line{min-height:54px;border-bottom:2px solid var(--line);padding-bottom:8px;align-content:flex-start}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:17px;font-family:var(--f-read);font-weight:600}
.tile.used{visibility:hidden}
.say{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:6px auto}
.say svg{width:34px;height:34px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.foot .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.foot.ok{background:var(--good-soft);border-color:transparent}
.foot.typo{background:var(--warn-soft);border-color:transparent}
.foot.bad{background:var(--danger-soft);border-color:transparent}
.verdict{font-weight:800;font-size:17px}
.foot.ok .verdict{color:var(--good)} .foot.typo .verdict{color:var(--warn)} .foot.bad .verdict{color:var(--danger)}
.right{font-family:var(--f-read);font-size:17px;font-weight:600}
.right b{color:var(--accent)}
.why{font-size:13.5px}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;align-self:flex-start}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px}
.days i{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.days i.zero{background:var(--line)}
.dlab{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center}
.urow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.urow .bar{grid-column:1/-1}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
</style>
</head><body>
<header class="top"><div class="wrap"><button class="icon-btn" id="backBtn" hidden aria-label="Назад"></button><h1 id="title">Грамматика</h1><div class="row" id="topActions"></div></div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabs" aria-label="Разделы"><div class="in">
  <button data-go="course"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg>Курс</button>
  <button data-go="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></svg>Повторение<span class="badge" id="dueBadge" hidden></span></button>
  <button data-go="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Статистика</button>
  <button data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Настройки</button>
</div></nav>

<script>
"use strict";
/* ================= course content (original material) =================
   item forms:
   ['mc',  question with ___, [options], correctIndex, rule]
   ['gap', question with ___, 'answer|alternative', rule]      ('gap!' = spelling is the point: no typo forgiveness)
   ['build', russian, 'answer|alternative word order', rule, [extra tiles]]
   ['tr',  russian, 'answer|alternative', rule]
   ['fix', wrong sentence, 'corrected|alternative', rule]
   ['dict', sentence to type by ear, rule]
   Item ids are unit id + position, so add new items only at the END of a unit. */
const SECTIONS=[
{ru:'Настоящее время',en:'Present',units:[
{id:'be1',ru:'am / is / are',en:'am / is / are',
 th:{ru:`<p>Глагол <b>to be</b> («быть, являться, находиться») в настоящем времени имеет три формы.</p>
<table><tr><th>Кто</th><th>Форма</th><th>Коротко</th></tr>
<tr><td>I</td><td><span class="en">I am</span></td><td>I'm</td></tr>
<tr><td>he / she / it</td><td><span class="en">she is</span></td><td>he's, she's, it's</td></tr>
<tr><td>we / you / they</td><td><span class="en">they are</span></td><td>we're, you're, they're</td></tr></table>
<p>По-русски мы говорим «Я студент», «Она дома» — без глагола. В английском предложении глагол обязателен:</p>
<ul><li><span class="en">I am a student.</span> — Я студент.</li><li><span class="en">She is at home.</span> — Она дома.</li><li><span class="en">My friends are from Kazan.</span> — Мои друзья из Казани.</li></ul>
<p>Одно существительное (my brother, the car) = he/she/it → <b>is</b>. Несколько (my friends, the books) = they → <b>are</b>.</p>`,
 en:`<p>The verb <b>to be</b> has three present forms.</p>
<table><tr><th>Subject</th><th>Form</th><th>Short</th></tr>
<tr><td>I</td><td><span class="en">I am</span></td><td>I'm</td></tr>
<tr><td>he / she / it</td><td><span class="en">she is</span></td><td>he's, she's, it's</td></tr>
<tr><td>we / you / they</td><td><span class="en">they are</span></td><td>we're, you're, they're</td></tr></table>
<p>Russian drops this verb; English never does:</p>
<ul><li><span class="en">I am a student.</span></li><li><span class="en">She is at home.</span></li><li><span class="en">My friends are from Kazan.</span></li></ul>
<p>One noun (my brother, the car) → <b>is</b>. A plural noun (my friends, the books) → <b>are</b>.</p>`},
 rules:{a:{ru:'I → am; he / she / it → is; we / you / they → are.',en:'I → am; he / she / it → is; we / you / they → are.'},
  b:{ru:'В английском предложении всегда есть глагол: «Она дома» = She is at home.',en:'An English sentence always needs a verb: She is at home.'},
  c:{ru:'Одно существительное = he/she/it → is. Множественное число = they → are.',en:'A singular noun takes is; a plural noun takes are.'}},
 items:[
 ['mc','I ___ a student.',['am','is','are'],0,'a'],
 ['mc','She ___ my sister.',['am','is','are'],1,'a'],
 ['mc','We ___ at work.',['am','is','are'],2,'a'],
 ['mc','My brother ___ a driver.',['am','is','are'],1,'c'],
 ['mc','The books ___ on the table.',['am','is','are'],2,'c'],
 ['gap','It ___ cold today.','is','a'],
 ['gap','You ___ late.','are','a'],
 ['gap','Anna and Tom ___ from Canada.','are','c'],
 ['gap','I ___ tired.','am','a'],
 ['build','Он мой друг.','He is my friend.','b',['are']],
 ['build','Мы дома.','We are at home.','b',['is']],
 ['tr','Я из России.','I am from Russia.','b'],
 ['tr','Они счастливы.','They are happy.','b'],
 ['dict','This is my friend. He is a teacher.','a']]},

{id:'be2',ru:'am / is / are: отрицание и вопрос',en:'am / is / are: negatives and questions',
 th:{ru:`<p><b>Отрицание:</b> после be ставим <b>not</b>.</p>
<ul><li><span class="en">I am not ready.</span> (I'm not)</li><li><span class="en">He is not at home.</span> (isn't)</li><li><span class="en">They are not students.</span> (aren't)</li></ul>
<p>Формы «amn't» не существует — только <b>I'm not</b>.</p>
<p><b>Вопрос:</b> be переходит на первое место, перед подлежащим.</p>
<ul><li><span class="en">Is she at home?</span></li><li><span class="en">Are you ready?</span></li></ul>
<p>Вопросительное слово ставится ещё раньше: <span class="en">Where is my phone?</span> <span class="en">What is your name?</span></p>
<p><b>Краткий ответ</b> повторяет be: <span class="en">Yes, I am.</span> <span class="en">No, he isn't.</span> В ответе «да» сокращать нельзя: <span class="bad">Yes, I'm.</span></p>`,
 en:`<p><b>Negative:</b> put <b>not</b> after be.</p>
<ul><li><span class="en">I am not ready.</span> (I'm not)</li><li><span class="en">He is not at home.</span> (isn't)</li><li><span class="en">They are not students.</span> (aren't)</li></ul>
<p><b>Question:</b> be moves in front of the subject.</p>
<ul><li><span class="en">Is she at home?</span></li><li><span class="en">Are you ready?</span></li></ul>
<p>A question word goes first: <span class="en">Where is my phone?</span> <span class="en">What is your name?</span></p>
<p><b>Short answers</b> repeat be: <span class="en">Yes, I am.</span> <span class="en">No, he isn't.</span> No short form after yes: <span class="bad">Yes, I'm.</span></p>`},
 rules:{a:{ru:'Отрицание: be + not (isn\'t, aren\'t, I\'m not).',en:'Negative: be + not (isn\'t, aren\'t, I\'m not).'},
  b:{ru:'Вопрос: be встаёт перед подлежащим — Is he…? Are they…?',en:'Question: be goes before the subject — Is he…? Are they…?'},
  c:{ru:'Краткий ответ повторяет ту же форму be: Yes, they are. / No, it isn\'t.',en:'A short answer repeats the same form of be: Yes, they are. / No, it isn\'t.'},
  d:{ru:'Порядок: вопросительное слово + be + подлежащее.',en:'Order: question word + be + subject.'}},
 items:[
 ['mc','He ___ at home now. (not)',["isn't","aren't","am not"],0,'a'],
 ['mc','___ you ready?',['Is','Are','Am'],1,'b'],
 ['mc','___ your mother a doctor?',['Is','Are','Am'],0,'b'],
 ['mc','"Are they students?" — "Yes, they ___."',['is','are','am'],1,'c'],
 ['mc','I ___ hungry. (not)',['am not',"isn't","aren't"],0,'a'],
 ['gap','Where ___ my keys?','are','d'],
 ['gap','What ___ your name?','is','d'],
 ['gap','We ___ late. (not)','are not','a'],
 ['gap','"Is it cold?" — "No, it ___."','is not','c'],
 ['build','Она не учитель.','She is not a teacher.','a',['are']],
 ['build','Ты устал?','Are you tired?','b',['is']],
 ['build','Где твой телефон?','Where is your phone?','d',['are']],
 ['tr','Я не готов.','I am not ready.','a'],
 ['fix','Is your friends at work?','Are your friends at work?','b']]},

{id:'pc1',ru:'Present Continuous: I am doing',en:'Present Continuous: I am doing',
 th:{ru:`<p><b>Present Continuous</b> — действие происходит прямо сейчас. Форма: <b>am / is / are + глагол с -ing</b>.</p>
<ul><li><span class="en">I am working.</span> — Я работаю (сейчас).</li><li><span class="en">She is reading a book.</span></li><li><span class="en">They are playing football.</span></li></ul>
<p>Нужны обе части. <span class="bad">She reading.</span> и <span class="bad">She is read.</span> — ошибки.</p>
<p><b>Как писать -ing:</b></p>
<table><tr><td>обычно</td><td>work → working, read → reading</td></tr>
<tr><td>-e на конце убираем</td><td>make → making, write → writing</td></tr>
<tr><td>краткая гласная + одна согласная: удваиваем</td><td>run → running, sit → sitting, swim → swimming</td></tr></table>
<p>Слова-подсказки: <b>now, at the moment, Look!, Listen!</b></p>`,
 en:`<p><b>Present Continuous</b> is for something happening right now. Form: <b>am / is / are + verb-ing</b>.</p>
<ul><li><span class="en">I am working.</span></li><li><span class="en">She is reading a book.</span></li><li><span class="en">They are playing football.</span></li></ul>
<p>You need both parts. <span class="bad">She reading.</span> and <span class="bad">She is read.</span> are wrong.</p>
<p><b>Spelling of -ing:</b></p>
<table><tr><td>usually</td><td>work → working, read → reading</td></tr>
<tr><td>drop final -e</td><td>make → making, write → writing</td></tr>
<tr><td>short vowel + one consonant: double it</td><td>run → running, sit → sitting, swim → swimming</td></tr></table>
<p>Signal words: <b>now, at the moment, Look!, Listen!</b></p>`},
 rules:{a:{ru:'am / is / are + глагол с -ing. Обе части обязательны.',en:'am / is / are + verb-ing. Both parts are required.'},

{id:'pc2',ru:'Present Continuous: отрицание и вопрос',en:'Present Continuous: negatives and questions',
 th:{ru:`<p><b>Отрицание:</b> not после be.</p>
<ul><li><span class="en">I'm not working today.</span></li><li><span class="en">He isn't sleeping.</span></li><li><span class="en">We aren't watching TV.</span></li></ul>
<p><b>Вопрос:</b> be перед подлежащим.</p>
<ul><li><span class="en">Are you listening?</span></li><li><span class="en">Is it raining?</span></li></ul>
<p>С вопросительным словом: <b>слово + be + подлежащее + -ing</b>.</p>
<ul><li><span class="en">What are you doing?</span></li><li><span class="en">Where is she going?</span></li></ul>
<p>Типичная ошибка — русский порядок слов: <span class="bad">What you are doing?</span></p>
<p>Здесь не нужны do / does: <span class="bad">Do you listening?</span></p>`,
 en:`<p><b>Negative:</b> not after be.</p>
<ul><li><span class="en">I'm not working today.</span></li><li><span class="en">He isn't sleeping.</span></li><li><span class="en">We aren't watching TV.</span></li></ul>
<p><b>Question:</b> be before the subject.</p>
<ul><li><span class="en">Are you listening?</span></li><li><span class="en">Is it raining?</span></li></ul>
<p>With a question word: <b>word + be + subject + -ing</b>.</p>
<ul><li><span class="en">What are you doing?</span></li><li><span class="en">Where is she going?</span></li></ul>
<p>Common mistake: <span class="bad">What you are doing?</span> And no do / does here: <span class="bad">Do you listening?</span></p>`},

{id:'ps1',ru:'Present Simple: I do / he does',en:'Present Simple: I do / he does',
 th:{ru:`<p><b>Present Simple</b> — привычки, регулярные действия, факты. Не «сейчас», а «вообще».</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I work</span></td><td><span class="en">he works</span></td></tr>
<tr><td><span class="en">they live</span></td><td><span class="en">she lives</span></td></tr></table>
<p>Для he / she / it к глаголу добавляется <b>-s</b>. Это самая частая ошибка русскоязычных.</p>
<table><tr><td>после -s, -sh, -ch, -x, -o → -es</td><td>watch → watches, go → goes, do → does</td></tr>
<tr><td>согласная + y → -ies</td><td>study → studies (но play → plays)</td></tr>
<tr><td>особая форма</td><td>have → has</td></tr></table>
<p>Слова <b>always, usually, often, sometimes, never</b> стоят перед глаголом: <span class="en">She often reads.</span> <span class="en">I never drink coffee.</span> Но после be: <span class="en">He is always late.</span></p>`,
 en:`<p><b>Present Simple</b> is for habits, repeated actions and facts — things that are true in general.</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I work</span></td><td><span class="en">he works</span></td></tr>
<tr><td><span class="en">they live</span></td><td><span class="en">she lives</span></td></tr></table>
<p>After he / she / it the verb takes <b>-s</b>.</p>
<table><tr><td>after -s, -sh, -ch, -x, -o → -es</td><td>watch → watches, go → goes, do → does</td></tr>
<tr><td>consonant + y → -ies</td><td>study → studies (but play → plays)</td></tr>
<tr><td>irregular</td><td>have → has</td></tr></table>
<p><b>always, usually, often, sometimes, never</b> go before the verb: <span class="en">She often reads.</span> <span class="en">I never drink coffee.</span> But after be: <span class="en">He is always late.</span></p>`},
 rules:{a:{ru:'he / she / it → глагол + -s. I / you / we / they → без окончания.',en:'he / she / it → verb + -s. I / you / we / they → no ending.'},
  b:{ru:'-es после s / sh / ch / x / o; согласная + y → -ies; have → has.',en:'-es after s / sh / ch / x / o; consonant + y → -ies; have → has.'},
  c:{ru:'always / usually / often / never стоят перед основным глаголом.',en:'always / usually / often / never go before the main verb.'},
  d:{ru:'Привычка или факт → Present Simple.',en:'A habit or a fact → Present Simple.'}},

{id:'ps2',ru:"Present Simple: I don't / he doesn't",en:"Present Simple: I don't / he doesn't",
 th:{ru:`<p>Отрицание в Present Simple строится с помощью <b>do not / does not</b>.</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I don't work</span></td><td><span class="en">he doesn't work</span></td></tr>
<tr><td><span class="en">they don't know</span></td><td><span class="en">she doesn't know</span></td></tr></table>
<p>После <b>doesn't</b> глагол стоит без -s: окончание уже «ушло» в does.</p>
<ul><li><span class="en">She likes tea.</span> → <span class="en">She doesn't like tea.</span></li><li><span class="bad">She doesn't likes tea.</span></li></ul>
<p>Не путай с be: <span class="en">I'm not tired.</span> (прилагательное) — <span class="en">I don't work.</span> (глагол).</p>`,
 en:`<p>The Present Simple negative uses <b>do not / does not</b>.</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I don't work</span></td><td><span class="en">he doesn't work</span></td></tr>
<tr><td><span class="en">they don't know</span></td><td><span class="en">she doesn't know</span></td></tr></table>
<p>After <b>doesn't</b> the verb has no -s: the ending is already in does.</p>
<ul><li><span class="en">She likes tea.</span> → <span class="en">She doesn't like tea.</span></li><li><span class="bad">She doesn't likes tea.</span></li></ul>
<p>Don't mix it up with be: <span class="en">I'm not tired.</span> (adjective) — <span class="en">I don't work.</span> (verb).</p>`},
 rules:{a:{ru:"I / you / we / they → don't + глагол.",en:"I / you / we / they → don't + verb."},
  b:{ru:"he / she / it → doesn't + глагол.",en:"he / she / it → doesn't + verb."},
  c:{ru:"После doesn't глагол без -s: doesn't like, doesn't have.",en:"No -s after doesn't: doesn't like, doesn't have."}},

{id:'ps3',ru:'Present Simple: Do you…? Does he…?',en:'Present Simple: Do you…? Does he…?',
 th:{ru:`<p>Вопрос в Present Simple начинается с <b>do / does</b>.</p>
<table><tr><th>do</th><th>I / you / we / they</th><td><span class="en">Do you work?</span></td></tr>
<tr><th>does</th><th>he / she / it</th><td><span class="en">Does she work?</span></td></tr></table>
<p>После does глагол без -s: <span class="bad">Does she works?</span></p>
<p>Порядок слов всегда один: <b>(вопросительное слово) + do / does + подлежащее + глагол</b>.</p>
<ul><li><span class="en">Where do you live?</span></li><li><span class="en">What time does the film start?</span></li><li><span class="en">How often do they play?</span></li></ul>
<p>По-русски можно спросить «Где ты живёшь?» без вспомогательного слова, по-английски нельзя: <span class="bad">Where you live?</span></p>
<p>Краткий ответ: <span class="en">Yes, I do.</span> <span class="en">No, she doesn't.</span></p>`,
 en:`<p>A Present Simple question starts with <b>do / does</b>.</p>
<table><tr><th>do</th><th>I / you / we / they</th><td><span class="en">Do you work?</span></td></tr>
<tr><th>does</th><th>he / she / it</th><td><span class="en">Does she work?</span></td></tr></table>
<p>No -s after does: <span class="bad">Does she works?</span></p>
<p>Word order: <b>(question word) + do / does + subject + verb</b>.</p>
<ul><li><span class="en">Where do you live?</span></li><li><span class="en">What time does the film start?</span></li><li><span class="en">How often do they play?</span></li></ul>
<p>You cannot leave out do: <span class="bad">Where you live?</span></p>
<p>Short answers: <span class="en">Yes, I do.</span> <span class="en">No, she doesn't.</span></p>`},
 rules:{a:{ru:'Do → I / you / we / they. Does → he / she / it.',en:'Do → I / you / we / they. Does → he / she / it.'},
  b:{ru:'После does глагол без -s: Does she work?',en:'No -s after does: Does she work?'},

{id:'pcps',ru:'Continuous или Simple?',en:'Continuous or Simple?',
 th:{ru:`<p>Главный вопрос: действие идёт <b>сейчас</b> или происходит <b>вообще, регулярно</b>?</p>
<table><tr><th>Present Continuous</th><th>Present Simple</th></tr>
<tr><td>сейчас, в данный момент, временно</td><td>обычно, всегда, факт</td></tr>
<tr><td><span class="en">I'm working now.</span></td><td><span class="en">I work every day.</span></td></tr>
<tr><td><span class="en">Look! It's snowing.</span></td><td><span class="en">It often snows in winter.</span></td></tr>
<tr><td>now, at the moment, today, Look!</td><td>always, usually, often, never, every day</td></tr></table>
<p><b>Глаголы состояния</b> обычно не употребляются в Continuous, даже если речь о «сейчас»: like, love, hate, want, need, know, understand, believe, remember, prefer, mean.</p>
<ul><li><span class="en">I want a coffee now.</span> <span class="bad">I'm wanting</span></li><li><span class="en">I don't understand.</span> <span class="bad">I'm not understanding</span></li></ul>`,
 en:`<p>The key question: is it happening <b>now</b>, or is it true <b>in general</b>?</p>
<table><tr><th>Present Continuous</th><th>Present Simple</th></tr>
<tr><td>now, at this moment, temporary</td><td>usually, always, a fact</td></tr>
<tr><td><span class="en">I'm working now.</span></td><td><span class="en">I work every day.</span></td></tr>
<tr><td><span class="en">Look! It's snowing.</span></td><td><span class="en">It often snows in winter.</span></td></tr>
<tr><td>now, at the moment, today, Look!</td><td>always, usually, often, never, every day</td></tr></table>
<p><b>State verbs</b> are not normally used in the Continuous, even for «now»: like, love, hate, want, need, know, understand, believe, remember, prefer, mean.</p>
<ul><li><span class="en">I want a coffee now.</span> <span class="bad">I'm wanting</span></li><li><span class="en">I don't understand.</span> <span class="bad">I'm not understanding</span></li></ul>`},
 rules:{a:{ru:'now / at the moment / today / Look! → действие сейчас → Continuous.',en:'now / at the moment / today / Look! → happening now → Continuous.'},
  b:{ru:'every day / usually / often / never → привычка → Simple.',en:'every day / usually / often / never → habit → Simple.'},

{id:'hgot',ru:'have got / has got',en:'have got / has got',
 th:{ru:`<p><b>have got</b> = «иметь», «у меня есть».</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I have got a car.</span> (I've got)</td><td><span class="en">She has got a car.</span> (she's got)</td></tr>
<tr><td><span class="en">We haven't got time.</span></td><td><span class="en">He hasn't got time.</span></td></tr>
<tr><td><span class="en">Have you got a pen?</span></td><td><span class="en">Has she got a pen?</span></td></tr></table>
<p>То же самое можно сказать просто с <b>have</b>, но тогда вопрос и отрицание строятся через do / does:</p>
<ul><li><span class="en">I have a car.</span></li><li><span class="en">Do you have a car?</span></li><li><span class="en">She doesn't have a car.</span></li></ul>
<p>Смешивать два способа нельзя: <span class="bad">Do you have got a pen?</span></p>`,
 en:`<p><b>have got</b> means «to have, to own».</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I have got a car.</span> (I've got)</td><td><span class="en">She has got a car.</span> (she's got)</td></tr>
<tr><td><span class="en">We haven't got time.</span></td><td><span class="en">He hasn't got time.</span></td></tr>
<tr><td><span class="en">Have you got a pen?</span></td><td><span class="en">Has she got a pen?</span></td></tr></table>
<p>You can say the same with plain <b>have</b>, but then questions and negatives use do / does:</p>
<ul><li><span class="en">I have a car.</span></li><li><span class="en">Do you have a car?</span></li><li><span class="en">She doesn't have a car.</span></li></ul>
<p>Don't mix the two patterns: <span class="bad">Do you have got a pen?</span></p>`},
 rules:{a:{ru:'I / you / we / they have got; he / she / it has got.',en:'I / you / we / they have got; he / she / it has got.'},
  b:{ru:'Отрицание: haven\'t / hasn\'t got. Вопрос: Have / Has + подлежащее + got?',en:'Negative: haven\'t / hasn\'t got. Question: Have / Has + subject + got?'},

{ru:'Прошедшее время',en:'Past',units:[
{id:'was',ru:'was / were',en:'was / were',
 th:{ru:`<p><b>was / were</b> — прошедшее время глагола be: «был, была, были».</p>
<table><tr><th>I / he / she / it</th><th>we / you / they</th></tr>
<tr><td><span class="en">I was at home.</span></td><td><span class="en">We were at home.</span></td></tr>
<tr><td><span class="en">She wasn't late.</span></td><td><span class="en">They weren't late.</span></td></tr>
<tr><td><span class="en">Was he there?</span></td><td><span class="en">Were you there?</span></td></tr></table>

function dayKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* ================= answer checking ================= */
function canon(s){
  s=String(s).toLowerCase().replace(/[’‘`ʼ]/g,"'").replace(/[.,!?;:"“”«»()—–-]+/g,' ');
  s=s.replace(/\b(do|does|did|is|are|was|were|have|has)nt\b/g,'$1 not').replace(/\bim\b/g,'i am');
  s=s.replace(/\bcan't\b/g,'cannot').replace(/\bcan not\b/g,'cannot').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not')
     .replace(/\bi'm\b/g,'i am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will')
     .replace(/\b(he|she|it|that|there|what|where|who|how|here|when|why)'s got\b/g,'$1 has got')
     .replace(/\b(he|she|it|that|there|what|where|who|how|here|when|why)'s\b/g,'$1 is');
  return s.replace(/\s+/g,' ').trim();
}
const AUX=new Set(['am','is','are','not','do','does','did','was','were','have','has']);
const VOCAB=new Set();
ITEMS.forEach(it=>{[...(it.ans||[]),...(it.o||[]),...(it.extra||[]),(it.t==='tr'||it.t==='build')?'':it.q||''].forEach(x=>canon(x).split(' ').forEach(w=>w&&VOCAB.add(w)))});
/* one-character slip: returns the position of the difference, or -1 */
function slip(a,b){
  if(a===b)return -1;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return -1;
  let i=0;while(i<la&&i<lb&&a[i]===b[i])i++;
  if(la===lb){if(a.slice(i+1)===b.slice(i+1))return i;if(a[i]===b[i+1]&&a[i+1]===b[i]&&a.slice(i+2)===b.slice(i+2))return i;return -1}
  return (la<lb?a.slice(i)===b.slice(i+1):a.slice(i+1)===b.slice(i))?i:-1;
}
/* → {res:'ok'|'typo'|'bad', want, got}  A slip is forgiven only when it cannot be the grammar itself:
   the word is 4+ letters, the typed word is not another real word of the course (play / plays),
   and the difference is not inside an -s / -ed / -ing ending. */
function check(user,answers,strict){
  const u=canon(user);if(!u)return {res:'bad'};
  for(const a of answers)if(canon(a)===u)return {res:'ok'};
  if(!strict)for(const a of answers){
    const A=canon(a).split(' '),U=u.split(' ');if(A.length!==U.length)continue;
    let diff=-1,many=false;for(let i=0;i<A.length;i++)if(A[i]!==U[i]){if(diff>=0){many=true;break}diff=i}
    if(many||diff<0)continue;
    const w=A[diff],g=U[diff],p=slip(g,w);
    if(p<0||w.length<4||VOCAB.has(g))continue;
    if(/(s|ed|ing)$/.test(w)&&p>=w.length-3)continue;
    return {res:'typo',want:w,got:g};
  }
  return {res:'bad'};
}

    sec.units.forEach(u=>{
      const d=stepsDone(u),open=unlocked(u),m=unitMastered(u);
      const sub=!open?'Откроется после предыдущей темы':m?'Освоено':unitDone(u)?'Пройдено · закрепляется в повторении':d?`Шаг ${d} из ${u.steps.length} пройден`:'Теория и '+u.list.length+' '+plural(u.list.length,'задание','задания','заданий');
      h+=`<button class="unit ${unitDone(u)?'done':''} ${open?'':'locked'}" data-u="${u.id}" ${open?'':'disabled'}>
        <span class="num">${unitDone(u)?'✓':u.n}</span><span><span class="tt">${esc(u.ru)}</span><br><span class="sub">${sub}</span></span>
        <span class="dots">${u.steps.map((_,i)=>`<i class="${i<d?'on':''}"></i>`).join('')}</span></button>`;
    });
  });
  h+=`<div class="sec-title">Дальше в курсе</div><div class="soon">${SOON.map(esc).join(' · ')}<br><br>Эти темы добавятся следующими — движок уже готов, нужен только материал.</div>`;
  $('#view').innerHTML=h;
  $('#revBtn')&&($('#revBtn').onclick=startReview);
  document.querySelectorAll('.unit[data-u]').forEach(b=>b.onclick=()=>go('unit',b.dataset.u));
}

function renderUnit(){
  const u=UNIT(view.arg);$('#title').textContent=u.n+'. '+u.ru;
  const d=stepsDone(u);
  let h=`<div class="row" style="justify-content:space-between"><span class="task">Теория</span>
    <span class="seg" role="group" aria-label="Язык теории"><button data-l="ru" aria-pressed="${S.lang==='ru'}">Русский</button><button data-l="en" aria-pressed="${S.lang==='en'}">English</button></span></div>
    <div class="panel theory">${u.th[S.lang]||u.th.ru}<div class="small muted">Нажми на английский пример, чтобы услышать его.</div></div>
    <span class="task">Практика</span>`;
  u.steps.forEach((ids,i)=>{
    const done=i<d,open=i<=d;
    h+=`<div class="panel step"><div><b>Шаг ${i+1}. ${i===0?'Узнаём форму':'Строим сами'}</b><div class="small muted">${ids.length} ${plural(ids.length,'задание','задания','заданий')}${done?' · пройден':''}</div></div>
      <button class="btn ${done?'':'primary'}" data-step="${i}" ${open?'':'disabled'}>${done?'Ещё раз':open?'Начать':'Закрыт'}</button></div>`;
  });
  $('#view').innerHTML=h;
  document.querySelectorAll('.seg [data-l]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();render()});
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>startSession({kind:'step',unit:u.id,step:+b.dataset.step,q:u.steps[+b.dataset.step]}));
}

function renderReview(){
  $('#title').textContent='Повторение';
  const due=dueIds(),seen=Object.keys(S.items).filter(id=>ITEMS.has(id)),tm=addDays(1);
  const tomorrow=seen.filter(id=>S.items[id].d===tm).length;
  let h='';
  if(!seen.length)h=`<div class="panel"><h2>Пока нечего повторять</h2><div class="muted">Пройди первый шаг любой темы. Каждое задание потом вернётся сюда через день, три дня, неделю и дальше — так правило переходит в долгую память.</div><button class="btn primary" id="toCourse">К курсу</button></div>`;
  else{
    h=due.length?`<div class="panel"><h2>Сегодня: ${due.length} ${plural(due.length,'задание','задания','заданий')}</h2><div class="muted">Темы идут вперемешку. Там, где раньше был выбор из вариантов, теперь нужно вписать ответ самому.</div><button class="btn primary big" id="revBtn">Начать${due.length>15?' (первые 15)':''}</button></div>`
      :`<div class="panel"><h2>На сегодня всё повторено</h2><div class="muted">Завтра вернётся: ${tomorrow}. Можно потренироваться дополнительно — на интервалы это не повлияет, но ошибки вернут задание в очередь.</div><button class="btn big" id="extraBtn">Смешанная практика: 10 заданий</button></div>`;
    const boxes=[0,0,0];seen.forEach(id=>{const b=S.items[id].b;boxes[b<=1?0:b<MASTER?1:2]++});
    h+=`<div class="grid2"><div class="stat"><div class="v">${boxes[0]}</div><div class="l">новые и сложные</div></div><div class="stat"><div class="v">${boxes[1]}</div><div class="l">закрепляются</div></div>
      <div class="stat"><div class="v">${boxes[2]}</div><div class="l">освоены</div></div><div class="stat"><div class="v">${ITEMS.size-seen.length}</div><div class="l">ещё не встречались</div></div></div>`;
  }
  $('#view').innerHTML=h;
  $('#toCourse')&&($('#toCourse').onclick=()=>go('course'));
  $('#revBtn')&&($('#revBtn').onclick=startReview);
  $('#extraBtn')&&($('#extraBtn').onclick=startExtra);
}

function renderStats(){
  $('#title').textContent='Статистика';
  let n=0,ok=0,sec=0;Object.values(S.days).forEach(d=>{n+=d.n||0;ok+=d.ok||0;sec+=d.sec||0});
  const seen=Object.keys(S.items).filter(id=>ITEMS.has(id)),mast=seen.filter(id=>S.items[id].b>=MASTER).length;
  const day=S.days[dayKey()]||{n:0},st=streak(),mins=Math.round(sec/60);
  let h=`<div class="grid2">
    <div class="stat"><div class="v">${coursePct()}%</div><div class="l">курса пройдено · осталось ${100-coursePct()}%</div></div>
    <div class="stat"><div class="v">${st}</div><div class="l">${plural(st,'день','дня','дней')} подряд</div></div>
    <div class="stat"><div class="v">${day.n} / ${S.goal}</div><div class="l">ответов сегодня</div></div>
    <div class="stat"><div class="v">${n?Math.round(100*ok/n)+'%':'—'}</div><div class="l">верных с первой попытки</div></div>
    <div class="stat"><div class="v">${mast} / ${ITEMS.size}</div><div class="l">заданий освоено</div></div>
    <div class="stat"><div class="v">${mins<60?mins+' мин':(mins/60).toFixed(1)+' ч'}</div><div class="l">времени в упражнениях</div></div></div>`;
  const ds=[];for(let i=13;i>=0;i--){const k=addDays(-i);ds.push({k,n:(S.days[k]||{}).n||0})}
  const mx=Math.max(1,...ds.map(d=>d.n));
  h+=`<div class="panel"><h2>Ответы за 14 дней</h2><div class="days">${ds.map(d=>`<i class="${d.n?'':'zero'}" style="height:${d.n?Math.max(6,Math.round(100*d.n/mx)):2}%" title="${d.k}: ${d.n}"></i>`).join('')}</div>
    <div class="dlab">${ds.map(d=>`<span>${+d.k.slice(8)}</span>`).join('')}</div></div>`;
  const rows=UNITS.map(u=>{let r=0,w=0;u.list.forEach(it=>{const x=S.items[it.id];if(x){r+=x.r||0;w+=x.w||0}});return {u,r,w,p:r+w?r/(r+w):null}}).filter(x=>x.p!=null).sort((a,b)=>a.p-b.p);
  h+=`<div class="panel"><h2>Точность по темам</h2>${rows.length?'<div class="small muted">Сверху — темы, где ошибок больше всего.</div>'+rows.map(x=>`<div class="urow"><span>${x.u.n}. ${esc(x.u.ru)}</span><b>${Math.round(100*x.p)}%</b><div class="bar"><i style="width:${Math.round(100*x.p)}%"></i></div></div>`).join(''):'<div class="muted">Появится после первых ответов.</div>'}</div>`;
  $('#view').innerHTML=h;
}

function renderSettings(){
  $('#title').textContent='Настройки';
  $('#view').innerHTML=`<div class="panel">
    <div class="field"><span>Язык теории и пояснений</span><span class="seg"><button data-l="ru" aria-pressed="${S.lang==='ru'}">Русский</button><button data-l="en" aria-pressed="${S.lang==='en'}">English</button></span></div>
    <div class="field"><span>Цель на день, ответов</span><select id="goal">${[10,20,30,50].map(g=>`<option ${g===S.goal?'selected':''}>${g}</option>`).join('')}</select></div>
    <div class="field"><span>Озвучивать правильный ответ</span><span class="seg"><button data-s="1" aria-pressed="${!!S.sound}">Да</button><button data-s="0" aria-pressed="${!S.sound}">Нет</button></span></div></div>
    <div class="panel"><h2>Проверка ответов</h2><div class="small muted">Регистр и знаки препинания не учитываются. Сокращения равны полной форме: don't = do not, I'm = I am. Одна опечатка в длинном слове прощается с пометкой, но не там, где одна буква и есть грамматика: play / plays, окончания -s, -ed, -ing.</div></div>
    <div class="panel"><h2>Сброс</h2><div class="small muted">Удаляет весь прогресс грамматики. Слова и тексты Лексики не затрагиваются.</div><button class="btn danger" id="reset">Сбросить прогресс</button></div>`;
  document.querySelectorAll('.seg [data-l]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();render()});
  document.querySelectorAll('.seg [data-s]').forEach(b=>b.onclick=()=>{S.sound=b.dataset.s==='1';save();render()});
  $('#goal').onchange=e=>{S.goal=+e.target.value;save()};
  $('#reset').onclick=e=>{const b=e.currentTarget;if(b.dataset.arm){S.items={};S.steps={};S.days={};saveNow();go('course')}else{b.dataset.arm=1;b.textContent='Нажми ещё раз, чтобы удалить всё'}};
}

/* ================= sessions ================= */
function startSession(o){
  let q=o.q.filter(id=>ITEMS.has(id)&&(CAN_SPEAK||ITEMS.get(id).t!=='dict'));
  if(!q.length)return;
  session=Object.assign({i:0,q,total:q.length,right:0,wrong:0,typos:0,tried:new Set(),again:{},state:null,t0:Date.now()},o,{q});
  render();scrollTo(0,0);
}
function startReview(){const d=dueIds().slice(0,15);if(d.length)startSession({kind:'review',q:shuffle(d)})}
function startExtra(){
  const seen=Object.keys(S.items).filter(id=>ITEMS.has(id));
  const w=shuffle(seen).sort((a,b)=>(S.items[b].w||0)-(S.items[b].r||0)-((S.items[a].w||0)-(S.items[a].r||0)));
  startSession({kind:'extra',q:shuffle(w.slice(0,10))});
}
function proper(w){return w==='I'||/^(I'm|I've|Tom|Anna|London|Russia|English|French|TV|Paris|Moscow|Canada)$/.test(w)}
function fillBlank(q,a){return esc(q.replace(/\s*\([^)]*\)\s*$/,'')).replace('___','<b>'+esc(a)+'</b>')}
const TASK={mc:'Выбери вариант',gap:'Впиши пропущенное',build:'Собери предложение',tr:'Переведи на английский',fix:'Исправь ошибку',dict:'Напиши то, что слышишь'};

function renderSession(){
  const s=session;
  if(s.i>=s.q.length)return renderSummary();
  const it=ITEMS.get(s.q[s.i]),rec=S.items[it.id];
  /* in review, a multiple-choice gap that was already answered right once becomes a typed gap */
  let mode=it.t;if(mode==='mc'&&s.kind!=='step'&&it.q.includes('___')&&rec&&rec.b>=1&&canon(it.ans[0]).split(' ').every(w=>AUX.has(w)))mode='gap';
  s.state={it,mode,shown:Date.now(),pick:null,tiles:null,line:[],done:false};
  let h=`<div class="sess-top"><button class="icon-btn" id="quit" aria-label="Закрыть">${CLOSE}</button><div class="bar"><i style="width:${Math.round(100*s.i/s.q.length)}%"></i></div><span class="small muted">${s.i+1} / ${s.q.length}</span></div>
    <div class="task">${TASK[mode]}${s.kind!=='step'?' · '+esc(UNIT(it.u).ru):''}</div>`;
  const input=`<input class="inp" id="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Ответ по-английски">`;
  if(mode==='mc')h+=`<div class="q">${esc(it.q).replace('___','<span class="blank"></span>')}</div><div class="opts">${shuffle(it.o.map((o,i)=>i)).map(i=>`<button class="opt" data-i="${i}" aria-pressed="false">${esc(it.o[i])}</button>`).join('')}</div>`;
  else if(mode==='gap')h+=`<div class="q">${esc(it.q).replace('___','<span class="blank"></span>')}</div>${input}`;
  else if(mode==='tr')h+=`<div class="q">${esc(it.q)}</div>${input}`;
  else if(mode==='fix')h+=`<div class="q"><span class="wrong">${esc(it.q)}</span></div><div class="small muted">Напиши предложение целиком, уже без ошибки.</div>${input}`;
  else if(mode==='dict')h+=`<button class="say" id="say" aria-label="Прослушать">${SPK}</button><div class="small muted" style="text-align:center">Можно слушать сколько угодно раз.</div>${input}`;
  else if(mode==='build'){
    const words=it.ans[0].replace(/[.?!,]/g,'').split(' ').map((w,i)=>i===0&&!proper(w)?w.toLowerCase():w);
    s.state.tiles=shuffle(words.concat(it.extra));
    h+=`<div class="q">${esc(it.q)}</div><div class="tiles line" id="line"></div><div class="tiles" id="bank">${s.state.tiles.map((w,i)=>`<button class="tile" data-i="${i}">${esc(w)}</button>`).join('')}</div>`;
  }
  h+=`<div class="foot" id="foot"><div class="wrap"><button class="btn primary big" id="checkBtn" disabled>Проверить</button></div></div>`;
  $('#view').innerHTML=h;
  $('#quit').onclick=()=>{saveNow();const k=s.kind,u=s.unit;session=null;k==='step'?go('unit',u):go('review')};
  const cb=$('#checkBtn');cb.onclick=submit;
  if(mode==='mc')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(s.state.done)return;s.state.pick=+b.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));cb.disabled=false});
  if(mode==='build'){
    const paint=()=>{$('#line').innerHTML=s.state.line.map((ti,k)=>`<button class="tile" data-k="${k}">${esc(s.state.tiles[ti])}</button>`).join('');
      document.querySelectorAll('#bank .tile').forEach(b=>b.classList.toggle('used',s.state.line.includes(+b.dataset.i)));cb.disabled=!s.state.line.length;
      document.querySelectorAll('#line .tile').forEach(b=>b.onclick=()=>{if(s.state.done)return;s.state.line.splice(+b.dataset.k,1);paint()})};
    document.querySelectorAll('#bank .tile').forEach(b=>b.onclick=()=>{if(s.state.done)return;s.state.line.push(+b.dataset.i);paint()});paint();
  }
  const inp=$('#ans');
  if(inp){inp.oninput=()=>{cb.disabled=!inp.value.trim()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(s.state.done)next();else if(inp.value.trim())submit()}};if(!('ontouchstart' in window))inp.focus()}
  if(mode==='dict'){$('#say').onclick=()=>speak(it.ans[0]);setTimeout(()=>speak(it.ans[0]),350)}
}

function submit(){
  const s=session,st=s.state,it=st.it;if(st.done)return;
  let r,given='';
  if(st.mode==='mc'){given=it.o[st.pick];r={res:st.pick===it.c?'ok':'bad'}}
  else if(st.mode==='build'){given=st.line.map(i=>st.tiles[i]).join(' ');r=check(given,it.ans,true)}
  else{given=$('#ans').value;r=check(given,it.ans,it.strict)}
  st.done=true;st.given=given;st.r=r;
  grade(it,r.res!=='bad',r.res==='typo');
  showFeedback();
}
/* only the first attempt at an item within a session counts for intervals and statistics */
function grade(it,ok,typo){
  const s=session,first=!s.tried.has(it.id);s.tried.add(it.id);
  if(!ok){s.again[it.id]=(s.again[it.id]||0)+1;if(s.again[it.id]<=2)s.q.push(it.id)}
  if(!first)return;
  ok?s.right++:s.wrong++;if(typo)s.typos++;
  const t=dayKey(),rec=S.items[it.id]||(S.items[it.id]={b:0,d:t,r:0,w:0}),wasDue=rec.d<=t||!(rec.r+rec.w);
  if(ok){rec.r++;if(wasDue){rec.b=Math.min(rec.b+1,IV.length-1);rec.d=addDays(IV[rec.b])}}
  else{rec.w++;rec.b=0;rec.d=addDays(1)}
  const d=dayRec();d.n++;if(ok)d.ok++;d.sec+=Math.min(90,Math.round((Date.now()-s.state.shown)/1000));
  s.state.rec={first:true};save();
}
function showFeedback(){
  const s=session,st=s.state,it=st.it,r=st.r,u=UNIT(it.u);
  document.querySelectorAll('.opt,.tile,#ans').forEach(e=>e.disabled=true);
  const rule=u.rules[it.rule],why=rule?(rule[S.lang]||rule.ru):'';
  const full=(it.t==='mc'||it.t==='gap')&&it.q.includes('___')?fillBlank(it.q,it.ans[0]):esc(it.ans[0]);
  const plain=(it.t==='mc'||it.t==='gap')&&it.q.includes('___')?it.q.replace('___',it.ans[0]).replace(/\s*\([^)]*\)\s*$/,''):it.ans[0];
  const f=$('#foot');f.className='foot '+r.res;
  let h=`<div class="wrap"><div class="verdict">${r.res==='ok'?'Верно':r.res==='typo'?'Верно, но есть помарка':'Неверно'}</div>`;
  if(r.res==='typo')h+=`<div class="small">Ты написал <b>${esc(r.got)}</b>, правильно — <b>${esc(r.want)}</b>.</div>`;
  if(r.res!=='ok'||it.t==='dict')h+=`<div class="right">${full}</div>`;
  if(why&&r.res!=='ok')h+=`<div class="why">${esc(why)}</div>`;
  if(r.res==='bad'&&(it.t==='tr'||it.t==='fix')&&st.mode!=='mc')h+=`<button class="linkbtn" id="mine">Мой вариант тоже верный — засчитать</button>`;
  h+=`<button class="btn primary big" id="nextBtn">Дальше</button></div>`;
  f.innerHTML=h;
  $('#nextBtn').onclick=next;
  $('#mine')&&($('#mine').onclick=override);
  if(S.sound&&CAN_SPEAK&&it.t!=='dict'&&it.q!==undefined&&plain&&!/→/.test(plain))speak(plain.replace(/["“”]/g,''));
}
/* the learner says their own translation was also correct: undo the miss */
function override(){
  const s=session,it=s.state.it,rec=S.items[it.id];
  if(s.q[s.q.length-1]===it.id&&s.q.length>s.i+1)s.q.pop();
  if(s.state.rec&&rec){s.wrong--;s.right++;rec.w=Math.max(0,rec.w-1);rec.r++;rec.b=1;rec.d=addDays(IV[1]);dayRec().ok++;save()}
  s.state.r={res:'ok'};const f=$('#foot');f.className='foot ok';f.querySelector('.verdict').textContent='Засчитано';$('#mine').remove();
}
function next(){session.i++;render();scrollTo(0,0)}

function renderSummary(){
  const s=session,n=s.right+s.wrong,mins=Math.max(1,Math.round((Date.now()-s.t0)/60000));
  let extra='';
  if(s.kind==='step'){
    const u=UNIT(s.unit),before=stepsDone(u);
    if(s.step+1>before){S.steps[u.id]=s.step+1}
    saveNow();
    const nextU=UNITS[u.n];
    extra=unitDone(u)?(before<u.steps.length?`<div>Тема «${esc(u.ru)}» пройдена.${nextU?' Открыта следующая: «'+esc(nextU.ru)+'».':''}</div>`:'')
      :`<div>Шаг ${s.step+1} пройден. Впереди шаг ${s.step+2}.</div>`;
  }else saveNow();
  $('#view').innerHTML=`<div class="panel" style="text-align:center;padding:26px 16px"><div class="task">Готово</div>
    <div style="font-size:44px;font-weight:800;letter-spacing:-.02em">${n?Math.round(100*s.right/n):0}%</div>
    <div class="muted">верно с первой попытки: ${s.right} из ${n}${s.typos?' · помарок: '+s.typos:''} · ${mins} мин</div>${extra}
    <div class="small muted">${s.wrong?'Задания с ошибками вернутся в повторении уже завтра.':'Эти задания вернутся в повторении через день, потом через три, через неделю.'}</div></div>
    <button class="btn primary big" id="doneBtn">Продолжить</button>`;
  $('#doneBtn').onclick=()=>{const k=s.kind,u=s.unit;session=null;k==='step'?go('unit',u):go('review')};
}

render();
</script>
</body></html>

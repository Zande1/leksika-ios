{ru:'Прилагательные и наречия',en:'Adjectives and adverbs',units:[
{id:'comp',ru:'Сравнительная степень: старше, дороже',en:'Comparatives: older, more expensive',
 th:{ru:`<p>Сравниваем два предмета: «больше, чем», «интереснее, чем».</p>
<table><tr><th>короткие слова: + -er</th><th>длинные слова: more + слово</th></tr>
<tr><td>old → <b>older</b>, cheap → <b>cheaper</b></td><td>expensive → <b>more expensive</b></td></tr>
<tr><td>big → <b>bigger</b>, hot → <b>hotter</b> (удвоение)</td><td>interesting → <b>more interesting</b></td></tr>
<tr><td>easy → <b>easier</b>, happy → <b>happier</b> (y → i)</td><td>difficult → <b>more difficult</b></td></tr></table>
<p>Исключения: good → <b>better</b>, bad → <b>worse</b>, far → <b>further</b>.</p>
<p>«Чем» — это <b>than</b>:</p>
<ul><li><span class="en">My brother is older than me.</span></li><li><span class="en">This phone is more expensive than that one.</span></li></ul>
<p>Нельзя использовать оба способа сразу: <span class="bad">more older</span>, <span class="bad">more tall</span>.</p>`,
 en:`<p>We compare two things.</p>
<table><tr><th>short words: + -er</th><th>long words: more + word</th></tr>
<tr><td>old → <b>older</b>, cheap → <b>cheaper</b></td><td>expensive → <b>more expensive</b></td></tr>
<tr><td>big → <b>bigger</b>, hot → <b>hotter</b> (double consonant)</td><td>interesting → <b>more interesting</b></td></tr>
<tr><td>easy → <b>easier</b>, happy → <b>happier</b> (y → i)</td><td>difficult → <b>more difficult</b></td></tr></table>
<p>Irregular: good → <b>better</b>, bad → <b>worse</b>, far → <b>further</b>.</p>
<p>Use <b>than</b> after the comparative:</p>
<ul><li><span class="en">My brother is older than me.</span></li><li><span class="en">This phone is more expensive than that one.</span></li></ul>
<p>Never use both patterns together: <span class="bad">more older</span>, <span class="bad">more tall</span>.</p>`},

  b:{ru:'Длинные слова: more + прилагательное (more expensive).',en:'Long words: more + adjective (more expensive).'},
  c:{ru:'Исключения: good → better, bad → worse.',en:'Irregular: good → better, bad → worse.'},
  d:{ru:'«Чем» = than.',en:'Use than after a comparative.'}},

{id:'sup',ru:'Превосходная степень: самый старый, самый дорогой',en:'Superlatives: the oldest, the most expensive',
 th:{ru:`<p>Выделяем один предмет из всех: «самый».</p>
<table><tr><th>короткие слова: the + -est</th><th>длинные слова: the most + слово</th></tr>
<tr><td>old → <b>the oldest</b></td><td>expensive → <b>the most expensive</b></td></tr>
<tr><td>big → <b>the biggest</b>, hot → <b>the hottest</b></td><td>interesting → <b>the most interesting</b></td></tr>
<tr><td>happy → <b>the happiest</b></td><td>difficult → <b>the most difficult</b></td></tr></table>
<p>Исключения: good → <b>the best</b>, bad → <b>the worst</b>.</p>
<p>Перед превосходной степенью стоит <b>the</b> (но после my, his, her — без the: my best friend). После неё место обозначается через <b>in</b>:</p>
<ul><li><span class="en">It is the tallest building in the city.</span></li><li><span class="en">She is the best student in the class.</span></li><li><span class="en">This is the best film I have ever seen.</span></li></ul>`,
 en:`<p>We pick one thing out of all the others.</p>
<table><tr><th>short words: the + -est</th><th>long words: the most + word</th></tr>
<tr><td>old → <b>the oldest</b></td><td>expensive → <b>the most expensive</b></td></tr>
<tr><td>big → <b>the biggest</b>, hot → <b>the hottest</b></td><td>interesting → <b>the most interesting</b></td></tr>
<tr><td>happy → <b>the happiest</b></td><td>difficult → <b>the most difficult</b></td></tr></table>
<p>Irregular: good → <b>the best</b>, bad → <b>the worst</b>.</p>
<p>A superlative takes <b>the</b> (but not after my, his, her: my best friend). The place after it uses <b>in</b>:</p>
<ul><li><span class="en">It is the tallest building in the city.</span></li><li><span class="en">She is the best student in the class.</span></li><li><span class="en">This is the best film I have ever seen.</span></li></ul>`},

{id:'adv',ru:'Прилагательное или наречие: быстрый или быстро',en:'Adjectives and adverbs: quick / quickly',
 th:{ru:`<p><b>Прилагательное</b> описывает предмет («какой?»), <b>наречие</b> — действие («как?»).</p>
<ul><li><span class="en">She is a careful driver.</span> — какой водитель?</li><li><span class="en">She drives carefully.</span> — как водит?</li></ul>
<p>Наречие обычно = прилагательное + <b>-ly</b>:</p>
<table><tr><td>slow → slowly</td><td>quick → quickly</td><td>beautiful → beautifully</td></tr>
<tr><td>easy → eas<b>ily</b></td><td>happy → happ<b>ily</b></td><td>bad → badly</td></tr></table>
<p>Исключения:</p>
<ul><li>good → <b>well</b>: <span class="en">You speak English well.</span></li><li><b>fast, hard, late, early</b> не меняются: <span class="en">He works hard.</span> <span class="en">She runs fast.</span></li></ul>
<p>После <b>be, look, feel, sound, smell</b> стоит прилагательное, а не наречие: <span class="en">You look happy.</span> <span class="en">It smells good.</span></p>`,
 en:`<p>An <b>adjective</b> describes a thing; an <b>adverb</b> describes an action.</p>
<ul><li><span class="en">She is a careful driver.</span></li><li><span class="en">She drives carefully.</span></li></ul>
<p>An adverb is usually adjective + <b>-ly</b>:</p>
<table><tr><td>slow → slowly</td><td>quick → quickly</td><td>beautiful → beautifully</td></tr>
<tr><td>easy → eas<b>ily</b></td><td>happy → happ<b>ily</b></td><td>bad → badly</td></tr></table>
<p>Irregular:</p>
<ul><li>good → <b>well</b>: <span class="en">You speak English well.</span></li><li><b>fast, hard, late, early</b> do not change: <span class="en">He works hard.</span> <span class="en">She runs fast.</span></li></ul>
<p>After <b>be, look, feel, sound, smell</b> use an adjective, not an adverb: <span class="en">You look happy.</span> <span class="en">It smells good.</span></p>`},
 rules:{a:{ru:'Прилагательное описывает предмет, наречие — действие.',en:'An adjective describes a thing, an adverb describes an action.'},
  b:{ru:'Наречие: + -ly; -y → -ily (easy → easily).',en:'Adverb: + -ly; -y → -ily (easy → easily).'},
  c:{ru:'good → well; fast, hard, late, early не меняются.',en:'good → well; fast, hard, late, early do not change.'},
  d:{ru:'После be, look, feel, sound, smell — прилагательное.',en:'After be, look, feel, sound, smell use an adjective.'}},

{ru:'Вопросы',en:'Questions',units:[
{id:'wh',ru:'Вопросительные слова: кто, что, где, как',en:'Question words: who, what, where, how',
 th:{ru:`<p>Вопросительные слова: <b>who</b> (кто), <b>what</b> (что), <b>where</b> (где, куда), <b>when</b> (когда), <b>why</b> (почему), <b>whose</b> (чей), <b>which</b> (который), <b>how</b> (как).</p>
<p>Обычный порядок: <b>вопросительное слово + вспомогательный глагол + подлежащее + глагол</b>.</p>
<ul><li><span class="en">Where do you live?</span></li><li><span class="en">Why are you late?</span></li><li><span class="en">What did she say?</span></li></ul>
<p><b>Вопрос к подлежащему.</b> Если who или what — это тот, кто действует, do / did не нужны, порядок как в утверждении:</p>
<ul><li><span class="en">Who lives here?</span> <span class="bad">Who does live here?</span></li><li><span class="en">What happened?</span></li><li><span class="en">Who called you?</span> — Кто тебе звонил? Сравни: <span class="en">Who did you call?</span> — Кому ты звонил?</li></ul>
<p>Сочетания с how: <b>how much</b> (сколько, цена), <b>how many</b> (сколько штук), <b>how old</b>, <b>how long</b>, <b>how often</b>.</p>
<p>Предлог уходит в конец: <span class="en">Where are you from?</span> <span class="en">What are you waiting for?</span></p>`,
 en:`<p>Question words: <b>who, what, where, when, why, whose, which, how</b>.</p>
<p>Normal order: <b>question word + auxiliary + subject + verb</b>.</p>
<ul><li><span class="en">Where do you live?</span></li><li><span class="en">Why are you late?</span></li><li><span class="en">What did she say?</span></li></ul>
<p><b>Subject questions.</b> When who or what is the one doing the action, there is no do / did and the order is like a statement:</p>
<ul><li><span class="en">Who lives here?</span> <span class="bad">Who does live here?</span></li><li><span class="en">What happened?</span></li><li><span class="en">Who called you?</span> Compare: <span class="en">Who did you call?</span></li></ul>
<p>With how: <b>how much, how many, how old, how long, how often</b>.</p>
<p>The preposition goes to the end: <span class="en">Where are you from?</span> <span class="en">What are you waiting for?</span></p>`},

  c:{ru:'how much — цена и неисчисляемое; how many — штуки; how old, how long, how often.',en:'how much for price and uncountables; how many for countables; how old, how long, how often.'},
  d:{ru:'Предлог ставится в конец вопроса: Where are you from?',en:'The preposition goes to the end: Where are you from?'}},

{id:'poss',ru:"Чей и какой: 's, this, that, these, those",en:"Possessive 's, this / that / these / those",
 th:{ru:`<p><b>Принадлежность.</b> У людей и животных — имя + <b>'s</b>:</p>
<ul><li><span class="en">Tom's car</span> — машина Тома</li><li><span class="en">my mother's name</span> — имя моей мамы</li><li><span class="en">my parents' house</span> — после множественного -s только апостроф</li></ul>
<p>По-русски порядок обратный («машина Тома»), поэтому частая ошибка — <span class="bad">the car of Tom</span>.</p>
<p>У предметов чаще <b>of</b>: <span class="en">the end of the film</span>, <span class="en">the name of this street</span>.</p>
<p><b>Указательные слова:</b></p>
<table><tr><th></th><th>близко</th><th>далеко</th></tr>
<tr><th>один</th><td><span class="en">this book</span></td><td><span class="en">that book</span></td></tr>
<tr><th>несколько</th><td><span class="en">these books</span></td><td><span class="en">those books</span></td></tr></table>
<p>Число должно совпадать: <span class="bad">this books</span>.</p>`,
 en:`<p><b>Possession.</b> For people and animals use name + <b>'s</b>:</p>
<ul><li><span class="en">Tom's car</span></li><li><span class="en">my mother's name</span></li><li><span class="en">my parents' house</span> — after a plural -s, just the apostrophe</li></ul>
<p>A common mistake: <span class="bad">the car of Tom</span>.</p>
<p>For things we usually use <b>of</b>: <span class="en">the end of the film</span>, <span class="en">the name of this street</span>.</p>
<p><b>Demonstratives:</b></p>
<table><tr><th></th><th>near</th><th>far</th></tr>
<tr><th>one</th><td><span class="en">this book</span></td><td><span class="en">that book</span></td></tr>
<tr><th>several</th><td><span class="en">these books</span></td><td><span class="en">those books</span></td></tr></table>
<p>The number must agree: <span class="bad">this books</span>.</p>`},

{id:'inf',ru:'Инфинитив или -ing: хочу сделать, люблю делать',en:'to do or doing?',
 th:{ru:`<p>Когда два глагола идут подряд, форма второго зависит от первого.</p>
<table><tr><th>+ to + глагол</th><th>+ глагол с -ing</th></tr>
<tr><td>want, need, decide, hope, plan, would like</td><td>enjoy, finish, mind, stop</td></tr>
<tr><td><span class="en">I want to go.</span></td><td><span class="en">I enjoy cooking.</span></td></tr>
<tr><td><span class="en">We decided to stay.</span></td><td><span class="en">Have you finished eating?</span></td></tr>
<tr><td><span class="en">I would like to ask you.</span></td><td><span class="en">It stopped raining.</span></td></tr></table>
<p><b>like, love, hate</b> — обычно с -ing, но to тоже возможно: <span class="en">I like reading.</span> <span class="en">I like to read.</span></p>
<p>После <b>can, must, should, will</b> — глагол без to: <span class="en">You should sleep more.</span></p>
<p>Ошибки: <span class="bad">I want go.</span> <span class="bad">She enjoys to read.</span></p>`,
 en:`<p>When two verbs come together, the form of the second depends on the first.</p>
<table><tr><th>+ to + verb</th><th>+ verb-ing</th></tr>
<tr><td>want, need, decide, hope, plan, would like</td><td>enjoy, finish, mind, stop</td></tr>
<tr><td><span class="en">I want to go.</span></td><td><span class="en">I enjoy cooking.</span></td></tr>
<tr><td><span class="en">We decided to stay.</span></td><td><span class="en">Have you finished eating?</span></td></tr>
<tr><td><span class="en">I would like to ask you.</span></td><td><span class="en">It stopped raining.</span></td></tr></table>
<p><b>like, love, hate</b> usually take -ing, but to is also possible: <span class="en">I like reading.</span> <span class="en">I like to read.</span></p>
<p>After <b>can, must, should, will</b> the verb has no to: <span class="en">You should sleep more.</span></p>
<p>Mistakes: <span class="bad">I want go.</span> <span class="bad">She enjoys to read.</span></p>`},
 rules:{a:{ru:'want, need, decide, hope, plan, would like + to + глагол.',en:'want, need, decide, hope, plan, would like + to + verb.'},
  b:{ru:'enjoy, finish, mind, stop + глагол с -ing.',en:'enjoy, finish, mind, stop + verb-ing.'},
  c:{ru:'like, love, hate — обычно с -ing, возможно и с to.',en:'like, love, hate usually take -ing; to is also possible.'},
  d:{ru:'После can, must, should, will — глагол без to.',en:'After can, must, should, will the verb has no to.'}},

{id:'pass',ru:'Страдательный залог: сделано, построено',en:'Passive: is made, was built',
 th:{ru:`<p><b>Пассив</b> нужен, когда важно само действие или его результат, а не тот, кто это сделал.</p>
<table><tr><th>Настоящее</th><th>Прошедшее</th></tr>
<tr><td>am / is / are + третья форма</td><td>was / were + третья форма</td></tr>
<tr><td><span class="en">This car is made in Germany.</span></td><td><span class="en">The house was built in 1990.</span></td></tr>
<tr><td><span class="en">English is spoken here.</span></td><td><span class="en">The letters were sent yesterday.</span></td></tr></table>
<p>Кто сделал — через <b>by</b>: <span class="en">The book was written by Tolstoy.</span></p>
<p>Отрицание и вопрос — как у be: <span class="en">I wasn't invited.</span> <span class="en">Where are these phones made?</span></p>
<p>Третьи формы из этой темы:</p>
<table><tr><td>make → <b>made</b></td><td>build → <b>built</b></td><td>speak → <b>spoken</b></td></tr>
<tr><td>write → <b>written</b></td><td>send → <b>sent</b></td><td>steal → <b>stolen</b></td></tr>
<tr><td>grow → <b>grown</b></td><td>break → <b>broken</b></td><td>sing → <b>sung</b></td></tr></table>`,
 en:`<p>The <b>passive</b> is used when the action or its result matters more than who did it.</p>
<table><tr><th>Present</th><th>Past</th></tr>
<tr><td>am / is / are + past participle</td><td>was / were + past participle</td></tr>
<tr><td><span class="en">This car is made in Germany.</span></td><td><span class="en">The house was built in 1990.</span></td></tr>
<tr><td><span class="en">English is spoken here.</span></td><td><span class="en">The letters were sent yesterday.</span></td></tr></table>
<p>The doer is added with <b>by</b>: <span class="en">The book was written by Tolstoy.</span></p>
<p>Negatives and questions work like be: <span class="en">I wasn't invited.</span> <span class="en">Where are these phones made?</span></p>
<p>Participles used in this unit:</p>
<table><tr><td>make → <b>made</b></td><td>build → <b>built</b></td><td>speak → <b>spoken</b></td></tr>
<tr><td>write → <b>written</b></td><td>send → <b>sent</b></td><td>steal → <b>stolen</b></td></tr>
<tr><td>grow → <b>grown</b></td><td>break → <b>broken</b></td><td>sing → <b>sung</b></td></tr></table>`},

  b:{ru:'Прошедшее: was / were + третья форма (was built).',en:'Past: was / were + past participle (was built).'},

{id:'if1',ru:'Условные предложения: если и когда',en:'if and when: first conditional',
 th:{ru:`<p>Говорим о реальном будущем: «если будет дождь, мы останемся дома».</p>
<table><tr><th>часть с if / when</th><th>главная часть</th></tr>
<tr><td>настоящее время (Present Simple)</td><td>will + глагол</td></tr>
<tr><td><span class="en">If it rains,</span></td><td><span class="en">we will stay at home.</span></td></tr>
<tr><td><span class="en">When I get home,</span></td><td><span class="en">I will call you.</span></td></tr></table>
<p>По-русски после «если» и «когда» стоит будущее («если <b>будет</b> дождь»), по-английски — настоящее. Это главная ловушка:</p>
<ul><li><span class="bad">If it will rain, …</span></li><li><span class="bad">When I will finish, …</span></li></ul>
<p>Части можно менять местами: <span class="en">We will stay at home if it rains.</span></p>
<p><b>if</b> — может случиться, а может нет. <b>when</b> — случится точно, вопрос только во времени.</p>`,
 en:`<p>We talk about a real possibility in the future.</p>
<table><tr><th>the if / when part</th><th>the main part</th></tr>
<tr><td>Present Simple</td><td>will + verb</td></tr>
<tr><td><span class="en">If it rains,</span></td><td><span class="en">we will stay at home.</span></td></tr>
<tr><td><span class="en">When I get home,</span></td><td><span class="en">I will call you.</span></td></tr></table>
<p>After if and when we use the present, not will:</p>
<ul><li><span class="bad">If it will rain, …</span></li><li><span class="bad">When I will finish, …</span></li></ul>
<p>The two parts can change places: <span class="en">We will stay at home if it rains.</span></p>
<p><b>if</b>: it may or may not happen. <b>when</b>: it will certainly happen.</p>`},
 rules:{a:{ru:'После if и when — настоящее время, даже если речь о будущем.',en:'After if and when use the present, even when talking about the future.'},
  b:{ru:'В главной части — will + глагол.',en:'The main part takes will + verb.'},
  c:{ru:'if — «если» (может не случиться); when — «когда» (случится точно).',en:'if = it may not happen; when = it certainly will.'}},

{lv:'b',ru:'Времена подробнее',en:'Tenses in depth',units:[
{id:'ppc',ru:'Делаю уже какое-то время',en:'Present Perfect Continuous: I have been doing',
 th:{ru:`<p><b>Present Perfect Continuous</b> — действие началось в прошлом и продолжается до сих пор. Форма: <b>have / has been + глагол с -ing</b>.</p>
<ul><li><span class="en">I have been learning English for two years.</span> — Я учу английский уже два года.</li><li><span class="en">It has been raining since morning.</span></li><li><span class="en">How long have you been waiting?</span></li></ul>
<p>По-русски здесь настоящее время («учу», «жду»), поэтому частая ошибка — Present Continuous: <span class="bad">I am learning English for two years.</span> Если сказано, сколько времени длится действие (for, since, how long), нужен Perfect.</p>
<p>Второе значение: действие только что закончилось, и виден его результат.</p>
<ul><li><span class="en">You look tired.</span> — <span class="en">I have been running.</span></li></ul>
<p>Глаголы состояния (know, like, want, be, have в значении «иметь») в Continuous не ставятся — для них обычный Present Perfect: <span class="en">I have known him for ten years.</span> <span class="bad">I have been knowing</span></p>`,
 en:`<p><b>Present Perfect Continuous</b>: an action started in the past and is still going on. Form: <b>have / has been + verb-ing</b>.</p>
<ul><li><span class="en">I have been learning English for two years.</span></li><li><span class="en">It has been raining since morning.</span></li><li><span class="en">How long have you been waiting?</span></li></ul>
<p>A common mistake is the Present Continuous: <span class="bad">I am learning English for two years.</span> When you say how long (for, since, how long), use the Perfect.</p>
<p>Second use: the action has just stopped and you can see the result.</p>
<ul><li><span class="en">You look tired.</span> — <span class="en">I have been running.</span></li></ul>
<p>State verbs (know, like, want, be, have = own) are not used in the Continuous; use the Present Perfect: <span class="en">I have known him for ten years.</span> <span class="bad">I have been knowing</span></p>`},
 rules:{a:{ru:'have / has been + глагол с -ing.',en:'have / has been + verb-ing.'},
  b:{ru:'Действие началось раньше и всё ещё идёт (for, since, how long) → Perfect Continuous, а не Present Continuous.',en:'Started earlier and still going on (for, since, how long) → Perfect Continuous, not Present Continuous.'},
  c:{ru:'Действие только что закончилось, и виден результат.',en:'The action has just stopped and the result is visible.'},
  d:{ru:'know, like, want, be, have («иметь») — без Continuous: I have known.',en:'know, like, want, be, have (own) take no Continuous: I have known.'}},

{id:'forsince',ru:'Как долго и когда: for, since, ago',en:'for, since, ago',
 th:{ru:`<p>Три слова, которые легко перепутать.</p>
<table><tr><th>for</th><th>since</th><th>ago</th></tr>
<tr><td>период: сколько длится</td><td>момент начала</td><td>сколько времени назад</td></tr>
<tr><td>Present Perfect</td><td>Present Perfect</td><td>Past Simple</td></tr>
<tr><td><span class="en">for two years</span><br><span class="en">for a long time</span></td><td><span class="en">since 2020</span><br><span class="en">since Monday</span></td><td><span class="en">two years ago</span></td></tr></table>
<ul><li><span class="en">I have lived here for ten years.</span> — живу и сейчас.</li><li><span class="en">I have lived here since 2016.</span></li><li><span class="en">I moved here ten years ago.</span> — событие в прошлом.</li></ul>
<p>После since может стоять целое предложение: <span class="en">I have known her since I was a child.</span></p>
<p>Вопросы: <b>How long…?</b> — Present Perfect, <b>When…?</b> — Past Simple.</p>
<ul><li><span class="en">How long have you been married?</span></li><li><span class="en">When did you get married?</span></li></ul>`,
 en:`<p>Three words that are easy to confuse.</p>
<table><tr><th>for</th><th>since</th><th>ago</th></tr>
<tr><td>a period: how long</td><td>the starting point</td><td>how long before now</td></tr>
<tr><td>Present Perfect</td><td>Present Perfect</td><td>Past Simple</td></tr>
<tr><td><span class="en">for two years</span><br><span class="en">for a long time</span></td><td><span class="en">since 2020</span><br><span class="en">since Monday</span></td><td><span class="en">two years ago</span></td></tr></table>
<ul><li><span class="en">I have lived here for ten years.</span></li><li><span class="en">I have lived here since 2016.</span></li><li><span class="en">I moved here ten years ago.</span></li></ul>
<p>since can be followed by a clause: <span class="en">I have known her since I was a child.</span></p>
<p>Questions: <b>How long…?</b> takes the Present Perfect, <b>When…?</b> the Past Simple.</p>
<ul><li><span class="en">How long have you been married?</span></li><li><span class="en">When did you get married?</span></li></ul>`},

  d:{ru:'How long…? → Present Perfect. When…? → Past Simple.',en:'How long…? → Present Perfect. When…? → Past Simple.'}},

{id:'pastperf',ru:'Предпрошедшее: что случилось раньше',en:'Past Perfect: I had done',
 th:{ru:`<p><b>Past Perfect</b> показывает, что одно прошлое действие произошло раньше другого. Форма: <b>had + третья форма</b>, одинаково для всех лиц.</p>
<ul><li><span class="en">When I arrived, the train had already left.</span> — сначала ушёл поезд, потом пришёл я.</li><li><span class="en">I wasn't hungry because I had eaten.</span></li></ul>
<p>Сравни:</p>
<table><tr><td><span class="en">When I arrived, they left.</span></td><td>я пришёл — и они ушли (после)</td></tr>
<tr><td><span class="en">When I arrived, they had left.</span></td><td>к моему приходу их уже не было (до)</td></tr></table>
<p>Отрицание и вопрос: <span class="en">They hadn't left.</span> <span class="en">Had you finished?</span></p>
<p>Если события просто идут по порядку, Past Perfect не нужен: <span class="en">He got up, had a shower and left.</span></p>
<p>Часто используется после said, told, knew, realised: <span class="en">She told me she had read the book.</span></p>`,
 en:`<p><b>Past Perfect</b> shows that one past action happened before another. Form: <b>had + past participle</b>, the same for every person.</p>
<ul><li><span class="en">When I arrived, the train had already left.</span></li><li><span class="en">I wasn't hungry because I had eaten.</span></li></ul>
<p>Compare:</p>
<table><tr><td><span class="en">When I arrived, they left.</span></td><td>I came, then they left (after)</td></tr>
<tr><td><span class="en">When I arrived, they had left.</span></td><td>they were already gone (before)</td></tr></table>
<p>Negative and question: <span class="en">They hadn't left.</span> <span class="en">Had you finished?</span></p>
<p>When events simply follow each other, you don't need it: <span class="en">He got up, had a shower and left.</span></p>
<p>It is common after said, told, knew, realised: <span class="en">She told me she had read the book.</span></p>`},
 rules:{a:{ru:'had + третья форма, одинаково для всех лиц.',en:'had + past participle, the same for every person.'},
  b:{ru:'Из двух прошлых действий более раннее — в Past Perfect.',en:'Of two past actions, the earlier one takes the Past Perfect.'},
  c:{ru:"Отрицание: hadn't + третья форма. Вопрос: Had + подлежащее + третья форма.",en:"Negative: hadn't + participle. Question: Had + subject + participle."},
  d:{ru:'События по порядку, одно за другим → достаточно Past Simple.',en:'Events in order, one after another → the Past Simple is enough.'}},

{id:'usedto',ru:'Раньше делал, а теперь нет',en:'used to',
 th:{ru:`<p><b>used to + глагол</b> — привычка или состояние в прошлом, которых больше нет. По-русски это «раньше».</p>
<ul><li><span class="en">I used to smoke.</span> — Раньше я курил (сейчас нет).</li><li><span class="en">She used to live in London.</span></li><li><span class="en">There used to be a cinema here.</span></li></ul>
<p>Отрицание и вопрос — с did, и тогда <b>use</b> без -d:</p>
<ul><li><span class="en">I didn't use to like coffee.</span></li><li><span class="en">Did you use to play football?</span></li></ul>
<p>used to — только о прошлом. Для привычек в настоящем — Present Simple и usually: <span class="en">Now I usually get up at six.</span></p>
<p>Для одного события used to не подходит, нужен Past Simple: <span class="en">I went to Paris in 2019.</span> <span class="bad">I used to go to Paris in 2019.</span></p>`,
 en:`<p><b>used to + verb</b>: a past habit or state that is no longer true.</p>
<ul><li><span class="en">I used to smoke.</span> (I don't now.)</li><li><span class="en">She used to live in London.</span></li><li><span class="en">There used to be a cinema here.</span></li></ul>
<p>Negatives and questions take did, and then it is <b>use</b> without -d:</p>
<ul><li><span class="en">I didn't use to like coffee.</span></li><li><span class="en">Did you use to play football?</span></li></ul>
<p>used to is only about the past. For present habits use the Present Simple and usually: <span class="en">Now I usually get up at six.</span></p>
<p>For a single event use the Past Simple: <span class="en">I went to Paris in 2019.</span> <span class="bad">I used to go to Paris in 2019.</span></p>`},
 rules:{a:{ru:'used to + первая форма: привычка или состояние в прошлом, которых больше нет.',en:'used to + base form: a past habit or state that is no longer true.'},
  b:{ru:"С did — use без -d: didn't use to, Did you use to…?",en:"With did it is use without -d: didn't use to, Did you use to…?"},
  c:{ru:'Одно событие в прошлом → Past Simple, не used to.',en:'A single past event → Past Simple, not used to.'},
  d:{ru:'Привычка в настоящем → Present Simple + usually.',en:'A present habit → Present Simple + usually.'}},

{lv:'b',ru:'Условия и косвенная речь',en:'Conditions and reporting',units:[
{id:'if2',ru:'Нереальное условие: если бы',en:'Second conditional: If I had…, I would…',
 th:{ru:`<p>Второй тип условных — воображаемая ситуация в настоящем или будущем: «если бы».</p>
<table><tr><th>часть с if</th><th>главная часть</th></tr>
<tr><td>Past Simple</td><td>would + глагол</td></tr>
<tr><td><span class="en">If I had more money,</span></td><td><span class="en">I would travel.</span></td></tr>
<tr><td><span class="en">If I won the lottery,</span></td><td><span class="en">I would buy a house.</span></td></tr></table>
<p>Прошедшее время здесь не про прошлое: оно показывает, что ситуация нереальна.</p>
<p>После if не ставится would: <span class="bad">If I would have a car, …</span></p>
<p>С глаголом be принято <b>were</b> для всех лиц, особенно в совете: <span class="en">If I were you, I would talk to her.</span></p>
<p>Сравни с первым типом:</p>
<ul><li><span class="en">If it rains, I will stay at home.</span> — это вполне может случиться.</li><li><span class="en">If I lived in Spain, I would go to the beach every day.</span> — я там не живу, это мечта.</li></ul>`,
 en:`<p>The second conditional describes an imaginary situation in the present or future.</p>
<table><tr><th>the if part</th><th>the main part</th></tr>
<tr><td>Past Simple</td><td>would + verb</td></tr>
<tr><td><span class="en">If I had more money,</span></td><td><span class="en">I would travel.</span></td></tr>
<tr><td><span class="en">If I won the lottery,</span></td><td><span class="en">I would buy a house.</span></td></tr></table>
<p>The past tense here is not about the past: it shows the situation is unreal.</p>
<p>No would after if: <span class="bad">If I would have a car, …</span></p>
<p>With be we normally use <b>were</b> for every person, especially for advice: <span class="en">If I were you, I would talk to her.</span></p>
<p>Compare with the first conditional:</p>
<ul><li><span class="en">If it rains, I will stay at home.</span> — a real possibility.</li><li><span class="en">If I lived in Spain, I would go to the beach every day.</span> — imaginary.</li></ul>`},
 rules:{a:{ru:'if + Past Simple, would + первая форма: воображаемая ситуация.',en:'if + Past Simple, would + base form: an imaginary situation.'},
  b:{ru:'После if не ставится would: If I had, а не If I would have.',en:'No would after if: If I had, not If I would have.'},
  c:{ru:'С be — were для всех лиц: If I were you…',en:'With be use were for every person: If I were you…'},
  d:{ru:'Реальная возможность → первый тип (if + настоящее, will).',en:'A real possibility → first conditional (if + present, will).'}},

{id:'reported',ru:'Косвенная речь: он сказал, что…',en:'Reported speech: he said that…',
 th:{ru:`<p>Когда мы пересказываем чужие слова после said / told, время в английском <b>сдвигается назад</b>.</p>
<table><tr><th>прямая речь</th><th>косвенная речь</th></tr>
<tr><td>am / is / are</td><td>was / were</td></tr>
<tr><td>do / work</td><td>did / worked</td></tr>
<tr><td>will</td><td>would</td></tr>
<tr><td>can</td><td>could</td></tr>
<tr><td>have done, did</td><td>had done</td></tr></table>
<ul><li>"I am tired." → <span class="en">He said he was tired.</span></li><li>"I will call you." → <span class="en">She said she would call me.</span></li></ul>
<p>По-русски время не меняется («он сказал, что <b>устал</b>»), поэтому сдвиг легко забыть.</p>
<p><b>say</b> и <b>tell</b>: после tell обязательно «кому».</p>
<ul><li><span class="en">He said that he was busy.</span></li><li><span class="en">He told me that he was busy.</span> <span class="bad">He said me</span></li></ul>
<p>Местоимения меняются по смыслу: "I like <b>my</b> job." → Tom said he liked <b>his</b> job.</p>
<p><b>Вопросы</b>: ask + if или вопросительное слово, дальше прямой порядок слов без do / did:</p>
<ul><li>"Where do you live?" → <span class="en">She asked where I lived.</span></li><li>"Are you ready?" → <span class="en">He asked if I was ready.</span></li></ul>`,
 en:`<p>When we report what someone said after said / told, the tense <b>moves back</b>.</p>
<table><tr><th>direct speech</th><th>reported speech</th></tr>
<tr><td>am / is / are</td><td>was / were</td></tr>
<tr><td>do / work</td><td>did / worked</td></tr>
<tr><td>will</td><td>would</td></tr>
<tr><td>can</td><td>could</td></tr>
<tr><td>have done, did</td><td>had done</td></tr></table>
<ul><li>"I am tired." → <span class="en">He said he was tired.</span></li><li>"I will call you." → <span class="en">She said she would call me.</span></li></ul>
<p><b>say</b> and <b>tell</b>: tell needs a person after it.</p>
<ul><li><span class="en">He said that he was busy.</span></li><li><span class="en">He told me that he was busy.</span> <span class="bad">He said me</span></li></ul>
<p>Pronouns change to fit: "I like <b>my</b> job." → Tom said he liked <b>his</b> job.</p>
<p><b>Questions</b>: ask + if or a question word, then statement word order with no do / did:</p>
<ul><li>"Where do you live?" → <span class="en">She asked where I lived.</span></li><li>"Are you ready?" → <span class="en">He asked if I was ready.</span></li></ul>`},
 rules:{a:{ru:'Время сдвигается назад: is → was, do → did, will → would, can → could, have done → had done.',en:'The tense moves back: is → was, do → did, will → would, can → could, have done → had done.'},
  b:{ru:'say (that)…; tell + кому: He told me…',en:'say (that)…; tell + person: He told me…'},
  c:{ru:'Местоимения меняются по смыслу: I → he, my → his.',en:'Pronouns change to fit: I → he, my → his.'},
  d:{ru:'Вопрос: ask + if / вопросительное слово + прямой порядок слов.',en:'Questions: ask + if / question word + statement word order.'}},

{id:'imp',ru:"Просьбы и предложения: сделай, давай сделаем",en:"Imperative and let's",
 th:{ru:`<p><b>Повелительное наклонение</b> — просьба, указание, совет. Это просто первая форма глагола, без подлежащего.</p>
<ul><li><span class="en">Open the window, please.</span></li><li><span class="en">Be careful!</span></li><li><span class="en">Sit down.</span></li></ul>
<p>Отрицание — <b>Don't</b> + глагол:</p>
<ul><li><span class="en">Don't touch that.</span></li><li><span class="en">Don't be late.</span></li></ul>
<p><b>Let's</b> + глагол — «давай, давайте» (предложение сделать что-то вместе). Отрицание — <b>Let's not</b>:</p>
<ul><li><span class="en">Let's go for a walk.</span></li><li><span class="en">Let's not go out tonight.</span></li></ul>
<p>После let's глагол без to: <span class="bad">Let's to go.</span></p>
<p>Слово <b>please</b> в начале или в конце делает просьбу вежливой.</p>`,
 en:`<p>The <b>imperative</b> gives an instruction, a request or advice. It is the base form of the verb with no subject.</p>
<ul><li><span class="en">Open the window, please.</span></li><li><span class="en">Be careful!</span></li><li><span class="en">Sit down.</span></li></ul>
<p>The negative is <b>Don't</b> + verb:</p>
<ul><li><span class="en">Don't touch that.</span></li><li><span class="en">Don't be late.</span></li></ul>
<p><b>Let's</b> + verb makes a suggestion for you and me together. The negative is <b>Let's not</b>:</p>
<ul><li><span class="en">Let's go for a walk.</span></li><li><span class="en">Let's not go out tonight.</span></li></ul>
<p>No to after let's: <span class="bad">Let's to go.</span></p>
<p><b>please</b> at the beginning or the end makes a request polite.</p>`},

  c:{ru:"Let's + глагол без to — «давай»; отрицание: Let's not.",en:"Let's + verb without to; negative: Let's not."}},

{id:'tooenough',ru:'Слишком и достаточно',en:'too and enough',
 th:{ru:`<p><b>too</b> — «слишком», больше, чем нужно. Стоит перед прилагательным.</p>
<ul><li><span class="en">This coffee is too hot.</span></li><li><span class="en">She speaks too fast.</span></li></ul>
<p><b>enough</b> — «достаточно». Место зависит от того, с чем оно стоит:</p>
<table><tr><th>после прилагательного</th><th>перед существительным</th></tr>
<tr><td><span class="en">big enough</span></td><td><span class="en">enough money</span></td></tr>
<tr><td><span class="en">He is not old enough.</span></td><td><span class="en">We have enough time.</span></td></tr></table>
<p>Частая ошибка — русский порядок слов: <span class="bad">enough big</span>.</p>
<p>С существительными «слишком много» — это <b>too much</b> (неисчисляемые) и <b>too many</b> (исчисляемые):</p>
<ul><li><span class="en">too much noise</span></li><li><span class="en">too many people</span></li></ul>
<p>Не путай too и very: <span class="en">very hot</span> — просто очень горячий, <span class="en">too hot</span> — настолько, что это проблема.</p>`,
 en:`<p><b>too</b> means more than is good. It goes before an adjective.</p>
<ul><li><span class="en">This coffee is too hot.</span></li><li><span class="en">She speaks too fast.</span></li></ul>
<p><b>enough</b> means as much as is needed. Its place depends on the word it goes with:</p>
<table><tr><th>after an adjective</th><th>before a noun</th></tr>
<tr><td><span class="en">big enough</span></td><td><span class="en">enough money</span></td></tr>
<tr><td><span class="en">He is not old enough.</span></td><td><span class="en">We have enough time.</span></td></tr></table>
<p>A common mistake: <span class="bad">enough big</span>.</p>
<p>With nouns use <b>too much</b> (uncountable) and <b>too many</b> (countable):</p>
<ul><li><span class="en">too much noise</span></li><li><span class="en">too many people</span></li></ul>
<p>too is not very: <span class="en">very hot</span> is simply very hot; <span class="en">too hot</span> is a problem.</p>`},
 rules:{a:{ru:'too + прилагательное = слишком (и это плохо).',en:'too + adjective = more than is good.'},
  b:{ru:'Прилагательное + enough: big enough, old enough.',en:'Adjective + enough: big enough, old enough.'},
  c:{ru:'enough + существительное: enough money, enough time.',en:'enough + noun: enough money, enough time.'},
  d:{ru:'too much + неисчисляемое; too many + исчисляемое.',en:'too much + uncountable; too many + countable.'}},

{id:'afew',ru:'Несколько и немного',en:'a few and a little',
 th:{ru:`<p>Оба выражения значат «немного, некоторое количество», но используются с разными существительными.</p>
<table><tr><th>a few</th><th>a little</th></tr>
<tr><td>с исчисляемыми во множественном числе</td><td>с неисчисляемыми</td></tr>
<tr><td><span class="en">a few friends</span></td><td><span class="en">a little water</span></td></tr>
<tr><td><span class="en">a few minutes</span></td><td><span class="en">a little time</span></td></tr></table>
<p>a little также стоит перед прилагательным: <span class="en">I am a little tired.</span></p>
<p>Без артикля <b>few</b> и <b>little</b> значат «мало, почти нет» — с отрицательным оттенком:</p>
<ul><li><span class="en">I have a few friends.</span> — есть несколько, и это хорошо.</li><li><span class="en">I have few friends.</span> — мало, почти нет.</li><li><span class="en">There is little time left.</span> — времени почти не осталось.</li></ul>`,
 en:`<p>Both mean «some, a small amount», but they go with different nouns.</p>
<table><tr><th>a few</th><th>a little</th></tr>
<tr><td>with plural countable nouns</td><td>with uncountable nouns</td></tr>
<tr><td><span class="en">a few friends</span></td><td><span class="en">a little water</span></td></tr>
<tr><td><span class="en">a few minutes</span></td><td><span class="en">a little time</span></td></tr></table>
<p>a little also goes before an adjective: <span class="en">I am a little tired.</span></p>
<p>Without the article, <b>few</b> and <b>little</b> mean «not many, not much» and sound negative:</p>
<ul><li><span class="en">I have a few friends.</span> — some, which is fine.</li><li><span class="en">I have few friends.</span> — almost none.</li><li><span class="en">There is little time left.</span> — almost no time.</li></ul>`},
 rules:{a:{ru:'a few + исчисляемые во множественном числе.',en:'a few + plural countable nouns.'},
  b:{ru:'a little + неисчисляемые (и перед прилагательным: a little tired).',en:'a little + uncountable nouns (and before an adjective: a little tired).'},
  c:{ru:'few / little без a — «мало, почти нет».',en:'few / little without a mean «almost none».'}},

{id:'irr',ru:'Неправильные глаголы: три формы',en:'Irregular verbs: three forms',
 th:{ru:`<p>У каждого английского глагола три формы. У правильных вторая и третья — просто <b>-ed</b>. У неправильных их нужно выучить.</p>
<table><tr><th>первая</th><th>вторая</th><th>третья</th></tr>
<tr><td>после did, will, can, to</td><td>Past Simple</td><td>Present Perfect, пассив</td></tr>
<tr><td><span class="en">Did you go?</span></td><td><span class="en">I went.</span></td><td><span class="en">I have gone.</span></td></tr></table>
<p>Глаголы этой темы:</p>
<table><tr><td>go — went — gone</td><td>see — saw — seen</td><td>take — took — taken</td></tr>
<tr><td>write — wrote — written</td><td>eat — ate — eaten</td><td>give — gave — given</td></tr>
<tr><td>buy — bought — bought</td><td>break — broke — broken</td><td>speak — spoke — spoken</td></tr>
<tr><td>know — knew — known</td><td>drink — drank — drunk</td><td>do — did — done</td></tr>
<tr><td>come — came — come</td><td>find — found — found</td><td>think — thought — thought</td></tr></table>
<p>Самая частая ошибка — вторая форма вместо третьей: <span class="bad">I have ate</span>, <span class="bad">He has broke</span>. И наоборот, прошедшая форма после did: <span class="bad">She didn't came</span>.</p>`,
 en:`<p>Every English verb has three forms. For regular verbs the second and third are simply <b>-ed</b>. Irregular ones have to be learned.</p>
<table><tr><th>base</th><th>past</th><th>participle</th></tr>
<tr><td>after did, will, can, to</td><td>Past Simple</td><td>Present Perfect, passive</td></tr>
<tr><td><span class="en">Did you go?</span></td><td><span class="en">I went.</span></td><td><span class="en">I have gone.</span></td></tr></table>
<p>The verbs in this unit:</p>
<table><tr><td>go — went — gone</td><td>see — saw — seen</td><td>take — took — taken</td></tr>
<tr><td>write — wrote — written</td><td>eat — ate — eaten</td><td>give — gave — given</td></tr>
<tr><td>buy — bought — bought</td><td>break — broke — broken</td><td>speak — spoke — spoken</td></tr>
<tr><td>know — knew — known</td><td>drink — drank — drunk</td><td>do — did — done</td></tr>
<tr><td>come — came — come</td><td>find — found — found</td><td>think — thought — thought</td></tr></table>
<p>The commonest mistake is the past form instead of the participle: <span class="bad">I have ate</span>, <span class="bad">He has broke</span>. And a past form after did: <span class="bad">She didn't came</span>.</p>`},
 rules:{a:{ru:'Вторая форма — для Past Simple: I went, she gave.',en:'The past form is for the Past Simple: I went, she gave.'},
  b:{ru:'Третья форма — после have / has и в пассиве: I have gone, it was broken.',en:'The participle goes after have / has and in the passive: I have gone, it was broken.'},
  c:{ru:"После did / didn't — первая форма.",en:"After did / didn't use the base form."}},

{id:'unless',ru:'Если не: unless',en:'unless',
 th:{ru:`<p><b>unless</b> значит «если не». Это то же самое, что <b>if … not</b>.</p>
<table><tr><td><span class="en">I will not go unless you come with me.</span></td></tr>
<tr><td><span class="en">I will not go if you do not come with me.</span></td></tr></table>
<p>Отрицание уже есть внутри unless, поэтому глагол после него стоит в утвердительной форме:</p>
<ul><li><span class="en">Unless you study, you will fail.</span></li><li><span class="bad">Unless you don't study, you will fail.</span></li></ul>
<p>Как и после if, после unless идёт настоящее время, даже когда речь о будущем:</p>
<ul><li><span class="en">Unless it rains, we will play tennis.</span></li><li><span class="bad">Unless it will rain, …</span></li></ul>
<p>unless часто используется в предупреждениях: <span class="en">You will be late unless you hurry.</span></p>`,
 en:`<p><b>unless</b> means <b>if … not</b>.</p>
<table><tr><td><span class="en">I will not go unless you come with me.</span></td></tr>
<tr><td><span class="en">I will not go if you do not come with me.</span></td></tr></table>
<p>The negative is already inside unless, so the verb after it is positive:</p>
<ul><li><span class="en">Unless you study, you will fail.</span></li><li><span class="bad">Unless you don't study, you will fail.</span></li></ul>
<p>As after if, use the present after unless, even when talking about the future:</p>
<ul><li><span class="en">Unless it rains, we will play tennis.</span></li><li><span class="bad">Unless it will rain, …</span></li></ul>
<p>unless is common in warnings: <span class="en">You will be late unless you hurry.</span></p>`},
 rules:{a:{ru:'unless = if … not («если не»).',en:'unless = if … not.'},
  b:{ru:'После unless глагол в утвердительной форме: отрицание уже внутри.',en:'The verb after unless is positive: the negative is already inside.'},
  c:{ru:'После unless — настоящее время, как после if.',en:'After unless use the present, as after if.'}},

"be1": "<h4>Где в английском нужен be, а в русском глагола нет<\/h4><div class=\"tw\"><table><tr><th>Что сообщаем<\/th><th>Пример<\/th><\/tr><tr><td>кто человек, профессия<\/td><td><span class=\"en\">He is a doctor.<\/span><\/td><\/tr><tr><td>возраст<\/td><td><span class=\"en\">I am twenty-one.<\/span><\/td><\/tr><tr><td>состояние, чувство<\/td><td><span class=\"en\">I am hungry.<\/span> <span class=\"en\">She is afraid.<\/span><\/td><\/tr><tr><td>место<\/td><td><span class=\"en\">They are in Moscow.<\/span><\/td><\/tr><tr><td>погода, время, расстояние<\/td><td><span class=\"en\">It is cold.<\/span> <span class=\"en\">It is five o'clock.<\/span><\/td><\/tr><tr><td>цена<\/td><td><span class=\"en\">It is ten dollars.<\/span><\/td><\/tr><\/table><\/div><h4>Тонкости<\/h4><ul><li><b>you<\/b> всегда с <b>are<\/b>, даже если это один человек: <span class=\"en\">You are my friend.<\/span><\/li><li>Краткая форма возможна и после существительного: <span class=\"en\">Tom's at work.<\/span> <span class=\"en\">My sister's a nurse.<\/span> В разговоре почти всегда говорят кратко, в деловом письме пишут полностью.<\/li><li>В безличных фразах («Холодно», «Поздно») нужно подлежащее <b>it<\/b>: <span class=\"en\">It is late.<\/span><\/li><li>С одной профессией нужен артикль <b>a / an<\/b>: <span class=\"en\">I am an engineer.<\/span> Во множественном числе артикля нет: <span class=\"en\">We are engineers.<\/span><\/li><li>Слова-ловушки: <b>people<\/b>, <b>police<\/b> — множественное число (<span class=\"en\">People are different.<\/span>); <b>news<\/b>, <b>money<\/b> — единственное (<span class=\"en\">The news is good.<\/span>); <b>everybody<\/b>, <b>everyone<\/b> — тоже единственное (<span class=\"en\">Everybody is here.<\/span>).<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I student.<\/span><span class=\"en\">I am a student.<\/span><small>глагол нельзя пропускать<\/small><\/li><li><span class=\"bad\">I have 21 years.<\/span><span class=\"en\">I am 21.<\/span><small>возраст — через be<\/small><\/li><li><span class=\"bad\">I am agree.<\/span><span class=\"en\">I agree.<\/span><small>agree — уже глагол, be не нужен<\/small><\/li><li><span class=\"bad\">Cold today.<\/span><span class=\"en\">It is cold today.<\/span><small>нужно подлежащее it<\/small><\/li><li><span class=\"bad\">My parents is at home.<\/span><span class=\"en\">My parents are at home.<\/span><\/li><\/ul>",
"be2": "<h4>Две краткие формы отрицания<\/h4><div class=\"tw\"><table><tr><th>Сокращаем not<\/th><th>Сокращаем be<\/th><\/tr><tr><td><span class=\"en\">He isn't here.<\/span><\/td><td><span class=\"en\">He's not here.<\/span><\/td><\/tr><tr><td><span class=\"en\">We aren't ready.<\/span><\/td><td><span class=\"en\">We're not ready.<\/span><\/td><\/tr><tr><td>нет<\/td><td><span class=\"en\">I'm not ready.<\/span><\/td><\/tr><\/table><\/div><p>Обе колонки значат одно и то же. С <b>I<\/b> возможен только вариант <b>I'm not<\/b>.<\/p><h4>Краткие ответы<\/h4><ul><li>В ответе «да» форму не сокращают: <span class=\"en\">Yes, I am.<\/span> <span class=\"en\">Yes, she is.<\/span> Варианта «Yes, I'm» не бывает.<\/li><li>В ответе «нет» можно обоими способами: <span class=\"en\">No, she isn't.<\/span> <span class=\"en\">No, she's not.<\/span><\/li><\/ul><h4>Частые вопросы с be<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>О чём он<\/td><\/tr><tr><td><span class=\"en\">What is your name?<\/span><\/td><td>имя<\/td><\/tr><tr><td><span class=\"en\">How old are you?<\/span><\/td><td>возраст<\/td><\/tr><tr><td><span class=\"en\">Where are you from?<\/span><\/td><td>откуда ты<\/td><\/tr><tr><td><span class=\"en\">How are you?<\/span><\/td><td>как дела, самочувствие<\/td><\/tr><tr><td><span class=\"en\">What is she like?<\/span><\/td><td>какая она по характеру<\/td><\/tr><tr><td><span class=\"en\">What is it?<\/span> / <span class=\"en\">Who is it?<\/span><\/td><td>что это / кто это<\/td><\/tr><tr><td><span class=\"en\">How much is it?<\/span><\/td><td>цена<\/td><\/tr><\/table><\/div><h4>Вопрос с отрицанием<\/h4><p><span class=\"en\">Isn't it cold?<\/span> — «Разве не холодно?» Так спрашивают, когда ждут согласия или удивлены.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Where you are from?<\/span><span class=\"en\">Where are you from?<\/span><small>be встаёт перед подлежащим<\/small><\/li><li><span class=\"bad\">You are ready?<\/span><span class=\"en\">Are you ready?<\/span><small>одной интонации в правильной речи мало<\/small><\/li><li><span class=\"bad\">Yes, I'm.<\/span><span class=\"en\">Yes, I am.<\/span><\/li><li><span class=\"bad\">How old you are?<\/span><span class=\"en\">How old are you?<\/span><\/li><li><span class=\"bad\">I amn't sure.<\/span><span class=\"en\">I'm not sure.<\/span><\/li><\/ul>",
"pc1": "<h4>Написание -ing полностью<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Примеры<\/th><\/tr><tr><td>обычно просто + ing<\/td><td>work → working, play → playing<\/td><\/tr><tr><td>немое -e убираем<\/td><td>make → making, write → writing, come → coming<\/td><\/tr><tr><td>-ee и be сохраняются<\/td><td>see → seeing, be → being<\/td><\/tr><tr><td>-ie → -ying<\/td><td>lie → lying, die → dying<\/td><\/tr><tr><td>один слог, гласная + согласная: удваиваем<\/td><td>run → running, sit → sitting, get → getting, stop → stopping<\/td><\/tr><tr><td>w, x, y не удваиваем<\/td><td>snow → snowing, fix → fixing, play → playing<\/td><\/tr><tr><td>два слога, ударение на последнем: удваиваем<\/td><td>begin → beginning, forget → forgetting<\/td><\/tr><tr><td>два слога, ударение на первом: не удваиваем<\/td><td>open → opening, visit → visiting, listen → listening<\/td><\/tr><tr><td>-l (британский вариант)<\/td><td>travel → travelling<\/td><\/tr><\/table><\/div><h4>Когда ещё нужен Present Continuous<\/h4><ul><li>Временная ситуация «в эти дни», не обязательно в эту секунду: <span class=\"en\">I am reading a good book these days.<\/span> <span class=\"en\">She is living with her parents this month.<\/span><\/li><li>Что-то меняется: <span class=\"en\">It is getting dark.<\/span> <span class=\"en\">Prices are going up.<\/span><\/li><li>Личная договорённость на будущее, когда названо время: <span class=\"en\">I am meeting Anna tomorrow.<\/span><\/li><li>Раздражение с <b>always<\/b>: <span class=\"en\">He is always losing his keys.<\/span> — «вечно теряет».<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I working now.<\/span><span class=\"en\">I am working now.<\/span><small>без be формы нет<\/small><\/li><li><span class=\"bad\">I am work now.<\/span><span class=\"en\">I am working now.<\/span><small>без -ing тоже<\/small><\/li><li><span class=\"bad\">She is writeing.<\/span><span class=\"en\">She is writing.<\/span><\/li><li><span class=\"bad\">He is swiming.<\/span><span class=\"en\">He is swimming.<\/span><\/li><li><span class=\"bad\">I am understanding you.<\/span><span class=\"en\">I understand you.<\/span><small>глаголы состояния в Continuous не ставят<\/small><\/li><\/ul>",
"pc2": "<h4>Краткие ответы<\/h4><p><span class=\"en\">Are you working?<\/span> — <span class=\"en\">Yes, I am.<\/span> / <span class=\"en\">No, I'm not.<\/span> <span class=\"en\">Is he sleeping?<\/span> — <span class=\"en\">Yes, he is.<\/span> / <span class=\"en\">No, he isn't.<\/span> Глагол с -ing в кратком ответе не повторяют.<\/p><h4>Вопрос к подлежащему<\/h4><p>Если спрашиваем «кто?» или «что?» делает действие, порядок слов как в утверждении, а глагол всегда <b>is<\/b>: <span class=\"en\">Who is talking?<\/span> <span class=\"en\">What is happening?<\/span><\/p><h4>Предлог уходит в конец вопроса<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>Перевод<\/td><\/tr><tr><td><span class=\"en\">What are you looking at?<\/span><\/td><td>На что ты смотришь?<\/td><\/tr><tr><td><span class=\"en\">Who are you waiting for?<\/span><\/td><td>Кого ты ждёшь?<\/td><\/tr><tr><td><span class=\"en\">Who is she talking to?<\/span><\/td><td>С кем она говорит?<\/td><\/tr><tr><td><span class=\"en\">What are you thinking about?<\/span><\/td><td>О чём ты думаешь?<\/td><\/tr><\/table><\/div><h4>Вопрос с отрицанием<\/h4><p><span class=\"en\">Why aren't you eating?<\/span> — «Почему ты не ешь?» <span class=\"en\">Isn't she coming?<\/span> — «Разве она не придёт?»<\/p><h4>Отрицание: два способа<\/h4><p><span class=\"en\">He isn't listening.<\/span> = <span class=\"en\">He's not listening.<\/span> Смысл одинаковый.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Do you working?<\/span><span class=\"en\">Are you working?<\/span><small>в Continuous вспомогательный глагол — be, а не do<\/small><\/li><li><span class=\"bad\">What you are doing?<\/span><span class=\"en\">What are you doing?<\/span><\/li><li><span class=\"bad\">He don't working.<\/span><span class=\"en\">He isn't working.<\/span><\/li><li><span class=\"bad\">Yes, I'm working.<\/span><span class=\"en\">Yes, I am.<\/span><small>для краткого ответа хватит be<\/small><\/li><li><span class=\"bad\">At what are you looking?<\/span><span class=\"en\">What are you looking at?<\/span><\/li><\/ul>",
"ps1": "<h4>Когда нужен Present Simple<\/h4><ul><li>Привычки и регулярные действия: <span class=\"en\">I get up at seven.<\/span><\/li><li>Факты и то, что верно всегда: <span class=\"en\">Water boils at 100 degrees.<\/span><\/li><li>Постоянные ситуации: <span class=\"en\">She lives in Kazan.<\/span> <span class=\"en\">He works in a bank.<\/span><\/li><li>Расписания, даже о будущем: <span class=\"en\">The train leaves at nine tomorrow.<\/span><\/li><li>Чувства, мнения, знание: <span class=\"en\">I like tea.<\/span> <span class=\"en\">I know him.<\/span><\/li><\/ul><h4>Окончание -s полностью<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Примеры<\/th><\/tr><tr><td>обычно + s<\/td><td>work → works, live → lives<\/td><\/tr><tr><td>после -s, -ss, -sh, -ch, -x, -z, -o → -es<\/td><td>pass → passes, wash → washes, fix → fixes, go → goes<\/td><\/tr><tr><td>согласная + y → -ies<\/td><td>study → studies, try → tries, fly → flies<\/td><\/tr><tr><td>гласная + y → просто -s<\/td><td>play → plays, buy → buys, say → says<\/td><\/tr><tr><td>особые формы<\/td><td>have → has, be → is<\/td><\/tr><\/table><\/div><p>Произношение: после глухих звуков [s] (works, likes), после звонких и гласных [z] (plays, lives), после шипящих и свистящих — отдельный слог [iz] (watches, washes).<\/p><h4>Место наречий частоты<\/h4><div class=\"tw\"><table><tr><td>Положение<\/td><td>Пример<\/td><\/tr><tr><td>перед основным глаголом<\/td><td><span class=\"en\">She often reads.<\/span><\/td><\/tr><tr><td>после be<\/td><td><span class=\"en\">He is always late.<\/span><\/td><\/tr><tr><td>между don't / doesn't и глаголом<\/td><td><span class=\"en\">I don't usually eat meat.<\/span><\/td><\/tr><tr><td>every day, twice a week, on Mondays — в конце<\/td><td><span class=\"en\">I go to the gym twice a week.<\/span><\/td><\/tr><\/table><\/div><p><b>Sometimes<\/b> и <b>usually<\/b> могут стоять и в начале: <span class=\"en\">Sometimes I walk to work.<\/span><\/p><h4>Ещё<\/h4><ul><li><b>everybody, nobody, somebody<\/b> — единственное число: <span class=\"en\">Everybody knows it.<\/span><\/li><li><b>never<\/b> уже содержит отрицание, второе не нужно: <span class=\"en\">I never drink coffee.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">He work in a bank.<\/span><span class=\"en\">He works in a bank.<\/span><\/li><li><span class=\"bad\">She haves two children.<\/span><span class=\"en\">She has two children.<\/span><\/li><li><span class=\"bad\">I always am late.<\/span><span class=\"en\">I am always late.<\/span><small>после be<\/small><\/li><li><span class=\"bad\">He goes often there.<\/span><span class=\"en\">He often goes there.<\/span><\/li><li><span class=\"bad\">My friends lives here.<\/span><span class=\"en\">My friends live here.<\/span><small>они = they, без -s<\/small><\/li><\/ul>",
"ps2": "<h4>Как устроено<\/h4><p><b>do / does<\/b> берёт на себя и отрицание, и окончание -s, поэтому основной глагол остаётся в первой форме: <span class=\"en\">She doesn't like fish.<\/span> Полные формы <b>do not / does not<\/b> — для официального письма или чтобы подчеркнуть «нет».<\/p><h4>Где don't не используется<\/h4><div class=\"tw\"><table><tr><th>Глагол<\/th><th>Отрицание<\/th><\/tr><tr><td>be<\/td><td><span class=\"en\">I'm not tired.<\/span> <span class=\"en\">He isn't here.<\/span><\/td><\/tr><tr><td>can, must, should, will<\/td><td><span class=\"en\">I can't swim.<\/span> <span class=\"en\">You shouldn't go.<\/span><\/td><\/tr><tr><td>have got<\/td><td><span class=\"en\">I haven't got a car.<\/span><\/td><\/tr><\/table><\/div><p>С простым <b>have<\/b> — через do: <span class=\"en\">I don't have a car.<\/span><\/p><h4>Тонкости<\/h4><ul><li>Одно отрицание на предложение. Со словами <b>never, nobody, nothing<\/b> глагол стоит в утвердительной форме: <span class=\"en\">I never eat meat.<\/span> <span class=\"en\">Nobody knows.<\/span><\/li><li>«Я думаю, что он не прав» по-английски обычно строят с отрицанием в первой части: <span class=\"en\">I don't think he is right.<\/span><\/li><li><b>do<\/b> может быть и основным глаголом, тогда он повторяется: <span class=\"en\">He doesn't do his homework.<\/span><\/li><li>Вопрос-предложение: <span class=\"en\">Why don't you ask him?<\/span> — «Почему бы тебе не спросить его?»<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">He don't know.<\/span><span class=\"en\">He doesn't know.<\/span><\/li><li><span class=\"bad\">She doesn't likes it.<\/span><span class=\"en\">She doesn't like it.<\/span><small>-s уже в doesn't<\/small><\/li><li><span class=\"bad\">I not like coffee.<\/span><span class=\"en\">I don't like coffee.<\/span><\/li><li><span class=\"bad\">I am not understand.<\/span><span class=\"en\">I don't understand.<\/span><small>understand — обычный глагол, be не нужен<\/small><\/li><li><span class=\"bad\">I don't never go there.<\/span><span class=\"en\">I never go there.<\/span><\/li><\/ul>",
"ps3": "<h4>Вопрос к подлежащему: без do<\/h4><p>Когда спрашиваем, кто делает действие, порядок слов как в утверждении, глагол с -s:<\/p><div class=\"tw\"><table><tr><th>К подлежащему (без do)<\/th><th>К остальному (с do)<\/th><\/tr><tr><td><span class=\"en\">Who lives here?<\/span><\/td><td><span class=\"en\">Where do you live?<\/span><\/td><\/tr><tr><td><span class=\"en\">Who knows the answer?<\/span><\/td><td><span class=\"en\">What do you know?<\/span><\/td><\/tr><tr><td><span class=\"en\">What happens next?<\/span><\/td><td><span class=\"en\">What does he want?<\/span><\/td><\/tr><\/table><\/div><h4>Полезные вопросы целиком<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>Перевод<\/td><\/tr><tr><td><span class=\"en\">What do you do?<\/span><\/td><td>Кем ты работаешь?<\/td><\/tr><tr><td><span class=\"en\">What does this word mean?<\/span><\/td><td>Что значит это слово?<\/td><\/tr><tr><td><span class=\"en\">How do you spell it?<\/span><\/td><td>Как это пишется?<\/td><\/tr><tr><td><span class=\"en\">How much does it cost?<\/span><\/td><td>Сколько это стоит?<\/td><\/tr><tr><td><span class=\"en\">How often do you train?<\/span><\/td><td>Как часто ты тренируешься?<\/td><\/tr><tr><td><span class=\"en\">What time does it start?<\/span><\/td><td>Во сколько начало?<\/td><\/tr><tr><td><span class=\"en\">How long does it take?<\/span><\/td><td>Сколько это занимает времени?<\/td><\/tr><\/table><\/div><h4>Тонкости<\/h4><ul><li><span class=\"en\">What do you do?<\/span> — о профессии. <span class=\"en\">What are you doing?<\/span> — чем занят сейчас.<\/li><li>Предлог в конце: <span class=\"en\">Where do you come from?<\/span> <span class=\"en\">What music do you listen to?<\/span><\/li><li>С be и модальными do не нужен: <span class=\"en\">Are you tired?<\/span> <span class=\"en\">Can you help?<\/span><\/li><li>Вопрос с отрицанием: <span class=\"en\">Don't you like it?<\/span> — «Разве тебе не нравится?»<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Does she works here?<\/span><span class=\"en\">Does she work here?<\/span><\/li><li><span class=\"bad\">Do she work here?<\/span><span class=\"en\">Does she work here?<\/span><\/li><li><span class=\"bad\">What means this word?<\/span><span class=\"en\">What does this word mean?<\/span><\/li><li><span class=\"bad\">Where you live?<\/span><span class=\"en\">Where do you live?<\/span><\/li><li><span class=\"bad\">How much costs it?<\/span><span class=\"en\">How much does it cost?<\/span><\/li><li><span class=\"bad\">Who does live here?<\/span><span class=\"en\">Who lives here?<\/span><small>вопрос к подлежащему<\/small><\/li><\/ul>",
"pcps": "<h4>Глаголы состояния: только Simple<\/h4><div class=\"tw\"><table><tr><th>Группа<\/th><th>Глаголы<\/th><\/tr><tr><td>чувства и желания<\/td><td>like, love, hate, prefer, want, need<\/td><\/tr><tr><td>знание и мнение<\/td><td>know, understand, believe, remember, forget, mean<\/td><\/tr><tr><td>восприятие<\/td><td>see, hear, smell, taste, seem<\/td><\/tr><tr><td>владение<\/td><td>have (иметь), own, belong<\/td><\/tr><tr><td>прочее<\/td><td>be, cost<\/td><\/tr><\/table><\/div><p><span class=\"en\">I want a coffee now.<\/span> <span class=\"en\">Do you understand me?<\/span> Здесь действие «сейчас», но форма Simple.<\/p><h4>Глаголы с двумя значениями<\/h4><div class=\"tw\"><table><tr><th>Состояние → Simple<\/th><th>Действие → Continuous<\/th><\/tr><tr><td><span class=\"en\">I think you are right.<\/span> — считаю<\/td><td><span class=\"en\">I am thinking about it.<\/span> — обдумываю<\/td><\/tr><tr><td><span class=\"en\">I have a car.<\/span> — владею<\/td><td><span class=\"en\">I am having lunch.<\/span> — обедаю<\/td><\/tr><tr><td><span class=\"en\">I see.<\/span> — понимаю<\/td><td><span class=\"en\">I am seeing the doctor at five.<\/span> — иду на приём<\/td><\/tr><tr><td><span class=\"en\">The soup tastes good.<\/span> — на вкус<\/td><td><span class=\"en\">She is tasting the soup.<\/span> — пробует<\/td><\/tr><\/table><\/div><h4>Постоянное и временное<\/h4><div class=\"tw\"><table><tr><td>Постоянно<\/td><td>Временно<\/td><\/tr><tr><td><span class=\"en\">I live in Moscow.<\/span><\/td><td><span class=\"en\">I am living with a friend this week.<\/span><\/td><\/tr><tr><td><span class=\"en\">He works in a bank.<\/span><\/td><td><span class=\"en\">He is working from home today.<\/span><\/td><\/tr><\/table><\/div><h4>Оба времени о будущем<\/h4><ul><li>Расписание — Simple: <span class=\"en\">The film starts at eight.<\/span><\/li><li>Личная договорённость — Continuous: <span class=\"en\">I am meeting Tom at eight.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I am knowing him.<\/span><span class=\"en\">I know him.<\/span><\/li><li><span class=\"bad\">I am wanting to go home.<\/span><span class=\"en\">I want to go home.<\/span><\/li><li><span class=\"bad\">Now I read a book.<\/span><span class=\"en\">I am reading a book now.<\/span><small>в русском время одно, в английском разные<\/small><\/li><li><span class=\"bad\">I am going to work by bus every day.<\/span><span class=\"en\">I go to work by bus every day.<\/span><\/li><li><span class=\"bad\">What do you do now?<\/span><span class=\"en\">What are you doing now?<\/span><small>если спрашиваем о занятии в эту минуту<\/small><\/li><\/ul>",
"hgot": "<h4>have got и have: в чём разница<\/h4><p>Для владения, родственников, внешности и болезней оба варианта значат одно и то же: <span class=\"en\">I've got a brother.<\/span> = <span class=\"en\">I have a brother.<\/span> В британской речи чаще <b>have got<\/b>, в американской — <b>have<\/b>. В письме надёжнее <b>have<\/b>.<\/p><h4>Где got не ставится<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Пример<\/th><\/tr><tr><td>действия: еда, душ, отдых<\/td><td><span class=\"en\">I have breakfast at eight.<\/span> <span class=\"en\">She is having a shower.<\/span><\/td><\/tr><tr><td>прошедшее время<\/td><td><span class=\"en\">I had a dog.<\/span><\/td><\/tr><tr><td>будущее<\/td><td><span class=\"en\">I will have time tomorrow.<\/span><\/td><\/tr><tr><td>после модальных<\/td><td><span class=\"en\">You must have a ticket.<\/span><\/td><\/tr><\/table><\/div><h4>Сокращения<\/h4><ul><li><span class=\"en\">I've got<\/span>, <span class=\"en\">we've got<\/span>, <span class=\"en\">he's got<\/span>, <span class=\"en\">she's got<\/span>. Здесь <b>'s<\/b> = <b>has<\/b>, а не <b>is<\/b>.<\/li><li>Без <b>got<\/b> не сокращают: говорят <span class=\"en\">I have a car<\/span>, а не «I've a car».<\/li><\/ul><h4>Краткие ответы<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>Ответ<\/td><\/tr><tr><td><span class=\"en\">Have you got a pen?<\/span><\/td><td><span class=\"en\">Yes, I have.<\/span> / <span class=\"en\">No, I haven't.<\/span><\/td><\/tr><tr><td><span class=\"en\">Do you have a pen?<\/span><\/td><td><span class=\"en\">Yes, I do.<\/span> / <span class=\"en\">No, I don't.<\/span><\/td><\/tr><\/table><\/div><p>Нельзя смешивать два способа в одном предложении.<\/p><h4>Русское «у меня есть»<\/h4><p>Строится от человека, а не от предмета: «У неё есть машина» → <span class=\"en\">She has got a car.<\/span> Предлогов и слова «есть» переводить не надо.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Do you have got a car?<\/span><span class=\"en\">Have you got a car?<\/span><small>или: Do you have a car?<\/small><\/li><li><span class=\"bad\">I don't have got time.<\/span><span class=\"en\">I haven't got time.<\/span><small>или: I don't have time<\/small><\/li><li><span class=\"bad\">She have got a cat.<\/span><span class=\"en\">She has got a cat.<\/span><\/li><li><span class=\"bad\">I have got breakfast at seven.<\/span><span class=\"en\">I have breakfast at seven.<\/span><small>действие, got не нужен<\/small><\/li><li><span class=\"bad\">Yesterday I had got a headache.<\/span><span class=\"en\">Yesterday I had a headache.<\/span><\/li><\/ul>",
"was": "<h4>Формы целиком<\/h4><div class=\"tw\"><table><tr><th>Лицо<\/th><th>Утверждение<\/th><th>Отрицание<\/th><th>Вопрос<\/th><\/tr><tr><td>I / he / she / it<\/td><td>was<\/td><td>wasn't<\/td><td>Was he…?<\/td><\/tr><tr><td>we / you / they<\/td><td>were<\/td><td>weren't<\/td><td>Were they…?<\/td><\/tr><\/table><\/div><p><b>you<\/b> всегда с <b>were<\/b>, даже об одном человеке: <span class=\"en\">You were right.<\/span><\/p><h4>Выражения с was / were<\/h4><ul><li>Родиться: <span class=\"en\">I was born in 2005.<\/span> — всегда с be и всегда в прошедшем.<\/li><li>Было холодно, поздно: <span class=\"en\">It was cold.<\/span> <span class=\"en\">It was late.<\/span><\/li><li>Было, находилось: <span class=\"en\">There was a shop here.<\/span> <span class=\"en\">There were two cafes.<\/span><\/li><li>Опоздать, быть занятым, быть в отпуске: <span class=\"en\">He was late.<\/span> <span class=\"en\">We were busy.<\/span> <span class=\"en\">She was on holiday.<\/span><\/li><\/ul><h4>Слова прошедшего времени<\/h4><p><b>yesterday, last night, last week, two days ago, in 2020, when I was a child<\/b>. «Вчера вечером» — <span class=\"en\">last night<\/span> или <span class=\"en\">yesterday evening<\/span>, но не «yesterday night».<\/p><h4>Вопросы<\/h4><div class=\"tw\"><table><tr><td>Вопрос<\/td><td>Перевод<\/td><\/tr><tr><td><span class=\"en\">Where were you?<\/span><\/td><td>Где ты был?<\/td><\/tr><tr><td><span class=\"en\">How was the film?<\/span><\/td><td>Как фильм?<\/td><\/tr><tr><td><span class=\"en\">What was the weather like?<\/span><\/td><td>Какая была погода?<\/td><\/tr><tr><td><span class=\"en\">Why was she late?<\/span><\/td><td>Почему она опоздала?<\/td><\/tr><tr><td><span class=\"en\">Who was there?<\/span><\/td><td>Кто там был?<\/td><\/tr><\/table><\/div><p>Краткие ответы: <span class=\"en\">Yes, I was.<\/span> <span class=\"en\">No, we weren't.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I were at home.<\/span><span class=\"en\">I was at home.<\/span><\/li><li><span class=\"bad\">They was happy.<\/span><span class=\"en\">They were happy.<\/span><\/li><li><span class=\"bad\">I born in Moscow.<\/span><span class=\"en\">I was born in Moscow.<\/span><\/li><li><span class=\"bad\">Did you were at work?<\/span><span class=\"en\">Were you at work?<\/span><small>с be вспомогательный did не нужен<\/small><\/li><li><span class=\"bad\">Yesterday I am tired.<\/span><span class=\"en\">Yesterday I was tired.<\/span><\/li><\/ul>",
"past1": "<h4>Написание -ed полностью<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Примеры<\/th><\/tr><tr><td>обычно + ed<\/td><td>work → worked, watch → watched<\/td><\/tr><tr><td>уже есть -e: только + d<\/td><td>live → lived, like → liked<\/td><\/tr><tr><td>согласная + y → -ied<\/td><td>study → studied, try → tried<\/td><\/tr><tr><td>гласная + y → просто -ed<\/td><td>play → played, stay → stayed<\/td><\/tr><tr><td>один слог, гласная + согласная: удваиваем<\/td><td>stop → stopped, plan → planned<\/td><\/tr><tr><td>два слога, ударение на последнем: удваиваем<\/td><td>prefer → preferred<\/td><\/tr><tr><td>два слога, ударение на первом: не удваиваем<\/td><td>visit → visited, open → opened<\/td><\/tr><\/table><\/div><h4>Как читается -ed<\/h4><div class=\"tw\"><table><tr><th>Звук<\/th><th>Когда<\/th><th>Примеры<\/th><\/tr><tr><td>[t]<\/td><td>после глухих согласных<\/td><td>worked, stopped, watched<\/td><\/tr><tr><td>[d]<\/td><td>после звонких и гласных<\/td><td>played, lived, called<\/td><\/tr><tr><td>[id]<\/td><td>только после t и d<\/td><td>wanted, needed, started<\/td><\/tr><\/table><\/div><p>Лишний слог появляется только в третьем случае. «Work-ed» в два слога — ошибка произношения.<\/p><h4>Неправильные глаголы по группам<\/h4><div class=\"tw\"><table><tr><th>Группа<\/th><th>Примеры<\/th><\/tr><tr><td>форма не меняется<\/td><td>put → put, cut → cut, cost → cost<\/td><\/tr><tr><td>меняется гласная<\/td><td>come → came, give → gave, write → wrote, drink → drank<\/td><\/tr><tr><td>-ought / -aught<\/td><td>buy → bought, think → thought, bring → brought, catch → caught, teach → taught<\/td><\/tr><tr><td>конец на -t<\/td><td>feel → felt, keep → kept, sleep → slept, leave → left, send → sent, spend → spent<\/td><\/tr><tr><td>совсем другая форма<\/td><td>go → went, be → was / were<\/td><\/tr><\/table><\/div><p><b>read<\/b> пишется одинаково, но в прошедшем читается [red].<\/p><h4>Когда нужен Past Simple<\/h4><ul><li>Действие закончено, и время известно или понятно: <span class=\"en\">I saw him yesterday.<\/span><\/li><li>Цепочка событий: <span class=\"en\">I got up, had breakfast and went out.<\/span><\/li><li>Привычка в прошлом: <span class=\"en\">We played football every day.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I goed home.<\/span><span class=\"en\">I went home.<\/span><\/li><li><span class=\"bad\">He buyed a car.<\/span><span class=\"en\">He bought a car.<\/span><\/li><li><span class=\"bad\">I was go to the shop.<\/span><span class=\"en\">I went to the shop.<\/span><small>was здесь лишний<\/small><\/li><li><span class=\"bad\">I have seen him yesterday.<\/span><span class=\"en\">I saw him yesterday.<\/span><small>названо время — Past Simple<\/small><\/li><li><span class=\"bad\">She studyed English.<\/span><span class=\"en\">She studied English.<\/span><\/li><\/ul>",
"past2": "<h4>did один на всех<\/h4><p><b>did<\/b> не меняется по лицам и забирает на себя прошедшее время, поэтому основной глагол возвращается в первую форму: <span class=\"en\">She didn't go.<\/span> <span class=\"en\">Did they see it?<\/span> Краткие ответы: <span class=\"en\">Yes, I did.<\/span> <span class=\"en\">No, I didn't.<\/span><\/p><h4>Вопрос к подлежащему: без did<\/h4><div class=\"tw\"><table><tr><th>К подлежащему (без did)<\/th><th>К остальному (с did)<\/th><\/tr><tr><td><span class=\"en\">Who called you?<\/span> — Кто тебе звонил?<\/td><td><span class=\"en\">Who did you call?<\/span> — Кому ты звонил?<\/td><\/tr><tr><td><span class=\"en\">What happened?<\/span> — Что случилось?<\/td><td><span class=\"en\">What did you see?<\/span> — Что ты видел?<\/td><\/tr><tr><td><span class=\"en\">Who told you?<\/span><\/td><td><span class=\"en\">What did he tell you?<\/span><\/td><\/tr><\/table><\/div><h4>Где did не используется<\/h4><div class=\"tw\"><table><tr><th>Глагол<\/th><th>Отрицание и вопрос<\/th><\/tr><tr><td>be<\/td><td><span class=\"en\">I wasn't there.<\/span> <span class=\"en\">Were you at home?<\/span><\/td><\/tr><tr><td>can<\/td><td><span class=\"en\">I couldn't sleep.<\/span> <span class=\"en\">Could you swim?<\/span><\/td><\/tr><\/table><\/div><h4>Тонкости<\/h4><ul><li><b>do<\/b> как основной глагол остаётся: <span class=\"en\">What did you do?<\/span> <span class=\"en\">I didn't do it.<\/span><\/li><li>С <b>never<\/b> глагол во второй форме, без didn't: <span class=\"en\">I never saw him again.<\/span><\/li><li>Вопрос с отрицанием: <span class=\"en\">Why didn't you call me?<\/span><\/li><li>Предлог в конце: <span class=\"en\">Who did you go with?<\/span> <span class=\"en\">What did you talk about?<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Did you went there?<\/span><span class=\"en\">Did you go there?<\/span><\/li><li><span class=\"bad\">I didn't saw him.<\/span><span class=\"en\">I didn't see him.<\/span><\/li><li><span class=\"bad\">Where you went?<\/span><span class=\"en\">Where did you go?<\/span><\/li><li><span class=\"bad\">What did happen?<\/span><span class=\"en\">What happened?<\/span><small>вопрос к подлежащему<\/small><\/li><li><span class=\"bad\">I not went to work.<\/span><span class=\"en\">I didn't go to work.<\/span><\/li><li><span class=\"bad\">Did you be at home?<\/span><span class=\"en\">Were you at home?<\/span><\/li><\/ul>",
"pastc": "<h4>Четыре случая<\/h4><ul><li>Действие шло в названный момент: <span class=\"en\">At eight I was having dinner.<\/span><\/li><li>Фон в рассказе: <span class=\"en\">The sun was shining and people were walking in the park.<\/span><\/li><li>Два длительных действия одновременно, обычно с <b>while<\/b>: <span class=\"en\">While I was cooking, he was watching TV.<\/span><\/li><li>Длительное действие, которое прервало короткое: <span class=\"en\">I was sleeping when you called.<\/span><\/li><\/ul><h4>Чего Past Continuous не выражает<\/h4><ul><li>Привычку в прошлом. Для неё Past Simple или used to: <span class=\"en\">I played football every day.<\/span><\/li><li>Законченное действие целиком: <span class=\"en\">I read the book last week.<\/span> — прочитал. <span class=\"en\">I was reading the book.<\/span> — читал, и неизвестно, дочитал ли.<\/li><li>Состояния: <span class=\"en\">I knew him.<\/span> <span class=\"en\">She wanted to leave.<\/span><\/li><\/ul><h4>Со словами all day, from … to …<\/h4><p>Возможны оба времени. Continuous подчёркивает, что действие тянулось: <span class=\"en\">I was working all day.<\/span> Simple просто сообщает факт: <span class=\"en\">I worked all day.<\/span><\/p><h4>Вежливая просьба<\/h4><p><span class=\"en\">I was wondering if you could help me.<\/span> — мягкая форма «не могли бы вы». Время прошедшее только по форме.<\/p><h4>Вопросы<\/h4><p><span class=\"en\">What were you doing at ten?<\/span> <span class=\"en\">Where was he going?<\/span> <span class=\"en\">Who were you talking to?<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I was work at five.<\/span><span class=\"en\">I was working at five.<\/span><\/li><li><span class=\"bad\">They was playing.<\/span><span class=\"en\">They were playing.<\/span><\/li><li><span class=\"bad\">When I was a child, I was playing football every day.<\/span><span class=\"en\">When I was a child, I played football every day.<\/span><small>привычка<\/small><\/li><li><span class=\"bad\">I was knowing the answer.<\/span><span class=\"en\">I knew the answer.<\/span><\/li><li><span class=\"bad\">What did you doing?<\/span><span class=\"en\">What were you doing?<\/span><\/li><\/ul>",
"pastcs": "<h4>Схемы с when и while<\/h4><div class=\"tw\"><table><tr><th>Схема<\/th><th>Пример<\/th><th>Смысл<\/th><\/tr><tr><td>Continuous + when + Simple<\/td><td><span class=\"en\">I was sleeping when the phone rang.<\/span><\/td><td>фон и событие<\/td><\/tr><tr><td>While + Continuous, Simple<\/td><td><span class=\"en\">While I was walking home, I met Anna.<\/span><\/td><td>то же, начинаем с фона<\/td><\/tr><tr><td>When + Simple, Simple<\/td><td><span class=\"en\">When he came, we had dinner.<\/span><\/td><td>он пришёл, и потом мы поели<\/td><\/tr><tr><td>When + Simple, Continuous<\/td><td><span class=\"en\">When he came, we were having dinner.<\/span><\/td><td>он пришёл, а мы уже ели<\/td><\/tr><\/table><\/div><p>Последние две строки отличаются только временем, а смысл разный.<\/p><h4>Тонкости<\/h4><ul><li>Если придаточное стоит первым, после него запятая. Если вторым — запятой нет.<\/li><li><b>as<\/b> может заменять <b>while<\/b>: <span class=\"en\">As I was leaving, the phone rang.<\/span><\/li><li>Законченный срок — Simple, даже если он долгий: <span class=\"en\">I lived there for five years.<\/span><\/li><li>Короткое, мгновенное действие в Continuous звучит странно: сломал, упал, нашёл, уронил — Simple.<\/li><li>После <b>while<\/b> в разговоре встречается и Simple (<span class=\"en\">While I cooked, he slept<\/span>), это не ошибка, но Continuous надёжнее.<\/li><\/ul><h4>Как выбрать<\/h4><p>Спроси себя: это рамка или событие? Рамка, внутри которой что-то случилось, — Continuous. Само событие, шаг сюжета — Simple.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I was breaking my leg when I played football.<\/span><span class=\"en\">I broke my leg when I was playing football.<\/span><small>перепутаны фон и событие<\/small><\/li><li><span class=\"bad\">When I came home, my wife cooked dinner.<\/span><span class=\"en\">When I came home, my wife was cooking dinner.<\/span><small>если она уже готовила<\/small><\/li><li><span class=\"bad\">I was seeing him yesterday.<\/span><span class=\"en\">I saw him yesterday.<\/span><\/li><li><span class=\"bad\">While I was knowing him, he was happy.<\/span><span class=\"en\">While I knew him, he was happy.<\/span><\/li><\/ul>",

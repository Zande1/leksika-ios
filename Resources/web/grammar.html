<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Грамматика</title>
<style>
/* Layout: one-column trainer — sticky top bar, fixed bottom tab bar, bottom feedback sheet during a session */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#181B22; --muted:#5F6676; --line:#E1E5EB;
  --accent:#0D7A6B; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC;
  --warn:#8A5A00; --warn-soft:#FFEDB9; --danger:#B93D29; --danger-soft:#FBE3DE; --good:#2F8A3B; --good-soft:#DDF3E0;
  --shadow:rgba(16,20,28,.14);
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h:60px; --r:14px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
:root.emb{--sat:0px; --sab:0px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --ink:#E8EAEF; --muted:#9AA1AE; --line:#2A2E36;
  --accent:#3CC4AE; --accent-ink:#04211C; --accent-soft:#163631;
  --warn:#FFD25E; --warn-soft:#3A3013; --danger:#F0806B; --danger-soft:#3B1E19; --good:#6CCB78; --good-soft:#17321B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --ink:#E8EAEF; --muted:#9AA1AE; --line:#2A2E36;
  --accent:#3CC4AE; --accent-ink:#04211C; --accent-soft:#163631;
  --warn:#FFD25E; --warn-soft:#3A3013; --danger:#F0806B; --danger-soft:#3B1E19; --good:#6CCB78; --good-soft:#17321B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:var(--sat)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:54px;padding-block:6px}
header.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding-bottom:calc(var(--nav-h) + var(--sab) + 24px)}
body.in-session main{padding-bottom:calc(var(--sab) + 240px)}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative;min-width:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;text-align:center}
body.in-session nav.tabs{display:none}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:14px 18px;font-size:16px;border-radius:12px;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:16px;font-weight:800}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.gray{background:var(--line);color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}

/* course map */
.hero{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.hero .pct{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.hero .bar{grid-column:1/-1}
.sec-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px -4px}
.unit{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.unit .num{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums}
.unit.done .num{background:var(--accent);color:var(--accent-ink)}
.unit.locked{opacity:.55}
.unit.locked .num{background:var(--line);color:var(--muted)}
.unit .tt{font-weight:700;overflow-wrap:anywhere}
.unit .ru{font-size:13.5px;color:var(--ink);opacity:.8}
.unit .sub{font-size:12.5px;color:var(--muted)}
.unit .dots{display:flex;gap:4px}
.unit .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.unit .dots i.on{background:var(--accent)}
.unit.test{border-style:dashed}
.unit.test .num{border-radius:12px}
.lvseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.lvseg button{padding:10px 8px;font-size:14px}
.lvseg button span{font-weight:600;opacity:.75;font-size:12px}
.mist{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.mist:first-of-type{border-top:0}
.wrongtxt{color:var(--danger);font-family:var(--f-read);font-weight:600}
.soon{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px}

/* theory */
.theory{font-size:15.5px}
.theory p{margin:0 0 10px}
.theory table{border-collapse:collapse;width:100%;margin:4px 0 12px;font-size:15px}
.theory td,.theory th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.theory th{background:var(--bg);font-size:12.5px;color:var(--muted);font-weight:700}
.theory ul{margin:0 0 10px;padding-left:20px}
.theory li{margin:3px 0}
.en{font-family:var(--f-read);font-weight:600;color:var(--ink);border-bottom:1px dotted var(--muted);cursor:pointer}
.theory .bad{text-decoration:line-through;color:var(--danger);font-family:var(--f-read)}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.step{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}

/* session */
.sess-top{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.task{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q{font-family:var(--f-read);font-size:23px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.q .blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--accent);margin:0 2px;height:1.1em;vertical-align:baseline}
.q .wrong{color:var(--danger)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:17px;font-family:var(--f-read);font-weight:600;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:18px;font-family:var(--f-read)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{font-size:16px;line-height:1.5;min-height:130px;resize:vertical;display:block}
textarea.out{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;min-height:180px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tiles.line{min-height:54px;border-bottom:2px solid var(--line);padding-bottom:8px;align-content:flex-start}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:17px;font-family:var(--f-read);font-weight:600}
.tile.used{visibility:hidden}
.say{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:6px auto}
.say svg{width:34px;height:34px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.foot .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.foot.ok{background:var(--good-soft);border-color:transparent}
.foot.typo{background:var(--warn-soft);border-color:transparent}
.foot.bad{background:var(--danger-soft);border-color:transparent}
.verdict{font-weight:800;font-size:17px}
.foot.ok .verdict{color:var(--good)} .foot.typo .verdict{color:var(--warn)} .foot.bad .verdict{color:var(--danger)}
.right{font-family:var(--f-read);font-size:17px;font-weight:600}
.right b{color:var(--accent)}
.why{font-size:13.5px}
.tw{cursor:pointer;border-radius:4px}
.tw:active{background:var(--accent-soft)}
#tip{position:fixed;left:12px;right:12px;top:calc(var(--sat) + 10px);z-index:40;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4;box-shadow:0 8px 24px var(--shadow)}
#tip b{font-family:var(--f-read);font-size:17px}
#tip .linkbtn{color:inherit;opacity:.8;display:block;margin-top:8px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;align-self:flex-start}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px}
.days i{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.days i.zero{background:var(--line)}
.dlab{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center}
.urow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.urow .bar{grid-column:1/-1}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}

/* ================= look, second version =================
   One idea carries the look: text marked by hand. Ink-blue is the pen (actions, links, new words),
   highlighter yellow marks what is active or in progress. Everything else stays quiet. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#12151B; --muted:#646C7C; --line:#E4E7EC;
  --accent:#2748E0; --accent-ink:#FFFFFF; --accent-soft:#E6EBFF;
  --mark:#FFD84A; --mark-ink:#12151B; --mark-soft:#FFF4C2;
  --danger:#D03A26; --danger-soft:#FCE5E0; --good:#1B9450; --good-soft:#DDF4E6; --warn:#8A5A00; --warn-soft:#FFF0C2;
  --play:#FFF1B0; --shadow:rgba(18,21,27,.12);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-read:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --nav-h:62px; --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --surface:#171A20; --ink:#ECEEF3; --muted:#969FB0; --line:#272B33;
  --accent:#8FA5FF; --accent-ink:#0A1233; --accent-soft:#1B2347;
  --mark:#F2C63C; --mark-ink:#12151B; --mark-soft:#3B3212;
  --danger:#FF8A75; --danger-soft:#3D1D17; --good:#5FCB84; --good-soft:#15321F; --warn:#FFD25E; --warn-soft:#3A3013;
  --play:rgba(242,198,60,.22); --shadow:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F13; --surface:#171A20; --ink:#ECEEF3; --muted:#969FB0; --line:#272B33;
  --accent:#8FA5FF; --accent-ink:#0A1233; --accent-soft:#1B2347;
  --mark:#F2C63C; --mark-ink:#12151B; --mark-soft:#3B3212;
  --danger:#FF8A75; --danger-soft:#3D1D17; --good:#5FCB84; --good-soft:#15321F; --warn:#FFD25E; --warn-soft:#3A3013;
  --play:rgba(242,198,60,.22); --shadow:rgba(0,0,0,.55); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
body{font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
header.top{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:0}
header.top .wrap{min-height:60px;padding-block:8px}
header.top h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
main .wrap{gap:16px;padding-block:8px 18px}
/* bottom bar: the active section is marked with the highlighter */
nav.tabs{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line)}
nav.tabs .in{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{font-size:11px;font-weight:600;gap:4px;letter-spacing:0;color:var(--muted);overflow:visible}
nav.tabs button svg{width:24px;height:24px;padding:3px 14px;box-sizing:content-box;border-radius:999px;transition:background .18s}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{background:var(--mark);color:var(--mark-ink)}
nav.tabs .badge{top:4px;left:calc(50% + 10px);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{border-radius:14px;padding:11px 16px;font-size:15px;font-weight:600;border-color:var(--line);transition:transform .08s,background .15s}
.btn:active,.icon-btn:active,.opt:active,.chip:active{transform:scale(.97)}
.btn.primary{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn.ghost{background:transparent;border-color:transparent}
.icon-btn{border-radius:14px;width:44px;height:44px}
.panel{border-radius:var(--r);padding:18px;gap:12px;border-color:transparent;box-shadow:0 1px 2px rgba(18,21,27,.05),0 0 0 1px var(--line)}
.panel h2{font-size:18px;letter-spacing:-.01em}
.small{font-size:14px}
.note{border-style:solid;border-radius:16px;font-size:14px;padding:12px 14px;background:transparent}
.chip{padding:8px 14px;font-size:14px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
input[type=text],input[type=search],textarea,select{border-radius:14px;background:var(--surface);padding:12px 14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toast{border-radius:16px;padding:12px 16px;font-size:15px;box-shadow:0 10px 30px var(--shadow)}
.toast button{color:var(--mark)}
@media (prefers-reduced-motion: reduce){.btn,.icon-btn,.opt,.chip,nav.tabs button svg{transition:none}.btn:active,.icon-btn:active,.opt:active,.chip:active{transform:none}}

/* ---- Грамматика ---- */
nav.tabs .in{grid-template-columns:none}
.task,.sec-title{text-transform:none;letter-spacing:0;font-size:14px;font-weight:700;color:var(--muted)}
.sec-title{font-size:17px;color:var(--ink);letter-spacing:-.01em;margin:14px 2px -4px}
.chip{border:0;background:var(--mark);color:var(--mark-ink)}
.chip.gray{background:var(--line);color:var(--muted)}
.bar{height:10px;border-radius:999px}
.bar i{border-radius:999px}
.hero .pct{font-size:52px;letter-spacing:-.04em}
.unit{border-radius:var(--r);padding:16px;border-color:transparent;box-shadow:0 1px 2px rgba(18,21,27,.05),0 0 0 1px var(--line);grid-template-columns:44px 1fr auto}
.unit .num{width:44px;height:44px;font-size:16px}
.unit.done .num{background:var(--mark);color:var(--mark-ink)}
.unit .tt{font-size:17px;letter-spacing:-.01em}
.unit .ru{font-size:14px}
.unit .sub{font-size:13px}
.unit .dots i{width:8px;height:8px}
.unit .dots i.on{background:var(--accent)}
.unit.test{box-shadow:none;border:1.5px dashed var(--line)}
.soon{border-radius:var(--r);font-size:14px;padding:16px}
.theory{font-size:17px;line-height:1.55}
.theory table{font-size:16px;border-radius:12px;overflow:hidden}
.theory th{font-size:13px}
.en{border-bottom:0;background:linear-gradient(transparent 62%,var(--mark-soft) 62%)}
.seg{border-radius:14px;border:0;background:var(--line);padding:3px;gap:3px}
.seg button{border-radius:11px;padding:8px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.q{font-size:26px;letter-spacing:-.01em;line-height:1.35}
.q .blank{border-bottom:3px solid var(--mark);min-width:64px}
.opt{border-radius:18px;padding:16px 18px;font-size:18px;border-width:1.5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.inp{border-radius:18px;padding:16px;font-size:19px;border-width:1.5px}
.tile{border-radius:14px;padding:10px 14px;font-size:18px;box-shadow:0 2px 0 var(--line)}
.tiles.line{border-bottom:2px solid var(--line)}
.say{width:88px;height:88px;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.foot{border-top:0;border-radius:28px 28px 0 0;box-shadow:0 -12px 36px var(--shadow)}
.foot .wrap{padding-block:18px 14px}
.verdict{font-size:20px;letter-spacing:-.01em}
.right{font-size:19px}
.btn.big{border-radius:18px;padding:16px 18px;font-size:17px}
.stat{border-radius:var(--r);padding:16px;border-color:transparent;box-shadow:0 1px 2px rgba(18,21,27,.05),0 0 0 1px var(--line)}
.stat .v{font-size:30px;letter-spacing:-.03em}
.stat .l{font-size:13px}
.days i{background:var(--accent);border-radius:6px 6px 2px 2px}
#tip{border-radius:18px;padding:14px 16px;box-shadow:0 12px 32px var(--shadow)}
select{border-radius:14px}

/* extended reference */
.more{padding:0;overflow:hidden;min-width:0;max-width:100%}
.more>summary{list-style:none;cursor:pointer;padding:15px 44px 15px 16px;position:relative;display:grid;gap:2px}
.more>summary::-webkit-details-marker{display:none}
.more>summary b{font-size:16px}
.more>summary span{font-size:13px;color:var(--muted)}
.more>summary::after{content:'';position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .15s}
.more[open]>summary::after{transform:translateY(-30%) rotate(-135deg)}
.more[open]>summary{border-bottom:1px solid var(--line)}

{id:'be1',ru:"Глагол to be: утверждение",en:"am / is / are",
 th:{ru:`<p>Глагол <b>to be</b> («быть, являться, находиться») в настоящем времени имеет три формы.</p>
<table><tr><th>Кто</th><th>Форма</th><th>Коротко</th></tr>
<tr><td>I</td><td><span class="en">I am</span></td><td>I'm</td></tr>
<tr><td>he / she / it</td><td><span class="en">she is</span></td><td>he's, she's, it's</td></tr>
<tr><td>we / you / they</td><td><span class="en">they are</span></td><td>we're, you're, they're</td></tr></table>
<p>По-русски мы говорим «Я студент», «Она дома» — без глагола. В английском предложении глагол обязателен:</p>
<ul><li><span class="en">I am a student.</span> — Я студент.</li><li><span class="en">She is at home.</span> — Она дома.</li><li><span class="en">My friends are from Kazan.</span> — Мои друзья из Казани.</li></ul>
<p>Одно существительное (my brother, the car) = he/she/it → <b>is</b>. Несколько (my friends, the books) = they → <b>are</b>.</p>`,
 en:`<p>The verb <b>to be</b> has three present forms.</p>
<table><tr><th>Subject</th><th>Form</th><th>Short</th></tr>
<tr><td>I</td><td><span class="en">I am</span></td><td>I'm</td></tr>
<tr><td>he / she / it</td><td><span class="en">she is</span></td><td>he's, she's, it's</td></tr>
<tr><td>we / you / they</td><td><span class="en">they are</span></td><td>we're, you're, they're</td></tr></table>
<p>Russian drops this verb; English never does:</p>
<ul><li><span class="en">I am a student.</span></li><li><span class="en">She is at home.</span></li><li><span class="en">My friends are from Kazan.</span></li></ul>
<p>One noun (my brother, the car) → <b>is</b>. A plural noun (my friends, the books) → <b>are</b>.</p>`},

{id:'be2',ru:"Глагол to be: отрицание и вопрос",en:"am / is / are: negatives and questions",
 th:{ru:`<p><b>Отрицание:</b> после be ставим <b>not</b>.</p>
<ul><li><span class="en">I am not ready.</span> (I'm not)</li><li><span class="en">He is not at home.</span> (isn't)</li><li><span class="en">They are not students.</span> (aren't)</li></ul>
<p>Формы «amn't» не существует — только <b>I'm not</b>.</p>
<p><b>Вопрос:</b> be переходит на первое место, перед подлежащим.</p>
<ul><li><span class="en">Is she at home?</span></li><li><span class="en">Are you ready?</span></li></ul>
<p>Вопросительное слово ставится ещё раньше: <span class="en">Where is my phone?</span> <span class="en">What is your name?</span></p>
<p><b>Краткий ответ</b> повторяет be: <span class="en">Yes, I am.</span> <span class="en">No, he isn't.</span> В ответе «да» сокращать нельзя: <span class="bad">Yes, I'm.</span></p>`,
 en:`<p><b>Negative:</b> put <b>not</b> after be.</p>
<ul><li><span class="en">I am not ready.</span> (I'm not)</li><li><span class="en">He is not at home.</span> (isn't)</li><li><span class="en">They are not students.</span> (aren't)</li></ul>
<p><b>Question:</b> be moves in front of the subject.</p>
<ul><li><span class="en">Is she at home?</span></li><li><span class="en">Are you ready?</span></li></ul>
<p>A question word goes first: <span class="en">Where is my phone?</span> <span class="en">What is your name?</span></p>
<p><b>Short answers</b> repeat be: <span class="en">Yes, I am.</span> <span class="en">No, he isn't.</span> No short form after yes: <span class="bad">Yes, I'm.</span></p>`},
 rules:{a:{ru:'Отрицание: be + not (isn\'t, aren\'t, I\'m not).',en:'Negative: be + not (isn\'t, aren\'t, I\'m not).'},

  c:{ru:'Краткий ответ повторяет ту же форму be: Yes, they are. / No, it isn\'t.',en:'A short answer repeats the same form of be: Yes, they are. / No, it isn\'t.'},
  d:{ru:'Порядок: вопросительное слово + be + подлежащее.',en:'Order: question word + be + subject.'}},

{id:'pc1',ru:"Настоящее длительное: утверждение",en:"Present Continuous: I am doing",
 th:{ru:`<p><b>Present Continuous</b> — действие происходит прямо сейчас. Форма: <b>am / is / are + глагол с -ing</b>.</p>
<ul><li><span class="en">I am working.</span> — Я работаю (сейчас).</li><li><span class="en">She is reading a book.</span></li><li><span class="en">They are playing football.</span></li></ul>
<p>Нужны обе части. <span class="bad">She reading.</span> и <span class="bad">She is read.</span> — ошибки.</p>
<p><b>Как писать -ing:</b></p>
<table><tr><td>обычно</td><td>work → working, read → reading</td></tr>
<tr><td>-e на конце убираем</td><td>make → making, write → writing</td></tr>
<tr><td>краткая гласная + одна согласная: удваиваем</td><td>run → running, sit → sitting, swim → swimming</td></tr></table>
<p>Согласная удваивается только в ударном слоге: open → opening, visit → visiting.</p>
<p>Слова-подсказки: <b>now, at the moment, Look!, Listen!</b></p>`,
 en:`<p><b>Present Continuous</b> is for something happening right now. Form: <b>am / is / are + verb-ing</b>.</p>
<ul><li><span class="en">I am working.</span></li><li><span class="en">She is reading a book.</span></li><li><span class="en">They are playing football.</span></li></ul>
<p>You need both parts. <span class="bad">She reading.</span> and <span class="bad">She is read.</span> are wrong.</p>
<p><b>Spelling of -ing:</b></p>
<table><tr><td>usually</td><td>work → working, read → reading</td></tr>
<tr><td>drop final -e</td><td>make → making, write → writing</td></tr>
<tr><td>short vowel + one consonant: double it</td><td>run → running, sit → sitting, swim → swimming</td></tr></table>
<p>The consonant doubles only in a stressed syllable: open → opening, visit → visiting.</p>
<p>Signal words: <b>now, at the moment, Look!, Listen!</b></p>`},

  c:{ru:'now / at the moment / Look! — действие прямо сейчас, нужен Continuous.',en:'now / at the moment / Look! — happening right now, so use the Continuous.'}},

{id:'pc2',ru:"Настоящее длительное: отрицание и вопрос",en:"Present Continuous: negatives and questions",
 th:{ru:`<p><b>Отрицание:</b> not после be.</p>
<ul><li><span class="en">I'm not working today.</span></li><li><span class="en">He isn't sleeping.</span></li><li><span class="en">We aren't watching TV.</span></li></ul>
<p><b>Вопрос:</b> be перед подлежащим.</p>
<ul><li><span class="en">Are you listening?</span></li><li><span class="en">Is it raining?</span></li></ul>
<p>С вопросительным словом: <b>слово + be + подлежащее + -ing</b>.</p>
<ul><li><span class="en">What are you doing?</span></li><li><span class="en">Where is she going?</span></li></ul>
<p>Типичная ошибка — русский порядок слов: <span class="bad">What you are doing?</span></p>
<p>Здесь не нужны do / does: <span class="bad">Do you listening?</span></p>`,
 en:`<p><b>Negative:</b> not after be.</p>
<ul><li><span class="en">I'm not working today.</span></li><li><span class="en">He isn't sleeping.</span></li><li><span class="en">We aren't watching TV.</span></li></ul>
<p><b>Question:</b> be before the subject.</p>
<ul><li><span class="en">Are you listening?</span></li><li><span class="en">Is it raining?</span></li></ul>
<p>With a question word: <b>word + be + subject + -ing</b>.</p>
<ul><li><span class="en">What are you doing?</span></li><li><span class="en">Where is she going?</span></li></ul>
<p>Common mistake: <span class="bad">What you are doing?</span> And no do / does here: <span class="bad">Do you listening?</span></p>`},

{id:'ps1',ru:"Настоящее простое: утверждение",en:"Present Simple: I do / he does",
 th:{ru:`<p><b>Present Simple</b> — привычки, регулярные действия, факты. Не «сейчас», а «вообще».</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I work</span></td><td><span class="en">he works</span></td></tr>
<tr><td><span class="en">they live</span></td><td><span class="en">she lives</span></td></tr></table>
<p>Для he / she / it к глаголу добавляется <b>-s</b>. Это самая частая ошибка русскоязычных.</p>
<table><tr><td>после -s, -sh, -ch, -x, -o → -es</td><td>watch → watches, go → goes, do → does</td></tr>
<tr><td>согласная + y → -ies</td><td>study → studies (но play → plays)</td></tr>
<tr><td>особая форма</td><td>have → has</td></tr></table>
<p>Слова <b>always, usually, often, sometimes, never</b> стоят перед глаголом: <span class="en">She often reads.</span> <span class="en">I never drink coffee.</span> Но после be: <span class="en">He is always late.</span></p>`,
 en:`<p><b>Present Simple</b> is for habits, repeated actions and facts — things that are true in general.</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I work</span></td><td><span class="en">he works</span></td></tr>
<tr><td><span class="en">they live</span></td><td><span class="en">she lives</span></td></tr></table>
<p>After he / she / it the verb takes <b>-s</b>.</p>
<table><tr><td>after -s, -sh, -ch, -x, -o → -es</td><td>watch → watches, go → goes, do → does</td></tr>
<tr><td>consonant + y → -ies</td><td>study → studies (but play → plays)</td></tr>
<tr><td>irregular</td><td>have → has</td></tr></table>
<p><b>always, usually, often, sometimes, never</b> go before the verb: <span class="en">She often reads.</span> <span class="en">I never drink coffee.</span> But after be: <span class="en">He is always late.</span></p>`},
 rules:{a:{ru:'he / she / it → глагол + -s. I / you / we / they → без окончания.',en:'he / she / it → verb + -s. I / you / we / they → no ending.'},
  b:{ru:'-es после s / sh / ch / x / o; согласная + y → -ies; have → has.',en:'-es after s / sh / ch / x / o; consonant + y → -ies; have → has.'},
  c:{ru:'always / usually / often / never стоят перед основным глаголом.',en:'always / usually / often / never go before the main verb.'},

{id:'ps2',ru:"Настоящее простое: отрицание",en:"Present Simple: I don't / he doesn't",
 th:{ru:`<p>Отрицание в Present Simple строится с помощью <b>do not / does not</b>.</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I don't work</span></td><td><span class="en">he doesn't work</span></td></tr>
<tr><td><span class="en">they don't know</span></td><td><span class="en">she doesn't know</span></td></tr></table>
<p>После <b>doesn't</b> глагол стоит без -s: окончание уже «ушло» в does.</p>
<ul><li><span class="en">She likes tea.</span> → <span class="en">She doesn't like tea.</span></li><li><span class="bad">She doesn't likes tea.</span></li></ul>
<p>Не путай с be: <span class="en">I'm not tired.</span> (прилагательное) — <span class="en">I don't work.</span> (глагол).</p>`,
 en:`<p>The Present Simple negative uses <b>do not / does not</b>.</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I don't work</span></td><td><span class="en">he doesn't work</span></td></tr>
<tr><td><span class="en">they don't know</span></td><td><span class="en">she doesn't know</span></td></tr></table>
<p>After <b>doesn't</b> the verb has no -s: the ending is already in does.</p>
<ul><li><span class="en">She likes tea.</span> → <span class="en">She doesn't like tea.</span></li><li><span class="bad">She doesn't likes tea.</span></li></ul>
<p>Don't mix it up with be: <span class="en">I'm not tired.</span> (adjective) — <span class="en">I don't work.</span> (verb).</p>`},

  c:{ru:"После doesn't глагол без -s: doesn't like, doesn't have.",en:"No -s after doesn't: doesn't like, doesn't have."}},

{id:'ps3',ru:"Настоящее простое: вопрос",en:"Present Simple: Do you…? Does he…?",
 th:{ru:`<p>Вопрос в Present Simple начинается с <b>do / does</b>.</p>
<table><tr><th>do</th><th>I / you / we / they</th><td><span class="en">Do you work?</span></td></tr>
<tr><th>does</th><th>he / she / it</th><td><span class="en">Does she work?</span></td></tr></table>
<p>После does глагол без -s: <span class="bad">Does she works?</span></p>
<p>Порядок слов всегда один: <b>(вопросительное слово) + do / does + подлежащее + глагол</b>.</p>
<ul><li><span class="en">Where do you live?</span></li><li><span class="en">What time does the film start?</span></li><li><span class="en">How often do they play?</span></li></ul>
<p>По-русски можно спросить «Где ты живёшь?» без вспомогательного слова, по-английски нельзя: <span class="bad">Where you live?</span></p>
<p>Краткий ответ: <span class="en">Yes, I do.</span> <span class="en">No, she doesn't.</span></p>`,
 en:`<p>A Present Simple question starts with <b>do / does</b>.</p>
<table><tr><th>do</th><th>I / you / we / they</th><td><span class="en">Do you work?</span></td></tr>
<tr><th>does</th><th>he / she / it</th><td><span class="en">Does she work?</span></td></tr></table>
<p>No -s after does: <span class="bad">Does she works?</span></p>
<p>Word order: <b>(question word) + do / does + subject + verb</b>.</p>
<ul><li><span class="en">Where do you live?</span></li><li><span class="en">What time does the film start?</span></li><li><span class="en">How often do they play?</span></li></ul>
<p>You cannot leave out do: <span class="bad">Where you live?</span></p>
<p>Short answers: <span class="en">Yes, I do.</span> <span class="en">No, she doesn't.</span></p>`},
 rules:{a:{ru:'Do → I / you / we / they. Does → he / she / it.',en:'Do → I / you / we / they. Does → he / she / it.'},
  b:{ru:'После does глагол без -s: Does she work?',en:'No -s after does: Does she work?'},
  c:{ru:'Вопросительное слово + do / does + подлежащее + глагол.',en:'Question word + do / does + subject + verb.'},
  d:{ru:'Краткий ответ повторяет do / does: Yes, I do. / No, she doesn\'t.',en:'A short answer repeats do / does: Yes, I do. / No, she doesn\'t.'}},

{id:'pcps',ru:"Длительное или простое: что выбрать",en:"Present Continuous or Present Simple?",
 th:{ru:`<p>Главный вопрос: действие идёт <b>сейчас</b> или происходит <b>вообще, регулярно</b>?</p>
<table><tr><th>Present Continuous</th><th>Present Simple</th></tr>
<tr><td>сейчас, в данный момент, временно</td><td>обычно, всегда, факт</td></tr>
<tr><td><span class="en">I'm working now.</span></td><td><span class="en">I work every day.</span></td></tr>
<tr><td><span class="en">Look! It's snowing.</span></td><td><span class="en">It often snows in winter.</span></td></tr>
<tr><td>now, at the moment, today, Look!</td><td>always, usually, often, never, every day</td></tr></table>
<p><b>Глаголы состояния</b> обычно не употребляются в Continuous, даже если речь о «сейчас»: like, love, hate, want, need, know, understand, believe, remember, prefer, mean.</p>
<ul><li><span class="en">I want a coffee now.</span> <span class="bad">I'm wanting</span></li><li><span class="en">I don't understand.</span> <span class="bad">I'm not understanding</span></li></ul>`,
 en:`<p>The key question: is it happening <b>now</b>, or is it true <b>in general</b>?</p>
<table><tr><th>Present Continuous</th><th>Present Simple</th></tr>
<tr><td>now, at this moment, temporary</td><td>usually, always, a fact</td></tr>
<tr><td><span class="en">I'm working now.</span></td><td><span class="en">I work every day.</span></td></tr>
<tr><td><span class="en">Look! It's snowing.</span></td><td><span class="en">It often snows in winter.</span></td></tr>
<tr><td>now, at the moment, today, Look!</td><td>always, usually, often, never, every day</td></tr></table>
<p><b>State verbs</b> are not normally used in the Continuous, even for «now»: like, love, hate, want, need, know, understand, believe, remember, prefer, mean.</p>
<ul><li><span class="en">I want a coffee now.</span> <span class="bad">I'm wanting</span></li><li><span class="en">I don't understand.</span> <span class="bad">I'm not understanding</span></li></ul>`},
 rules:{a:{ru:'now / at the moment / today / Look! → действие сейчас → Continuous.',en:'now / at the moment / today / Look! → happening now → Continuous.'},
  b:{ru:'every day / usually / often / never → привычка → Simple.',en:'every day / usually / often / never → habit → Simple.'},
  c:{ru:'like, want, know, understand, need — глаголы состояния: только Simple.',en:'like, want, know, understand, need are state verbs: Simple only.'}},

{id:'hgot',ru:"У меня есть: have got",en:"have got / has got",
 th:{ru:`<p><b>have got</b> = «иметь», «у меня есть».</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I have got a car.</span> (I've got)</td><td><span class="en">She has got a car.</span> (she's got)</td></tr>
<tr><td><span class="en">We haven't got time.</span></td><td><span class="en">He hasn't got time.</span></td></tr>
<tr><td><span class="en">Have you got a pen?</span></td><td><span class="en">Has she got a pen?</span></td></tr></table>
<p>То же самое можно сказать просто с <b>have</b>, но тогда вопрос и отрицание строятся через do / does:</p>
<ul><li><span class="en">I have a car.</span></li><li><span class="en">Do you have a car?</span></li><li><span class="en">She doesn't have a car.</span></li></ul>
<p>Смешивать два способа нельзя: <span class="bad">Do you have got a pen?</span></p>`,
 en:`<p><b>have got</b> means «to have, to own».</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I have got a car.</span> (I've got)</td><td><span class="en">She has got a car.</span> (she's got)</td></tr>
<tr><td><span class="en">We haven't got time.</span></td><td><span class="en">He hasn't got time.</span></td></tr>
<tr><td><span class="en">Have you got a pen?</span></td><td><span class="en">Has she got a pen?</span></td></tr></table>
<p>You can say the same with plain <b>have</b>, but then questions and negatives use do / does:</p>
<ul><li><span class="en">I have a car.</span></li><li><span class="en">Do you have a car?</span></li><li><span class="en">She doesn't have a car.</span></li></ul>
<p>Don't mix the two patterns: <span class="bad">Do you have got a pen?</span></p>`},

{ru:'Прошедшее время',en:'Past',units:[
{id:'was',ru:"Глагол to be в прошедшем времени",en:"was / were",
 th:{ru:`<p><b>was / were</b> — прошедшее время глагола be: «был, была, были».</p>
<table><tr><th>I / he / she / it</th><th>we / you / they</th></tr>
<tr><td><span class="en">I was at home.</span></td><td><span class="en">We were at home.</span></td></tr>
<tr><td><span class="en">She wasn't late.</span></td><td><span class="en">They weren't late.</span></td></tr>
<tr><td><span class="en">Was he there?</span></td><td><span class="en">Were you there?</span></td></tr></table>
<p>Отрицание и вопрос строятся как у am / is / are: not после глагола, а в вопросе глагол перед подлежащим. Вспомогательный did не нужен.</p>
<p>Слова-подсказки прошедшего: <b>yesterday, last night, last week, two days ago, in 2020</b>.</p>
<p>Полезная фраза: <span class="en">I was born in 2005.</span> — Я родился в 2005 году.</p>`,
 en:`<p><b>was / were</b> is the past of be.</p>
<table><tr><th>I / he / she / it</th><th>we / you / they</th></tr>
<tr><td><span class="en">I was at home.</span></td><td><span class="en">We were at home.</span></td></tr>
<tr><td><span class="en">She wasn't late.</span></td><td><span class="en">They weren't late.</span></td></tr>
<tr><td><span class="en">Was he there?</span></td><td><span class="en">Were you there?</span></td></tr></table>
<p>Negatives and questions work like am / is / are: not after the verb; the verb before the subject in a question. No did.</p>
<p>Past signal words: <b>yesterday, last night, last week, two days ago, in 2020</b>.</p>
<p>Useful phrase: <span class="en">I was born in 2005.</span></p>`},
 rules:{a:{ru:'I / he / she / it → was; we / you / they → were.',en:'I / he / she / it → was; we / you / they → were.'},
  b:{ru:'Отрицание: wasn\'t / weren\'t. Вопрос: Was / Were + подлежащее. Без did.',en:'Negative: wasn\'t / weren\'t. Question: Was / Were + subject. No did.'},
  c:{ru:'yesterday / last … / … ago → прошедшее время.',en:'yesterday / last … / … ago → past tense.'}},

{id:'past1',ru:"Прошедшее простое: утверждение",en:"Past Simple: worked, went",
 th:{ru:`<p><b>Past Simple</b> — законченное действие в прошлом. Форма одна для всех лиц: I worked, she worked, they worked.</p>
<p><b>Правильные глаголы:</b> + <b>-ed</b>.</p>
<table><tr><td>обычно</td><td>work → worked, watch → watched</td></tr>
<tr><td>на -e: только -d</td><td>live → lived, like → liked</td></tr>
<tr><td>согласная + y → -ied</td><td>study → studied (но play → played)</td></tr>
<tr><td>краткая ударная гласная + согласная: удвоение</td><td>stop → stopped, plan → planned (но open → opened)</td></tr></table>
<p><b>Неправильные глаголы</b> имеют свою форму, её нужно запомнить:</p>
<table><tr><td>go → <b>went</b></td><td>have → <b>had</b></td><td>see → <b>saw</b></td></tr>
<tr><td>come → <b>came</b></td><td>buy → <b>bought</b></td><td>make → <b>made</b></td></tr>
<tr><td>eat → <b>ate</b></td><td>write → <b>wrote</b></td><td>get → <b>got</b></td></tr>
<tr><td>take → <b>took</b></td><td>say → <b>said</b></td><td>do → <b>did</b></td></tr>
<tr><td>give → <b>gave</b></td><td>find → <b>found</b></td><td>know → <b>knew</b></td></tr></table>
<ul><li><span class="en">I watched a film yesterday.</span></li><li><span class="en">We went to the cinema last week.</span></li></ul>`,
 en:`<p><b>Past Simple</b> is for a finished action in the past. One form for every person: I worked, she worked, they worked.</p>
<p><b>Regular verbs:</b> + <b>-ed</b>.</p>
<table><tr><td>usually</td><td>work → worked, watch → watched</td></tr>
<tr><td>ends in -e: just -d</td><td>live → lived, like → liked</td></tr>
<tr><td>consonant + y → -ied</td><td>study → studied (but play → played)</td></tr>
<tr><td>short stressed vowel + consonant: double it</td><td>stop → stopped, plan → planned (but open → opened)</td></tr></table>
<p><b>Irregular verbs</b> have their own form, which you have to learn:</p>
<table><tr><td>go → <b>went</b></td><td>have → <b>had</b></td><td>see → <b>saw</b></td></tr>
<tr><td>come → <b>came</b></td><td>buy → <b>bought</b></td><td>make → <b>made</b></td></tr>
<tr><td>eat → <b>ate</b></td><td>write → <b>wrote</b></td><td>get → <b>got</b></td></tr>
<tr><td>take → <b>took</b></td><td>say → <b>said</b></td><td>do → <b>did</b></td></tr>
<tr><td>give → <b>gave</b></td><td>find → <b>found</b></td><td>know → <b>knew</b></td></tr></table>
<ul><li><span class="en">I watched a film yesterday.</span></li><li><span class="en">We went to the cinema last week.</span></li></ul>`},

{id:'past2',ru:"Прошедшее простое: отрицание и вопрос",en:"Past Simple: didn't / Did you…?",
 th:{ru:`<p>Отрицание и вопрос в Past Simple строятся с <b>did</b> — для всех лиц одинаково.</p>
<table><tr><th>Отрицание</th><td><span class="en">I didn't go.</span></td><td><span class="en">She didn't call.</span></td></tr>
<tr><th>Вопрос</th><td><span class="en">Did you go?</span></td><td><span class="en">Did she call?</span></td></tr></table>
<p>После did / didn't глагол возвращается в первую форму: прошедшее время уже показано словом did.</p>
<ul><li><span class="en">He went.</span> → <span class="en">He didn't go.</span> <span class="bad">He didn't went.</span></li><li><span class="en">You saw it.</span> → <span class="en">Did you see it?</span> <span class="bad">Did you saw it?</span></li></ul>
<p>С вопросительным словом: <span class="en">What did you say?</span> <span class="en">Where did they go?</span></p>
<p>Краткий ответ: <span class="en">Yes, I did.</span> <span class="en">No, she didn't.</span></p>
<p>С was / were did не нужен: <span class="en">Were you at home?</span> <span class="en">I wasn't there.</span></p>`,
 en:`<p>Past Simple negatives and questions use <b>did</b> — the same for every person.</p>
<table><tr><th>Negative</th><td><span class="en">I didn't go.</span></td><td><span class="en">She didn't call.</span></td></tr>
<tr><th>Question</th><td><span class="en">Did you go?</span></td><td><span class="en">Did she call?</span></td></tr></table>
<p>After did / didn't the verb goes back to its base form: did already shows the past.</p>
<ul><li><span class="en">He went.</span> → <span class="en">He didn't go.</span> <span class="bad">He didn't went.</span></li><li><span class="en">You saw it.</span> → <span class="en">Did you see it?</span> <span class="bad">Did you saw it?</span></li></ul>
<p>With a question word: <span class="en">What did you say?</span> <span class="en">Where did they go?</span></p>
<p>Short answers: <span class="en">Yes, I did.</span> <span class="en">No, she didn't.</span></p>
<p>No did with was / were: <span class="en">Were you at home?</span> <span class="en">I wasn't there.</span></p>`},

  b:{ru:'Вопрос: (вопросительное слово) + did + подлежащее + первая форма.',en:'Question: (question word) + did + subject + base form.'},
  c:{ru:'После did / didn\'t — первая форма: go, see, buy (не went, saw, bought).',en:'After did / didn\'t use the base form: go, see, buy (not went, saw, bought).'},
  d:{ru:'С was / were вспомогательный did не используется.',en:'No did with was / were.'}},

{id:'pastc',ru:"Прошедшее длительное",en:"Past Continuous: I was doing",
 th:{ru:`<p><b>Past Continuous</b> — действие было в процессе в какой-то момент прошлого. Форма: <b>was / were + глагол с -ing</b>.</p>
<table><tr><th>I / he / she / it</th><th>we / you / they</th></tr>
<tr><td><span class="en">I was working.</span></td><td><span class="en">They were working.</span></td></tr>
<tr><td><span class="en">She wasn't sleeping.</span></td><td><span class="en">We weren't sleeping.</span></td></tr>
<tr><td><span class="en">Was he listening?</span></td><td><span class="en">Were you listening?</span></td></tr></table>
<p>Момент обычно назван или понятен: <b>at 8 o'clock, at that moment, at this time yesterday, all evening</b>.</p>
<ul><li><span class="en">At eight o'clock I was having dinner.</span> — В восемь я ужинал (был в процессе).</li><li><span class="en">What were you doing at midnight?</span></li></ul>
<p>Сравни: <span class="en">I had dinner at eight.</span> — поужинал (факт), <span class="en">I was having dinner at eight.</span> — в восемь сидел за ужином.</p>`,
 en:`<p><b>Past Continuous</b>: an action was in progress at some moment in the past. Form: <b>was / were + verb-ing</b>.</p>
<table><tr><th>I / he / she / it</th><th>we / you / they</th></tr>
<tr><td><span class="en">I was working.</span></td><td><span class="en">They were working.</span></td></tr>
<tr><td><span class="en">She wasn't sleeping.</span></td><td><span class="en">We weren't sleeping.</span></td></tr>
<tr><td><span class="en">Was he listening?</span></td><td><span class="en">Were you listening?</span></td></tr></table>
<p>The moment is usually given or clear: <b>at 8 o'clock, at that moment, at this time yesterday, all evening</b>.</p>
<ul><li><span class="en">At eight o'clock I was having dinner.</span></li><li><span class="en">What were you doing at midnight?</span></li></ul>
<p>Compare: <span class="en">I had dinner at eight.</span> (a fact) and <span class="en">I was having dinner at eight.</span> (in the middle of it).</p>`},
 rules:{a:{ru:'was / were + глагол с -ing: I / he / she / it was, we / you / they were.',en:'was / were + verb-ing: I / he / she / it was, we / you / they were.'},
  b:{ru:"Отрицание: wasn't / weren't + -ing. Вопрос: Was / Were + подлежащее + -ing. Без did.",en:"Negative: wasn't / weren't + -ing. Question: Was / Were + subject + -ing. No did."},
  c:{ru:'Действие длилось в конкретный момент прошлого: at 8 o\'clock, at that moment, all evening.',en:'The action was in progress at a specific past moment: at 8 o\'clock, at that moment, all evening.'}},

{id:'pastcs',ru:"Прошедшее длительное или простое",en:"Past Continuous or Past Simple?",
 th:{ru:`<p>Два прошедших времени часто стоят рядом в одном предложении.</p>
<table><tr><th>Past Continuous</th><th>Past Simple</th></tr>
<tr><td>фон, длительный процесс</td><td>короткое событие, законченный факт</td></tr>
<tr><td><span class="en">I was cooking</span></td><td><span class="en">when the phone rang.</span></td></tr>
<tr><td><span class="en">It was raining</span></td><td><span class="en">when I woke up.</span></td></tr></table>
<p>Длинное действие шло, короткое его прервало или случилось на его фоне. После <b>while</b> обычно Continuous, после <b>when</b> — Simple:</p>
<ul><li><span class="en">While I was walking home, I met Tom.</span></li><li><span class="en">I was walking home when I met Tom.</span></li></ul>
<p>Действия одно за другим — все в Past Simple: <span class="en">He came home, had dinner and went to bed.</span></p>
<p>Глаголы состояния и в прошедшем не ставятся в Continuous: <span class="en">I knew the answer.</span> <span class="bad">I was knowing</span></p>`,
 en:`<p>The two past tenses often appear together in one sentence.</p>
<table><tr><th>Past Continuous</th><th>Past Simple</th></tr>
<tr><td>background, a longer action in progress</td><td>a short event, a finished fact</td></tr>
<tr><td><span class="en">I was cooking</span></td><td><span class="en">when the phone rang.</span></td></tr>
<tr><td><span class="en">It was raining</span></td><td><span class="en">when I woke up.</span></td></tr></table>
<p>The long action was going on; the short one interrupted it. After <b>while</b> we usually use the Continuous, after <b>when</b> the Simple:</p>
<ul><li><span class="en">While I was walking home, I met Tom.</span></li><li><span class="en">I was walking home when I met Tom.</span></li></ul>
<p>Actions one after another are all Past Simple: <span class="en">He came home, had dinner and went to bed.</span></p>
<p>State verbs are not used in the Continuous in the past either: <span class="en">I knew the answer.</span> <span class="bad">I was knowing</span></p>`},
 rules:{a:{ru:'Длительный фон → was / were doing. Короткое событие на этом фоне → Past Simple.',en:'A longer background action → was / were doing. A short event during it → Past Simple.'},
  b:{ru:'Действия одно за другим → все в Past Simple.',en:'Actions one after another → all in the Past Simple.'},
  c:{ru:'После while обычно Continuous, после when — Simple.',en:'After while we usually use the Continuous, after when the Simple.'},
  d:{ru:'know, want, like, need — состояния: только Simple (I knew, I wanted).',en:'know, want, like, need are state verbs: Simple only (I knew, I wanted).'}},

{ru:'Настоящее совершённое',en:'Present Perfect',units:[
{id:'pp1',ru:"Настоящее совершённое",en:"Present Perfect: I have done",
 th:{ru:`<p><b>Present Perfect</b> связывает прошлое с настоящим: действие произошло, и нам важен результат сейчас. Когда именно — не говорится.</p>
<p>Форма: <b>have / has + третья форма глагола</b>.</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I have finished.</span> (I've)</td><td><span class="en">She has finished.</span> (she's)</td></tr>
<tr><td><span class="en">We haven't finished.</span></td><td><span class="en">He hasn't finished.</span></td></tr>
<tr><td><span class="en">Have you finished?</span></td><td><span class="en">Has she finished?</span></td></tr></table>
<p>Третья форма правильных глаголов — та же <b>-ed</b>: worked, finished, closed. У неправильных её нужно учить:</p>
<table><tr><td>do → did → <b>done</b></td><td>see → saw → <b>seen</b></td><td>go → went → <b>gone</b></td></tr>
<tr><td>write → wrote → <b>written</b></td><td>eat → ate → <b>eaten</b></td><td>take → took → <b>taken</b></td></tr>
<tr><td>break → broke → <b>broken</b></td><td>buy → bought → <b>bought</b></td><td>have → had → <b>had</b></td></tr>
<tr><td>lose → lost → <b>lost</b></td><td>find → found → <b>found</b></td><td>read → read → <b>read</b></td></tr></table>
<ul><li><span class="en">I have lost my keys.</span> — Я потерял ключи (и сейчас их нет).</li><li><span class="en">The taxi has arrived.</span> — Такси приехало (оно здесь).</li></ul>`,
 en:`<p><b>Present Perfect</b> links the past to the present: something happened and the result matters now. We don't say when.</p>
<p>Form: <b>have / has + past participle</b>.</p>
<table><tr><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><span class="en">I have finished.</span> (I've)</td><td><span class="en">She has finished.</span> (she's)</td></tr>
<tr><td><span class="en">We haven't finished.</span></td><td><span class="en">He hasn't finished.</span></td></tr>
<tr><td><span class="en">Have you finished?</span></td><td><span class="en">Has she finished?</span></td></tr></table>
<p>For regular verbs the participle is the same <b>-ed</b> form: worked, finished, closed. Irregular ones have to be learned:</p>
<table><tr><td>do → did → <b>done</b></td><td>see → saw → <b>seen</b></td><td>go → went → <b>gone</b></td></tr>
<tr><td>write → wrote → <b>written</b></td><td>eat → ate → <b>eaten</b></td><td>take → took → <b>taken</b></td></tr>
<tr><td>break → broke → <b>broken</b></td><td>buy → bought → <b>bought</b></td><td>have → had → <b>had</b></td></tr>
<tr><td>lose → lost → <b>lost</b></td><td>find → found → <b>found</b></td><td>read → read → <b>read</b></td></tr></table>
<ul><li><span class="en">I have lost my keys.</span> (I don't have them now.)</li><li><span class="en">The taxi has arrived.</span> (It is here.)</li></ul>`},
 rules:{a:{ru:'have / has + третья форма глагола; he / she / it → has.',en:'have / has + past participle; he / she / it → has.'},
  b:{ru:'Третья форма: у правильных -ed; у неправильных своя: done, seen, gone, written, eaten, bought, broken.',en:'Past participle: -ed for regular verbs; irregular ones differ: done, seen, gone, written, eaten, bought, broken.'},

  d:{ru:'Важен результат сейчас, а время действия не названо → Present Perfect.',en:'The result matters now and no time is given → Present Perfect.'}},

{id:'pp2',ru:"Совершённое или прошедшее простое",en:"Present Perfect or Past Simple?",
 th:{ru:`<p>Главный вопрос: названо ли законченное время?</p>
<table><tr><th>Past Simple</th><th>Present Perfect</th></tr>
<tr><td>время названо и закончилось: yesterday, last week, in 2019, two days ago, When…?</td><td>время не названо; опыт за всю жизнь; результат сейчас</td></tr>
<tr><td><span class="en">I saw him yesterday.</span></td><td><span class="en">I have seen him before.</span></td></tr>
<tr><td><span class="en">We went to Paris in 2019.</span></td><td><span class="en">We have been to Paris twice.</span></td></tr></table>
<p><b>ever / never</b> — опыт: <span class="en">Have you ever been to London?</span> <span class="en">I have never eaten sushi.</span></p>
<p><b>just</b> (только что) и <b>already</b> (уже) стоят между have и глаголом: <span class="en">She has just left.</span> <span class="en">I have already eaten.</span></p>
<p><b>yet</b> (ещё, уже) — в конце вопросов и отрицаний: <span class="en">Has the bus come yet?</span> <span class="en">I haven't finished yet.</span></p>
<p><b>have been to</b> = побывал где-то: <span class="en">I have been to Italy.</span></p>
<p>Типичная ошибка: <span class="bad">I have seen him yesterday.</span> С yesterday возможен только Past Simple.</p>`,
 en:`<p>The key question: is a finished time given?</p>
<table><tr><th>Past Simple</th><th>Present Perfect</th></tr>
<tr><td>a finished time is given: yesterday, last week, in 2019, two days ago, When…?</td><td>no time given; life experience; a result now</td></tr>
<tr><td><span class="en">I saw him yesterday.</span></td><td><span class="en">I have seen him before.</span></td></tr>
<tr><td><span class="en">We went to Paris in 2019.</span></td><td><span class="en">We have been to Paris twice.</span></td></tr></table>
<p><b>ever / never</b> for experience: <span class="en">Have you ever been to London?</span> <span class="en">I have never eaten sushi.</span></p>
<p><b>just</b> and <b>already</b> go between have and the verb: <span class="en">She has just left.</span> <span class="en">I have already eaten.</span></p>
<p><b>yet</b> goes at the end of questions and negatives: <span class="en">Has the bus come yet?</span> <span class="en">I haven't finished yet.</span></p>
<p><b>have been to</b> = visited a place: <span class="en">I have been to Italy.</span></p>
<p>Common mistake: <span class="bad">I have seen him yesterday.</span> With yesterday only the Past Simple is possible.</p>`},
 rules:{a:{ru:'Названо законченное время (yesterday, last year, ago, When…?) → Past Simple.',en:'A finished time is given (yesterday, last year, ago, When…?) → Past Simple.'},
  b:{ru:'ever / never, «сколько раз» — опыт без даты → Present Perfect.',en:'ever / never, «how many times» — experience with no date → Present Perfect.'},
  c:{ru:'just и already — между have и глаголом; yet — в конце вопроса или отрицания.',en:'just and already go between have and the verb; yet goes at the end of a question or negative.'},
  d:{ru:'have been to = побывал где-то.',en:'have been to = have visited a place.'}},

{ru:'Будущее время',en:'Future',units:[
{id:'gt',ru:"Планы и намерения: «собираюсь»",en:"be going to",
 th:{ru:`<p><b>be going to</b> — «собираюсь»: план или намерение, которое уже решено.</p>
<p>Форма: <b>am / is / are + going to + глагол</b>.</p>
<ul><li><span class="en">I am going to buy a new phone.</span></li><li><span class="en">She is going to see a doctor.</span></li><li><span class="en">We aren't going to move.</span></li><li><span class="en">Are you going to tell him?</span></li><li><span class="en">What are you going to do tonight?</span></li></ul>
<p>После going to глагол всегда в первой форме: <span class="bad">She is going to buys</span></p>
<p>Второе значение — что-то вот-вот случится, и это видно уже сейчас:</p>
<ul><li><span class="en">Look at those clouds! It is going to rain.</span></li></ul>
<p>Не забывай be: <span class="bad">I going to visit them.</span></p>`,
 en:`<p><b>be going to</b> is for a plan or intention that is already decided.</p>
<p>Form: <b>am / is / are + going to + verb</b>.</p>
<ul><li><span class="en">I am going to buy a new phone.</span></li><li><span class="en">She is going to see a doctor.</span></li><li><span class="en">We aren't going to move.</span></li><li><span class="en">Are you going to tell him?</span></li><li><span class="en">What are you going to do tonight?</span></li></ul>
<p>After going to the verb is always the base form: <span class="bad">She is going to buys</span></p>
<p>Second use: something is about to happen and we can already see it:</p>
<ul><li><span class="en">Look at those clouds! It is going to rain.</span></li></ul>
<p>Don't drop be: <span class="bad">I going to visit them.</span></p>`},

  c:{ru:'Заранее решённый план или то, что вот-вот случится по явным признакам.',en:'A plan already decided, or something about to happen that we can see coming.'}},

{id:'will',ru:"Будущее с will: решения, обещания, прогнозы",en:"will",
 th:{ru:`<p><b>will + глагол</b> — будущее, одинаковое для всех лиц. Коротко: <b>'ll</b>, отрицание <b>won't</b> (will not).</p>
<ul><li><span class="en">I will call you.</span> (I'll call you.)</li><li><span class="en">She won't come.</span></li><li><span class="en">Will you be at home?</span></li></ul>
<p>После will нет ни to, ни -s: <span class="bad">She will comes</span>, <span class="bad">I will to help</span></p>
<p>Когда нужен will:</p>
<table><tr><td>решение прямо сейчас</td><td><span class="en">The phone is ringing. I'll answer it.</span></td></tr>
<tr><td>обещание, предложение помощи</td><td><span class="en">I'll help you.</span> <span class="en">I won't tell anyone.</span></td></tr>
<tr><td>мнение о будущем</td><td><span class="en">I think it will rain tomorrow.</span></td></tr></table>
<p>Если план решён заранее, нужен <b>going to</b>: <span class="en">We have tickets. We are going to fly on Friday.</span></p>`,
 en:`<p><b>will + verb</b> is a future form that is the same for every person. Short form: <b>'ll</b>; negative: <b>won't</b> (will not).</p>
<ul><li><span class="en">I will call you.</span> (I'll call you.)</li><li><span class="en">She won't come.</span></li><li><span class="en">Will you be at home?</span></li></ul>
<p>No to and no -s after will: <span class="bad">She will comes</span>, <span class="bad">I will to help</span></p>
<p>When to use will:</p>
<table><tr><td>a decision made right now</td><td><span class="en">The phone is ringing. I'll answer it.</span></td></tr>
<tr><td>a promise or an offer</td><td><span class="en">I'll help you.</span> <span class="en">I won't tell anyone.</span></td></tr>
<tr><td>an opinion about the future</td><td><span class="en">I think it will rain tomorrow.</span></td></tr></table>
<p>For a plan decided earlier use <b>going to</b>: <span class="en">We have tickets. We are going to fly on Friday.</span></p>`},

{ru:'Модальные глаголы',en:'Modal verbs',units:[
{id:'can',ru:'Умею, могу: can и could',en:'can / could',
 th:{ru:`<p><b>can</b> — «могу, умею». После can идёт глагол в первой форме: без to и без -s, одинаково для всех лиц.</p>
<ul><li><span class="en">I can swim.</span></li><li><span class="en">She can speak English.</span> <span class="bad">She cans speak</span> <span class="bad">She can to speak</span></li></ul>
<p>Отрицание — <b>can't</b> (cannot), вопрос — can перед подлежащим:</p>
<ul><li><span class="en">I can't drive.</span></li><li><span class="en">Can you hear me?</span></li></ul>
<p><b>could</b> — прошедшее время от can:</p>
<ul><li><span class="en">I could read when I was five.</span></li><li><span class="en">We couldn't find the hotel.</span></li></ul>
<p><b>Can you…? / Could you…?</b> — просьба. Could звучит вежливее: <span class="en">Could you open the window, please?</span></p>`,
 en:`<p><b>can</b> means ability or possibility. It is followed by the base form: no to, no -s, the same for every person.</p>
<ul><li><span class="en">I can swim.</span></li><li><span class="en">She can speak English.</span> <span class="bad">She cans speak</span> <span class="bad">She can to speak</span></li></ul>
<p>The negative is <b>can't</b> (cannot); in a question can goes before the subject:</p>
<ul><li><span class="en">I can't drive.</span></li><li><span class="en">Can you hear me?</span></li></ul>
<p><b>could</b> is the past of can:</p>
<ul><li><span class="en">I could read when I was five.</span></li><li><span class="en">We couldn't find the hotel.</span></li></ul>
<p><b>Can you…? / Could you…?</b> make a request. Could is more polite: <span class="en">Could you open the window, please?</span></p>`},

  d:{ru:'Can you…? / Could you…? — просьба; could вежливее.',en:'Can you…? / Could you…? make a request; could is more polite.'}},

{id:'must',ru:'Должен, нужно: must и have to',en:'must / have to',
 th:{ru:`<p><b>must</b> и <b>have to</b> — «должен, нужно».</p>
<table><tr><th>must + глагол</th><th>have to / has to + глагол</th></tr>
<tr><td>без to, без -s, для всех лиц одинаково</td><td>как обычный глагол: he has to, вопрос и отрицание через do / does</td></tr>
<tr><td><span class="en">You must stop.</span></td><td><span class="en">She has to get up early.</span></td></tr>
<tr><td></td><td><span class="en">Do you have to work today?</span></td></tr></table>
<p>В утверждениях они близки по смыслу. В отрицаниях смысл разный:</p>
<ul><li><span class="en">You mustn't smoke here.</span> — нельзя, запрещено.</li><li><span class="en">You don't have to come.</span> — не обязательно, можно не приходить.</li></ul>
<p>В прошедшем времени для обоих — <b>had to</b>: <span class="en">I had to work late yesterday.</span></p>`,
 en:`<p><b>must</b> and <b>have to</b> both express necessity.</p>
<table><tr><th>must + verb</th><th>have to / has to + verb</th></tr>
<tr><td>no to, no -s, the same for every person</td><td>behaves like a normal verb: he has to; questions and negatives with do / does</td></tr>
<tr><td><span class="en">You must stop.</span></td><td><span class="en">She has to get up early.</span></td></tr>
<tr><td></td><td><span class="en">Do you have to work today?</span></td></tr></table>
<p>In positive sentences they are close in meaning. The negatives are different:</p>
<ul><li><span class="en">You mustn't smoke here.</span> — it is forbidden.</li><li><span class="en">You don't have to come.</span> — it is not necessary.</li></ul>
<p>The past of both is <b>had to</b>: <span class="en">I had to work late yesterday.</span></p>`},
 rules:{a:{ru:'must + первая форма, без to и без -s.',en:'must + base form, no to and no -s.'},
  b:{ru:'have to / has to + глагол; вопрос и отрицание через do / does.',en:'have to / has to + verb; questions and negatives with do / does.'},
  c:{ru:"mustn't = нельзя. don't have to = не обязательно.",en:"mustn't = it is forbidden. don't have to = it is not necessary."},
  d:{ru:'В прошедшем времени — had to.',en:'The past form is had to.'}},

{id:'should',ru:'Совет: should',en:'should',
 th:{ru:`<p><b>should</b> — совет: «стоит, следует». После should глагол в первой форме, без to и без -s.</p>
<ul><li><span class="en">You should go to bed.</span> — Тебе стоит лечь спать.</li><li><span class="en">He should see a doctor.</span></li></ul>
<p>Отрицание — <b>shouldn't</b>, вопрос — should перед подлежащим:</p>
<ul><li><span class="en">You shouldn't eat so much sugar.</span></li><li><span class="en">Should I call her?</span></li><li><span class="en">What should I do?</span></li></ul>
<p>Часто с <b>I think</b>: <span class="en">I think you should buy it.</span></p>
<p>should мягче, чем must: must — обязанность, should — хорошая идея.</p>
<p>Ошибки: <span class="bad">You should to study.</span> <span class="bad">He shoulds call.</span></p>`,
 en:`<p><b>should</b> gives advice: it is a good idea. It is followed by the base form, no to and no -s.</p>
<ul><li><span class="en">You should go to bed.</span></li><li><span class="en">He should see a doctor.</span></li></ul>
<p>The negative is <b>shouldn't</b>; in a question should goes before the subject:</p>
<ul><li><span class="en">You shouldn't eat so much sugar.</span></li><li><span class="en">Should I call her?</span></li><li><span class="en">What should I do?</span></li></ul>
<p>Often with <b>I think</b>: <span class="en">I think you should buy it.</span></p>
<p>should is softer than must: must is an obligation, should is a good idea.</p>
<p>Mistakes: <span class="bad">You should to study.</span> <span class="bad">He shoulds call.</span></p>`},

  c:{ru:'should — совет («стоит»); must — обязанность.',en:'should is advice; must is an obligation.'}},

{id:'there',ru:'Есть, находится: there is / there are',en:'there is / there are',
 th:{ru:`<p><b>there is / there are</b> сообщает, что что-то где-то есть. По-русски такие фразы начинаются с места: «На столе книга». По-английски — с there.</p>
<table><tr><th>одно</th><th>несколько</th></tr>
<tr><td><span class="en">There is a book on the table.</span></td><td><span class="en">There are two books on the table.</span></td></tr>
<tr><td><span class="en">There isn't a bank here.</span></td><td><span class="en">There aren't any shops here.</span></td></tr>
<tr><td><span class="en">Is there a bank near here?</span></td><td><span class="en">Are there any shops?</span></td></tr></table>
<p>В прошедшем времени: <b>there was / there were</b>. <span class="en">There was a park here.</span> <span class="en">There were a lot of people.</span></p>
<p>Не путай с it is. <span class="en">There is a cat under the bed.</span> — сообщаем, что кошка там есть. <span class="bad">It is a cat under the bed.</span></p>`,
 en:`<p><b>there is / there are</b> says that something exists somewhere.</p>
<table><tr><th>one</th><th>several</th></tr>
<tr><td><span class="en">There is a book on the table.</span></td><td><span class="en">There are two books on the table.</span></td></tr>
<tr><td><span class="en">There isn't a bank here.</span></td><td><span class="en">There aren't any shops here.</span></td></tr>
<tr><td><span class="en">Is there a bank near here?</span></td><td><span class="en">Are there any shops?</span></td></tr></table>
<p>In the past: <b>there was / there were</b>. <span class="en">There was a park here.</span> <span class="en">There were a lot of people.</span></p>
<p>Don't confuse it with it is. <span class="en">There is a cat under the bed.</span> tells us the cat exists there. <span class="bad">It is a cat under the bed.</span></p>`},
 rules:{a:{ru:'there is + единственное число; there are + множественное.',en:'there is + singular; there are + plural.'},
  b:{ru:"Вопрос: Is there…? / Are there…? Отрицание: there isn't / there aren't.",en:"Question: Is there…? / Are there…? Negative: there isn't / there aren't."},
  c:{ru:'В прошедшем: there was / there were.',en:'In the past: there was / there were.'},
  d:{ru:'Сообщаем, что что-то где-то есть → there is, а не it is.',en:'To say that something exists somewhere use there is, not it is.'}},

{id:'art',ru:'Артикли a / an / the',en:'a / an / the',
 th:{ru:`<p>В русском артиклей нет, поэтому это одна из самых трудных тем. Главная идея: понятно ли собеседнику, о каком именно предмете речь?</p>
<table><tr><th>a / an</th><th>the</th><th>без артикля</th></tr>
<tr><td>один из многих, говорим впервые, профессия</td><td>конкретный: уже упоминали, он один такой, ясно из ситуации</td><td>в общем смысле, имена, города</td></tr>
<tr><td><span class="en">I saw a film.</span></td><td><span class="en">The film was great.</span></td><td><span class="en">I like music.</span></td></tr>
<tr><td><span class="en">She is a doctor.</span></td><td><span class="en">Open the window, please.</span></td><td><span class="en">He lives in London.</span></td></tr></table>
<p><b>an</b> ставится перед гласным звуком: <span class="en">an apple</span>, <span class="en">an engineer</span>, <span class="en">an hour</span> (h не читается).</p>
<p><b>the</b> — когда предмет единственный: <span class="en">the sun</span>, <span class="en">the kitchen</span> (в этом доме).</p>
<p>Без артикля — устойчивые выражения: <b>at home, at work, go to bed, have breakfast</b>.</p>
<p>Исчисляемое существительное в единственном числе не может стоять совсем без ничего: <span class="bad">I am student.</span></p>`,
 en:`<p>The main idea: does the listener know exactly which thing you mean?</p>
<table><tr><th>a / an</th><th>the</th><th>no article</th></tr>
<tr><td>one of many, first mention, a job</td><td>a specific one: mentioned before, the only one, clear from the situation</td><td>in general, names, cities</td></tr>
<tr><td><span class="en">I saw a film.</span></td><td><span class="en">The film was great.</span></td><td><span class="en">I like music.</span></td></tr>
<tr><td><span class="en">She is a doctor.</span></td><td><span class="en">Open the window, please.</span></td><td><span class="en">He lives in London.</span></td></tr></table>
<p><b>an</b> goes before a vowel sound: <span class="en">an apple</span>, <span class="en">an engineer</span>, <span class="en">an hour</span> (silent h).</p>
<p><b>the</b> when there is only one: <span class="en">the sun</span>, <span class="en">the kitchen</span> (in this house).</p>
<p>No article in fixed phrases: <b>at home, at work, go to bed, have breakfast</b>.</p>
<p>A singular countable noun cannot stand with nothing at all: <span class="bad">I am student.</span></p>`},
 rules:{a:{ru:'a / an — «один из», первое упоминание или профессия; an перед гласным звуком.',en:'a / an — one of many, first mention or a job; an before a vowel sound.'},
  b:{ru:'the — когда понятно, какой именно: уже упоминали, он один, ясно из ситуации.',en:'the — when it is clear which one: mentioned before, the only one, clear from the situation.'},
  c:{ru:'Без артикля: в общем смысле (I like music), имена и города, at home, have breakfast.',en:'No article: general meaning (I like music), names and cities, at home, have breakfast.'}},

{id:'some',ru:'Количество: some, any, much, many',en:'some / any, much / many',
 th:{ru:`<p>Существительные бывают <b>исчисляемые</b> (a book, two books) и <b>неисчисляемые</b> (water, money, time, bread, information). У неисчисляемых нет множественного числа и артикля a: <span class="bad">an information</span>, <span class="bad">moneys</span>.</p>
<table><tr><th>some</th><th>any</th></tr>
<tr><td>утверждения</td><td>вопросы и отрицания</td></tr>
<tr><td><span class="en">I have some friends.</span></td><td><span class="en">Do you have any friends?</span></td></tr>
<tr><td><span class="en">I bought some bread.</span></td><td><span class="en">We don't have any bread.</span></td></tr></table>
<table><tr><th>many</th><th>much</th></tr>
<tr><td>с исчисляемыми во множественном числе</td><td>с неисчисляемыми</td></tr>
<tr><td><span class="en">How many books?</span></td><td><span class="en">How much money?</span></td></tr>
<tr><td><span class="en">not many people</span></td><td><span class="en">not much time</span></td></tr></table>
<p>В просьбах и предложениях тоже <b>some</b>, хотя по форме это вопрос: <span class="en">Can I have some water?</span> <span class="en">Would you like some tea?</span></p>
<p><b>a lot of</b> подходит к любым существительным и обычно стоит в утверждениях: <span class="en">a lot of friends</span>, <span class="en">a lot of time</span>.</p>`,
 en:`<p>Nouns are <b>countable</b> (a book, two books) or <b>uncountable</b> (water, money, time, bread, information). Uncountable nouns have no plural and no a: <span class="bad">an information</span>, <span class="bad">moneys</span>.</p>
<table><tr><th>some</th><th>any</th></tr>
<tr><td>positive sentences</td><td>questions and negatives</td></tr>
<tr><td><span class="en">I have some friends.</span></td><td><span class="en">Do you have any friends?</span></td></tr>
<tr><td><span class="en">I bought some bread.</span></td><td><span class="en">We don't have any bread.</span></td></tr></table>
<table><tr><th>many</th><th>much</th></tr>
<tr><td>with plural countable nouns</td><td>with uncountable nouns</td></tr>
<tr><td><span class="en">How many books?</span></td><td><span class="en">How much money?</span></td></tr>
<tr><td><span class="en">not many people</span></td><td><span class="en">not much time</span></td></tr></table>
<p>Requests and offers also take <b>some</b>, although they are questions: <span class="en">Can I have some water?</span> <span class="en">Would you like some tea?</span></p>
<p><b>a lot of</b> works with any noun and is usual in positive sentences: <span class="en">a lot of friends</span>, <span class="en">a lot of time</span>.</p>`},
 rules:{a:{ru:'some — в утверждениях, а также в просьбах и предложениях; any — в вопросах и отрицаниях.',en:'some in positive sentences and in requests and offers; any in questions and negatives.'},
  b:{ru:'many + исчисляемые во множественном числе; much + неисчисляемые.',en:'many + plural countable nouns; much + uncountable nouns.'},
  c:{ru:'Неисчисляемые (water, money, bread, information) — без множественного числа и без a.',en:'Uncountable nouns (water, money, bread, information) have no plural and no a.'},
  d:{ru:'a lot of подходит к любым существительным.',en:'a lot of works with any noun.'}},

{ru:'Местоимения и предлоги',en:'Pronouns and prepositions',units:[
{id:'pron',ru:'Местоимения: I, me, my, mine',en:'I / me / my / mine',
 th:{ru:`<p>У каждого местоимения четыре формы.</p>
<table><tr><th>кто (перед глаголом)</th><th>кого, кому (после глагола, предлога)</th><th>чей + существительное</th><th>чей (без существительного)</th></tr>
<tr><td>I</td><td>me</td><td>my</td><td>mine</td></tr>
<tr><td>you</td><td>you</td><td>your</td><td>yours</td></tr>
<tr><td>he</td><td>him</td><td>his</td><td>his</td></tr>
<tr><td>she</td><td>her</td><td>her</td><td>hers</td></tr>
<tr><td>it</td><td>it</td><td>its</td><td>—</td></tr>
<tr><td>we</td><td>us</td><td>our</td><td>ours</td></tr>
<tr><td>they</td><td>them</td><td>their</td><td>theirs</td></tr></table>
<ul><li><span class="en">I know him.</span> <span class="en">He knows me.</span></li><li><span class="en">This is my book.</span> <span class="en">This book is mine.</span></li><li><span class="en">Talk to her.</span> <span class="en">Wait for us.</span></li></ul>
<p>В английском нет слова «свой»: выбираем по лицу. <span class="en">He gave me his number.</span> <span class="en">I love my job.</span></p>
<p><b>its</b> — «его» про предмет или животное; <b>it's</b> = it is.</p>`,
 en:`<p>Each pronoun has four forms.</p>
<table><tr><th>subject (before the verb)</th><th>object (after a verb or preposition)</th><th>possessive + noun</th><th>possessive without a noun</th></tr>
<tr><td>I</td><td>me</td><td>my</td><td>mine</td></tr>
<tr><td>you</td><td>you</td><td>your</td><td>yours</td></tr>
<tr><td>he</td><td>him</td><td>his</td><td>his</td></tr>
<tr><td>she</td><td>her</td><td>her</td><td>hers</td></tr>
<tr><td>it</td><td>it</td><td>its</td><td>—</td></tr>
<tr><td>we</td><td>us</td><td>our</td><td>ours</td></tr>
<tr><td>they</td><td>them</td><td>their</td><td>theirs</td></tr></table>
<ul><li><span class="en">I know him.</span> <span class="en">He knows me.</span></li><li><span class="en">This is my book.</span> <span class="en">This book is mine.</span></li><li><span class="en">Talk to her.</span> <span class="en">Wait for us.</span></li></ul>
<p><b>its</b> is the possessive of it; <b>it's</b> = it is.</p>`},
 rules:{a:{ru:'Перед глаголом — I, he, she, we, they. После глагола или предлога — me, him, her, us, them.',en:'Before the verb: I, he, she, we, they. After a verb or preposition: me, him, her, us, them.'},

  d:{ru:"its = «его» (про предмет); it's = it is.",en:"its is possessive; it's = it is."}},

{id:'prep',ru:'Предлоги времени и места: in, on, at',en:'in / on / at',
 th:{ru:`<p>Три предлога, которые работают и для времени, и для места.</p>
<p><b>Время:</b></p>
<table><tr><th>at</th><th>on</th><th>in</th></tr>
<tr><td>точное время</td><td>день, дата</td><td>месяц, год, сезон, часть дня</td></tr>
<tr><td><span class="en">at five o'clock</span><br><span class="en">at night</span></td><td><span class="en">on Monday</span><br><span class="en">on 5 May</span></td><td><span class="en">in May</span>, <span class="en">in 2005</span><br><span class="en">in the morning</span></td></tr></table>
<p>Перед <b>last, next, this, every</b> предлог не нужен: <span class="en">See you next week.</span> <span class="bad">on next week</span></p>
<p><b>Место:</b></p>
<table><tr><th>in</th><th>on</th><th>at</th></tr>
<tr><td>внутри</td><td>на поверхности</td><td>точка, место как «пункт»</td></tr>
<tr><td><span class="en">in the room</span><br><span class="en">in Moscow</span></td><td><span class="en">on the table</span><br><span class="en">on the wall</span></td><td><span class="en">at the bus stop</span><br><span class="en">at home</span>, <span class="en">at work</span></td></tr></table>`,
 en:`<p>Three prepositions that work for both time and place.</p>
<p><b>Time:</b></p>
<table><tr><th>at</th><th>on</th><th>in</th></tr>
<tr><td>clock time</td><td>day, date</td><td>month, year, season, part of the day</td></tr>
<tr><td><span class="en">at five o'clock</span><br><span class="en">at night</span></td><td><span class="en">on Monday</span><br><span class="en">on 5 May</span></td><td><span class="en">in May</span>, <span class="en">in 2005</span><br><span class="en">in the morning</span></td></tr></table>
<p>No preposition before <b>last, next, this, every</b>: <span class="en">See you next week.</span> <span class="bad">on next week</span></p>
<p><b>Place:</b></p>
<table><tr><th>in</th><th>on</th><th>at</th></tr>
<tr><td>inside</td><td>on a surface</td><td>a point, a place as a location</td></tr>
<tr><td><span class="en">in the room</span><br><span class="en">in Moscow</span></td><td><span class="en">on the table</span><br><span class="en">on the wall</span></td><td><span class="en">at the bus stop</span><br><span class="en">at home</span>, <span class="en">at work</span></td></tr></table>`},
 rules:{a:{ru:'Время: at — точное время и at night; on — день и дата; in — месяц, год, сезон, часть дня.',en:'Time: at for clock times and at night; on for days and dates; in for months, years, seasons, parts of the day.'},
  b:{ru:'Перед last, next, this, every предлог не ставится.',en:'No preposition before last, next, this, every.'},
  c:{ru:'Место: in — внутри; on — на поверхности; at — точка (at home, at work, at the bus stop).',en:'Place: in = inside; on = on a surface; at = a point (at home, at work, at the bus stop).'}},

<\/span> (расписание), <span class=\"en\">I am leaving at six<\/span> (моё решение).<\/li><\/ul><h4>После when, if, as soon as, until<\/h4><p>Будущего времени нет ни в какой форме: <span class=\"en\">I'll call you when I get home.<\/span> <span class=\"en\">We'll start as soon as he arrives.<\/span><\/p><h4>Слова, которые тянут will<\/h4><p><b>I think, I hope, I am sure, probably, maybe, perhaps, I expect, I promise<\/b>: <span class=\"en\">I am sure you will like it.<\/span> <span class=\"en\">Maybe I will stay.<\/span><\/p><h4>shall<\/h4><p>С <b>I<\/b> и <b>we<\/b> в вопросе — предложение или просьба о совете: <span class=\"en\">Shall I help you?<\/span> <span class=\"en\">What shall we do?<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I will meet Anna at six. We agreed yesterday.<\/span><span class=\"en\">I am meeting Anna at six. We agreed yesterday.<\/span><small>уже договорились<\/small><\/li><li><span class=\"bad\">It is raining tomorrow.<\/span><span class=\"en\">It is going to rain tomorrow.<\/span><small>от людей не зависит<\/small><\/li><li><span class=\"bad\">— The phone! — I am going to answer.<\/span><span class=\"en\">— The phone! — I'll answer.<\/span><small>решил только что<\/small><\/li><li><span class=\"bad\">When I will arrive, I will call.<\/span><span class=\"en\">When I arrive, I will call.<\/span><\/li><li><span class=\"bad\">The film is starting at eight every day.<\/span><span class=\"en\">The film starts at eight every day.<\/span><\/li><\/ul>",
"if3": "<h4>Формы и сокращения<\/h4><div class=\"tw\"><table><tr><th>Часть<\/th><th>Полно<\/th><th>Кратко<\/th><\/tr><tr><td>с if<\/td><td><span class=\"en\">If I had known<\/span><\/td><td><span class=\"en\">If I'd known<\/span><\/td><\/tr><tr><td>главная<\/td><td><span class=\"en\">I would have come<\/span><\/td><td><span class=\"en\">I'd have come<\/span> / <span class=\"en\">I would've come<\/span><\/td><\/tr><\/table><\/div><p><b>'d<\/b> в части с if — это <b>had<\/b>, в главной — <b>would<\/b>.<\/p><h4>Все три типа рядом<\/h4><div class=\"tw\"><table><tr><th>Тип<\/th><th>О чём<\/th><th>Пример<\/th><\/tr><tr><td>первый<\/td><td>реальное будущее<\/td><td><span class=\"en\">If I see him, I will tell him.<\/span><\/td><\/tr><tr><td>второй<\/td><td>воображаемое сейчас<\/td><td><span class=\"en\">If I saw him, I would tell him.<\/span><\/td><\/tr><tr><td>третий<\/td><td>прошлое, которого не было<\/td><td><span class=\"en\">If I had seen him, I would have told him.<\/span><\/td><\/tr><\/table><\/div><h4>could have и might have<\/h4><ul><li><span class=\"en\">If I had had more time, I could have finished.<\/span> — смог бы закончить.<\/li><li><span class=\"en\">If you had asked, she might have agreed.<\/span> — возможно, согласилась бы.<\/li><\/ul><h4>Смешанный тип<\/h4><p>Условие в прошлом, а следствие — сейчас: <span class=\"en\">If I had studied medicine, I would be a doctor now.<\/span> В главной части тогда обычный would + глагол.<\/p><h4>Сожаление<\/h4><ul><li><b>I wish<\/b> + Past Perfect: <span class=\"en\">I wish I had gone to university.<\/span> — «Жаль, что я не пошёл».<\/li><li><b>should have<\/b> + третья форма: <span class=\"en\">I should have called.<\/span> — «Надо было позвонить».<\/li><\/ul><h4>had had и had been<\/h4><p>Не опечатка: первое had — вспомогательное. <span class=\"en\">If I had had a car, I would have driven.<\/span> <span class=\"en\">If I had been there, I would have helped.<\/span><\/p><h4>Как это звучит по-русски<\/h4><p>Русское «если бы …, то … бы» одно и то же для настоящего и прошлого. По-английски надо решить: это про сейчас (второй тип) или про тогда (третий).<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">If I would have known, I would have come.<\/span><span class=\"en\">If I had known, I would have come.<\/span><\/li><li><span class=\"bad\">If I knew yesterday, I would have come.<\/span><span class=\"en\">If I had known yesterday, I would have come.<\/span><\/li><li><span class=\"bad\">If I had known, I would come yesterday.<\/span><span class=\"en\">If I had known, I would have come yesterday.<\/span><\/li><li><span class=\"bad\">If she had studied, she had passed.<\/span><span class=\"en\">If she had studied, she would have passed.<\/span><\/li><li><span class=\"bad\">I wish I went there last year.<\/span><span class=\"en\">I wish I had gone there last year.<\/span><\/li><\/ul>",
"deduce": "<h4>Шкала уверенности<\/h4><div class=\"tw\"><table><tr><th>Насколько уверен<\/th><th>Сейчас<\/th><th>О прошлом<\/th><\/tr><tr><td>почти 100% да<\/td><td><span class=\"en\">He must be at home.<\/span><\/td><td><span class=\"en\">He must have left.<\/span><\/td><\/tr><tr><td>возможно<\/td><td><span class=\"en\">He might be at home.<\/span> (или may, could)<\/td><td><span class=\"en\">He might have left.<\/span><\/td><\/tr><tr><td>возможно, нет<\/td><td><span class=\"en\">He might not be at home.<\/span><\/td><td><span class=\"en\">He might not have left.<\/span><\/td><\/tr><tr><td>почти 100% нет<\/td><td><span class=\"en\">He can't be at home.<\/span><\/td><td><span class=\"en\">He can't have left.<\/span><\/td><\/tr><\/table><\/div><h4>Отрицания, которые путают<\/h4><ul><li><b>mustn't<\/b> — только запрет, для догадок не используется.<\/li><li><b>might not<\/b> — «возможно, нет». <b>couldn't<\/b> — «не может быть». Это не одно и то же: <span class=\"en\">He might not know.<\/span> — может, и не знает. <span class=\"en\">He couldn't know.<\/span> — никак не может знать.<\/li><li><b>can<\/b> в утверждении для догадки не используют: говорят <span class=\"en\">It could be true<\/span>, а не «It can be true».<\/li><\/ul><h4>Догадка о действии в процессе<\/h4><p>Модальный + be + -ing: <span class=\"en\">She must be sleeping.<\/span> <span class=\"en\">They might be waiting for us.<\/span><\/p><h4>Как это говорят по-русски<\/h4><p>«Должно быть», «наверняка», «по-видимому» → must. «Может быть», «возможно», «вдруг» → might. «Не может быть», «исключено» → can't. «Вряд ли» слабее: <span class=\"en\">He probably isn't at home.<\/span> Слова <b>maybe<\/b> и <b>perhaps<\/b> тоже годятся, но стоят в начале и не меняют глагол: <span class=\"en\">Maybe he is at home.<\/span><\/p><h4>must: два значения<\/h4><p><span class=\"en\">You must be quiet.<\/span> — обязанность. <span class=\"en\">You must be tired.<\/span> — догадка. Различают по смыслу. В прошлом формы разные: обязанность — <span class=\"en\">I had to go<\/span>, догадка — <span class=\"en\">He must have gone<\/span>.<\/p><h4>Не путай с should have<\/h4><p><span class=\"en\">He must have called.<\/span> — уверен, что звонил. <span class=\"en\">He should have called.<\/span> — должен был позвонить, но не позвонил.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">It mustn't be true.<\/span><span class=\"en\">It can't be true.<\/span><small>в британской норме<\/small><\/li><li><span class=\"bad\">He must be tired yesterday.<\/span><span class=\"en\">He must have been tired yesterday.<\/span><\/li><li><span class=\"bad\">She can be at home.<\/span><span class=\"en\">She could be at home.<\/span><small>или might<\/small><\/li><li><span class=\"bad\">He must had left.<\/span><span class=\"en\">He must have left.<\/span><\/li><li><span class=\"bad\">Maybe he must be at home.<\/span><span class=\"en\">He must be at home.<\/span><small>одно слово уверенности на предложение<\/small><\/li><\/ul>",
"pass2": "<h4>Пассив целиком<\/h4><div class=\"tw\"><table><tr><th>Время<\/th><th>Актив<\/th><th>Пассив<\/th><\/tr><tr><td>Present Simple<\/td><td><span class=\"en\">They clean it.<\/span><\/td><td><span class=\"en\">It is cleaned.<\/span><\/td><\/tr><tr><td>Present Continuous<\/td><td><span class=\"en\">They are cleaning it.<\/span><\/td><td><span class=\"en\">It is being cleaned.<\/span><\/td><\/tr><tr><td>Past Simple<\/td><td><span class=\"en\">They cleaned it.<\/span><\/td><td><span class=\"en\">It was cleaned.<\/span><\/td><\/tr><tr><td>Past Continuous<\/td><td><span class=\"en\">They were cleaning it.<\/span><\/td><td><span class=\"en\">It was being cleaned.<\/span><\/td><\/tr><tr><td>Present Perfect<\/td><td><span class=\"en\">They have cleaned it.<\/span><\/td><td><span class=\"en\">It has been cleaned.<\/span><\/td><\/tr><tr><td>Past Perfect<\/td><td><span class=\"en\">They had cleaned it.<\/span><\/td><td><span class=\"en\">It had been cleaned.<\/span><\/td><\/tr><tr><td>will<\/td><td><span class=\"en\">They will clean it.<\/span><\/td><td><span class=\"en\">It will be cleaned.<\/span><\/td><\/tr><tr><td>going to<\/td><td><span class=\"en\">They are going to clean it.<\/span><\/td><td><span class=\"en\">It is going to be cleaned.<\/span><\/td><\/tr><tr><td>модальные<\/td><td><span class=\"en\">They must clean it.<\/span><\/td><td><span class=\"en\">It must be cleaned.<\/span><\/td><\/tr><\/table><\/div><h4>been и being<\/h4><ul><li><b>been<\/b> — только после have / has / had: <span class=\"en\">has been done<\/span>.<\/li><li><b>being<\/b> — только после am / is / are / was / were: <span class=\"en\">is being done<\/span>.<\/li><li>Present Perfect Continuous в пассиве почти не используют.<\/li><\/ul><h4>Вопросы и отрицания<\/h4><p>Меняется только первый вспомогательный глагол: <span class=\"en\">Has it been sent?<\/span> <span class=\"en\">It hasn't been sent.<\/span> <span class=\"en\">Is it being repaired?<\/span> <span class=\"en\">Will it be finished?<\/span> <span class=\"en\">Can it be done?<\/span><\/p><h4>Инфинитив и -ing в пассиве<\/h4><ul><li>После глаголов с to: <span class=\"en\">I want to be told the truth.<\/span> <span class=\"en\">It needs to be done.<\/span><\/li><li>После предлогов и enjoy, like, hate: <span class=\"en\">I don't like being told what to do.<\/span><\/li><\/ul><h4>have something done<\/h4><p>Когда работу делает кто-то для тебя: <span class=\"en\">I had my car repaired.<\/span> — «Мне починили машину». <span class=\"en\">She is having her hair cut.<\/span> Это не пассив по форме, но по смыслу рядом.<\/p><h4>Когда пассив лучше, когда хуже<\/h4><p>Он уместен, если исполнитель неизвестен, не важен или очевиден: <span class=\"en\">My bike has been stolen.<\/span> В живой речи его меньше, чем в новостях и документах. Если исполнитель известен и важен, актив звучит естественнее.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">The letter has sent.<\/span><span class=\"en\">The letter has been sent.<\/span><\/li><li><span class=\"bad\">The road is been repaired.<\/span><span class=\"en\">The road is being repaired.<\/span><\/li><li><span class=\"bad\">It will finished tomorrow.<\/span><span class=\"en\">It will be finished tomorrow.<\/span><\/li><li><span class=\"bad\">It must to be done.<\/span><span class=\"en\">It must be done.<\/span><\/li><li><span class=\"bad\">The house has been build.<\/span><span class=\"en\">The house has been built.<\/span><\/li><li><span class=\"bad\">My car has being stolen.<\/span><span class=\"en\">My car has been stolen.<\/span><\/li><\/ul>",
"rel": "<h4>Все слова<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Заменяет<\/th><th>Пример<\/th><\/tr><tr><td>who<\/td><td>человек (подлежащее или дополнение)<\/td><td><span class=\"en\">the girl who called<\/span><\/td><\/tr><tr><td>whom<\/td><td>человек-дополнение, книжно<\/td><td><span class=\"en\">the man whom I met<\/span><\/td><\/tr><tr><td>which<\/td><td>предмет, животное<\/td><td><span class=\"en\">the car which broke down<\/span><\/td><\/tr><tr><td>that<\/td><td>человек или предмет, разговорно<\/td><td><span class=\"en\">the car that broke down<\/span><\/td><\/tr><tr><td>whose<\/td><td>чей<\/td><td><span class=\"en\">the boy whose bike was stolen<\/span><\/td><\/tr><tr><td>where<\/td><td>место<\/td><td><span class=\"en\">the café where we met<\/span><\/td><\/tr><tr><td>when<\/td><td>время<\/td><td><span class=\"en\">the day when we met<\/span><\/td><\/tr><tr><td>why<\/td><td>причина<\/td><td><span class=\"en\">the reason why I left<\/span><\/td><\/tr><\/table><\/div><h4>Два вида придаточных<\/h4><div class=\"tw\"><table><tr><th>Уточняющее<\/th><th>Добавляющее<\/th><\/tr><tr><td>без него непонятно, о ком речь<\/td><td>просто добавляет сведения<\/td><\/tr><tr><td>без запятых<\/td><td>в запятых<\/td><\/tr><tr><td>можно that, можно опустить слово<\/td><td>только who / which, опускать нельзя<\/td><\/tr><tr><td><span class=\"en\">The man who lives next door is a doctor.<\/span><\/td><td><span class=\"en\">My father, who lives in Kazan, is a doctor.<\/span><\/td><\/tr><\/table><\/div><h4>Когда слово опускают<\/h4><p>Только в уточняющем придаточном и только если оно не подлежащее: <span class=\"en\">the film (that) we saw<\/span>, <span class=\"en\">the people (who) I work with<\/span>. Проверка: после слова идёт подлежащее — можно убрать; идёт глагол — нельзя.<\/p><h4>Предлог<\/h4><p>В разговорной речи предлог уходит в конец: <span class=\"en\">the people I work with<\/span>, <span class=\"en\">the film I told you about<\/span>, <span class=\"en\">the house I grew up in<\/span>. В книжной — перед словом: <span class=\"en\">the house in which I grew up<\/span>.<\/p><h4>what — это не which<\/h4><p><b>what<\/b> = «то, что»: <span class=\"en\">I don't understand what you mean.<\/span> <span class=\"en\">What I need is rest.<\/span> После существительного what не ставят: <span class=\"en\">everything that I know<\/span>, а не «everything what I know».<\/p><h4>which ко всему предложению<\/h4><p><span class=\"en\">He passed the exam, which surprised everyone.<\/span> — «…что всех удивило».<\/p><h4>Запятые<\/h4><p>В русском запятая перед «который» обязательна. В английском уточняющее придаточное запятыми не выделяют.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">The man which lives here is my uncle.<\/span><span class=\"en\">The man who lives here is my uncle.<\/span><\/li><li><span class=\"bad\">This is the book which I bought it.<\/span><span class=\"en\">This is the book which I bought.<\/span><\/li><li><span class=\"bad\">The woman who her son is a pilot…<\/span><span class=\"en\">The woman whose son is a pilot…<\/span><\/li><li><span class=\"bad\">The city where I was born in…<\/span><span class=\"en\">The city where I was born…<\/span><small>или: the city I was born in<\/small><\/li><li><span class=\"bad\">Everything what he said was true.<\/span><span class=\"en\">Everything that he said was true.<\/span><\/li><li><span class=\"bad\">The man lives next door is a doctor.<\/span><span class=\"en\">The man who lives next door is a doctor.<\/span><small>подлежащее опускать нельзя<\/small><\/li><\/ul>",
"ginf": "<h4>Предлоги, после которых чаще всего ошибаются<\/h4><div class=\"tw\"><table><tr><th>Выражение<\/th><th>Пример<\/th><\/tr><tr><td>be good / bad at<\/td><td><span class=\"en\">He is good at drawing.<\/span><\/td><\/tr><tr><td>be interested in<\/td><td><span class=\"en\">I am interested in learning Chinese.<\/span><\/td><\/tr><tr><td>be afraid of, be tired of<\/td><td><span class=\"en\">I am tired of waiting.<\/span><\/td><\/tr><tr><td>think about / of<\/td><td><span class=\"en\">I am thinking of changing my job.<\/span><\/td><\/tr><tr><td>thank for, sorry for<\/td><td><span class=\"en\">Sorry for being late.<\/span><\/td><\/tr><tr><td>instead of, without, before, after<\/td><td><span class=\"en\">Wash your hands before eating.<\/span><\/td><\/tr><tr><td>look forward to<\/td><td><span class=\"en\">I look forward to hearing from you.<\/span><\/td><\/tr><tr><td>be used to, get used to<\/td><td><span class=\"en\">I am used to getting up early.<\/span><\/td><\/tr><\/table><\/div><p>В последних двух строках <b>to<\/b> — предлог, а не часть инфинитива.<\/p><h4>Глаголы, меняющие смысл<\/h4><div class=\"tw\"><table><tr><th>Глагол<\/th><th>+ to<\/th><th>+ -ing<\/th><\/tr><tr><td>stop<\/td><td>остановиться, чтобы сделать<\/td><td>перестать делать<\/td><\/tr><tr><td>remember<\/td><td>не забыть сделать (впереди)<\/td><td>помнить, как делал (позади)<\/td><\/tr><tr><td>forget<\/td><td>забыть сделать<\/td><td>забыть, как делал<\/td><\/tr><tr><td>try<\/td><td>стараться, пытаться<\/td><td>попробовать как способ<\/td><\/tr><tr><td>regret<\/td><td>с сожалением сообщать<\/td><td>жалеть о сделанном<\/td><\/tr><tr><td>go on<\/td><td>перейти к новому делу<\/td><td>продолжать то же<\/td><\/tr><\/table><\/div><p>Общая подсказка: to смотрит вперёд, -ing — назад или на сам процесс.<\/p><h4>Глагол + человек + to<\/h4><p><b>want, ask, tell, advise, allow, expect, help, invite, teach, remind, would like<\/b>: <span class=\"en\">She reminded me to buy bread.<\/span> <span class=\"en\">They invited us to stay.<\/span> <span class=\"en\">I didn't expect him to come.<\/span><\/p><p>Отрицание — not перед to: <span class=\"en\">He told me not to worry.<\/span><\/p><h4>Без to<\/h4><ul><li><b>make, let<\/b> + человек + глагол: <span class=\"en\">Don't make me laugh.<\/span> <span class=\"en\">Let them go.<\/span><\/li><li>В пассиве у make to возвращается: <span class=\"en\">I was made to wait.<\/span><\/li><li><b>see, hear, watch, feel<\/b> + человек + глагол или -ing: <span class=\"en\">I saw him leave.<\/span> — всё действие. <span class=\"en\">I saw him leaving.<\/span> — в процессе.<\/li><li><b>had better, would rather<\/b>: <span class=\"en\">I would rather stay at home.<\/span><\/li><\/ul><h4>Глаголы только с -ing<\/h4><p><b>enjoy, finish, avoid, mind, suggest, keep, practise, imagine, miss, risk, can't help, can't stand, it's worth<\/b>: <span class=\"en\">It's worth trying.<\/span> <span class=\"en\">I can't help laughing.<\/span><\/p><p>После <b>suggest<\/b> нет «человек + to»: <span class=\"en\">He suggested going by train.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I want that you come.<\/span><span class=\"en\">I want you to come.<\/span><\/li><li><span class=\"bad\">She made me to cry.<\/span><span class=\"en\">She made me cry.<\/span><\/li><li><span class=\"bad\">He suggested me to go.<\/span><span class=\"en\">He suggested going.<\/span><small>или: He suggested that I go<\/small><\/li><li><span class=\"bad\">I am looking forward to see you.<\/span><span class=\"en\">I am looking forward to seeing you.<\/span><\/li><li><span class=\"bad\">I stopped to smoke last year.<\/span><span class=\"en\">I stopped smoking last year.<\/span><small>бросил<\/small><\/li><li><span class=\"bad\">He told me to not worry.<\/span><span class=\"en\">He told me not to worry.<\/span><small>так надёжнее<\/small><\/li><li><span class=\"bad\">I am used to get up early.<\/span><span class=\"en\">I am used to getting up early.<\/span><\/li><\/ul>",
"art2": "<h4>Вообще или конкретно: проверка<\/h4><p>Спроси себя: можно ли добавить «вообще, любые»? Тогда артикля нет. Можно ли добавить «тот самый, вот этот»? Тогда the.<\/p><div class=\"tw\"><table><tr><th>В общем<\/th><th>Конкретно<\/th><\/tr><tr><td><span class=\"en\">I like coffee.<\/span><\/td><td><span class=\"en\">The coffee is cold.<\/span> — вот этот<\/td><\/tr><tr><td><span class=\"en\">Children need love.<\/span><\/td><td><span class=\"en\">The children are asleep.<\/span> — наши<\/td><\/tr><tr><td><span class=\"en\">History is interesting.<\/span><\/td><td><span class=\"en\">the history of Russia<\/span><\/td><\/tr><tr><td><span class=\"en\">Money is not everything.<\/span><\/td><td><span class=\"en\">Where is the money I gave you?<\/span><\/td><\/tr><\/table><\/div><p>Слово с <b>of<\/b> или придаточным после почти всегда становится конкретным и получает the.<\/p><h4>География целиком<\/h4><div class=\"tw\"><table><tr><th>С the<\/th><th>Без артикля<\/th><\/tr><tr><td>реки: the Volga, the Thames<\/td><td>города: Moscow, London<\/td><\/tr><tr><td>моря и океаны: the Black Sea, the Pacific<\/td><td>континенты: Asia, Africa<\/td><\/tr><tr><td>горные цепи: the Alps, the Urals<\/td><td>отдельные горы: Everest, Elbrus<\/td><\/tr><tr><td>группы островов: the Canaries<\/td><td>отдельные острова: Sakhalin, Crete<\/td><\/tr><tr><td>пустыни: the Sahara<\/td><td>озёра: Lake Baikal, Lake Ladoga<\/td><\/tr><tr><td>страны со словами Kingdom, States, Republic, Federation: the United Kingdom, the Russian Federation<\/td><td>страны: Russia, Germany, China<\/td><\/tr><tr><td>страны во мн. числе: the Netherlands, the Philippines<\/td><td>улицы и площади: Tverskaya Street, Red Square<\/td><\/tr><tr><td>стороны света как регионы: the north, the Far East<\/td><td>аэропорты, вокзалы, парки: Sheremetyevo, Gorky Park<\/td><\/tr><\/table><\/div><p>Гостиницы, театры, музеи, газеты — обычно с the: <span class=\"en\">the Hilton<\/span>, <span class=\"en\">the Bolshoi<\/span>, <span class=\"en\">the Hermitage<\/span>, <span class=\"en\">the Times<\/span>.<\/p><h4>Место по назначению и место как здание<\/h4><div class=\"tw\"><table><tr><th>Без артикля: по назначению<\/th><th>С the: просто здание<\/th><\/tr><tr><td><span class=\"en\">He is in hospital.<\/span> — он пациент<\/td><td><span class=\"en\">I went to the hospital to visit him.<\/span><\/td><\/tr><tr><td><span class=\"en\">The children are at school.<\/span> — учатся<\/td><td><span class=\"en\">The meeting is at the school.<\/span><\/td><\/tr><tr><td><span class=\"en\">He is in prison.<\/span> — сидит<\/td><td><span class=\"en\">She works at the prison.<\/span><\/td><\/tr><tr><td><span class=\"en\">We go to church on Sundays.<\/span> — на службу<\/td><td><span class=\"en\">The church is very old.<\/span><\/td><\/tr><\/table><\/div><p>Так же без артикля: <b>go to bed, go to work, at work, at home, go home, at university<\/b>. В американском английском говорят <span class=\"en\">in the hospital<\/span>.<\/p><h4>the с прилагательными и группами<\/h4><ul><li>Группа людей: <span class=\"en\">the rich<\/span>, <span class=\"en\">the young<\/span>, <span class=\"en\">the unemployed<\/span>.<\/li><li>Национальность как народ: <span class=\"en\">the French<\/span>, <span class=\"en\">the Japanese<\/span>.<\/li><li>Семья: <span class=\"en\">the Smiths<\/span>.<\/li><\/ul><h4>Устойчивые сочетания<\/h4><div class=\"tw\"><table><tr><th>С the<\/th><th>Без артикля<\/th><th>С a<\/th><\/tr><tr><td>in the morning, in the end, at the moment<\/td><td>at night, at first, by car, on foot<\/td><td>have a look, have a rest<\/td><\/tr><tr><td>the same, the only, the next day<\/td><td>last week, next year<\/td><td>in a hurry, for a while<\/td><\/tr><tr><td>on the left, on the radio<\/td><td>on TV, at lunch, by mistake<\/td><td>a lot of, a few<\/td><\/tr><\/table><\/div><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I like the nature.<\/span><span class=\"en\">I like nature.<\/span><\/li><li><span class=\"bad\">The life is hard.<\/span><span class=\"en\">Life is hard.<\/span><\/li><li><span class=\"bad\">She is in the bed.<\/span><span class=\"en\">She is in bed.<\/span><\/li><li><span class=\"bad\">He lives in the Russia.<\/span><span class=\"en\">He lives in Russia.<\/span><\/li><li><span class=\"bad\">We swam in Black Sea.<\/span><span class=\"en\">We swam in the Black Sea.<\/span><\/li><li><span class=\"bad\">I listen to the music every day.<\/span><span class=\"en\">I listen to music every day.<\/span><\/li><li><span class=\"bad\">She plays piano.<\/span><span class=\"en\">She plays the piano.<\/span><small>в американской речи без артикля тоже говорят<\/small><\/li><\/ul>",
"phr": "<h4>Три типа фразовых глаголов<\/h4><div class=\"tw\"><table><tr><th>Тип<\/th><th>Как себя ведёт<\/th><th>Примеры<\/th><\/tr><tr><td>без дополнения<\/td><td>после него ничего не нужно<\/td><td>get up, wake up, sit down, grow up, come back, go on, break down<\/td><\/tr><tr><td>разделяемые<\/td><td>дополнение в середине или в конце; местоимение только в середине<\/td><td>turn on / off, put on, take off, pick up, give up, find out, fill in, look up, throw away, switch off<\/td><\/tr><tr><td>неразделяемые<\/td><td>дополнение только в конце<\/td><td>look for, look after, get on / off (the bus), run out of, look forward to, get over<\/td><\/tr><\/table><\/div><h4>Порядок слов у разделяемых<\/h4><div class=\"tw\"><table><tr><th>Дополнение<\/th><th>Варианты<\/th><\/tr><tr><td>существительное<\/td><td><span class=\"en\">Turn off the TV.<\/span> = <span class=\"en\">Turn the TV off.<\/span><\/td><\/tr><tr><td>местоимение<\/td><td><span class=\"en\">Turn it off.<\/span> — только так<\/td><\/tr><tr><td>длинное дополнение<\/td><td>в конец: <span class=\"en\">Turn off the TV in the kitchen.<\/span><\/td><\/tr><\/table><\/div><h4>Глаголы на каждый день<\/h4><div class=\"tw\"><table><tr><th>Глагол<\/th><th>Значение<\/th><th>Пример<\/th><\/tr><tr><td>wake up<\/td><td>проснуться<\/td><td><span class=\"en\">I woke up at six.<\/span><\/td><\/tr><tr><td>get on / get off<\/td><td>сесть в / выйти из транспорта<\/td><td><span class=\"en\">Get off at the next stop.<\/span><\/td><\/tr><tr><td>come in / go out<\/td><td>войти / выйти<\/td><td><span class=\"en\">Come in!<\/span><\/td><\/tr><tr><td>sit down / stand up<\/td><td>сесть / встать<\/td><td><span class=\"en\">Please sit down.<\/span><\/td><\/tr><tr><td>go on<\/td><td>продолжать<\/td><td><span class=\"en\">Go on, I am listening.<\/span><\/td><\/tr><tr><td>come back<\/td><td>вернуться<\/td><td><span class=\"en\">When are you coming back?<\/span><\/td><\/tr><tr><td>hurry up<\/td><td>поторопиться<\/td><td><span class=\"en\">Hurry up!<\/span><\/td><\/tr><tr><td>look up<\/td><td>посмотреть в словаре, справочнике<\/td><td><span class=\"en\">Look it up online.<\/span><\/td><\/tr><tr><td>throw away<\/td><td>выбросить<\/td><td><span class=\"en\">Don't throw it away.<\/span><\/td><\/tr><tr><td>break down<\/td><td>сломаться (о технике)<\/td><td><span class=\"en\">The car broke down.<\/span><\/td><\/tr><tr><td>get on with<\/td><td>ладить<\/td><td><span class=\"en\">I get on well with my boss.<\/span><\/td><\/tr><tr><td>take off<\/td><td>взлететь; снять<\/td><td><span class=\"en\">The plane took off.<\/span><\/td><\/tr><\/table><\/div><h4>Одно сочетание — несколько значений<\/h4><p><span class=\"en\">take off<\/span> — снять одежду и взлететь. <span class=\"en\">pick up<\/span> — поднять, забрать человека, подхватить язык. <span class=\"en\">turn up<\/span> — прибавить звук и появиться. Смотри на контекст.<\/p><h4>Как их учить<\/h4><p>Не списком по глаголу (все сочетания с get), а по ситуациям: утро, дорога, телефон. И сразу целой фразой с дополнением.<\/p><h4>Одно слово вместо двух<\/h4><p>У многих есть «книжный» синоним: <b>give up<\/b> — quit, <b>find out<\/b> — discover, <b>go on<\/b> — continue, <b>come back<\/b> — return. В разговоре естественнее фразовый вариант.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Turn off it.<\/span><span class=\"en\">Turn it off.<\/span><\/li><li><span class=\"bad\">I am looking my keys.<\/span><span class=\"en\">I am looking for my keys.<\/span><\/li><li><span class=\"bad\">Look the children after.<\/span><span class=\"en\">Look after the children.<\/span><\/li><li><span class=\"bad\">I get up me at seven.<\/span><span class=\"en\">I get up at seven.<\/span><small>«себя» не нужно<\/small><\/li><li><span class=\"bad\">Put off your coat.<\/span><span class=\"en\">Take off your coat.<\/span><small>put off = отложить<\/small><\/li><li><span class=\"bad\">I grew in Kazan.<\/span><span class=\"en\">I grew up in Kazan.<\/span><\/li><\/ul>",
"habits": "<h4>Четыре конструкции рядом<\/h4><div class=\"tw\"><table><tr><th>Конструкция<\/th><th>Время<\/th><th>После неё<\/th><th>Пример<\/th><\/tr><tr><td>used to<\/td><td>только прошлое<\/td><td>глагол<\/td><td><span class=\"en\">I used to smoke.<\/span><\/td><\/tr><tr><td>would<\/td><td>только прошлое<\/td><td>глагол (действие)<\/td><td><span class=\"en\">We would walk to school.<\/span><\/td><\/tr><tr><td>be used to<\/td><td>любое<\/td><td>-ing или существительное<\/td><td><span class=\"en\">I am used to working late.<\/span><\/td><\/tr><tr><td>get used to<\/td><td>любое<\/td><td>-ing или существительное<\/td><td><span class=\"en\">You will get used to it.<\/span><\/td><\/tr><\/table><\/div><h4>would: условия<\/h4><ul><li>Только повторявшиеся действия, не состояния: нельзя «I would live», «I would be shy».<\/li><li>Обычно в рассказе, когда время уже задано: <span class=\"en\">When I was a child, we would spend summers in the village.<\/span><\/li><li>В вопросах и отрицаниях в этом значении почти не встречается.<\/li><\/ul><h4>be used to во всех временах<\/h4><p><span class=\"en\">I was used to the heat.<\/span> <span class=\"en\">She has never been used to cooking for herself.<\/span> <span class=\"en\">You will soon be used to it.<\/span><\/p><h4>get used to: процесс<\/h4><div class=\"tw\"><table><tr><th>Стадия<\/th><th>Пример<\/th><\/tr><tr><td>начал привыкать<\/td><td><span class=\"en\">I am getting used to the new schedule.<\/span><\/td><\/tr><tr><td>привык<\/td><td><span class=\"en\">I have got used to it.<\/span><\/td><\/tr><tr><td>не могу привыкнуть<\/td><td><span class=\"en\">I can't get used to driving on the left.<\/span><\/td><\/tr><tr><td>привыкну<\/td><td><span class=\"en\">I'll get used to it.<\/span><\/td><\/tr><\/table><\/div><h4>Рядом по смыслу<\/h4><p><b>usually<\/b> — о нынешних привычках: <span class=\"en\">I usually get up at six.<\/span> <b>tend to<\/b> — «как правило»: <span class=\"en\">He tends to be late.<\/span> <b>keep + -ing<\/b> — «всё время»: <span class=\"en\">She keeps forgetting.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I am used to get up early.<\/span><span class=\"en\">I am used to getting up early.<\/span><\/li><li><span class=\"bad\">I would live in Kazan when I was young.<\/span><span class=\"en\">I used to live in Kazan when I was young.<\/span><\/li><li><span class=\"bad\">I use to go to the gym.<\/span><span class=\"en\">I usually go to the gym.<\/span><\/li><li><span class=\"bad\">I got used to live alone.<\/span><span class=\"en\">I got used to living alone.<\/span><\/li><li><span class=\"bad\">I am used the cold.<\/span><span class=\"en\">I am used to the cold.<\/span><\/li><\/ul>",
"narr": "<h4>Как времена делят работу<\/h4><div class=\"tw\"><table><tr><th>Вопрос<\/th><th>Время<\/th><th>Пример<\/th><\/tr><tr><td>Что произошло?<\/td><td>Past Simple<\/td><td><span class=\"en\">The door opened.<\/span><\/td><\/tr><tr><td>Что шло в этот момент?<\/td><td>Past Continuous<\/td><td><span class=\"en\">Everyone was sleeping.<\/span><\/td><\/tr><tr><td>Что случилось до этого?<\/td><td>Past Perfect<\/td><td><span class=\"en\">Someone had left the light on.<\/span><\/td><\/tr><tr><td>Что длилось до этого?<\/td><td>Past Perfect Continuous<\/td><td><span class=\"en\">I had been reading for an hour.<\/span><\/td><\/tr><\/table><\/div><h4>Начало рассказа<\/h4><p>Обычно сначала фон в Continuous, затем события в Simple: <span class=\"en\">It was getting dark. The wind was blowing. Suddenly I heard a noise.<\/span><\/p><h4>Когда Past Perfect не нужен<\/h4><ul><li>События в порядке следования: <span class=\"en\">I got up, washed and left.<\/span><\/li><li>С <b>before<\/b> и <b>after<\/b> порядок и так ясен: <span class=\"en\">After I ate, I went out.<\/span><\/li><li>Он нужен, когда о более раннем событии сообщают позже: <span class=\"en\">I got to the office and realised I had left my laptop at home.<\/span><\/li><\/ul><h4>Слова рассказа<\/h4><div class=\"tw\"><table><tr><th>Назначение<\/th><th>Слова<\/th><\/tr><tr><td>порядок<\/td><td>first, then, after that, later, finally, in the end<\/td><\/tr><tr><td>внезапность<\/td><td>suddenly, at that moment, all of a sudden<\/td><\/tr><tr><td>одновременность<\/td><td>while, as, meanwhile<\/td><\/tr><tr><td>шаг назад<\/td><td>before that, earlier, by then, already<\/td><\/tr><\/table><\/div><h4>had been doing и was doing<\/h4><p><span class=\"en\">He was tired because he had been running.<\/span> — бегал до этого и уже перестал. <span class=\"en\">He was tired because he was running.<\/span> — бежал в тот самый момент.<\/p><h4>Настоящее время в рассказе<\/h4><p>В анекдотах и живом пересказе часто переходят на настоящее: <span class=\"en\">So I walk in, and there he is.<\/span> Это стилистика, не ошибка, но в письменной работе лучше держать прошедшее.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">When I arrived, the film already started.<\/span><span class=\"en\">When I arrived, the film had already started.<\/span><\/li><li><span class=\"bad\">I was going home and was seeing an accident.<\/span><span class=\"en\">I was going home and saw an accident.<\/span><\/li><li><span class=\"bad\">I had got up, had washed and had left.<\/span><span class=\"en\">I got up, washed and left.<\/span><small>порядок событий — Past Simple<\/small><\/li><li><span class=\"bad\">She was tired because she worked all day.<\/span><span class=\"en\">She was tired because she had been working all day.<\/span><\/li><li><span class=\"bad\">While I walked home, it was starting to rain.<\/span><span class=\"en\">While I was walking home, it started to rain.<\/span><\/li><\/ul>",
"wish": "<h4>Все формы<\/h4><div class=\"tw\"><table><tr><th>Что имею в виду<\/th><th>Форма<\/th><th>Пример<\/th><th>Реальность<\/th><\/tr><tr><td>хочу иначе сейчас<\/td><td>wish + Past Simple<\/td><td><span class=\"en\">I wish I lived by the sea.<\/span><\/td><td>не живу<\/td><\/tr><tr><td>хочу уметь<\/td><td>wish + could<\/td><td><span class=\"en\">I wish I could drive.<\/span><\/td><td>не умею<\/td><\/tr><tr><td>жалею о прошлом<\/td><td>wish + Past Perfect<\/td><td><span class=\"en\">I wish I had not sold it.<\/span><\/td><td>продал<\/td><\/tr><tr><td>раздражает чужое поведение<\/td><td>wish + would<\/td><td><span class=\"en\">I wish he would call.<\/span><\/td><td>не звонит<\/td><\/tr><\/table><\/div><h4>wish … would: ограничения<\/h4><ul><li>О себе так не говорят: <span class=\"en\">I wish I could stop<\/span>, а не «I wish I would stop».<\/li><li>О состояниях тоже: <span class=\"en\">I wish it were warmer<\/span>, а не «would be warmer».<\/li><li>О погоде и вещах можно: <span class=\"en\">I wish it would stop raining.<\/span><\/li><\/ul><h4>If only<\/h4><p>То же самое, но сильнее: <span class=\"en\">If only I knew!<\/span> <span class=\"en\">If only I had listened!<\/span><\/p><h4>should have и его соседи<\/h4><div class=\"tw\"><table><tr><th>Форма<\/th><th>Смысл<\/th><th>Пример<\/th><\/tr><tr><td>should have done<\/td><td>надо было<\/td><td><span class=\"en\">I should have left earlier.<\/span><\/td><\/tr><tr><td>shouldn't have done<\/td><td>зря сделал<\/td><td><span class=\"en\">You shouldn't have told him.<\/span><\/td><\/tr><tr><td>could have done<\/td><td>мог, но не сделал<\/td><td><span class=\"en\">I could have helped.<\/span><\/td><\/tr><tr><td>needn't have done<\/td><td>сделал, а было не нужно<\/td><td><span class=\"en\">You needn't have bought milk.<\/span><\/td><\/tr><\/table><\/div><p>В речи <b>have<\/b> сжимается: «should've». Писать «should of» — ошибка.<\/p><h4>wish и hope<\/h4><p><b>wish<\/b> — о том, что нереально или уже не изменить. О реальном будущем — <b>hope<\/b> с настоящим временем: <span class=\"en\">I hope you pass the exam.<\/span><\/p><p>Другое значение wish — пожелание: <span class=\"en\">I wish you luck.<\/span> <span class=\"en\">We wish you a happy birthday.<\/span><\/p><h4>Перевод «жаль, что»<\/h4><p>Знак меняется: «Жаль, что я <b>не<\/b> знаю» → <span class=\"en\">I wish I knew.<\/span> «Жаль, что я сказал» → <span class=\"en\">I wish I had not said it.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I wish I have a car.<\/span><span class=\"en\">I wish I had a car.<\/span><\/li><li><span class=\"bad\">I wish I would be rich.<\/span><span class=\"en\">I wish I were rich.<\/span><\/li><li><span class=\"bad\">I wish I didn't go there yesterday.<\/span><span class=\"en\">I wish I hadn't gone there yesterday.<\/span><\/li><li><span class=\"bad\">You should called me.<\/span><span class=\"en\">You should have called me.<\/span><\/li><li><span class=\"bad\">I wish you will come.<\/span><span class=\"en\">I hope you will come.<\/span><small>реальное будущее<\/small><\/li><li><span class=\"bad\">I should of known.<\/span><span class=\"en\">I should have known.<\/span><\/li><\/ul>",
"indq": "<h4>Вводные фразы<\/h4><div class=\"tw\"><table><tr><th>Фраза<\/th><th>Оттенок<\/th><\/tr><tr><td><span class=\"en\">Could you tell me…?<\/span><\/td><td>вежливая просьба<\/td><\/tr><tr><td><span class=\"en\">Do you know…?<\/span><\/td><td>нейтрально<\/td><\/tr><tr><td><span class=\"en\">Do you happen to know…?<\/span><\/td><td>«случайно не знаете»<\/td><\/tr><tr><td><span class=\"en\">I was wondering…<\/span><\/td><td>очень мягко<\/td><\/tr><tr><td><span class=\"en\">I'd like to know…<\/span><\/td><td>деловой тон<\/td><\/tr><tr><td><span class=\"en\">Do you have any idea…?<\/span><\/td><td>разговорно<\/td><\/tr><tr><td><span class=\"en\">I'm not sure…<\/span>, <span class=\"en\">I can't remember…<\/span>, <span class=\"en\">I have no idea…<\/span><\/td><td>не вопрос, но порядок слов тот же<\/td><\/tr><\/table><\/div><h4>Превращение по шагам<\/h4><ul><li><span class=\"en\">Where does she live?<\/span> → убираем does → глагол получает -s → <span class=\"en\">Do you know where she lives?<\/span><\/li><li><span class=\"en\">When did they leave?<\/span> → убираем did → глагол в прошедшем → <span class=\"en\">Do you know when they left?<\/span><\/li><li><span class=\"en\">Is it far?<\/span> → нет вопросительного слова → if → <span class=\"en\">Do you know if it is far?<\/span><\/li><li><span class=\"en\">Who is that man?<\/span> → <span class=\"en\">Do you know who that man is?<\/span><\/li><\/ul><h4>Вопрос к подлежащему не меняется<\/h4><p><span class=\"en\">Who lives here?<\/span> → <span class=\"en\">Do you know who lives here?<\/span> Порядок и так прямой.<\/p><h4>Знак в конце<\/h4><p>Вопросительный знак ставят, только если сама вводная фраза — вопрос: <span class=\"en\">Could you tell me where it is?<\/span> Но: <span class=\"en\">I wonder where it is.<\/span><\/p><h4>if и whether<\/h4><p>Взаимозаменяемы. <b>whether<\/b> чуть формальнее и обязателен перед <b>or not<\/b> вплотную и после предлога: <span class=\"en\">I don't know whether or not to go.<\/span> <span class=\"en\">It depends on whether he agrees.<\/span><\/p><h4>То же правило в косвенной речи<\/h4><p><span class=\"en\">She asked where I lived.<\/span> <span class=\"en\">He wanted to know if I was free.<\/span> Отличие одно: в косвенной речи время ещё и сдвигается назад.<\/p><h4>Вопросительное слово + to<\/h4><p><span class=\"en\">I don't know what to do.<\/span> <span class=\"en\">Can you tell me how to get there?<\/span> <span class=\"en\">I'm not sure where to go.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Could you tell me where is the bank?<\/span><span class=\"en\">Could you tell me where the bank is?<\/span><\/li><li><span class=\"bad\">Do you know what time does it open?<\/span><span class=\"en\">Do you know what time it opens?<\/span><\/li><li><span class=\"bad\">I don't know where did she go.<\/span><span class=\"en\">I don't know where she went.<\/span><\/li><li><span class=\"bad\">Do you know is he at home?<\/span><span class=\"en\">Do you know if he is at home?<\/span><\/li><li><span class=\"bad\">Can you tell me what is your name?<\/span><span class=\"en\">Can you tell me what your name is?<\/span><\/li><li><span class=\"bad\">I wonder where is it?<\/span><span class=\"en\">I wonder where it is.<\/span><\/li><\/ul>",
"able": "<h4>Чем заменить can<\/h4><div class=\"tw\"><table><tr><th>Форма<\/th><th>Пример<\/th><\/tr><tr><td>будущее<\/td><td><span class=\"en\">I will be able to help.<\/span><\/td><\/tr><tr><td>Present Perfect<\/td><td><span class=\"en\">I haven't been able to sleep.<\/span><\/td><\/tr><tr><td>после to<\/td><td><span class=\"en\">I want to be able to speak freely.<\/span><\/td><\/tr><tr><td>после модальных<\/td><td><span class=\"en\">You should be able to do it.<\/span> <span class=\"en\">She might be able to come.<\/span><\/td><\/tr><tr><td>-ing форма<\/td><td><span class=\"en\">I enjoy being able to work from home.<\/span><\/td><\/tr><\/table><\/div><p>В настоящем <b>can<\/b> естественнее, чем <b>am able to<\/b>.<\/p><h4>could и was able to<\/h4><div class=\"tw\"><table><tr><th>Ситуация<\/th><th>could<\/th><th>was able to / managed to<\/th><\/tr><tr><td>умение вообще<\/td><td>да: <span class=\"en\">I could run fast.<\/span><\/td><td>возможно<\/td><\/tr><tr><td>одна удача<\/td><td>нет<\/td><td>да: <span class=\"en\">I managed to catch the train.<\/span><\/td><\/tr><tr><td>отрицание<\/td><td>да: <span class=\"en\">I couldn't catch it.<\/span><\/td><td>да<\/td><\/tr><tr><td>с глаголами чувств и понимания<\/td><td>да: <span class=\"en\">I could see the sea.<\/span><\/td><td>—<\/td><\/tr><\/table><\/div><h4>managed to и succeeded in<\/h4><p><span class=\"en\">I managed to open it.<\/span> = <span class=\"en\">I succeeded in opening it.<\/span> После succeed in — -ing.<\/p><h4>Разрешение<\/h4><div class=\"tw\"><table><tr><th>Время<\/th><th>Форма<\/th><\/tr><tr><td>сейчас, вообще<\/td><td><span class=\"en\">You can park here.<\/span> = <span class=\"en\">You are allowed to park here.<\/span><\/td><\/tr><tr><td>прошлое, общее правило<\/td><td><span class=\"en\">We could stay up late.<\/span> = <span class=\"en\">We were allowed to stay up late.<\/span><\/td><\/tr><tr><td>прошлое, один случай<\/td><td><span class=\"en\">I was allowed to leave early.<\/span> — не could<\/td><\/tr><tr><td>будущее<\/td><td><span class=\"en\">You will be allowed to take one bag.<\/span><\/td><\/tr><\/table><\/div><p><b>let<\/b> — то же в активе: <span class=\"en\">My parents let me stay.<\/span> = <span class=\"en\">I was allowed to stay.<\/span><\/p><p><b>be supposed to<\/b> — «положено»: <span class=\"en\">You are not supposed to smoke here.<\/span><\/p><h4>could: не только прошлое<\/h4><ul><li>Вежливая просьба: <span class=\"en\">Could you help me?<\/span><\/li><li>Возможность: <span class=\"en\">It could rain.<\/span><\/li><li>Упущенная возможность: <span class=\"en\">I could have won.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I will can come.<\/span><span class=\"en\">I will be able to come.<\/span><\/li><li><span class=\"bad\">I could find a taxi, so I got there on time.<\/span><span class=\"en\">I managed to find a taxi, so I got there on time.<\/span><\/li><li><span class=\"bad\">I haven't could sleep.<\/span><span class=\"en\">I haven't been able to sleep.<\/span><\/li><li><span class=\"bad\">I managed open the door.<\/span><span class=\"en\">I managed to open the door.<\/span><\/li><li><span class=\"bad\">We are not allowed smoking here.<\/span><span class=\"en\">We are not allowed to smoke here.<\/span><\/li><li><span class=\"bad\">I succeeded to pass.<\/span><span class=\"en\">I succeeded in passing.<\/span><\/li><\/ul>",
"causative": "<h4>Во всех временах<\/h4><div class=\"tw\"><table><tr><th>Время<\/th><th>Пример<\/th><\/tr><tr><td>Present Simple<\/td><td><span class=\"en\">I have my car serviced every year.<\/span><\/td><\/tr><tr><td>Present Continuous<\/td><td><span class=\"en\">We are having the roof repaired.<\/span><\/td><\/tr><tr><td>Past Simple<\/td><td><span class=\"en\">She had her phone fixed.<\/span><\/td><\/tr><tr><td>Present Perfect<\/td><td><span class=\"en\">I have just had my hair cut.<\/span><\/td><\/tr><tr><td>Future<\/td><td><span class=\"en\">I will have it delivered.<\/span><\/td><\/tr><tr><td>going to<\/td><td><span class=\"en\">I am going to have my eyes tested.<\/span><\/td><\/tr><tr><td>модальные<\/td><td><span class=\"en\">You should have it checked.<\/span><\/td><\/tr><\/table><\/div><h4>Вопросы и отрицания<\/h4><p>Здесь <b>have<\/b> — обычный глагол, поэтому нужен do: <span class=\"en\">Do you have your windows cleaned?<\/span> <span class=\"en\">I didn't have it repaired.<\/span> <span class=\"en\">Where did you have it done?<\/span><\/p><h4>have и get<\/h4><p><b>get<\/b> разговорнее и подходит, когда пришлось что-то организовать: <span class=\"en\">I must get my hair cut.<\/span> В повелительном — обычно get: <span class=\"en\">Get it fixed!<\/span><\/p><h4>Кто сделал<\/h4><p>Если важно — через by: <span class=\"en\">I had my portrait painted by a local artist.<\/span><\/p><h4>Неприятное событие<\/h4><p>Та же конструкция описывает то, что с человеком случилось не по его воле: <span class=\"en\">I had my bag stolen.<\/span> — «У меня украли сумку». <span class=\"en\">He had his nose broken.<\/span><\/p><h4>Заставить или попросить человека<\/h4><div class=\"tw\"><table><tr><th>Конструкция<\/th><th>Пример<\/th><\/tr><tr><td>have + человек + глагол<\/td><td><span class=\"en\">I had the mechanic check the brakes.<\/span><\/td><\/tr><tr><td>get + человек + to + глагол<\/td><td><span class=\"en\">I got him to help me.<\/span><\/td><\/tr><tr><td>make + человек + глагол<\/td><td><span class=\"en\">She made me wait.<\/span> — заставила<\/td><\/tr><\/table><\/div><h4>Не путай три похожие фразы<\/h4><div class=\"tw\"><table><tr><th>Фраза<\/th><th>Смысл<\/th><\/tr><tr><td><span class=\"en\">I had my car repaired.<\/span><\/td><td>мне починили<\/td><\/tr><tr><td><span class=\"en\">I had repaired my car.<\/span><\/td><td>я сам починил до того (Past Perfect)<\/td><\/tr><tr><td><span class=\"en\">I have repaired my car.<\/span><\/td><td>я сам починил (Present Perfect)<\/td><\/tr><\/table><\/div><h4>По-русски<\/h4><p>«Я постригся», «я сшил костюм», «я починил машину» часто значат, что это сделал мастер. По-английски в таких случаях нужна эта конструкция.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I had repaired my car at the garage.<\/span><span class=\"en\">I had my car repaired at the garage.<\/span><\/li><li><span class=\"bad\">I had cut my hair yesterday.<\/span><span class=\"en\">I had my hair cut yesterday.<\/span><\/li><li><span class=\"bad\">She had her house paint.<\/span><span class=\"en\">She had her house painted.<\/span><\/li><li><span class=\"bad\">Had you your car washed?<\/span><span class=\"en\">Did you have your car washed?<\/span><\/li><li><span class=\"bad\">I made my hair cut.<\/span><span class=\"en\">I had my hair cut.<\/span><\/li><\/ul>",
"link": "<h4>Что идёт после каждого слова<\/h4><div class=\"tw\"><table><tr><th>Смысл<\/th><th>+ предложение<\/th><th>+ существительное / -ing<\/th><th>Отдельное предложение<\/th><\/tr><tr><td>уступка<\/td><td>although, though, even though<\/td><td>despite, in spite of<\/td><td>However, … Nevertheless, …<\/td><\/tr><tr><td>причина<\/td><td>because, as, since<\/td><td>because of, due to<\/td><td>That is why …<\/td><\/tr><tr><td>следствие<\/td><td>so<\/td><td>—<\/td><td>Therefore, … As a result, …<\/td><\/tr><tr><td>цель<\/td><td>so that<\/td><td>for<\/td><td>—<\/td><\/tr><tr><td>добавление<\/td><td>and<\/td><td>as well as, besides<\/td><td>Also, … Moreover, … In addition, …<\/td><\/tr><tr><td>противопоставление<\/td><td>but, while, whereas<\/td><td>unlike<\/td><td>On the other hand, …<\/td><\/tr><\/table><\/div><h4>despite: три способа<\/h4><ul><li>+ существительное: <span class=\"en\">Despite the rain, we went out.<\/span><\/li><li>+ -ing: <span class=\"en\">Despite feeling tired, he went on.<\/span><\/li><li>+ the fact that + предложение: <span class=\"en\">Despite the fact that it was raining, we went out.<\/span><\/li><\/ul><p><b>in spite of<\/b> работает так же. «Despite of» не существует.<\/p><h4>although, though, even though<\/h4><p><b>though<\/b> — разговорнее и может стоять в конце: <span class=\"en\">It was hard. I enjoyed it, though.<\/span> <b>even though<\/b> — сильнее: «даже несмотря на то, что».<\/p><h4>Запятые<\/h4><ul><li>Придаточное в начале — запятая: <span class=\"en\">Although it was late, we stayed.<\/span><\/li><li>Перед <b>so<\/b> в значении «поэтому» — запятая: <span class=\"en\">It was late, so we left.<\/span><\/li><li>После <b>However<\/b> в начале предложения — запятая.<\/li><li>Перед <b>because<\/b> запятая обычно не нужна.<\/li><\/ul><h4>but и however<\/h4><p>Смысл близкий, место разное. <b>but<\/b> соединяет внутри одного предложения: <span class=\"en\">It was expensive, but we bought it.<\/span> <b>however<\/b> открывает следующее: <span class=\"en\">It was expensive. However, we bought it.<\/span><\/p><h4>Не два союза сразу<\/h4><p>По-русски «хотя…, но…» — норма. По-английски только один: <span class=\"en\">Although it was cold, we went out.<\/span><\/p><h4>so that и to<\/h4><p>Цель с тем же действующим лицом — to: <span class=\"en\">I got up early to catch the train.<\/span> С другим лицом или с can / could — so that: <span class=\"en\">I spoke slowly so that everyone could understand.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Despite of the rain, we went out.<\/span><span class=\"en\">Despite the rain, we went out.<\/span><\/li><li><span class=\"bad\">Despite it was raining, we went out.<\/span><span class=\"en\">Although it was raining, we went out.<\/span><\/li><li><span class=\"bad\">Although it was cold, but we went out.<\/span><span class=\"en\">Although it was cold, we went out.<\/span><\/li><li><span class=\"bad\">Because of it was late, we left.<\/span><span class=\"en\">Because it was late, we left.<\/span><\/li><li><span class=\"bad\">In spite the noise, I slept.<\/span><span class=\"en\">In spite of the noise, I slept.<\/span><\/li><li><span class=\"bad\">It was late, however we stayed.<\/span><span class=\"en\">It was late. However, we stayed.<\/span><\/li><\/ul>",
"sosuch": "<h4>Схемы целиком<\/h4><div class=\"tw\"><table><tr><th>Схема<\/th><th>Пример<\/th><\/tr><tr><td>so + прилагательное<\/td><td><span class=\"en\">so tired<\/span><\/td><\/tr><tr><td>so + наречие<\/td><td><span class=\"en\">so quickly<\/span><\/td><\/tr><tr><td>such + a / an + прилагательное + ед. число<\/td><td><span class=\"en\">such a good idea<\/span><\/td><\/tr><tr><td>such + прилагательное + мн. число<\/td><td><span class=\"en\">such good ideas<\/span><\/td><\/tr><tr><td>such + прилагательное + неисчисляемое<\/td><td><span class=\"en\">such good advice<\/span><\/td><\/tr><tr><td>such + a / an + существительное<\/td><td><span class=\"en\">such a mess<\/span>, <span class=\"en\">such a pity<\/span><\/td><\/tr><tr><td>so much / so little + неисчисляемое<\/td><td><span class=\"en\">so much time<\/span>, <span class=\"en\">so little money<\/span><\/td><\/tr><tr><td>so many / so few + мн. число<\/td><td><span class=\"en\">so many people<\/span>, <span class=\"en\">so few places<\/span><\/td><\/tr><tr><td>such a lot of + любое<\/td><td><span class=\"en\">such a lot of work<\/span><\/td><\/tr><\/table><\/div><h4>so и very<\/h4><p><b>very<\/b> просто усиливает. <b>so<\/b> эмоциональнее и часто подразумевает последствие: <span class=\"en\">I am so tired.<\/span> В отрицании <span class=\"en\">not so bad<\/span> = «не так уж плохо».<\/p><h4>that можно опустить<\/h4><p>В разговоре: <span class=\"en\">I was so tired I fell asleep.<\/span><\/p><h4>so и too<\/h4><p><b>so … that<\/b> — следствие: <span class=\"en\">It was so heavy that I couldn't lift it.<\/span> <b>too … to<\/b> — то же через «слишком»: <span class=\"en\">It was too heavy to lift.<\/span><\/p><h4>Другие значения so<\/h4><ul><li>«Поэтому»: <span class=\"en\">I was late, so I ran.<\/span><\/li><li>«Тоже»: <span class=\"en\">So do I.<\/span><\/li><li>Вместо целой фразы: <span class=\"en\">I think so.<\/span> <span class=\"en\">I hope so.<\/span> <span class=\"en\">I don't think so.<\/span><\/li><li>«Чтобы»: <span class=\"en\">so that<\/span>.<\/li><\/ul><h4>Другие значения such<\/h4><ul><li><span class=\"en\">such as<\/span> — «такие как»: <span class=\"en\">fruit such as apples and pears<\/span>.<\/li><li>«Подобный»: <span class=\"en\">I have never heard such a thing.<\/span><\/li><\/ul><h4>Порядок слов<\/h4><p>Артикль идёт после such: <span class=\"en\">such a nice day<\/span>. Вариант «a such nice day» невозможен. В книжной речи встречается <span class=\"en\">so nice a day<\/span>.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">It was so nice day.<\/span><span class=\"en\">It was such a nice day.<\/span><\/li><li><span class=\"bad\">She is such beautiful.<\/span><span class=\"en\">She is so beautiful.<\/span><\/li><li><span class=\"bad\">It was a such good film.<\/span><span class=\"en\">It was such a good film.<\/span><\/li><li><span class=\"bad\">There were so much people.<\/span><span class=\"en\">There were so many people.<\/span><\/li><li><span class=\"bad\">They are so nice people.<\/span><span class=\"en\">They are such nice people.<\/span><\/li><li><span class=\"bad\">I was so tired, that I went to bed.<\/span><span class=\"en\">I was so tired that I went to bed.<\/span><small>без запятой<\/small><\/li><\/ul>",
"tags": "<h4>Хвостики по временам<\/h4><div class=\"tw\"><table><tr><th>Предложение<\/th><th>Хвостик<\/th><\/tr><tr><td><span class=\"en\">You are tired,<\/span><\/td><td><span class=\"en\">aren't you?<\/span><\/td><\/tr><tr><td><span class=\"en\">She was there,<\/span><\/td><td><span class=\"en\">wasn't she?<\/span><\/td><\/tr><tr><td><span class=\"en\">He works here,<\/span><\/td><td><span class=\"en\">doesn't he?<\/span><\/td><\/tr><tr><td><span class=\"en\">They came,<\/span><\/td><td><span class=\"en\">didn't they?<\/span><\/td><\/tr><tr><td><span class=\"en\">You have seen it,<\/span><\/td><td><span class=\"en\">haven't you?<\/span><\/td><\/tr><tr><td><span class=\"en\">She will come,<\/span><\/td><td><span class=\"en\">won't she?<\/span><\/td><\/tr><tr><td><span class=\"en\">He can swim,<\/span><\/td><td><span class=\"en\">can't he?<\/span><\/td><\/tr><tr><td><span class=\"en\">You would like tea,<\/span><\/td><td><span class=\"en\">wouldn't you?<\/span><\/td><\/tr><tr><td><span class=\"en\">We should go,<\/span><\/td><td><span class=\"en\">shouldn't we?<\/span><\/td><\/tr><\/table><\/div><h4>Особые случаи<\/h4><div class=\"tw\"><table><tr><th>Предложение<\/th><th>Хвостик<\/th><\/tr><tr><td><span class=\"en\">I am right,<\/span><\/td><td><span class=\"en\">aren't I?<\/span><\/td><\/tr><tr><td><span class=\"en\">Let's start,<\/span><\/td><td><span class=\"en\">shall we?<\/span><\/td><\/tr><tr><td><span class=\"en\">Help me,<\/span><\/td><td><span class=\"en\">will you?<\/span> / <span class=\"en\">can you?<\/span><\/td><\/tr><tr><td><span class=\"en\">Don't forget,<\/span><\/td><td><span class=\"en\">will you?<\/span><\/td><\/tr><tr><td><span class=\"en\">There is a bank here,<\/span><\/td><td><span class=\"en\">isn't there?<\/span><\/td><\/tr><tr><td><span class=\"en\">This is your bag,<\/span><\/td><td><span class=\"en\">isn't it?<\/span><\/td><\/tr><tr><td><span class=\"en\">Everybody knows,<\/span><\/td><td><span class=\"en\">don't they?<\/span><\/td><\/tr><tr><td><span class=\"en\">Nobody called,<\/span><\/td><td><span class=\"en\">did they?<\/span><\/td><\/tr><\/table><\/div><h4>Скрытое отрицание<\/h4><p>Слова <b>never, nobody, nothing, hardly, rarely<\/b> уже отрицательные, поэтому хвостик утвердительный: <span class=\"en\">You never listen, do you?<\/span> <span class=\"en\">He hardly works, does he?<\/span><\/p><h4>have как основной глагол<\/h4><p><span class=\"en\">You have a car, don't you?<\/span> — с do. С have got: <span class=\"en\">You have got a car, haven't you?<\/span><\/p><h4>Интонация меняет смысл<\/h4><p>Голос вниз — уверен, жду согласия: <span class=\"en\">It's a nice day, isn't it?<\/span> Голос вверх — правда не знаю и спрашиваю: <span class=\"en\">You are coming, aren't you?<\/span><\/p><h4>Как отвечать<\/h4><p>Отвечают по факту, а не «соглашаясь» с формой вопроса: <span class=\"en\">You don't smoke, do you?<\/span> — <span class=\"en\">No, I don't.<\/span> (не курю) / <span class=\"en\">Yes, I do.<\/span> (курю). Русское «Да, не курю» здесь невозможно.<\/p><h4>Проще в разговоре<\/h4><p>В живой речи хвостик часто заменяют на <b>right?<\/b>: <span class=\"en\">You live here, right?<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">You are tired, isn't it?<\/span><span class=\"en\">You are tired, aren't you?<\/span><\/li><li><span class=\"bad\">She likes tea, isn't she?<\/span><span class=\"en\">She likes tea, doesn't she?<\/span><\/li><li><span class=\"bad\">He isn't here, isn't he?<\/span><span class=\"en\">He isn't here, is he?<\/span><\/li><li><span class=\"bad\">Tom is late, isn't Tom?<\/span><span class=\"en\">Tom is late, isn't he?<\/span><\/li><li><span class=\"bad\">You never smoke, don't you?<\/span><span class=\"en\">You never smoke, do you?<\/span><\/li><li><span class=\"bad\">I am late, amn't I?<\/span><span class=\"en\">I am late, aren't I?<\/span><\/li><\/ul>",
"soneither": "<h4>Все глаголы<\/h4><div class=\"tw\"><table><tr><th>Реплика<\/th><th>Согласен<\/th><th>Не согласен<\/th><\/tr><tr><td><span class=\"en\">I am hungry.<\/span><\/td><td><span class=\"en\">So am I.<\/span><\/td><td><span class=\"en\">I am not.<\/span><\/td><\/tr><tr><td><span class=\"en\">I am not ready.<\/span><\/td><td><span class=\"en\">Neither am I.<\/span><\/td><td><span class=\"en\">I am.<\/span><\/td><\/tr><tr><td><span class=\"en\">I like it.<\/span><\/td><td><span class=\"en\">So do I.<\/span><\/td><td><span class=\"en\">I don't.<\/span><\/td><\/tr><tr><td><span class=\"en\">I don't know.<\/span><\/td><td><span class=\"en\">Neither do I.<\/span><\/td><td><span class=\"en\">I do.<\/span><\/td><\/tr><tr><td><span class=\"en\">I went there.<\/span><\/td><td><span class=\"en\">So did I.<\/span><\/td><td><span class=\"en\">I didn't.<\/span><\/td><\/tr><tr><td><span class=\"en\">I have seen it.<\/span><\/td><td><span class=\"en\">So have I.<\/span><\/td><td><span class=\"en\">I haven't.<\/span><\/td><\/tr><tr><td><span class=\"en\">I can't drive.<\/span><\/td><td><span class=\"en\">Neither can I.<\/span><\/td><td><span class=\"en\">I can.<\/span><\/td><\/tr><tr><td><span class=\"en\">I will come.<\/span><\/td><td><span class=\"en\">So will I.<\/span><\/td><td><span class=\"en\">I won't.<\/span><\/td><\/tr><tr><td><span class=\"en\">I would like tea.<\/span><\/td><td><span class=\"en\">So would I.<\/span><\/td><td><span class=\"en\">I wouldn't.<\/span><\/td><\/tr><\/table><\/div><h4>Не только I<\/h4><p>Подлежащее может быть любым, глагол согласуется с ним: <span class=\"en\">So does my wife.<\/span> <span class=\"en\">Neither has Tom.<\/span> <span class=\"en\">So were they.<\/span><\/p><h4>Варианты<\/h4><ul><li><b>Nor<\/b> вместо Neither: <span class=\"en\">Nor do I.<\/span><\/li><li>С either в конце и обычным порядком: <span class=\"en\">I don't either.<\/span><\/li><li>С too: <span class=\"en\">I do too.<\/span><\/li><li>Разговорно: <span class=\"en\">Me too.<\/span> <span class=\"en\">Me neither.<\/span> Правильно для отрицания именно <b>Me neither<\/b>, а не «Me too».<\/li><\/ul><h4>Внутри одного предложения<\/h4><p><span class=\"en\">She speaks French, and so does her brother.<\/span> <span class=\"en\">I didn't go, and neither did Anna.<\/span><\/p><h4>so после think, hope, be afraid<\/h4><p>Другое so, заменяющее целую фразу: <span class=\"en\">Is he coming? — I think so.<\/span> <span class=\"en\">I hope so.<\/span> <span class=\"en\">I'm afraid so.<\/span> Отрицание: <span class=\"en\">I don't think so.<\/span> <span class=\"en\">I hope not.<\/span> <span class=\"en\">I'm afraid not.<\/span><\/p><h4>Порядок слов<\/h4><p>Здесь инверсия, как в вопросе: сначала глагол, потом подлежащее. <span class=\"en\">So I do<\/span> значит другое — «Да, действительно» (подтверждение с удивлением).<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">\"I like tea.\" — \"So I do.\"<\/span><span class=\"en\">\"I like tea.\" — \"So do I.\"<\/span><\/li><li><span class=\"bad\">\"I don't smoke.\" — \"So do I.\"<\/span><span class=\"en\">\"I don't smoke.\" — \"Neither do I.\"<\/span><\/li><li><span class=\"bad\">\"I can't swim.\" — \"Neither can't I.\"<\/span><span class=\"en\">\"I can't swim.\" — \"Neither can I.\"<\/span><\/li><li><span class=\"bad\">\"I am tired.\" — \"So do I.\"<\/span><span class=\"en\">\"I am tired.\" — \"So am I.\"<\/span><\/li><li><span class=\"bad\">\"I don't know.\" — \"Me too.\"<\/span><span class=\"en\">\"I don't know.\" — \"Me neither.\"<\/span><\/li><li><span class=\"bad\">\"She went home.\" — \"So went I.\"<\/span><span class=\"en\">\"She went home.\" — \"So did I.\"<\/span><\/li><\/ul>",
"quant": "<h4>О двух<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>+ существительное<\/th><th>+ of<\/th><th>Глагол<\/th><\/tr><tr><td>both<\/td><td>both books<\/td><td>both of the books, both of them<\/td><td>множественное<\/td><\/tr><tr><td>either<\/td><td>either book<\/td><td>either of the books, either of them<\/td><td>единственное<\/td><\/tr><tr><td>neither<\/td><td>neither book<\/td><td>neither of the books, neither of them<\/td><td>единственное<\/td><\/tr><\/table><\/div><p>После <b>neither of<\/b> в разговоре встречается и множественное число: <span class=\"en\">Neither of them are here.<\/span><\/p><h4>О трёх и больше<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Смысл<\/th><th>Пример<\/th><\/tr><tr><td>all<\/td><td>все<\/td><td><span class=\"en\">All of my friends came.<\/span><\/td><\/tr><tr><td>most<\/td><td>большинство<\/td><td><span class=\"en\">Most of the shops were closed.<\/span><\/td><\/tr><tr><td>many / much<\/td><td>многие / многое<\/td><td><span class=\"en\">Many of us agree.<\/span><\/td><\/tr><tr><td>some<\/td><td>некоторые<\/td><td><span class=\"en\">Some of the students failed.<\/span><\/td><\/tr><tr><td>a few / a little<\/td><td>несколько / немного<\/td><td><span class=\"en\">A few of them left.<\/span><\/td><\/tr><tr><td>none<\/td><td>никто, ни один<\/td><td><span class=\"en\">None of them came.<\/span><\/td><\/tr><\/table><\/div><p><b>no<\/b> — перед существительным, <b>none<\/b> — вместо него: <span class=\"en\">No students came.<\/span> <span class=\"en\">None came.<\/span><\/p><h4>of: когда нужен<\/h4><ul><li>Перед <b>the, my, his, these, those<\/b> и местоимениями <b>us, you, them<\/b> — нужен: <span class=\"en\">most of the time<\/span>, <span class=\"en\">some of us<\/span>.<\/li><li>В общем смысле — нет: <span class=\"en\">Most people work.<\/span> <span class=\"en\">Some children are shy.<\/span><\/li><li>После <b>all<\/b> и <b>both<\/b> перед существительным of можно опустить: <span class=\"en\">all my friends<\/span>, <span class=\"en\">both my parents<\/span>. Перед местоимением нельзя: <span class=\"en\">all of them<\/span>.<\/li><\/ul><h4>all и every<\/h4><div class=\"tw\"><table><tr><th>all<\/th><th>every<\/th><\/tr><tr><td>+ множественное: <span class=\"en\">all students<\/span><\/td><td>+ единственное: <span class=\"en\">every student<\/span><\/td><\/tr><tr><td><span class=\"en\">all day<\/span> — весь день<\/td><td><span class=\"en\">every day<\/span> — каждый день<\/td><\/tr><\/table><\/div><p><b>everyone, everybody, everything<\/b> — единственное число: <span class=\"en\">Everyone is here.<\/span><\/p><h4>each и every<\/h4><p><b>every<\/b> — о всех вместе, от трёх. <b>each<\/b> — о каждом по отдельности, можно о двух: <span class=\"en\">each hand<\/span>. Только each сочетается с of: <span class=\"en\">each of them<\/span>.<\/p><h4>Место в предложении<\/h4><p><b>both<\/b> и <b>all<\/b> могут стоять перед основным глаголом и после be: <span class=\"en\">We both like it.<\/span> <span class=\"en\">They are all here.<\/span><\/p><h4>Отрицание<\/h4><p>«Оба не» по-английски — neither: <span class=\"en\">Neither of us knew.<\/span> «Все не» — none или not all, смысл разный: <span class=\"en\">None of them came.<\/span> — никто. <span class=\"en\">Not all of them came.<\/span> — не все.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Both of them is here.<\/span><span class=\"en\">Both of them are here.<\/span><\/li><li><span class=\"bad\">Neither of them didn't come.<\/span><span class=\"en\">Neither of them came.<\/span><\/li><li><span class=\"bad\">Most of people like it.<\/span><span class=\"en\">Most people like it.<\/span><\/li><li><span class=\"bad\">Every students were late.<\/span><span class=\"en\">Every student was late.<\/span><\/li><li><span class=\"bad\">All of us didn't go.<\/span><span class=\"en\">None of us went.<\/span><\/li><li><span class=\"bad\">Either of them are fine.<\/span><span class=\"en\">Either of them is fine.<\/span><small>в письменной речи<\/small><\/li><\/ul>",

/* ================= answer checking ================= */
/* Normalises an answer. 's after a pronoun can be «is» or «has» and 'd can be «would» or «had»,
   so those are kept as placeholders and canonAll() returns every reading. */
const NUMW={1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten',11:'eleven',12:'twelve'};
function canonBase(s){
  s=String(s).toLowerCase().replace(/[’‘`ʼ]/g,"'").replace(/[.,!?;:"“”«»()—–-]+/g,' ');
  s=s.replace(/\b(do|does|did|is|are|was|were|have|has|had|could|should|would|must)nt\b/g,'$1 not').replace(/\bcant\b/g,'cannot').replace(/\bwont\b/g,'will not').replace(/\bim\b/g,'i am');
  s=s.replace(/\bcan't\b/g,'cannot').replace(/\bcan not\b/g,'cannot').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not')
     .replace(/\bi'm\b/g,'i am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will')
     .replace(/\b(he|she|it|that|there|what|where|who|how|here|when|why)'s got\b/g,'$1 has got')
     .replace(/\b(he|she|it|that|there|what|where|who|how|here|when|why)'s\b/g,'$1 \u0001')
     .replace(/\b(i|you|he|she|it|we|they|that|there|who|what)'d\b/g,'$1 \u0002')
     .replace(/\b([a-z]{2,})'s\b/g,'$1 \u0003')
     .replace(/\b(1[0-2]|[1-9])\b/g,m=>NUMW[m]);
  return s.replace(/\s+/g,' ').trim();
}
function canonAll(s){
  let out=[canonBase(s)];
  for(const [ch,opts] of [['\u0001',['is','has']],['\u0002',['would','had']],['\u0003',["'s",'is','has']]])
    while(out[0].includes(ch)&&out.length<=8)out=out.flatMap(x=>opts.map(o=>x.replace(ch,o)));
  return out;
}
const canon=s=>canonAll(s)[0];
const AUX=new Set(['am','is','are','not','do','does','did','was','were','have','has']);
/* forms of irregular verbs: typing one of them instead of another is grammar, never a slip */
const VOCAB=new Set('be am is are was were been do does did done go goes went gone have has had see saw seen come came make made take took taken get got give gave given find found know knew known think thought say said tell told write wrote written read eat ate eaten drink drank drunk buy bought bring brought break broke broken speak spoke spoken sing sang sung swim swam swum run ran begin began begun leave left lose lost meet met pay paid put send sent sit sat sleep slept stand stood steal stole stolen teach taught wear wore worn win won build built grow grew grown fall fell fallen feel felt forget forgot forgotten hear heard keep kept drive drove driven fly flew flown choose chose chosen sell sold spend spent become became catch caught cut hit let hold held'.split(' '));
ITEMS.forEach(it=>{[...(it.ans||[]),...(it.o||[]),...(it.extra||[]),(it.t==='tr'||it.t==='build')?'':it.q||''].forEach(x=>canon(x).split(' ').forEach(w=>w&&VOCAB.add(w)))});
/* one-character slip: returns the position of the difference, or -1 */
function slip(a,b){
  if(a===b)return -1;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return -1;
  let i=0;while(i<la&&i<lb&&a[i]===b[i])i++;
  if(la===lb){if(a.slice(i+1)===b.slice(i+1))return i;if(a[i]===b[i+1]&&a[i+1]===b[i]&&a.slice(i+2)===b.slice(i+2))return i;return -1}
  return (la<lb?a.slice(i)===b.slice(i+1):a.slice(i+1)===b.slice(i))?i:-1;
}
/* → {res:'ok'|'typo'|'bad', want, got}  A slip is forgiven only when it cannot be the grammar itself:
   the word is 4+ letters, the typed word is not another real word of the course (play / plays),
   and the difference is not inside an -s / -ed / -ing ending. */
function check(user,answers,strict){
  const U=canonAll(user);if(!U[0])return {res:'bad'};
  const A=answers.flatMap(a=>canonAll(a));
  for(const u of U)if(A.includes(u))return {res:'ok'};
  if(!strict)for(const a of A)for(const u of U){
    const aw=a.split(' '),uw=u.split(' ');if(aw.length!==uw.length)continue;
    let diff=-1,many=false;for(let i=0;i<aw.length;i++)if(aw[i]!==uw[i]){if(diff>=0){many=true;break}diff=i}
    if(many||diff<0)continue;
    const w=aw[diff],g=uw[diff],p=slip(g,w);
    if(p<0||w.length<4||VOCAB.has(g))continue;
    /* the last letter of a word is an ending (money / moneys, work / worked): grammar, not a slip */
    if(w.length===g.length?p===w.length-1:p===Math.min(w.length,g.length))continue;
    if(/(s|ed|ing)$/.test(w)&&p>=w.length-3)continue;
    /* a missing or extra doubled letter is a spelling rule (written / writen, getting / geting) */
    const L=w.length>g.length?w:g;if(w.length!==g.length&&/(ing|ed|en|er|est)$/.test(L)&&(L[p]===L[p-1]||L[p]===L[p+1]))continue;
    return {res:'typo',want:w,got:g};
  }
  return {res:'bad'};
}

/* ================= tap-to-translate =================
   Uses Лексика's native translator. Replies come back through window.__nb of the main frame,
   so that function is wrapped once and our own request ids are kept apart from the reader's. */
const TB={seq:9000000,cb:new Map(),cache:new Map()};
(function(){try{const w=EMB?PARENT:window,orig=w.__nb;
  w.__nb=(id,ok,val)=>{const c=TB.cb.get(id);if(c){TB.cb.delete(id);ok?c.res(val):c.rej(val);return}if(typeof orig==='function')orig(id,ok,val)}}catch(e){}})();
function nativeCall(type,data,ms=15000){return new Promise((res,rej)=>{if(!MH){rej();return}const id=++TB.seq;TB.cb.set(id,{res,rej});setTimeout(()=>{if(TB.cb.delete(id))rej()},ms);try{MH.postMessage({id,type,data})}catch(e){TB.cb.delete(id);rej()}})}

async function showTr(word,ctx){
  const key=word.toLowerCase();
  const head=`<b>${esc(word)}</b>`,more=ctx&&ctx.trim().split(/\s+/).length>1?'<button class="linkbtn" id="tipSent">Перевести всё предложение</button>':'';
  if(!MH){tip(head+' <span>— перевод по нажатию работает в приложении на iPhone.</span>',5000);return}
  const paint=tr=>{const t=tip(head+' <span>— '+esc(tr)+'</span>'+more);const b=t.querySelector('#tipSent');
    if(b)b.onclick=async e=>{e.stopPropagation();b.disabled=true;b.textContent='Перевожу…';
      try{const r=await nativeCall('translateSentence',{text:ctx},25000);tip(`<span>${esc(ctx)}</span><br><b>${esc(String(r&&r.tr||'—'))}</b>`,15000)}catch(err){tip(head+' <span>— не удалось перевести предложение.</span>',4000)}}};
  if(TB.cache.has(key)){paint(TB.cache.get(key));return}
  tip(head+' <span>— …</span>');
  try{const r=await nativeCall('translate',{text:word,ctx:ctx||'',isPhrase:false});let tr=String(r&&r.tr||'').trim();if(!tr)throw 0;
    if(r.lemma&&String(r.lemma).toLowerCase()!==key)tr+=' · форма от '+r.lemma;
    TB.cache.set(key,tr);paint(tr)}
  catch(e){tip(head+' <span>— не удалось перевести. Нужен интернет или установленный в iOS языковой пакет.</span>',5000)}
}

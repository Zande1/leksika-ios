"pp1": "<h4>Четыре значения<\/h4><div class=\"tw\"><table><tr><th>Значение<\/th><th>Пример<\/th><\/tr><tr><td>результат виден сейчас<\/td><td><span class=\"en\">I have lost my keys.<\/span> — и их нет<\/td><\/tr><tr><td>опыт «когда-либо в жизни»<\/td><td><span class=\"en\">I have been to London.<\/span><\/td><\/tr><tr><td>период ещё не закончился<\/td><td><span class=\"en\">I have drunk three coffees today.<\/span><\/td><\/tr><tr><td>началось раньше и длится<\/td><td><span class=\"en\">I have lived here for five years.<\/span><\/td><\/tr><\/table><\/div><h4>Как это переводится<\/h4><p>В русском такого времени нет. Первые три случая переводятся прошедшим временем («потерял», «был», «выпил»), четвёртый — настоящим: «Я живу здесь пять лет». Отсюда самая частая ошибка: <span class=\"en\">I have lived here for five years<\/span>, а не «I live here for five years».<\/p><h4>been и gone<\/h4><ul><li><span class=\"en\">He has been to Paris.<\/span> — съездил и вернулся.<\/li><li><span class=\"en\">He has gone to Paris.<\/span> — уехал и сейчас там.<\/li><\/ul><h4>Сокращения<\/h4><p><span class=\"en\">I've<\/span>, <span class=\"en\">you've<\/span>, <span class=\"en\">we've<\/span>, <span class=\"en\">he's<\/span>, <span class=\"en\">she's<\/span>. <b>'s<\/b> может значить и <b>is<\/b>, и <b>has<\/b>. Различают по следующему слову: <span class=\"en\">He's finished.<\/span> = has (третья форма), <span class=\"en\">He's tired.<\/span> = is.<\/p><h4>Слова-спутники<\/h4><p><b>just, already, yet, ever, never, recently, lately, so far, before, today, this week, this year, for, since<\/b>.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I have saw this film.<\/span><span class=\"en\">I have seen this film.<\/span><small>нужна третья форма<\/small><\/li><li><span class=\"bad\">He have finished.<\/span><span class=\"en\">He has finished.<\/span><\/li><li><span class=\"bad\">I have seen him yesterday.<\/span><span class=\"en\">I saw him yesterday.<\/span><small>названо законченное время<\/small><\/li><li><span class=\"bad\">I live here for five years.<\/span><span class=\"en\">I have lived here for five years.<\/span><\/li><li><span class=\"bad\">I have been in London twice.<\/span><span class=\"en\">I have been to London twice.<\/span><small>о поездках — been to<\/small><\/li><\/ul>",
"pp2": "<h4>Слова-подсказки<\/h4><div class=\"tw\"><table><tr><th>Present Perfect<\/th><th>Past Simple<\/th><\/tr><tr><td>ever, never, just, already, yet<\/td><td>yesterday, last week, two days ago<\/td><\/tr><tr><td>today, this week, this year (ещё идёт)<\/td><td>in 2020, on Monday, at five<\/td><\/tr><tr><td>for, since (до сих пор)<\/td><td>When…? What time…?<\/td><\/tr><tr><td>recently, so far, before<\/td><td>when I was a child<\/td><\/tr><\/table><\/div><h4>Как идёт разговор<\/h4><p>Новость сообщают в Present Perfect, а подробности — уже в Past Simple, потому что речь пошла о конкретном моменте: <span class=\"en\">I have bought a car.<\/span> — <span class=\"en\">Where did you buy it?<\/span> — <span class=\"en\">I bought it in Kazan.<\/span><\/p><h4>Тонкости<\/h4><ul><li>Вопрос <b>When…?<\/b> всегда в Past Simple: <span class=\"en\">When did you arrive?<\/span><\/li><li><b>today, this morning<\/b>: если период ещё идёт — Perfect, если уже кончился — Simple. В три часа дня скажут <span class=\"en\">I didn't have breakfast this morning.<\/span><\/li><li>О людях, которых уже нет, и о закрытых периодах — Past Simple: <span class=\"en\">Pushkin wrote many poems.<\/span><\/li><li>После «в первый раз»: <span class=\"en\">It is the first time I have eaten sushi.<\/span><\/li><li>В американской речи с <b>just, already, yet<\/b> часто ставят Past Simple: <span class=\"en\">Did you eat yet?<\/span> Это не ошибка, но в британской норме — Perfect.<\/li><\/ul><h4>Место just, already, yet, still<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Место<\/th><th>Пример<\/th><\/tr><tr><td>just, already<\/td><td>между have и глаголом<\/td><td><span class=\"en\">I have just eaten.<\/span><\/td><\/tr><tr><td>yet<\/td><td>в конце вопроса или отрицания<\/td><td><span class=\"en\">Have you finished yet?<\/span><\/td><\/tr><tr><td>still<\/td><td>перед haven't<\/td><td><span class=\"en\">I still haven't finished.<\/span><\/td><\/tr><\/table><\/div><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">When have you arrived?<\/span><span class=\"en\">When did you arrive?<\/span><\/li><li><span class=\"bad\">I have been there last year.<\/span><span class=\"en\">I was there last year.<\/span><\/li><li><span class=\"bad\">Did you ever be in Paris?<\/span><span class=\"en\">Have you ever been to Paris?<\/span><\/li><li><span class=\"bad\">I already have seen it.<\/span><span class=\"en\">I have already seen it.<\/span><\/li><li><span class=\"bad\">I didn't see him since Monday.<\/span><span class=\"en\">I haven't seen him since Monday.<\/span><\/li><\/ul>",
"gt": "<h4>Два значения<\/h4><ul><li>Намерение, решённое заранее: <span class=\"en\">I am going to buy a new phone.<\/span><\/li><li>Прогноз по тому, что видно уже сейчас: <span class=\"en\">Look at the clouds. It is going to rain.<\/span><\/li><\/ul><h4>going to и Present Continuous<\/h4><div class=\"tw\"><table><tr><th>going to<\/th><th>Present Continuous<\/th><\/tr><tr><td>намерение, деталей может не быть<\/td><td>договорённость: есть время, место, люди<\/td><\/tr><tr><td><span class=\"en\">I am going to see a doctor.<\/span><\/td><td><span class=\"en\">I am seeing the doctor at five.<\/span><\/td><\/tr><\/table><\/div><p>Часто подходят оба. С глаголом <b>go<\/b> обычно не говорят «going to go», а сокращают: <span class=\"en\">I am going to the cinema tonight.<\/span><\/p><h4>Собирался, но не сделал<\/h4><p><span class=\"en\">I was going to call you, but I forgot.<\/span> — прошедшая форма <b>was / were going to<\/b> показывает несостоявшийся план.<\/p><h4>В разговоре<\/h4><p>В быстрой речи <b>going to<\/b> звучит как «gonna». Так говорят и поют, но не пишут.<\/p><h4>Вопросы<\/h4><p><span class=\"en\">What are you going to do?<\/span> <span class=\"en\">When is she going to tell him?<\/span> <span class=\"en\">Are you going to stay?<\/span> — <span class=\"en\">Yes, I am.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I going to buy it.<\/span><span class=\"en\">I am going to buy it.<\/span><small>без be формы нет<\/small><\/li><li><span class=\"bad\">I am going buy it.<\/span><span class=\"en\">I am going to buy it.<\/span><small>нужен to<\/small><\/li><li><span class=\"bad\">I am going to buying it.<\/span><span class=\"en\">I am going to buy it.<\/span><small>после to первая форма<\/small><\/li><li><span class=\"bad\">He is going to goes.<\/span><span class=\"en\">He is going to go.<\/span><\/li><li><span class=\"bad\">I will going to call.<\/span><span class=\"en\">I am going to call.<\/span><small>will и going to вместе не ставят<\/small><\/li><\/ul>",
"will": "<h4>Когда нужен will<\/h4><div class=\"tw\"><table><tr><th>Значение<\/th><th>Пример<\/th><\/tr><tr><td>решение в момент речи<\/td><td><span class=\"en\">I'll take this one.<\/span><\/td><\/tr><tr><td>обещание<\/td><td><span class=\"en\">I'll call you tonight.<\/span><\/td><\/tr><tr><td>предложение помощи<\/td><td><span class=\"en\">I'll carry your bag.<\/span><\/td><\/tr><tr><td>просьба<\/td><td><span class=\"en\">Will you help me?<\/span><\/td><\/tr><tr><td>прогноз, мнение<\/td><td><span class=\"en\">I think it will rain.<\/span><\/td><\/tr><tr><td>факт о будущем<\/td><td><span class=\"en\">I'll be 22 next year.<\/span><\/td><\/tr><tr><td>отказ<\/td><td><span class=\"en\">The car won't start.<\/span><\/td><\/tr><\/table><\/div><h4>Три способа сказать о будущем<\/h4><div class=\"tw\"><table><tr><th>Форма<\/th><th>Что значит<\/th><th>Пример<\/th><\/tr><tr><td>will<\/td><td>решил только что, прогноз<\/td><td><span class=\"en\">I'll have tea.<\/span><\/td><\/tr><tr><td>going to<\/td><td>решил заранее<\/td><td><span class=\"en\">I am going to learn to drive.<\/span><\/td><\/tr><tr><td>Present Continuous<\/td><td>уже договорился<\/td><td><span class=\"en\">I am meeting Tom at six.<\/span><\/td><\/tr><\/table><\/div><h4>Тонкости<\/h4><ul><li><b>probably<\/b>: в утверждении после will, в отрицании перед won't: <span class=\"en\">I'll probably come.<\/span> <span class=\"en\">I probably won't come.<\/span><\/li><li>Отрицательное мнение: <span class=\"en\">I don't think I'll go.<\/span> звучит естественнее, чем «I think I won't go».<\/li><li><b>shall<\/b> с I и we — предложить что-то: <span class=\"en\">Shall I open the window?<\/span> <span class=\"en\">Shall we go?<\/span><\/li><li>После <b>if, when, before, as soon as<\/b> will не ставят: <span class=\"en\">I'll call you when I arrive.<\/span><\/li><li><b>will<\/b> не сокращают в кратком ответе: <span class=\"en\">Yes, I will.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I will to go.<\/span><span class=\"en\">I will go.<\/span><\/li><li><span class=\"bad\">He wills come.<\/span><span class=\"en\">He will come.<\/span><\/li><li><span class=\"bad\">I think I go home.<\/span><span class=\"en\">I think I'll go home.<\/span><\/li><li><span class=\"bad\">I'll call you when I will arrive.<\/span><span class=\"en\">I'll call you when I arrive.<\/span><\/li><li><span class=\"bad\">I will go to the doctor at five tomorrow.<\/span><span class=\"en\">I am going to the doctor at five tomorrow.<\/span><small>если запись уже есть<\/small><\/li><\/ul>",
"can": "<h4>Значения can<\/h4><div class=\"tw\"><table><tr><th>Значение<\/th><th>Пример<\/th><\/tr><tr><td>умение<\/td><td><span class=\"en\">I can swim.<\/span><\/td><\/tr><tr><td>возможность<\/td><td><span class=\"en\">You can buy tickets online.<\/span><\/td><\/tr><tr><td>разрешение<\/td><td><span class=\"en\">Can I come in?<\/span> <span class=\"en\">You can't park here.<\/span><\/td><\/tr><tr><td>просьба<\/td><td><span class=\"en\">Can you help me?<\/span><\/td><\/tr><\/table><\/div><p>С глаголами чувств <b>can<\/b> часто просто не переводится: <span class=\"en\">I can see the sea.<\/span> — «Я вижу море». <span class=\"en\">I can't hear you.<\/span> — «Я тебя не слышу».<\/p><h4>У can только две формы<\/h4><p>Для других времён берут <b>be able to<\/b>:<\/p><div class=\"tw\"><table><tr><th>Время<\/th><th>Пример<\/th><\/tr><tr><td>будущее<\/td><td><span class=\"en\">I will be able to come.<\/span><\/td><\/tr><tr><td>Present Perfect<\/td><td><span class=\"en\">I haven't been able to sleep.<\/span><\/td><\/tr><tr><td>после другого глагола<\/td><td><span class=\"en\">I want to be able to drive.<\/span><\/td><\/tr><\/table><\/div><h4>could в прошедшем<\/h4><ul><li>Общее умение: <span class=\"en\">I could swim when I was five.<\/span><\/li><li>Одна удача в конкретной ситуации — <b>was able to<\/b> или <b>managed to<\/b>: <span class=\"en\">The door was locked, but I was able to open it.<\/span><\/li><li>В отрицании разницы нет: <span class=\"en\">I couldn't open it.<\/span><\/li><\/ul><h4>Вежливость по возрастанию<\/h4><p><span class=\"en\">Can you…?<\/span> → <span class=\"en\">Could you…?<\/span> → <span class=\"en\">Could you possibly…?<\/span> Просьба о разрешении: <span class=\"en\">Can I…?<\/span> → <span class=\"en\">Could I…?<\/span> → <span class=\"en\">May I…?<\/span><\/p><h4>Произношение и письмо<\/h4><p>В утверждении <b>can<\/b> звучит слабо и коротко, а <b>can't<\/b> — с долгим гласным. <b>cannot<\/b> пишется слитно.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I can to swim.<\/span><span class=\"en\">I can swim.<\/span><\/li><li><span class=\"bad\">He cans drive.<\/span><span class=\"en\">He can drive.<\/span><\/li><li><span class=\"bad\">I don't can come.<\/span><span class=\"en\">I can't come.<\/span><\/li><li><span class=\"bad\">Do you can help?<\/span><span class=\"en\">Can you help?<\/span><\/li><li><span class=\"bad\">I will can come.<\/span><span class=\"en\">I will be able to come.<\/span><\/li><\/ul>",
"must": "<h4>must и have to<\/h4><div class=\"tw\"><table><tr><th>must<\/th><th>have to<\/th><\/tr><tr><td>говорящий сам так считает<\/td><td>требуют обстоятельства или правила<\/td><\/tr><tr><td><span class=\"en\">I must call my mother.<\/span><\/td><td><span class=\"en\">I have to work on Saturday.<\/span><\/td><\/tr><tr><td>письменные правила: <span class=\"en\">You must wear a helmet.<\/span><\/td><td>в речи встречается чаще<\/td><\/tr><\/table><\/div><p>В утверждениях разница небольшая, и <b>have to<\/b> подойдёт почти всегда.<\/p><h4>Отрицания значат разное<\/h4><div class=\"tw\"><table><tr><th>Форма<\/th><th>Смысл<\/th><th>Пример<\/th><\/tr><tr><td>mustn't<\/td><td>нельзя, запрещено<\/td><td><span class=\"en\">You mustn't smoke here.<\/span><\/td><\/tr><tr><td>don't have to<\/td><td>не обязательно, можно не делать<\/td><td><span class=\"en\">You don't have to come.<\/span><\/td><\/tr><tr><td>needn't<\/td><td>не нужно (то же, что don't have to)<\/td><td><span class=\"en\">You needn't wait.<\/span><\/td><\/tr><\/table><\/div><h4>Другие времена<\/h4><div class=\"tw\"><table><tr><th>Время<\/th><th>Форма<\/th><\/tr><tr><td>прошедшее<\/td><td><span class=\"en\">I had to wait.<\/span><\/td><\/tr><tr><td>будущее<\/td><td><span class=\"en\">I will have to go.<\/span><\/td><\/tr><tr><td>вопрос<\/td><td><span class=\"en\">Do I have to pay?<\/span><\/td><\/tr><\/table><\/div><p>У <b>must<\/b> прошедшей формы нет, всегда <b>had to<\/b>.<\/p><h4>Близкие выражения<\/h4><ul><li><b>have got to<\/b> — разговорный вариант have to: <span class=\"en\">I've got to go.<\/span><\/li><li><b>need to<\/b> — «нужно»: <span class=\"en\">I need to buy milk.<\/span><\/li><li><b>must<\/b> как догадка: <span class=\"en\">He must be tired.<\/span> — «Он, должно быть, устал».<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I must to go.<\/span><span class=\"en\">I must go.<\/span><\/li><li><span class=\"bad\">He musts work.<\/span><span class=\"en\">He must work.<\/span><\/li><li><span class=\"bad\">Yesterday I must work.<\/span><span class=\"en\">Yesterday I had to work.<\/span><\/li><li><span class=\"bad\">You don't must do it.<\/span><span class=\"en\">You don't have to do it.<\/span><small>или mustn't, если это запрет<\/small><\/li><li><span class=\"bad\">I haven't to go.<\/span><span class=\"en\">I don't have to go.<\/span><\/li><li><span class=\"bad\">You mustn't come if you are busy.<\/span><span class=\"en\">You don't have to come if you are busy.<\/span><small>«не обязательно», а не «запрещено»<\/small><\/li><\/ul>",
"should": "<h4>Сила совета по возрастанию<\/h4><div class=\"tw\"><table><tr><th>Форма<\/th><th>Смысл<\/th><th>Пример<\/th><\/tr><tr><td>could<\/td><td>можно бы<\/td><td><span class=\"en\">You could ask Tom.<\/span><\/td><\/tr><tr><td>should / ought to<\/td><td>стоит<\/td><td><span class=\"en\">You should see a doctor.<\/span><\/td><\/tr><tr><td>had better<\/td><td>лучше сделай, иначе будет плохо<\/td><td><span class=\"en\">You'd better hurry.<\/span><\/td><\/tr><tr><td>have to / must<\/td><td>обязан<\/td><td><span class=\"en\">You have to stop.<\/span><\/td><\/tr><\/table><\/div><p><b>ought to<\/b> значит то же, что should, но встречается реже. После <b>had better<\/b> глагол без to.<\/p><h4>Как советуют и спрашивают совета<\/h4><ul><li><span class=\"en\">What should I do?<\/span> <span class=\"en\">Should I call him?<\/span> <span class=\"en\">Do you think I should go?<\/span><\/li><li><span class=\"en\">I think you should rest.<\/span> <span class=\"en\">I don't think you should go.<\/span> — отрицание ставят в первую часть.<\/li><li><span class=\"en\">If I were you, I would wait.<\/span> — «На твоём месте я бы подождал».<\/li><li><span class=\"en\">Why don't you take a taxi?<\/span> — тот же совет, но мягче.<\/li><\/ul><h4>Другие значения<\/h4><ul><li>Ожидание: <span class=\"en\">She should be at home by now.<\/span> — «Она уже должна быть дома».<\/li><li>Упрёк о прошлом: <span class=\"en\">You should have called me.<\/span> — «Надо было позвонить». Форма: should have + третья форма.<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">You should to go.<\/span><span class=\"en\">You should go.<\/span><\/li><li><span class=\"bad\">He shoulds rest.<\/span><span class=\"en\">He should rest.<\/span><\/li><li><span class=\"bad\">You don't should eat it.<\/span><span class=\"en\">You shouldn't eat it.<\/span><\/li><li><span class=\"bad\">Do I should wait?<\/span><span class=\"en\">Should I wait?<\/span><\/li><li><span class=\"bad\">You should went there.<\/span><span class=\"en\">You should have gone there.<\/span><small>о прошлом<\/small><\/li><li><span class=\"bad\">You had better to go.<\/span><span class=\"en\">You had better go.<\/span><\/li><\/ul>",
"there": "<h4>there is и it is<\/h4><p><b>there is<\/b> впервые сообщает, что что-то существует или где-то находится. Дальше о том же предмете говорят <b>it<\/b>: <span class=\"en\">There is a book on the table. It is red.<\/span><\/p><h4>Русский порядок слов<\/h4><p>По-русски место стоит в начале: «На столе книга», «В городе два парка». По-английски начинаем с <b>there<\/b>, а место ставим в конец: <span class=\"en\">There is a book on the table.<\/span> <span class=\"en\">There are two parks in the city.<\/span><\/p><p>Если предмет уже известен, <b>there<\/b> не нужен: <span class=\"en\">The book is on the table.<\/span> — «Книга на столе».<\/p><h4>Согласование<\/h4><ul><li>Глагол смотрит на первое слово в списке: <span class=\"en\">There is a table and two chairs.<\/span> <span class=\"en\">There are two chairs and a table.<\/span><\/li><li>С неисчисляемыми — is: <span class=\"en\">There is some milk.<\/span> <span class=\"en\">There isn't any sugar.<\/span><\/li><li><b>no<\/b> вместо <b>not any<\/b>: <span class=\"en\">There is no time.<\/span> <span class=\"en\">There are no tickets.<\/span><\/li><\/ul><h4>Другие времена и модальные<\/h4><div class=\"tw\"><table><tr><th>Форма<\/th><th>Пример<\/th><\/tr><tr><td>прошедшее<\/td><td><span class=\"en\">There was a problem.<\/span> <span class=\"en\">There were many people.<\/span><\/td><\/tr><tr><td>будущее<\/td><td><span class=\"en\">There will be a meeting.<\/span><\/td><\/tr><tr><td>Present Perfect<\/td><td><span class=\"en\">There has been an accident.<\/span><\/td><\/tr><tr><td>going to<\/td><td><span class=\"en\">There is going to be a storm.<\/span><\/td><\/tr><tr><td>модальные<\/td><td><span class=\"en\">There must be a mistake.<\/span> <span class=\"en\">There might be a queue.<\/span><\/td><\/tr><\/table><\/div><h4>Вопросы<\/h4><p><span class=\"en\">Is there a bank near here?<\/span> — <span class=\"en\">Yes, there is.<\/span> / <span class=\"en\">No, there isn't.<\/span> <span class=\"en\">How many rooms are there?<\/span> <span class=\"en\">How much milk is there?<\/span> <span class=\"en\">Is there anything to eat?<\/span><\/p><h4>Не путай<\/h4><p><b>there<\/b> (там), <b>their<\/b> (их), <b>they're<\/b> (они есть) звучат одинаково, но пишутся по-разному.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">It is a book on the table.<\/span><span class=\"en\">There is a book on the table.<\/span><\/li><li><span class=\"bad\">In my city has a park.<\/span><span class=\"en\">There is a park in my city.<\/span><\/li><li><span class=\"bad\">There is two cats.<\/span><span class=\"en\">There are two cats.<\/span><\/li><li><span class=\"bad\">Is a bank near here?<\/span><span class=\"en\">Is there a bank near here?<\/span><\/li><li><span class=\"bad\">There is the book on the table.<\/span><span class=\"en\">The book is on the table.<\/span><small>предмет уже известен<\/small><\/li><\/ul>",
"art": "<h4>Главное правило<\/h4><p>Исчисляемое существительное в единственном числе не может стоять одно. Перед ним нужно что-то из набора: <b>a / an, the, my, this<\/b>. Нельзя сказать «I have car», можно <span class=\"en\">I have a car.<\/span><\/p><h4>a или an — по звуку, а не по букве<\/h4><p><span class=\"en\">an hour<\/span>, <span class=\"en\">an honest man<\/span> — h не читается. <span class=\"en\">a university<\/span>, <span class=\"en\">a European city<\/span> — первый звук согласный [j].<\/p><h4>Где нужен the<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Примеры<\/th><\/tr><tr><td>единственный в своём роде<\/td><td>the sun, the sky, the internet, the world<\/td><\/tr><tr><td>превосходная степень, порядковые<\/td><td>the best, the first, the last, the same<\/td><\/tr><tr><td>музыкальные инструменты<\/td><td>play the piano, play the guitar<\/td><\/tr><tr><td>части суток<\/td><td>in the morning, in the evening (но at night)<\/td><\/tr><tr><td>развлечения<\/td><td>go to the cinema, the theatre, listen to the radio<\/td><\/tr><tr><td>реки, моря, океаны, горные цепи<\/td><td>the Volga, the Black Sea, the Pacific, the Alps<\/td><\/tr><tr><td>страны со словом-типом или во мн. числе<\/td><td>the USA, the UK, the Netherlands<\/td><\/tr><\/table><\/div><h4>Где артикля нет<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Примеры<\/th><\/tr><tr><td>в общем смысле (мн. число, неисчисляемые)<\/td><td><span class=\"en\">Dogs are friendly.<\/span> <span class=\"en\">I like coffee.<\/span><\/td><\/tr><tr><td>еда по времени дня<\/td><td>have breakfast, have lunch, have dinner<\/td><\/tr><tr><td>спорт и игры<\/td><td>play football, play chess<\/td><\/tr><tr><td>языки и предметы<\/td><td>speak English, study maths<\/td><\/tr><tr><td>города, большинство стран, континенты<\/td><td>Moscow, Russia, Europe<\/td><\/tr><tr><td>улицы, озёра, отдельные горы<\/td><td>Tverskaya Street, Lake Baikal, Elbrus<\/td><\/tr><tr><td>устойчивые сочетания<\/td><td>go to bed, go to work, go home, at home, at work, by bus, on foot<\/td><\/tr><tr><td>дни, месяцы<\/td><td>on Monday, in May<\/td><\/tr><tr><td>телевидение<\/td><td>on TV, watch TV<\/td><\/tr><\/table><\/div><h4>a и one<\/h4><p><b>a<\/b> — «какой-то, любой». <b>one<\/b> — когда важно число: <span class=\"en\">I have one brother, not two.<\/span><\/p><h4>Два артикля сразу не бывает<\/h4><p>Артикль не ставят вместе с <b>my, this, some<\/b>: <span class=\"en\">She is my friend.<\/span> или <span class=\"en\">She is a friend of mine.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I am student.<\/span><span class=\"en\">I am a student.<\/span><\/li><li><span class=\"bad\">She is a my friend.<\/span><span class=\"en\">She is my friend.<\/span><\/li><li><span class=\"bad\">I like the music.<\/span><span class=\"en\">I like music.<\/span><small>музыка вообще<\/small><\/li><li><span class=\"bad\">The life is hard.<\/span><span class=\"en\">Life is hard.<\/span><\/li><li><span class=\"bad\">I play piano and the football.<\/span><span class=\"en\">I play the piano and football.<\/span><\/li><li><span class=\"bad\">I went to the home.<\/span><span class=\"en\">I went home.<\/span><\/li><li><span class=\"bad\">in the last year<\/span><span class=\"en\">last year<\/span><small>«в прошлом году»<\/small><\/li><\/ul>",
"some": "<h4>some и any шире, чем кажется<\/h4><ul><li>В предложении и просьбе — <b>some<\/b>, хотя это вопрос: <span class=\"en\">Would you like some tea?<\/span> <span class=\"en\">Can I have some water?<\/span><\/li><li><b>any<\/b> в утверждении значит «любой»: <span class=\"en\">You can come any day.<\/span> <span class=\"en\">Take any book.<\/span><\/li><li><b>no<\/b> = <b>not any<\/b>: <span class=\"en\">I have no money.<\/span> = <span class=\"en\">I don't have any money.<\/span> Двух отрицаний сразу не ставят.<\/li><\/ul><h4>Производные слова<\/h4><div class=\"tw\"><table><tr><th><\/th><th>some-<\/th><th>any-<\/th><th>no-<\/th><\/tr><tr><td>вещь<\/td><td>something<\/td><td>anything<\/td><td>nothing<\/td><\/tr><tr><td>человек<\/td><td>somebody / someone<\/td><td>anybody / anyone<\/td><td>nobody / no one<\/td><\/tr><tr><td>место<\/td><td>somewhere<\/td><td>anywhere<\/td><td>nowhere<\/td><\/tr><\/table><\/div><p>Правила те же, что у some и any. Глагол после них в единственном числе: <span class=\"en\">Nobody knows.<\/span> <span class=\"en\">Is anybody here?<\/span><\/p><h4>much, many, a lot of<\/h4><p><b>much<\/b> и <b>many<\/b> живут в вопросах и отрицаниях. В утверждении естественнее <b>a lot of<\/b>: <span class=\"en\">I have a lot of friends.<\/span> «I have much money» звучит неестественно. Исключения: <b>too much, so much, how much, very much, as much as<\/b>.<\/p><h4>Неисчисляемые, которые по-русски считаются<\/h4><div class=\"tw\"><table><tr><th>Английское<\/th><th>Как сказать «один»<\/th><th>Русская ловушка<\/th><\/tr><tr><td>money<\/td><td>some money<\/td><td>«деньги» во мн. числе, но <span class=\"en\">Money is important.<\/span><\/td><\/tr><tr><td>news<\/td><td>a piece of news<\/td><td>«новости», но <span class=\"en\">The news is good.<\/span><\/td><\/tr><tr><td>advice<\/td><td>a piece of advice<\/td><td>«советы», но advice без -s<\/td><\/tr><tr><td>information<\/td><td>some information<\/td><td>не «informations»<\/td><\/tr><tr><td>furniture, luggage<\/td><td>a piece of furniture<\/td><td>«мебель», «багаж»<\/td><\/tr><tr><td>hair<\/td><td>—<\/td><td>«волосы», но <span class=\"en\">Her hair is long.<\/span><\/td><\/tr><tr><td>homework, work<\/td><td>—<\/td><td>не «homeworks»<\/td><\/tr><tr><td>bread<\/td><td>a loaf, a slice of bread<\/td><td>не «a bread»<\/td><\/tr><\/table><\/div><h4>Порции и ёмкости<\/h4><p><span class=\"en\">a cup of tea<\/span>, <span class=\"en\">a glass of water<\/span>, <span class=\"en\">a bottle of milk<\/span>, <span class=\"en\">a piece of cake<\/span>, <span class=\"en\">a slice of bread<\/span>, <span class=\"en\">a kilo of apples<\/span>.<\/p><h4>Слова с двумя жизнями<\/h4><p><span class=\"en\">I like coffee.<\/span> (вещество) — <span class=\"en\">Two coffees, please.<\/span> (чашки). <span class=\"en\">I have no time.<\/span> (время) — <span class=\"en\">three times<\/span> (разы). <span class=\"en\">paper<\/span> (бумага) — <span class=\"en\">a paper<\/span> (газета).<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Can you give me an advice?<\/span><span class=\"en\">Can you give me some advice?<\/span><\/li><li><span class=\"bad\">I need more informations.<\/span><span class=\"en\">I need more information.<\/span><\/li><li><span class=\"bad\">The money are on the table.<\/span><span class=\"en\">The money is on the table.<\/span><\/li><li><span class=\"bad\">I have much friends.<\/span><span class=\"en\">I have a lot of friends.<\/span><\/li><li><span class=\"bad\">How many money do you have?<\/span><span class=\"en\">How much money do you have?<\/span><\/li><li><span class=\"bad\">I don't have no time.<\/span><span class=\"en\">I don't have any time.<\/span><\/li><\/ul>",
"pron": "<h4>Все формы в одной таблице<\/h4><div class=\"tw\"><table><tr><th>Кто<\/th><th>Кого, кому<\/th><th>Чей + сущ.<\/th><th>Чей (без сущ.)<\/th><th>Сам, себя<\/th><\/tr><tr><td>I<\/td><td>me<\/td><td>my<\/td><td>mine<\/td><td>myself<\/td><\/tr><tr><td>you<\/td><td>you<\/td><td>your<\/td><td>yours<\/td><td>yourself<\/td><\/tr><tr><td>he<\/td><td>him<\/td><td>his<\/td><td>his<\/td><td>himself<\/td><\/tr><tr><td>she<\/td><td>her<\/td><td>her<\/td><td>hers<\/td><td>herself<\/td><\/tr><tr><td>it<\/td><td>it<\/td><td>its<\/td><td>—<\/td><td>itself<\/td><\/tr><tr><td>we<\/td><td>us<\/td><td>our<\/td><td>ours<\/td><td>ourselves<\/td><\/tr><tr><td>they<\/td><td>them<\/td><td>their<\/td><td>theirs<\/td><td>themselves<\/td><\/tr><\/table><\/div><h4>Русское «свой»<\/h4><p>В английском слова «свой» нет. Выбираем по тому, кто действует: <span class=\"en\">I love my job.<\/span> <span class=\"en\">She loves her job.<\/span> <span class=\"en\">They sold their house.<\/span><\/p><h4>Части тела и одежда<\/h4><p>По-русски «Я помыл руки», по-английски обязательно чьи: <span class=\"en\">I washed my hands.<\/span> <span class=\"en\">He put on his coat.<\/span> <span class=\"en\">She broke her leg.<\/span><\/p><h4>Где объектная форма<\/h4><ul><li>После глагола и после любого предлога: <span class=\"en\">Call me.<\/span> <span class=\"en\">with him<\/span>, <span class=\"en\">for us<\/span>, <span class=\"en\">between you and me<\/span>.<\/li><li>В коротких репликах: <span class=\"en\">It's me.<\/span> <span class=\"en\">Me too.<\/span> <span class=\"en\">Who, me?<\/span><\/li><li>После <b>than<\/b> и <b>as<\/b> в разговорной речи: <span class=\"en\">He is older than me.<\/span><\/li><\/ul><h4>Возвратные местоимения<\/h4><ul><li>Действие направлено на себя: <span class=\"en\">I cut myself.<\/span> <span class=\"en\">She taught herself.<\/span><\/li><li><b>by myself<\/b> = один, без помощи: <span class=\"en\">I did it by myself.<\/span><\/li><li>После <b>feel, relax, concentrate, meet<\/b> возвратного местоимения нет: <span class=\"en\">I feel good.<\/span> <span class=\"en\">Let's meet at six.<\/span><\/li><\/ul><h4>Одинаково звучат, пишутся по-разному<\/h4><p><b>its<\/b> (его) и <b>it's<\/b> (it is); <b>your<\/b> и <b>you're<\/b>; <b>their<\/b>, <b>there<\/b> и <b>they're<\/b>; <b>whose<\/b> (чей) и <b>who's<\/b> (who is). В <b>yours, hers, ours, theirs<\/b> апострофа нет.<\/p><h4>Ещё<\/h4><ul><li><span class=\"en\">a friend of mine<\/span> — «один мой друг».<\/li><li><b>they<\/b> о человеке, пол которого неизвестен: <span class=\"en\">Someone left their bag.<\/span><\/li><li>В начале предложения вежливо ставить себя вторым: <span class=\"en\">My friend and I went…<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">This is mine book.<\/span><span class=\"en\">This is my book.<\/span><\/li><li><span class=\"bad\">The book is my.<\/span><span class=\"en\">The book is mine.<\/span><\/li><li><span class=\"bad\">I feel myself well.<\/span><span class=\"en\">I feel well.<\/span><\/li><li><span class=\"bad\">She washed the hair.<\/span><span class=\"en\">She washed her hair.<\/span><\/li><li><span class=\"bad\">He loves its job.<\/span><span class=\"en\">He loves his job.<\/span><\/li><li><span class=\"bad\">It's her's.<\/span><span class=\"en\">It's hers.<\/span><\/li><\/ul>",
"prep": "<h4>Время: at, on, in полностью<\/h4><div class=\"tw\"><table><tr><th>Предлог<\/th><th>Когда<\/th><th>Примеры<\/th><\/tr><tr><td>at<\/td><td>точное время, моменты<\/td><td>at five, at noon, at midnight, at night, at the weekend, at Christmas, at the moment<\/td><\/tr><tr><td>on<\/td><td>дни и даты<\/td><td>on Monday, on 5 May, on Monday morning, on my birthday, on New Year's Day<\/td><\/tr><tr><td>in<\/td><td>длинные отрезки<\/td><td>in May, in 2020, in summer, in the morning, in the evening, in the 20th century<\/td><\/tr><\/table><\/div><p><b>in<\/b> + срок = «через»: <span class=\"en\">I'll be back in five minutes.<\/span><\/p><p>Без предлога: <b>last, next, this, every, today, tomorrow, yesterday<\/b>: <span class=\"en\">See you next week.<\/span><\/p><p>В американском английском говорят <span class=\"en\">on the weekend<\/span>.<\/p><h4>Место: in, on, at полностью<\/h4><div class=\"tw\"><table><tr><th>Предлог<\/th><th>Идея<\/th><th>Примеры<\/th><\/tr><tr><td>in<\/td><td>внутри, в границах<\/td><td>in the room, in Moscow, in Russia, in bed, in hospital, in the sky, in a car, in the photo, in the middle<\/td><\/tr><tr><td>on<\/td><td>поверхность, линия<\/td><td>on the table, on the wall, on the second floor, on the left, on a bus, on a train, on page five, on TV, on the internet<\/td><\/tr><tr><td>at<\/td><td>точка, место как событие<\/td><td>at home, at work, at school, at the station, at the bus stop, at the door, at a party, at a concert, at the top, at the end<\/td><\/tr><\/table><\/div><p>Здание: <span class=\"en\">at the cinema<\/span> — пришёл на фильм; <span class=\"en\">in the cinema<\/span> — нахожусь внутри здания.<\/p><h4>Движение<\/h4><ul><li><b>to<\/b> — куда: <span class=\"en\">go to work<\/span>, <span class=\"en\">come to Moscow<\/span>. Но <span class=\"en\">go home<\/span> — без to.<\/li><li><b>arrive in<\/b> — город или страна, <b>arrive at<\/b> — здание или станция. «Arrive to» не бывает. С <b>get<\/b> — to: <span class=\"en\">get to the airport<\/span>.<\/li><\/ul><h4>Пары, которые путают<\/h4><div class=\"tw\"><table><tr><th>Выражение<\/th><th>Смысл<\/th><\/tr><tr><td>on time<\/td><td>вовремя, точно по расписанию<\/td><\/tr><tr><td>in time<\/td><td>успеть, не опоздать<\/td><\/tr><tr><td>at the end (of the film)<\/td><td>в конце чего-то<\/td><\/tr><tr><td>in the end<\/td><td>в итоге, наконец<\/td><\/tr><tr><td>by Friday<\/td><td>к пятнице, не позже<\/td><\/tr><tr><td>until Friday<\/td><td>до пятницы, всё это время<\/td><\/tr><\/table><\/div><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">in Monday<\/span><span class=\"en\">on Monday<\/span><\/li><li><span class=\"bad\">at 2020<\/span><span class=\"en\">in 2020<\/span><\/li><li><span class=\"bad\">on the morning<\/span><span class=\"en\">in the morning<\/span><\/li><li><span class=\"bad\">in home<\/span><span class=\"en\">at home<\/span><\/li><li><span class=\"bad\">I arrived to Moscow.<\/span><span class=\"en\">I arrived in Moscow.<\/span><\/li><li><span class=\"bad\">in next week<\/span><span class=\"en\">next week<\/span><\/li><li><span class=\"bad\">on the picture<\/span><span class=\"en\">in the picture<\/span><\/li><\/ul>",
"comp": "<h4>Как образовать: правила целиком<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Форма<\/th><th>Примеры<\/th><\/tr><tr><td>один слог<\/td><td>+ er<\/td><td>old → older, cheap → cheaper<\/td><\/tr><tr><td>один слог, гласная + согласная<\/td><td>удвоить + er<\/td><td>big → bigger, hot → hotter, thin → thinner<\/td><\/tr><tr><td>на -e<\/td><td>+ r<\/td><td>nice → nicer, large → larger<\/td><\/tr><tr><td>два слога на -y<\/td><td>-ier<\/td><td>happy → happier, easy → easier, busy → busier<\/td><\/tr><tr><td>остальные из двух и больше слогов<\/td><td>more + слово<\/td><td>more modern, more careful, more interesting<\/td><\/tr><tr><td>на -ed и -ing<\/td><td>more + слово<\/td><td>more tired, more boring<\/td><\/tr><\/table><\/div><p>Некоторые двусложные допускают оба способа: quiet, simple, clever (<span class=\"en\">quieter<\/span> или <span class=\"en\">more quiet<\/span>).<\/p><h4>Исключения<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Сравнительная<\/th><\/tr><tr><td>good, well<\/td><td>better<\/td><\/tr><tr><td>bad<\/td><td>worse<\/td><\/tr><tr><td>far<\/td><td>further / farther<\/td><\/tr><tr><td>much, many<\/td><td>more<\/td><\/tr><tr><td>little<\/td><td>less<\/td><\/tr><\/table><\/div><p>О старшинстве в семье говорят <b>elder<\/b>: <span class=\"en\">my elder brother<\/span>.<\/p><h4>Усилить или смягчить<\/h4><div class=\"tw\"><table><tr><th>Намного<\/th><th>Немного<\/th><\/tr><tr><td>much better, a lot cheaper, far more expensive<\/td><td>a bit colder, a little older, slightly bigger<\/td><\/tr><\/table><\/div><p>С <b>very<\/b> сравнительную степень не ставят.<\/p><h4>Другие способы сравнить<\/h4><ul><li>Одинаково: <span class=\"en\">as tall as<\/span>. Неодинаково: <span class=\"en\">not as tall as<\/span> — «не такой высокий, как».<\/li><li>Меньше: <span class=\"en\">less expensive than<\/span>.<\/li><li>Кратность: <span class=\"en\">twice as big as<\/span>, <span class=\"en\">three times as fast as<\/span>.<\/li><li>«Всё лучше и лучше»: <span class=\"en\">It is getting better and better.<\/span><\/li><li>«Чем…, тем…»: <span class=\"en\">The sooner, the better.<\/span><\/li><li>После <b>than<\/b>: <span class=\"en\">older than me<\/span> (разговорно) или <span class=\"en\">older than I am<\/span>.<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">more better<\/span><span class=\"en\">better<\/span><\/li><li><span class=\"bad\">more cheap<\/span><span class=\"en\">cheaper<\/span><\/li><li><span class=\"bad\">expensiver<\/span><span class=\"en\">more expensive<\/span><\/li><li><span class=\"bad\">She is older that me.<\/span><span class=\"en\">She is older than me.<\/span><\/li><li><span class=\"bad\">very bigger<\/span><span class=\"en\">much bigger<\/span><\/li><li><span class=\"bad\">He is more old than me.<\/span><span class=\"en\">He is older than me.<\/span><\/li><li><span class=\"bad\">not so tall than<\/span><span class=\"en\">not as tall as<\/span><\/li><\/ul>",
"sup": "<h4>Как образовать<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Форма<\/th><th>Примеры<\/th><\/tr><tr><td>короткие<\/td><td>the + est<\/td><td>the oldest, the biggest, the nicest, the happiest<\/td><\/tr><tr><td>длинные<\/td><td>the most + слово<\/td><td>the most expensive, the most interesting<\/td><\/tr><tr><td>наименьшая степень<\/td><td>the least + слово<\/td><td>the least expensive<\/td><\/tr><\/table><\/div><p>Написание меняется так же, как в сравнительной степени.<\/p><h4>Исключения<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Превосходная<\/th><\/tr><tr><td>good<\/td><td>the best<\/td><\/tr><tr><td>bad<\/td><td>the worst<\/td><\/tr><tr><td>far<\/td><td>the furthest / the farthest<\/td><\/tr><tr><td>much, many<\/td><td>the most<\/td><\/tr><tr><td>little<\/td><td>the least<\/td><\/tr><\/table><\/div><h4>in или of<\/h4><ul><li><b>in<\/b> — место или группа как целое: <span class=\"en\">the tallest in the class<\/span>, <span class=\"en\">the best in the world<\/span>, <span class=\"en\">the oldest in my family<\/span>.<\/li><li><b>of<\/b> — период или несколько предметов: <span class=\"en\">the best day of my life<\/span>, <span class=\"en\">the hottest month of the year<\/span>, <span class=\"en\">the cheapest of the three<\/span>.<\/li><\/ul><h4>Частые конструкции<\/h4><ul><li>С Present Perfect: <span class=\"en\">It is the best film I have ever seen.<\/span><\/li><li>«Один из самых…» + множественное число: <span class=\"en\">one of the biggest cities in Russia<\/span>.<\/li><li>С порядковым: <span class=\"en\">the second largest city<\/span>.<\/li><li>Вместо <b>the<\/b> может стоять притяжательное слово: <span class=\"en\">my best friend<\/span>, <span class=\"en\">her youngest son<\/span>.<\/li><\/ul><h4>most без the<\/h4><p><span class=\"en\">Most people like music.<\/span> — «Большинство людей». Здесь <b>most<\/b> не превосходная степень, и артикль не нужен.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">the most big<\/span><span class=\"en\">the biggest<\/span><\/li><li><span class=\"bad\">She is most beautiful girl.<\/span><span class=\"en\">She is the most beautiful girl.<\/span><\/li><li><span class=\"bad\">the most tallest<\/span><span class=\"en\">the tallest<\/span><\/li><li><span class=\"bad\">the best day in my life<\/span><span class=\"en\">the best day of my life<\/span><\/li><li><span class=\"bad\">one of the best film<\/span><span class=\"en\">one of the best films<\/span><\/li><li><span class=\"bad\">the most people think<\/span><span class=\"en\">most people think<\/span><\/li><li><span class=\"bad\">the baddest<\/span><span class=\"en\">the worst<\/span><\/li><\/ul>",
"adv": "<h4>Как образовать наречие<\/h4><div class=\"tw\"><table><tr><th>Прилагательное<\/th><th>Наречие<\/th><\/tr><tr><td>обычно + ly<\/td><td>slow → slowly, quick → quickly<\/td><\/tr><tr><td>-y → -ily<\/td><td>easy → easily, happy → happily<\/td><\/tr><tr><td>-le → -ly<\/td><td>simple → simply, terrible → terribly<\/td><\/tr><tr><td>-l → -lly<\/td><td>careful → carefully, real → really<\/td><\/tr><tr><td>-ic → -ically<\/td><td>basic → basically, automatic → automatically<\/td><\/tr><tr><td>особые<\/td><td>good → well, true → truly<\/td><\/tr><\/table><\/div><h4>Форма не меняется<\/h4><p><b>fast, hard, late, early, high, long, straight, daily<\/b>: <span class=\"en\">a fast car<\/span> — <span class=\"en\">He drives fast.<\/span><\/p><h4>Ложные друзья<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Значение<\/th><th>Пример<\/th><\/tr><tr><td>hard<\/td><td>усердно, сильно<\/td><td><span class=\"en\">He works hard.<\/span><\/td><\/tr><tr><td>hardly<\/td><td>едва, почти не<\/td><td><span class=\"en\">He hardly works.<\/span> — почти не работает<\/td><\/tr><tr><td>late<\/td><td>поздно<\/td><td><span class=\"en\">I came late.<\/span><\/td><\/tr><tr><td>lately<\/td><td>в последнее время<\/td><td><span class=\"en\">I haven't seen him lately.<\/span><\/td><\/tr><tr><td>near<\/td><td>близко<\/td><td><span class=\"en\">He lives near.<\/span><\/td><\/tr><tr><td>nearly<\/td><td>почти<\/td><td><span class=\"en\">I nearly fell.<\/span><\/td><\/tr><\/table><\/div><h4>Прилагательные на -ly<\/h4><p><b>friendly, lovely, lonely, silly, lively<\/b> — это прилагательные, наречий от них нет. Говорят <span class=\"en\">in a friendly way<\/span>.<\/p><h4>После каких глаголов прилагательное<\/h4><p><b>be, look, feel, sound, smell, taste, seem, get, become<\/b>: <span class=\"en\">It smells good.<\/span> <span class=\"en\">You look tired.<\/span> <span class=\"en\">I feel bad.<\/span> Но если <b>look<\/b> значит «смотреть», нужно наречие: <span class=\"en\">She looked at me angrily.<\/span><\/p><h4>Порядок слов<\/h4><p>Наречие не ставят между глаголом и дополнением: <span class=\"en\">She speaks English well.<\/span> В конце предложения порядок такой: как → где → когда: <span class=\"en\">He worked hard at school yesterday.<\/span><\/p><h4>Наречие перед прилагательным<\/h4><p><span class=\"en\">really good<\/span>, <span class=\"en\">very cold<\/span>, <span class=\"en\">quite easy<\/span>, <span class=\"en\">extremely tired<\/span>, <span class=\"en\">too hot<\/span>.<\/p><h4>Сравнение наречий<\/h4><p><span class=\"en\">more slowly<\/span>, <span class=\"en\">more carefully<\/span>. Короткие — как прилагательные: <span class=\"en\">faster<\/span>, <span class=\"en\">harder<\/span>, <span class=\"en\">earlier<\/span>, <span class=\"en\">better<\/span>, <span class=\"en\">worse<\/span>.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">He drives careful.<\/span><span class=\"en\">He drives carefully.<\/span><\/li><li><span class=\"bad\">She speaks English very good.<\/span><span class=\"en\">She speaks English very well.<\/span><\/li><li><span class=\"bad\">She speaks well English.<\/span><span class=\"en\">She speaks English well.<\/span><\/li><li><span class=\"bad\">He works hardly.<\/span><span class=\"en\">He works hard.<\/span><\/li><li><span class=\"bad\">She sings beautiful.<\/span><span class=\"en\">She sings beautifully.<\/span><\/li><li><span class=\"bad\">He spoke friendly.<\/span><span class=\"en\">He spoke in a friendly way.<\/span><\/li><\/ul><p>А вот <span class=\"en\">She speaks very good English.<\/span> — верно: здесь <b>good<\/b> описывает существительное English.<\/p>",
"wh": "<h4>Вопросительные слова целиком<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>О чём<\/th><th>Пример<\/th><\/tr><tr><td>who<\/td><td>кто, кого<\/td><td><span class=\"en\">Who is that?<\/span><\/td><\/tr><tr><td>what<\/td><td>что, какой<\/td><td><span class=\"en\">What is this?<\/span> <span class=\"en\">What colour is it?<\/span><\/td><\/tr><tr><td>which<\/td><td>который из известных<\/td><td><span class=\"en\">Which bag is yours?<\/span><\/td><\/tr><tr><td>whose<\/td><td>чей<\/td><td><span class=\"en\">Whose phone is this?<\/span><\/td><\/tr><tr><td>where<\/td><td>где, куда<\/td><td><span class=\"en\">Where do you live?<\/span><\/td><\/tr><tr><td>when, what time<\/td><td>когда, во сколько<\/td><td><span class=\"en\">What time does it start?<\/span><\/td><\/tr><tr><td>why<\/td><td>почему<\/td><td><span class=\"en\">Why are you late?<\/span><\/td><\/tr><tr><td>how<\/td><td>как<\/td><td><span class=\"en\">How do you know?<\/span><\/td><\/tr><tr><td>how often<\/td><td>как часто<\/td><td><span class=\"en\">How often do you train?<\/span><\/td><\/tr><tr><td>how long<\/td><td>как долго<\/td><td><span class=\"en\">How long does it take?<\/span><\/td><\/tr><tr><td>how far<\/td><td>как далеко<\/td><td><span class=\"en\">How far is it?<\/span><\/td><\/tr><tr><td>how old, how tall<\/td><td>возраст, рост<\/td><td><span class=\"en\">How tall are you?<\/span><\/td><\/tr><tr><td>what kind of<\/td><td>какого рода<\/td><td><span class=\"en\">What kind of music do you like?<\/span><\/td><\/tr><\/table><\/div><p><b>what<\/b> — выбор не ограничен, <b>which<\/b> — выбираем из нескольких известных: <span class=\"en\">Which do you want, tea or coffee?<\/span><\/p><h4>Вопрос к подлежащему и к дополнению<\/h4><div class=\"tw\"><table><tr><th>К подлежащему (без do / did)<\/th><th>К дополнению<\/th><\/tr><tr><td><span class=\"en\">Who loves Anna?<\/span> — Кто любит Анну?<\/td><td><span class=\"en\">Who does Anna love?<\/span> — Кого любит Анна?<\/td><\/tr><tr><td><span class=\"en\">Who saw you?<\/span> — Кто тебя видел?<\/td><td><span class=\"en\">Who did you see?<\/span> — Кого ты видел?<\/td><\/tr><tr><td><span class=\"en\">What makes you happy?<\/span><\/td><td><span class=\"en\">What do you want?<\/span><\/td><\/tr><\/table><\/div><h4>Четыре похожих вопроса<\/h4><div class=\"tw\"><table><tr><th>Вопрос<\/th><th>О чём<\/th><\/tr><tr><td><span class=\"en\">What is he like?<\/span><\/td><td>характер: какой он человек<\/td><\/tr><tr><td><span class=\"en\">What does he look like?<\/span><\/td><td>внешность<\/td><\/tr><tr><td><span class=\"en\">How is he?<\/span><\/td><td>здоровье, дела<\/td><\/tr><tr><td><span class=\"en\">What does he like?<\/span><\/td><td>что он любит<\/td><\/tr><\/table><\/div><h4>Предлог в конце<\/h4><p><span class=\"en\">Who are you talking to?<\/span> <span class=\"en\">What is the film about?<\/span> <span class=\"en\">Where is she from?<\/span> <span class=\"en\">What is it for?<\/span> — «Для чего это?»<\/p><h4>Вежливый вопрос внутри фразы<\/h4><p>После <span class=\"en\">Can you tell me…<\/span> и <span class=\"en\">Do you know…<\/span> порядок слов прямой и do не нужен: <span class=\"en\">Can you tell me where the station is?<\/span> <span class=\"en\">Do you know what time it starts?<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">Where you live?<\/span><span class=\"en\">Where do you live?<\/span><\/li><li><span class=\"bad\">Who did call you?<\/span><span class=\"en\">Who called you?<\/span><small>вопрос к подлежащему<\/small><\/li><li><span class=\"bad\">How many years are you?<\/span><span class=\"en\">How old are you?<\/span><\/li><li><span class=\"bad\">How do you call it?<\/span><span class=\"en\">What do you call it?<\/span><\/li><li><span class=\"bad\">How does he look like?<\/span><span class=\"en\">What does he look like?<\/span><\/li><li><span class=\"bad\">From where are you?<\/span><span class=\"en\">Where are you from?<\/span><\/li><li><span class=\"bad\">Can you tell me where is the station?<\/span><span class=\"en\">Can you tell me where the station is?<\/span><\/li><\/ul>",
"poss": "<h4>Апостроф: все случаи<\/h4><div class=\"tw\"><table><tr><th>Случай<\/th><th>Форма<\/th><th>Примеры<\/th><\/tr><tr><td>один владелец<\/td><td>+ 's<\/td><td>Tom's car, my sister's room<\/td><\/tr><tr><td>множественное на -s<\/td><td>только апостроф<\/td><td>my parents' house, the students' books<\/td><\/tr><tr><td>множественное без -s<\/td><td>+ 's<\/td><td>children's toys, men's shoes, people's lives<\/td><\/tr><tr><td>имя на -s<\/td><td>оба варианта<\/td><td>James's car / James' car<\/td><\/tr><tr><td>два владельца одной вещи<\/td><td>'s у последнего<\/td><td>Tom and Anna's flat<\/td><\/tr><\/table><\/div><h4>Без существительного после<\/h4><ul><li>Чьё это: <span class=\"en\">It is Tom's.<\/span> <span class=\"en\">Whose is this? — It's my brother's.<\/span><\/li><li>Чей-то дом или кабинет: <span class=\"en\">at the doctor's<\/span>, <span class=\"en\">at my friend's<\/span> — «у друга дома».<\/li><\/ul><h4>Не только у людей<\/h4><ul><li>Животные: <span class=\"en\">the dog's name<\/span>.<\/li><li>Время: <span class=\"en\">today's news<\/span>, <span class=\"en\">yesterday's meeting<\/span>, <span class=\"en\">a week's holiday<\/span>.<\/li><li>Страны и организации: <span class=\"en\">Russia's history<\/span>, <span class=\"en\">the company's plans<\/span>.<\/li><\/ul><h4>У предметов<\/h4><ul><li>С <b>of<\/b>: <span class=\"en\">the end of the film<\/span>, <span class=\"en\">the roof of the house<\/span>.<\/li><li>Часто просто два существительных подряд: <span class=\"en\">the car door<\/span>, <span class=\"en\">the kitchen table<\/span>, <span class=\"en\">a bus stop<\/span>.<\/li><\/ul><h4>Три значения 's<\/h4><p><span class=\"en\">Tom's car<\/span> — принадлежность. <span class=\"en\">Tom's here.<\/span> — is. <span class=\"en\">Tom's got a car.<\/span> — has.<\/p><h4>this, that, these, those: ещё употребления<\/h4><ul><li>По телефону: <span class=\"en\">Hello, this is Anna.<\/span> <span class=\"en\">Who is that?<\/span><\/li><li><b>that<\/b> о только что сказанном: <span class=\"en\">That's right.<\/span> <span class=\"en\">That's a good idea.<\/span><\/li><li>О времени: <span class=\"en\">this morning<\/span>, <span class=\"en\">these days<\/span> — «в наши дни», <span class=\"en\">in those days<\/span> — «в те времена».<\/li><li>Чтобы не повторять существительное: <span class=\"en\">this one<\/span>, <span class=\"en\">that one<\/span>, <span class=\"en\">the red ones<\/span>.<\/li><li>Произношение: <b>this<\/b> с кратким [i] и [s], <b>these<\/b> с долгим [i:] и [z].<\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">the car of my brother<\/span><span class=\"en\">my brother's car<\/span><\/li><li><span class=\"bad\">my parent's house<\/span><span class=\"en\">my parents' house<\/span><small>родителей двое<\/small><\/li><li><span class=\"bad\">this books<\/span><span class=\"en\">these books<\/span><\/li><li><span class=\"bad\">These is my friends.<\/span><span class=\"en\">These are my friends.<\/span><\/li><li><span class=\"bad\">the childrens' room<\/span><span class=\"en\">the children's room<\/span><\/li><li><span class=\"bad\">The dog lost it's ball.<\/span><span class=\"en\">The dog lost its ball.<\/span><\/li><\/ul>",
"inf": "<h4>Глагол + to<\/h4><p><b>want, need, decide, hope, plan, promise, agree, refuse, learn, try, forget, offer, manage, expect, seem, afford, would like, would love<\/b>: <span class=\"en\">I decided to stay.<\/span> <span class=\"en\">She promised to call.<\/span> <span class=\"en\">I can't afford to buy it.<\/span><\/p><h4>Глагол + -ing<\/h4><p><b>enjoy, finish, mind, avoid, keep, suggest, practise, give up, miss, imagine, can't stand, feel like, spend time<\/b>: <span class=\"en\">I enjoy reading.<\/span> <span class=\"en\">He gave up smoking.<\/span> <span class=\"en\">Keep going.<\/span> <span class=\"en\">I don't feel like cooking.<\/span><\/p><h4>Оба варианта, смысл тот же<\/h4><p><b>like, love, hate, prefer, start, begin, continue<\/b>: <span class=\"en\">It started raining.<\/span> = <span class=\"en\">It started to rain.<\/span> Но после <b>would like<\/b> — только to.<\/p><h4>Оба варианта, смысл разный<\/h4><div class=\"tw\"><table><tr><th>С to<\/th><th>С -ing<\/th><\/tr><tr><td><span class=\"en\">I stopped to smoke.<\/span> — остановился, чтобы покурить<\/td><td><span class=\"en\">I stopped smoking.<\/span> — бросил курить<\/td><\/tr><tr><td><span class=\"en\">Remember to lock the door.<\/span> — не забудь запереть<\/td><td><span class=\"en\">I remember locking the door.<\/span> — помню, что запер<\/td><\/tr><tr><td><span class=\"en\">I tried to open it.<\/span> — пытался<\/td><td><span class=\"en\">Try restarting it.<\/span> — попробуй, вдруг поможет<\/td><\/tr><tr><td><span class=\"en\">I forgot to call.<\/span> — забыл позвонить<\/td><td><span class=\"en\">I'll never forget meeting her.<\/span> — не забуду, как встретил<\/td><\/tr><\/table><\/div><h4>После предлога всегда -ing<\/h4><p><span class=\"en\">good at cooking<\/span>, <span class=\"en\">interested in learning<\/span>, <span class=\"en\">thank you for coming<\/span>, <span class=\"en\">before leaving<\/span>, <span class=\"en\">without saying a word<\/span>. В <span class=\"en\">I look forward to seeing you<\/span> <b>to<\/b> — предлог, поэтому тоже -ing.<\/p><h4>to для цели<\/h4><p>«Чтобы» — просто <b>to<\/b>: <span class=\"en\">I went to the shop to buy bread.<\/span> Не «for buy» и не «for to buy».<\/p><h4>Глагол + человек + to<\/h4><p><span class=\"en\">I want you to come.<\/span> — «Я хочу, чтобы ты пришёл». Так же: <span class=\"en\">She asked me to wait.<\/span> <span class=\"en\">He told us to sit down.<\/span> Оборот с <b>that<\/b> после want не используют.<\/p><h4>Без to<\/h4><ul><li>После модальных: <span class=\"en\">I can swim.<\/span><\/li><li>После <b>make<\/b> и <b>let<\/b>: <span class=\"en\">Let me go.<\/span> <span class=\"en\">She made me wait.<\/span><\/li><li><b>help<\/b> — можно и так, и так: <span class=\"en\">Help me (to) carry it.<\/span><\/li><\/ul><h4>Ещё -ing<\/h4><ul><li>Подлежащее: <span class=\"en\">Swimming is good for you.<\/span><\/li><li><b>go<\/b> + занятие: <span class=\"en\">go shopping<\/span>, <span class=\"en\">go swimming<\/span>, <span class=\"en\">go skiing<\/span>.<\/li><li>После прилагательного — to: <span class=\"en\">It is easy to learn.<\/span> <span class=\"en\">Nice to meet you.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I want that you come.<\/span><span class=\"en\">I want you to come.<\/span><\/li><li><span class=\"bad\">I enjoy to read.<\/span><span class=\"en\">I enjoy reading.<\/span><\/li><li><span class=\"bad\">I want go home.<\/span><span class=\"en\">I want to go home.<\/span><\/li><li><span class=\"bad\">I went there for buy milk.<\/span><span class=\"en\">I went there to buy milk.<\/span><\/li><li><span class=\"bad\">I am good in cook.<\/span><span class=\"en\">I am good at cooking.<\/span><\/li><li><span class=\"bad\">I look forward to see you.<\/span><span class=\"en\">I look forward to seeing you.<\/span><\/li><li><span class=\"bad\">She made me to wait.<\/span><span class=\"en\">She made me wait.<\/span><\/li><\/ul>",
"pass": "<h4>Пассив во всех основных временах<\/h4><div class=\"tw\"><table><tr><th>Время<\/th><th>Форма<\/th><th>Пример<\/th><\/tr><tr><td>Present Simple<\/td><td>am / is / are + 3-я форма<\/td><td><span class=\"en\">Cars are made here.<\/span><\/td><\/tr><tr><td>Past Simple<\/td><td>was / were + 3-я форма<\/td><td><span class=\"en\">The house was built in 1990.<\/span><\/td><\/tr><tr><td>Present Continuous<\/td><td>is being + 3-я форма<\/td><td><span class=\"en\">The road is being repaired.<\/span><\/td><\/tr><tr><td>Present Perfect<\/td><td>has been + 3-я форма<\/td><td><span class=\"en\">The letter has been sent.<\/span><\/td><\/tr><tr><td>Future<\/td><td>will be + 3-я форма<\/td><td><span class=\"en\">You will be told.<\/span><\/td><\/tr><tr><td>модальные<\/td><td>can / must be + 3-я форма<\/td><td><span class=\"en\">It can be done.<\/span><\/td><\/tr><\/table><\/div><p>Меняется только be, третья форма остаётся той же.<\/p><h4>Как это звучит по-русски<\/h4><div class=\"tw\"><table><tr><th>Русский<\/th><th>Английский<\/th><\/tr><tr><td>Здесь говорят по-английски.<\/td><td><span class=\"en\">English is spoken here.<\/span><\/td><\/tr><tr><td>Мне сказали.<\/td><td><span class=\"en\">I was told.<\/span><\/td><\/tr><tr><td>Его пригласили.<\/td><td><span class=\"en\">He was invited.<\/span><\/td><\/tr><tr><td>Дом строится.<\/td><td><span class=\"en\">The house is being built.<\/span><\/td><\/tr><tr><td>Мне дали книгу.<\/td><td><span class=\"en\">I was given a book.<\/span><\/td><\/tr><\/table><\/div><p>Русские фразы без подлежащего («сказали», «построили») почти всегда переводятся пассивом.<\/p><h4>by и with<\/h4><ul><li><b>by<\/b> — кто сделал: <span class=\"en\">It was written by Tolstoy.<\/span><\/li><li><b>with<\/b> — чем: <span class=\"en\">It was cut with a knife.<\/span><\/li><li>Если неважно или неизвестно, кто сделал, by не добавляют.<\/li><\/ul><h4>Вопросы<\/h4><p><span class=\"en\">Where was it made?<\/span> <span class=\"en\">When was it built?<\/span> <span class=\"en\">Is it made in China?<\/span> <span class=\"en\">Who was it written by?<\/span><\/p><h4>Что в пассив не ставится<\/h4><p>Глаголы без дополнения: <b>happen, arrive, go, come, die, exist<\/b>. Говорят <span class=\"en\">It happened yesterday.<\/span><\/p><h4>Разговорный пассив с get<\/h4><p><span class=\"en\">He got hurt.<\/span> <span class=\"en\">The window got broken.<\/span> <span class=\"en\">They got married.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">The house built in 1990.<\/span><span class=\"en\">The house was built in 1990.<\/span><small>без be это актив<\/small><\/li><li><span class=\"bad\">The letter was wrote yesterday.<\/span><span class=\"en\">The letter was written yesterday.<\/span><\/li><li><span class=\"bad\">It was happened yesterday.<\/span><span class=\"en\">It happened yesterday.<\/span><\/li><li><span class=\"bad\">English speaks here.<\/span><span class=\"en\">English is spoken here.<\/span><\/li><li><span class=\"bad\">I am interesting in music.<\/span><span class=\"en\">I am interested in music.<\/span><small>-ed — что чувствую я, -ing — какой предмет<\/small><\/li><li><span class=\"bad\">The book was written from Tolstoy.<\/span><span class=\"en\">The book was written by Tolstoy.<\/span><\/li><\/ul>",
"if1": "<h4>Два типа реальных условий<\/h4><div class=\"tw\"><table><tr><th>Тип<\/th><th>Форма<\/th><th>Пример<\/th><\/tr><tr><td>всегда так (нулевой)<\/td><td>if + настоящее, настоящее<\/td><td><span class=\"en\">If you heat ice, it melts.<\/span><\/td><\/tr><tr><td>возможное будущее (первый)<\/td><td>if + настоящее, will<\/td><td><span class=\"en\">If it rains, we will stay at home.<\/span><\/td><\/tr><\/table><\/div><h4>В главной части не только will<\/h4><p><span class=\"en\">If you see him, tell him.<\/span> — повелительное. <span class=\"en\">If it rains, we can stay at home.<\/span> — модальный. <span class=\"en\">If you are tired, you should rest.<\/span><\/p><h4>То же правило для других союзов<\/h4><p>После <b>when, as soon as, before, after, until, unless<\/b> будущее тоже выражают настоящим временем:<\/p><ul><li><span class=\"en\">I'll call you as soon as I arrive.<\/span><\/li><li><span class=\"en\">Wait here until I come back.<\/span><\/li><li><span class=\"en\">Before you go, close the window.<\/span><\/li><\/ul><h4>Порядок частей<\/h4><p>Можно начать с любой. Если <b>if<\/b> в начале — нужна запятая, если в середине — запятой нет: <span class=\"en\">If I have time, I'll help.<\/span> = <span class=\"en\">I'll help if I have time.<\/span><\/p><h4>if в значении «ли»<\/h4><p>Когда <b>if<\/b> значит «ли», это не условие, и will после него ставят: <span class=\"en\">I don't know if he will come.<\/span> — «Я не знаю, придёт ли он». Сравни: <span class=\"en\">I'll be happy if he comes.<\/span> — «…если он придёт».<\/p><h4>if и when<\/h4><p><b>if<\/b> — может случиться, а может и нет. <b>when<\/b> — случится точно: <span class=\"en\">If I see Tom, I'll tell him.<\/span> <span class=\"en\">When I see Tom, I'll tell him.<\/span><\/p><h4>После if возможны и другие настоящие времена<\/h4><p><span class=\"en\">If you are waiting for Anna, she will be late.<\/span> <span class=\"en\">When I have finished, I'll call you.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">If it will rain, I will stay at home.<\/span><span class=\"en\">If it rains, I will stay at home.<\/span><\/li><li><span class=\"bad\">When I will come home, I will call you.<\/span><span class=\"en\">When I come home, I will call you.<\/span><\/li><li><span class=\"bad\">If I will have time, I help you.<\/span><span class=\"en\">If I have time, I will help you.<\/span><\/li><li><span class=\"bad\">I will wait until you will come.<\/span><span class=\"en\">I will wait until you come.<\/span><\/li><li><span class=\"bad\">If I see him I tell him.<\/span><span class=\"en\">If I see him, I will tell him.<\/span><\/li><\/ul>",
"ppc": "<h4>Формы<\/h4><div class=\"tw\"><table><tr><th>Утверждение<\/th><th>Отрицание<\/th><th>Вопрос<\/th><\/tr><tr><td><span class=\"en\">I have been working.<\/span><\/td><td><span class=\"en\">I haven't been working.<\/span><\/td><td><span class=\"en\">Have you been working?<\/span><\/td><\/tr><tr><td><span class=\"en\">She has been working.<\/span><\/td><td><span class=\"en\">She hasn't been working.<\/span><\/td><td><span class=\"en\">Has she been working?<\/span><\/td><\/tr><\/table><\/div><p>Сокращения: <span class=\"en\">I've been<\/span>, <span class=\"en\">he's been<\/span>.<\/p><h4>Simple или Continuous<\/h4><div class=\"tw\"><table><tr><th>Present Perfect Continuous<\/th><th>Present Perfect Simple<\/th><\/tr><tr><td>важен процесс и его длительность<\/td><td>важен результат или количество<\/td><\/tr><tr><td><span class=\"en\">I have been reading this book.<\/span> — читаю, может, ещё не дочитал<\/td><td><span class=\"en\">I have read this book.<\/span> — прочитал<\/td><\/tr><tr><td><span class=\"en\">She has been writing emails all morning.<\/span><\/td><td><span class=\"en\">She has written ten emails.<\/span><\/td><\/tr><tr><td>How long…?<\/td><td>How many…? How much…? How many times…?<\/td><\/tr><\/table><\/div><p>С <b>live<\/b> и <b>work<\/b> разница почти не чувствуется: <span class=\"en\">I have lived here for years.<\/span> = <span class=\"en\">I have been living here for years.<\/span><\/p><h4>Виден результат недавнего действия<\/h4><p><span class=\"en\">You are out of breath. Have you been running?<\/span> <span class=\"en\">The ground is wet. It has been raining.<\/span> Действие могло уже закончиться, но следы остались.<\/p><h4>Как это по-русски<\/h4><p>Обычно настоящее время со словом «уже»: «Я жду уже час» → <span class=\"en\">I have been waiting for an hour.<\/span> Ни Present Simple, ни Present Continuous здесь не подходят.<\/p><h4>Глаголы состояния<\/h4><p><b>know, like, love, want, need, be, have<\/b> (иметь), <b>believe, understand<\/b> — только Simple: <span class=\"en\">I have known him for years.<\/span> <span class=\"en\">We have had this car since 2020.<\/span><\/p><h4>Слова-спутники<\/h4><p><b>for, since, how long, all day, all morning, lately, recently<\/b>.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I am learning English for two years.<\/span><span class=\"en\">I have been learning English for two years.<\/span><\/li><li><span class=\"bad\">I learn English since 2020.<\/span><span class=\"en\">I have been learning English since 2020.<\/span><\/li><li><span class=\"bad\">I have been knowing him for years.<\/span><span class=\"en\">I have known him for years.<\/span><\/li><li><span class=\"bad\">I have been reading three books this month.<\/span><span class=\"en\">I have read three books this month.<\/span><small>количество<\/small><\/li><li><span class=\"bad\">I have been work all day.<\/span><span class=\"en\">I have been working all day.<\/span><\/li><\/ul>",
"forsince": "<h4>for и since<\/h4><div class=\"tw\"><table><tr><th>for + отрезок<\/th><th>since + точка начала<\/th><\/tr><tr><td>for two hours, for a week, for five years<\/td><td>since nine o'clock, since Monday, since 2020<\/td><\/tr><tr><td>for a long time, for ages<\/td><td>since Christmas, since last year<\/td><\/tr><tr><td>for a while<\/td><td>since I was a child, since we met<\/td><\/tr><\/table><\/div><p>После <b>since<\/b> может идти целое предложение в Past Simple: <span class=\"en\">I have known her since we were at school.<\/span><\/p><h4>Тонкости for<\/h4><ul><li>В разговоре <b>for<\/b> иногда опускают: <span class=\"en\">I have lived here ten years.<\/span><\/li><li>Перед <b>all<\/b> его нет: <span class=\"en\">all day<\/span>, <span class=\"en\">all my life<\/span>.<\/li><li><b>for<\/b> работает с любым временем: <span class=\"en\">I lived there for two years.<\/span> — жил и уже не живу. <span class=\"en\">I will stay for a week.<\/span> <b>since<\/b> требует Perfect.<\/li><\/ul><h4>ago<\/h4><p>Отсчёт назад от сегодня, всегда с Past Simple: <span class=\"en\">I came here two years ago.<\/span> Если отсчёт идёт от момента в прошлом, говорят <b>before<\/b>: <span class=\"en\">I had met him two years before.<\/span><\/p><h4>Похожие слова<\/h4><div class=\"tw\"><table><tr><th>Слово<\/th><th>Смысл<\/th><th>Пример<\/th><\/tr><tr><td>during<\/td><td>когда, во время чего<\/td><td><span class=\"en\">I slept during the film.<\/span><\/td><\/tr><tr><td>for<\/td><td>как долго<\/td><td><span class=\"en\">I slept for two hours.<\/span><\/td><\/tr><tr><td>in<\/td><td>через (о будущем)<\/td><td><span class=\"en\">I'll be back in two days.<\/span><\/td><\/tr><tr><td>from … to / until<\/td><td>границы<\/td><td><span class=\"en\">I work from nine to six.<\/span><\/td><\/tr><\/table><\/div><h4>Вопросы<\/h4><div class=\"tw\"><table><tr><th>Вопрос<\/th><th>Время<\/th><th>Смысл<\/th><\/tr><tr><td><span class=\"en\">How long have you lived here?<\/span><\/td><td>Present Perfect<\/td><td>до сих пор<\/td><\/tr><tr><td><span class=\"en\">How long did you live there?<\/span><\/td><td>Past Simple<\/td><td>уже не живёшь<\/td><\/tr><tr><td><span class=\"en\">When did you move here?<\/span><\/td><td>Past Simple<\/td><td>момент<\/td><\/tr><tr><td><span class=\"en\">How long ago did you move?<\/span><\/td><td>Past Simple<\/td><td>сколько времени назад<\/td><\/tr><\/table><\/div><h4>«С тех пор как» наоборот<\/h4><p><span class=\"en\">It is two years since I saw him.<\/span> — «Прошло два года с тех пор, как я его видел».<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I have lived here since five years.<\/span><span class=\"en\">I have lived here for five years.<\/span><\/li><li><span class=\"bad\">I live here since 2020.<\/span><span class=\"en\">I have lived here since 2020.<\/span><\/li><li><span class=\"bad\">I have known him for 2015.<\/span><span class=\"en\">I have known him since 2015.<\/span><\/li><li><span class=\"bad\">I came here two years before.<\/span><span class=\"en\">I came here two years ago.<\/span><\/li><li><span class=\"bad\">I slept during two hours.<\/span><span class=\"en\">I slept for two hours.<\/span><\/li><li><span class=\"bad\">I know him five years.<\/span><span class=\"en\">I have known him for five years.<\/span><\/li><\/ul>",
"pastperf": "<h4>Когда он нужен<\/h4><p>Past Perfect появляется только там, где уже есть точка в прошлом и надо шагнуть ещё дальше назад. Об одном прошлом событии без такой точки говорят в Past Simple.<\/p><h4>Слова-спутники<\/h4><p><b>already, just, never … before, by the time, after, before, when, as soon as, because<\/b>:<\/p><ul><li><span class=\"en\">By the time we arrived, the film had started.<\/span><\/li><li><span class=\"en\">I had never seen snow before I came to Russia.<\/span><\/li><li><span class=\"en\">She was tired because she had worked all day.<\/span><\/li><\/ul><h4>Когда можно обойтись без него<\/h4><p>С <b>before<\/b> и <b>after<\/b> порядок событий и так ясен, поэтому Past Simple тоже годится: <span class=\"en\">After I finished work, I went home.<\/span> = <span class=\"en\">After I had finished work, I went home.<\/span><\/p><p>С <b>when<\/b> выбор меняет смысл:<\/p><div class=\"tw\"><table><tr><th>Предложение<\/th><th>Смысл<\/th><\/tr><tr><td><span class=\"en\">When I arrived, they left.<\/span><\/td><td>я пришёл, и они ушли<\/td><\/tr><tr><td><span class=\"en\">When I arrived, they had left.<\/span><\/td><td>к моему приходу их уже не было<\/td><\/tr><\/table><\/div><h4>Где ещё встречается<\/h4><ul><li>В косвенной речи: <span class=\"en\">He said he had seen the film.<\/span><\/li><li>После «в первый раз» о прошлом: <span class=\"en\">It was the first time I had flown.<\/span><\/li><li>В нереальном условии о прошлом: <span class=\"en\">If I had known, I would have come.<\/span><\/li><\/ul><h4>Формы<\/h4><ul><li>Сокращение <b>'d<\/b>: <span class=\"en\">I'd finished.<\/span> То же <b>'d<\/b> может быть <b>would<\/b>; различают по следующему слову: <span class=\"en\">I'd seen<\/span> — had, <span class=\"en\">I'd see<\/span> — would.<\/li><li><b>had had<\/b> — не опечатка: <span class=\"en\">I had had breakfast before I left.<\/span><\/li><li>Длительный вариант: <span class=\"en\">I had been waiting for an hour when the bus came.<\/span><\/li><\/ul><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I had seen this film last year.<\/span><span class=\"en\">I saw this film last year.<\/span><small>одно событие, шаг назад не нужен<\/small><\/li><li><span class=\"bad\">When I came, he already left.<\/span><span class=\"en\">When I came, he had already left.<\/span><\/li><li><span class=\"bad\">He had went home.<\/span><span class=\"en\">He had gone home.<\/span><\/li><li><span class=\"bad\">After he had came, we started.<\/span><span class=\"en\">After he had come, we started.<\/span><\/li><li><span class=\"bad\">I didn't had breakfast before.<\/span><span class=\"en\">I hadn't had breakfast before.<\/span><\/li><\/ul>",
"usedto": "<h4>Формы<\/h4><div class=\"tw\"><table><tr><th>Утверждение<\/th><th>Отрицание<\/th><th>Вопрос<\/th><\/tr><tr><td><span class=\"en\">I used to smoke.<\/span><\/td><td><span class=\"en\">I didn't use to smoke.<\/span><\/td><td><span class=\"en\">Did you use to smoke?<\/span><\/td><\/tr><\/table><\/div><p>Вместо отрицания часто говорят <span class=\"en\">I never used to…<\/span>. Настоящего времени у этой конструкции нет: о нынешней привычке — <span class=\"en\">I usually get up early.<\/span><\/p><h4>Что можно сказать через used to<\/h4><ul><li>Повторявшееся действие: <span class=\"en\">We used to play football after school.<\/span><\/li><li>Состояние, которого больше нет: <span class=\"en\">I used to live in Kazan.<\/span> <span class=\"en\">She used to have long hair.<\/span><\/li><\/ul><h4>Чего нельзя<\/h4><ul><li>Один раз: <span class=\"en\">I went to Sochi in 2019.<\/span><\/li><li>Точный срок или число раз: <span class=\"en\">I lived there for five years.<\/span> <span class=\"en\">I went there three times.<\/span><\/li><\/ul><h4>used to и would<\/h4><p><b>would<\/b> тоже описывает прошлые привычки, но только действия: <span class=\"en\">On Sundays we would go fishing.<\/span> О состояниях — только used to: <span class=\"en\">I used to have a dog.<\/span><\/p><h4>Три похожие конструкции<\/h4><div class=\"tw\"><table><tr><th>Конструкция<\/th><th>Смысл<\/th><th>Пример<\/th><\/tr><tr><td>used to + глагол<\/td><td>раньше делал<\/td><td><span class=\"en\">I used to drive to work.<\/span><\/td><\/tr><tr><td>be used to + -ing<\/td><td>привык<\/td><td><span class=\"en\">I am used to driving in the city.<\/span><\/td><\/tr><tr><td>get used to + -ing<\/td><td>привыкаю<\/td><td><span class=\"en\">I am getting used to driving here.<\/span><\/td><\/tr><\/table><\/div><p>Во второй и третьей <b>to<\/b> — предлог, поэтому после него -ing или существительное: <span class=\"en\">I am used to the cold.<\/span><\/p><h4>Чем заканчивается история<\/h4><p><span class=\"en\">I don't smoke any more.<\/span> <span class=\"en\">She no longer lives here.<\/span> <span class=\"en\">He still plays.<\/span><\/p><h4>Не путай с use<\/h4><p><b>use<\/b> [ju:z] — «использовать»: <span class=\"en\">I used a knife.<\/span> В <b>used to<\/b> звучит [ju:st].<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">I use to play tennis.<\/span><span class=\"en\">I usually play tennis.<\/span><small>о настоящем<\/small><\/li><li><span class=\"bad\">I didn't used to like it.<\/span><span class=\"en\">I didn't use to like it.<\/span><\/li><li><span class=\"bad\">I am used to get up early.<\/span><span class=\"en\">I am used to getting up early.<\/span><\/li><li><span class=\"bad\">I used to went there.<\/span><span class=\"en\">I used to go there.<\/span><\/li><li><span class=\"bad\">I used to live there for two years.<\/span><span class=\"en\">I lived there for two years.<\/span><\/li><\/ul>",
"if2": "<h4>Форма и смысл<\/h4><p><b>if<\/b> + Past Simple, <b>would<\/b> + первая форма. Прошедшее время здесь не о прошлом: оно показывает, что ситуация воображаемая, а речь идёт о настоящем или будущем. <span class=\"en\">If I had more time, I would learn Spanish.<\/span> — времени нет.<\/p><h4>Русское «бы»<\/h4><p>По-русски «бы» стоит в обеих частях: «Если бы я знал, я бы сказал». По-английски <b>would<\/b> только в главной части: <span class=\"en\">If I knew, I would tell you.<\/span><\/p><h4>Не только would<\/h4><p><span class=\"en\">If I had a car, I could drive you.<\/span> — мог бы. <span class=\"en\">If you asked him, he might help.<\/span> — возможно, помог бы.<\/p><h4>were и was<\/h4><p>В устойчивом <span class=\"en\">If I were you…<\/span> — всегда <b>were<\/b>. В остальных случаях в разговоре допустимо и <b>was<\/b>: <span class=\"en\">If he was here, he would help.<\/span> В письме надёжнее <b>were<\/b>.<\/p><h4>Первый или второй тип<\/h4><div class=\"tw\"><table><tr><th>Первый<\/th><th>Второй<\/th><\/tr><tr><td><span class=\"en\">If I win, I will buy a car.<\/span> — считаю, что шанс есть<\/td><td><span class=\"en\">If I won, I would buy a car.<\/span> — просто мечтаю<\/td><\/tr><tr><td><span class=\"en\">If I have time, I will come.<\/span> — возможно, будет<\/td><td><span class=\"en\">If I had time, I would come.<\/span> — но времени нет<\/td><\/tr><\/table><\/div><p>Выбор зависит от того, насколько реальной ситуацию считает говорящий.<\/p><h4>I wish<\/h4><p>Та же логика: после <b>wish<\/b> — прошедшее время о настоящем. <span class=\"en\">I wish I had a car.<\/span> — «Жаль, что у меня нет машины». <span class=\"en\">I wish I knew.<\/span> <span class=\"en\">I wish I were taller.<\/span><\/p><h4>Вежливые обороты<\/h4><p><span class=\"en\">Would you mind if I opened the window?<\/span> <span class=\"en\">It would be great if you could help.<\/span><\/p><h4>О прошлом — третий тип<\/h4><p><span class=\"en\">If I had known, I would have come.<\/span> — «Если бы я знал (тогда), я бы пришёл». Это отдельная тема.<\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">If I would have money, I would buy it.<\/span><span class=\"en\">If I had money, I would buy it.<\/span><\/li><li><span class=\"bad\">If I had money, I will buy it.<\/span><span class=\"en\">If I had money, I would buy it.<\/span><\/li><li><span class=\"bad\">If I will have time, I would help.<\/span><span class=\"en\">If I had time, I would help.<\/span><\/li><li><span class=\"bad\">If I am you, I would go.<\/span><span class=\"en\">If I were you, I would go.<\/span><\/li><li><span class=\"bad\">I wish I have a car.<\/span><span class=\"en\">I wish I had a car.<\/span><\/li><\/ul>",
"reported": "<h4>Сдвиг времён полностью<\/h4><div class=\"tw\"><table><tr><th>Прямая речь<\/th><th>Косвенная речь<\/th><\/tr><tr><td><span class=\"en\">I work here.<\/span><\/td><td><span class=\"en\">He said he worked there.<\/span><\/td><\/tr><tr><td><span class=\"en\">I am working.<\/span><\/td><td><span class=\"en\">He said he was working.<\/span><\/td><\/tr><tr><td><span class=\"en\">I worked.<\/span><\/td><td><span class=\"en\">He said he had worked.<\/span><\/td><\/tr><tr><td><span class=\"en\">I have worked.<\/span><\/td><td><span class=\"en\">He said he had worked.<\/span><\/td><\/tr><tr><td><span class=\"en\">I will work.<\/span><\/td><td><span class=\"en\">He said he would work.<\/span><\/td><\/tr><tr><td><span class=\"en\">I can work.<\/span><\/td><td><span class=\"en\">He said he could work.<\/span><\/td><\/tr><tr><td><span class=\"en\">I may come.<\/span><\/td><td><span class=\"en\">He said he might come.<\/span><\/td><\/tr><tr><td><span class=\"en\">I must go.<\/span><\/td><td><span class=\"en\">He said he had to go.<\/span><\/td><\/tr><\/table><\/div><p><b>would, could, should, might<\/b> не меняются.<\/p><h4>В русском сдвига нет<\/h4><p>«Он сказал, что живёт в Москве» — настоящее время. По-английски: <span class=\"en\">He said he lived in Moscow.<\/span> Это главная причина ошибок.<\/p><h4>Когда время можно не сдвигать<\/h4><ul><li>Вводный глагол в настоящем: <span class=\"en\">He says he is tired.<\/span><\/li><li>Сказанное верно и сейчас: <span class=\"en\">She said she lives in Kazan.<\/span> — допустимо, хотя <b>lived<\/b> тоже верно.<\/li><\/ul><h4>Слова времени и места<\/h4><div class=\"tw\"><table><tr><th>Прямая<\/th><th>Косвенная<\/th><\/tr><tr><td>now<\/td><td>then<\/td><\/tr><tr><td>today<\/td><td>that day<\/td><\/tr><tr><td>yesterday<\/td><td>the day before<\/td><\/tr><tr><td>tomorrow<\/td><td>the next day<\/td><\/tr><tr><td>last week<\/td><td>the week before<\/td><\/tr><tr><td>next week<\/td><td>the following week<\/td><\/tr><tr><td>here<\/td><td>there<\/td><\/tr><tr><td>this<\/td><td>that<\/td><\/tr><tr><td>ago<\/td><td>before<\/td><\/tr><\/table><\/div><h4>say и tell<\/h4><ul><li><b>say<\/b> — без адресата: <span class=\"en\">He said (that) he was busy.<\/span> С адресатом через to: <span class=\"en\">He said to me…<\/span><\/li><li><b>tell<\/b> — всегда с адресатом: <span class=\"en\">He told me (that) he was busy.<\/span><\/li><li>Устойчиво с tell: <span class=\"en\">tell the truth<\/span>, <span class=\"en\">tell a lie<\/span>, <span class=\"en\">tell a story<\/span>.<\/li><\/ul><h4>Вопросы<\/h4><p>Порядок слов прямой, без do / did и без вопросительного знака:<\/p><ul><li><span class=\"en\">She asked where I lived.<\/span><\/li><li><span class=\"en\">He asked what I was doing.<\/span><\/li><li>Общий вопрос — через <b>if<\/b> или <b>whether<\/b>: <span class=\"en\">She asked if I liked coffee.<\/span><\/li><\/ul><h4>Просьбы и приказы<\/h4><p><b>ask / tell<\/b> + кого + (not) to + глагол: <span class=\"en\">He told me to wait.<\/span> <span class=\"en\">She asked me not to be late.<\/span><\/p><h4>Другие вводные глаголы<\/h4><p><span class=\"en\">He explained that…<\/span>, <span class=\"en\">She promised to call.<\/span>, <span class=\"en\">He suggested going by taxi.<\/span>, <span class=\"en\">She advised me to rest.<\/span>, <span class=\"en\">He refused to help.<\/span><\/p><h4>Типичные ошибки<\/h4><ul class=\"errs\"><li><span class=\"bad\">He said me that he was busy.<\/span><span class=\"en\">He told me that he was busy.<\/span><\/li><li><span class=\"bad\">She told that she was tired.<\/span><span class=\"en\">She said that she was tired.<\/span><\/li><li><span class=\"bad\">He asked where did I live.<\/span><span class=\"en\">He asked where I lived.<\/span><\/li><li><span class=\"bad\">He said that he will come.<\/span><span class=\"en\">He said that he would come.<\/span><\/li><li><span class=\"bad\">She asked me that I wait.<\/span><span class=\"en\">She asked me to wait.<\/span><\/li><li><span class=\"bad\">He asked me do I like tea.<\/span><span class=\"en\">He asked me if I liked tea.<\/span><\/li><\/ul>",
